name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 22.15.0

jobs:
  # ══════════════════════════════════════════════════
  # PR Quality Gate — 线性步骤，一步失败 → ❌ 阻断合入
  # ══════════════════════════════════════════════════
  pr-check:
    name: PR Quality Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:schema
      - run: npm run lint:engine
      - run: npm run lint:undef
      - run: npm run lint:san
      - run: npm run lint:rng
      - run: npm run lint:audio
      - run: npm run lint:events
      - run: npm run analyze:events:ci
      - run: npm run lint:narrative
      - run: npm run lint:npc
      - run: node scripts/validate-mods.mjs
      - run: npm run build
      - run: node check_build.cjs --dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # ══════════════════════════════════════════════════
  # Main / Develop — 并行 job + 依赖链
  # ══════════════════════════════════════════════════
  lint:
    name: Lint
    # PRs use the linear pr-check job. Branch and tag pushes use this shared
    # dependency chain so release tags cannot skip their own prerequisites.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:schema
      - run: npm run lint:engine
      - run: npm run lint:undef
      - run: npm run lint:san
      - run: npm run lint:rng
      - run: npm run lint:audio
      - run: npm run lint:events
      - run: npm run analyze:events:ci
      - run: npm run lint:narrative
      - run: npm run lint:npc
      - run: node scripts/validate-mods.mjs

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
        timeout-minutes: 10

  build-vite:
    name: Vite Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node check_build.cjs --dist
      - uses: actions/upload-artifact@v4
        with:
          name: vite-${{ github.sha }}
          path: dist/
          retention-days: 14

  e2e:
    name: Browser E2E
    if: github.event_name == 'push'
    needs: build-vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vite-${{ github.sha }}
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  format-check:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
        continue-on-error: true

  # ══════════════════════════════════════════════════
  # Develop → GitHub Pages 预览部署
  # ══════════════════════════════════════════════════
  deploy-preview:
    name: Deploy Preview
    if: github.ref == 'refs/heads/develop'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vite-${{ github.sha }}
          path: dist
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          destination_dir: preview

  # Main -> production GitHub Pages. keep_files preserves the develop preview
  # subdirectory while replacing the production files at the branch root.
  deploy-production:
    name: Deploy Production
    if: github.ref == 'refs/heads/main'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vite-${{ github.sha }}
          path: dist
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true

  # ══════════════════════════════════════════════════
  # Tag → Release 自动发布
  # ══════════════════════════════════════════════════
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: vite-${{ github.sha }}
          path: dist
      - name: Package complete web release
        run: |
          test -f dist/index.html
          test -d dist/audio
          test -d dist/webp
          test -d dist/webp_ending
          cd dist
          zip -r "../abyssal-whispers-${GITHUB_REF_NAME}-web.zip" .
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            git log ${PREV_TAG}..HEAD --oneline --no-merges >> $GITHUB_STEP_SUMMARY
          else
            echo "## Initial Release" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            git log --oneline --no-merges -20 >> $GITHUB_STEP_SUMMARY
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: abyssal-whispers-${{ github.ref_name }}-web.zip
