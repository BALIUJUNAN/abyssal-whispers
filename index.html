{"name":"调查血迹","san_high":"地板上有暗红色的污渍。已经干了，边缘发黑。像是很久以前留下的。","san_mid":"地板上有暗红色的污渍。你蹲下来，发现它还是湿的。但空气里没有铁锈味。是别的味道。","san_low":"地板上有暗红色的污渍。你用手碰了一下。它缩了回去。","normal_text":"地板上有暗红色的污渍。已经干了。可能是酒，也可能是别的什么。","subtle_wrong_text":"地板上有暗红色的污渍。已经干了。你蹲下来看了看。边缘有一圈白色的盐渍。"},"harbor_water":{"name":"码头水面异动","san_high":"水面泛起一圈波纹。可能是鱼。也可能是别的什么。","san_mid":"水面泛起一圈波纹。波纹的形状像手指。你等了一会儿，它没有再出现。但你确定你看到了。","san_low":"水面泛起一圈波纹。它在回应你的心跳。","normal_text":"水面泛起一圈波纹。可能是鱼。","subtle_wrong_text":"水面泛起一圈波纹。波纹的形状很圆。像是有什么东西从正下方浮上来又沉下去了。"},"safehouse_footsteps":{"name":"安全屋夜间脚步声","san_high":"门外传来脚步声。你打开门，走廊空无一人。可能是隔壁的房客。","san_mid":"门外传来脚步声。你打开门，走廊空无一人。但地板上有湿脚印。鞋码和你的一样。","san_low":"门外传来脚步声。你没有开门。脚步声停在了你的门前。然后，有人轻轻敲了三下。","normal_text":"门外传来脚步声。你打开门，走廊空无一人。可能是隔壁的房客。","subtle_wrong_text":"门外传来脚步声。你打开门，走廊空无一人。但地板上有几滴水。"},"hilda_portrait":{"name":"希尔达庄园肖像","san_high":"大厅里挂着莫里斯家族的肖像画。画中人的眼睛朝向不同方向。","san_mid":"大厅里挂着莫里斯家族的肖像画。你走过时，所有的眼睛都转向了你。最年轻的那幅画里，男孩在微笑。","san_low":"大厅里挂着莫里斯家族的肖像画。你认出了最年轻的那幅画里的脸。那是你小时候的脸。","normal_text":"大厅里挂着莫里斯家族的肖像画。画中人的眼睛朝向不同方向。","subtle_wrong_text":"大厅里挂着莫里斯家族的肖像画。你走过时，觉得最年轻的那幅画里的人在看你。但你转过头时，他的眼睛朝向别处。"},"fisher_blood":{"name":"老费舍交出钥匙之血","san_high":"老费舍割开了手腕。血流入封印核心。他的表情很平静。","san_mid":"老费舍割开了手腕。血流入封印核心。血的颜色不对——不是红色，是灰蓝色。但老费舍的表情很平静。","san_low":"老费舍割开了手腕。血流入封印核心。你听到血在说话。它说的不是人话。老费舍闭上了眼睛。","normal_text":"老费舍割开了手腕。血流入封印核心。他的表情很平静。","subtle_wrong_text":"老费舍割开了手腕。血流入封印核心。血的颜色比正常的暗一些。但老费舍的表情很平静。"},"isabella_bell":{"name":"伊莎贝拉敲钟","san_high":"伊莎贝拉敲了十二下钟。然后她松开了钟绳。第十三声没有来。","san_mid":"伊莎贝拉敲了十二下钟。第十三下自己响了。不，等等——没有响。你低头看笔记，上面写着十三。你划掉了，改成十二。","san_low":"伊莎贝拉敲了十二下钟。你数到十三。伊莎贝拉说她只敲了十一下。你们谁是对的？","normal_text":"伊莎贝拉敲了十二下钟。然后她松开了钟绳。第十三声没有来。","subtle_wrong_text":"伊莎贝拉敲了十二下钟。你等了一会儿。第十三声没有来。但你的笔记上写着十三。你划掉了，改成十二。"},"joshua_guard":{"name":"约书亚发疯或守住灯塔","san_high":"约书亚站在灯塔入口。他的眼神清明。他说：这次我看着门。","san_mid":"约书亚站在灯塔入口。他的眼神清明。但他身后的墙上写满了同一个词：醒了。醒了。醒了。","san_low":"约书亚站在灯塔入口。他转过头看你。你不确定那是约书亚。他的眼睛颜色不对。但他说话的声音是约书亚的。","normal_text":"约书亚站在灯塔入口。他的眼神清明。他说：这次我看着门。","subtle_wrong_text":"约书亚站在灯塔入口。他的眼神清明。但他身后的墙上有一行字，你以前没见过：它醒了。"},"canned_food":{"name":"普通罐头","san_high":"罐头：一份可以果腹的食物。","san_mid":"罐头：标签被水泡烂了。你不记得自己什么时候买过它。","san_low":"罐头：里面有潮声。","normal_text":"罐头：一份可以果腹的食物。","subtle_wrong_text":"罐头：一份可以果腹的食物。标签有些潮，字迹模糊了。"},"tide_timetable":{"name":"潮汐时刻表","san_high":"潮汐时刻表：记录了每日涨潮退潮时间。","san_mid":"潮汐时刻表：记录了每日涨潮退潮时间。你注意到有几天的日期被水晕开了。","san_low":"潮汐时刻表：记录了每日涨潮退潮时间。最后一页写着你的名字。日期是今天。","normal_text":"潮汐时刻表：记录了每日涨潮退潮时间。","subtle_wrong_text":"潮汐时刻表：记录了每日涨潮退潮时间。有几天的日期被水晕开了。"},"candle_lamp":{"name":"蜡烛 / 灯油 / 手电","san_high":"蜡烛：照亮黑暗区域。","san_mid":"蜡烛：照亮黑暗区域。火焰偶尔朝没有风的方向倾斜。","san_low":"蜡烛：照亮黑暗区域。火焰朝你倾斜。像是在鞠躬。","normal_text":"蜡烛：照亮黑暗区域。","subtle_wrong_text":"蜡烛：照亮黑暗区域。火焰偶尔朝没有风的方向轻微倾斜。"},"catacombs_entrance_text":{"name":"深渊墓穴入口","san_high":"石门上刻满了符号。门缝中透出冰冷的气流。","san_mid":"石门上刻满了符号。符号在火把光芒下缓慢蠕动。你眨了眨眼。它们停了。也许它们从来没有动过。","san_low":"石门上刻满了符号。符号在看着你。你知道它们在看着你，因为你也在看着它们。你们是同类。","normal_text":"石门上刻满了符号。门缝中透出冰冷的气流。","subtle_wrong_text":"石门上刻满了符号。你凑近看时，觉得符号在火把光芒下微微蠕动。你眨了眨眼。它们停了。"}}},"philosophical_mechanics":{"description":"将玩法本身做成隐喻——沉默也是选择、不可逆微小选择、资源作为道德压力","core_principle":"无力感不是玩家什么都没有，而是玩家永远只有一份，却有三个人需要。","silence_is_choice":{"description":"沉默不会总是立刻导致最坏结果，但会留下痕迹","options":["说出真相","撒谎","沉默"],"silence_consequences":["NPC agency下降","NPC trust不变但humanity下降","安全屋士气降低","某个结局文本变冷","玩家日志记录：你没有回答。她替你理解了沉默。"],"key_silence_moments":[{"scene":"希尔达询问玩家是否愿意帮助封印","silence_effect":"希尔达agency-10，她开始考虑替代方案"},{"scene":"老费舍询问玩家是否理解他的处境","silence_effect":"老费舍humanity-5，他开始独自计划归海"},{"scene":"伊莎贝拉等待玩家阻止她敲钟","silence_effect":"第十三声响起，仪式进入不可逆阶段"},{"scene":"约书亚在灯塔前问玩家是否需要他","silence_effect":"约书亚agency-15，他开始怀疑自己的价值"}],"silence_journal_entries":["你没有回答。她替你理解了沉默。","你转身离开了。他没有叫住你。也许他早就知道你会这样。","你选择了沉默。沉默也是一种回答。但没有人告诉你沉默的答案是什么。"]},"timed_choices":{"description":"少数关键节点使用限时选择，但压力来自世界本身，而不是UI惩罚","avoid":"不要频繁使用硬性的3秒限时选择","appropriate_scenes":["NPC即将被拖入海中","第十三声钟即将响起","玩家决定最后一盏灯带走还是留给安全屋","伊莎贝拉等待玩家阻止她敲钟","老费舍将要归海"],"presentation_methods":{"description":"不要显示普通倒计时","methods":["钟声一下一下接近第十三声","潮水逐渐漫过台阶","门外脚步声越来越近","蜡烛越来越短","NPC呼吸越来越慢"]},"consequence_examples":["你在第十二声之后仍然沉默。所以她替你做了选择。","潮水漫过了最后一级台阶。你没有伸出手。他沉下去时没有看你。","蜡烛灭了。你选择了黑暗。黑暗也选择了你。"]},"resource_as_moral_pressure":{"description":"最后一份食物、最后一盏灯、最后一支镇静剂、最后一根绳索，都不应只是资源，而应成为人性审判","last_food_choices":[{"target":"self","effect":"降低明日疲劳","moral_weight":"neutral"},{"target":"joshua","effect":"降低癫狂概率","moral_weight":"compassion","description":"你把食物给了一个疯子。但他是人。"},{"target":"tommy","effect":"他愿意冲洗危险照片","moral_weight":"pragmatic_compassion","description":"他接过食物时手在发抖。不是因为害怕——是因为很久没人把他当人了。"},{"target":"hilda","effect":"帮她熬过血脉低语之夜","moral_weight":"deep_compassion","description":"她看着你递过来的食物，眼眶红了。三百年了，第一次有人记得她也会饿。"},{"target":"safehouse","effect":"提高幸存者士气","moral_weight":"collective"},{"target":"old_fisher","effect":"他愿意多说一些关于海的事","moral_weight":"understanding"}],"last_light_choices":[{"target":"bring_to_catacombs","effect":"墓穴探索安全","moral_weight":"self_preservation"},{"target":"leave_at_safehouse","effect":"安全屋当晚安全","moral_weight":"collective"},{"target":"give_to_isabella","effect":"让她完成第十二声后的选择","moral_weight":"faith_in_other"},{"target":"give_to_joshua","effect":"他守住灯塔入口","moral_weight":"trust"}]}},"ending_text_rewrite":{"description":"十个主结局的艺术化文本方向——结局不能只说明结果，要留下余味","principles":["每个结局根据humanity_evaluation分为三种文本温度","结局最后一句话应留有余味，不要总结性收尾","使用雾、钟声、水三个母题","允许玩家通关后仍无法确认真相是否唯一"],"endings":{"ending_seal_player_keeper":{"core_emotion":"沉重的平静","final_image":"多年后外乡人来到沃切斯特，听见十二声钟","motif_usage":["钟声","雾"],"high_humanity_text":"多年后，外乡人来到沃切斯特。他在镇中心听见钟声响了十二下。他松了一口气。只有你知道，第十三声被谁咽了回去。你站在深渊之眼前方。封印的光芒包裹着你。你闭上眼。你听到了远处的潮声。它很平静。像一首摇篮曲。","fragile_humanity_text":"封印重铸了。代价是你。你不是第一个，也许不是最后一个。你站在深渊之眼前方，听着自己的心跳。它和封印的脉动同步了。你不确定自己是在守护还是在被囚禁。但至少——今晚的钟声只有十二下。","lost_humanity_text":"封印重铸了。你成为了新的守门人。你已经不记得自己的名字了。但你记得钟声。十三声。你每天都在数。你不确定是在数钟声，还是在数自己还剩多少次。","last_line":"钟声响了十二下。第十三声没有来。你知道它在哪里。"},"ending_seal_hilda_choice":{"core_emotion":"被允许的告别","final_image":"庄园安静得像一口合上的棺","motif_usage":["雾","肖像画"],"high_humanity_text":"希尔达走进了封印核心。她转身看了你最后一眼。三百年了，她说，终于有人让我自己选。你没有阻止她。因为你知道——这是她的选择，不是你的。她把庄园祖先肖像一幅幅翻向墙面。最后一幅画翻过去时，庄园安静得像一口合上的棺。","fragile_humanity_text":"希尔达走进了封印核心。你不知道她是真的想这么做，还是因为你给了她太多信息让她觉得这是唯一选择。你永远不会知道。庄园的肖像画全都面向墙壁。你走过大厅时，有一幅画的眼睛还在看你。","lost_humanity_text":"希尔达走进了封印核心。你精心安排了一切——告诉她真相，给她选择的假象，让她以为这是自主决定。但你知道，你从一开始就在引导她走向这里。庄园的肖像画全都面向你。它们在微笑。","last_line":"庄园安静了。没有钟声。没有潮声。只有风穿过空走廊的声音。"},"ending_seal_old_fisher_blood":{"core_emotion":"最后的温度","final_image":"码头边只剩一双鞋","motif_usage":["水","月光"],"high_humanity_text":"老费舍坐在码头边，第一次在人前脱下鞋。脚趾之间的薄膜在月光下轻轻张开。他没有解释，只把刀递给你：趁我还知道疼。血流入封印核心。光芒爆发。老费舍倒下了。但他没有死。他还是人。勉强是。你扶他坐起来。他看着海面，很久没有说话。最后他说：谢谢你让我自己选。","fragile_humanity_text":"老费舍交出了钥匙之血。你不确定他是自愿的还是被你的期望所迫。他的眼睛里有释然，也有疲惫。封印重铸了。你扶他坐起来。他看着海面。你不知道他在想什么。也许他在想，如果他没有脱下那双鞋，结局会不会不一样。","lost_humanity_text":"老费舍的血流入了封印核心。你把他带到这里，他知道会发生什么。但你没有给他选择。你只是需要他的血。封印重铸了。你站起来时，码头边只剩一双鞋。鞋里是空的。海面很平静。","last_line":"码头边的鞋还在。海水没有碰它们。也许是出于尊重。"},"ending_isabella_twelfth_bell":{"core_emotion":"被拒绝的神谕","final_image":"第十二声之后的沉默","motif_usage":["钟声","蜡烛"],"high_humanity_text":"伊莎贝拉站在钟楼上。她敲了十二下。第十三下，她松开了手。钟绳在空中轻轻摆动。整座教堂都在等待。但第十三声没有来。伊莎贝拉走下钟楼。她的脸上没有泪水。只有疲惫。她经过你身边时轻声说：谢谢你让我看清了。","fragile_humanity_text":"伊莎贝拉敲了十二下钟。然后她松开了手。你不知道她是因为真相而悔悟，还是因为你给了她太多证据让她无法自欺。但结果是一样的——第十三声没有来。教堂的蜡烛同时熄灭了。不是风吹的。","lost_humanity_text":"伊莎贝拉敲了十二下钟。你用真相击溃了她的信仰。她不再相信任何东西了。第十三声没有来。但你知道——你不只是为了阻止仪式。你是为了证明你比她更正确。蜡烛的火焰朝你倾斜。像是在鞠躬。","last_line":"教堂安静了。钟绳还在轻轻摆动。像是有人刚刚松开手。"},"ending_escape_by_sea":{"core_emotion":"带不走的潮声","final_image":"船离岸后，雾仍然没有散","motif_usage":["雾","水","罐头"],"high_humanity_text":"你在黎明前登上了渔船。海风吹在脸上，那是你很长时间以来第一次感受到真实的风。你自由了。但你知道——沃切斯特还在那里。那些人还在那里。船离岸很远后，雾仍然没有散。玛莎给你的罐头在包里轻轻晃动。你忽然意识到，那不是罐头的声音。是潮水。从里面传来。","fragile_humanity_text":"你逃离了沃切斯特。你活下来了。但你没有带走所有人。有些人留在了雾里。你告诉自己你已经尽力了。也许这是真的。船离岸后，你回头看了一眼。沃切斯特已经消失在雾中。但你仍然能听到钟声。十二声。然后是沉默。","lost_humanity_text":"你逃离了沃切斯特。你带出了证据和情报。你活下来了。那些留在城里的人——你甚至没有回头看一眼。船离岸后，你打开罐头。里面不是食物。是海水。你把罐头扔进了海里。它没有沉。","last_line":"海很平静。但你知道，海的下面不平静。"},"ending_evidence_escape":{"core_emotion":"无人相信的真相","final_image":"多年后另一个港口响起第十三声钟","motif_usage":["钟声","旧照片"],"high_humanity_text":"你带着证据离开了沃切斯特。你把它们交给了需要知道的人。他们不相信你。但证据在那里。多年后，你在另一个港口城市听到了钟声。十三声。你知道——一切还没有结束。但至少，真相在你手中。","fragile_humanity_text":"你带着证据离开了。你把它们交给了需要知道的人。他们不相信你。你开始怀疑自己。也许沃切斯特只是一场梦。但你的口袋里有一张照片。照片上是码头。码头边有一双儿童鞋。鞋里是空的。","lost_humanity_text":"你带着证据离开了。你把它们卖给了最高出价者。钱到手了。真相？真相只是商品。多年后，你在报纸上看到沃切斯特的旅游业正在蓬勃发展。游客们称赞那里的神秘氛围。你笑了。","last_line":"报纸上说沃切斯特的钟声很好听。每天十二下。你数了三遍。是十二下。"},"ending_heretical_dawn":{"core_emotion":"被接受的启示","final_image":"天空裂开，玩家跪下","motif_usage":["钟声","光"],"high_humanity_text":"你不知道自己是怎么走到这一步的。你本想阻止仪式。但你看到了真相——或者说，你看到了它想让你看到的真相。天空裂开了。你跪下了。不是出于恐惧——是出于敬畏。也许这就是疯狂。也许这就是真相。你永远不会知道了。","fragile_humanity_text":"仪式完成了。你不确定自己是被欺骗了还是主动选择了。也许两者没有区别。新的时代开始了。你站在教堂门口，看着天空裂开。光从裂缝中涌出。你闭上了眼。你听到了钟声。很多声。你数不清了。","lost_humanity_text":"你完成了仪式。你从一开始就知道会发生什么。你想要这个结果。你欢迎它们。你张开了双臂。天空裂开了。光涌入了沃切斯特。你微笑了。这是你作为人类的最后一个表情。","last_line":"钟声响了。不是十三声。是很多声。你已经数不清了。"},"ending_abyss_consumed":{"core_emotion":"平静的坠落","final_image":"深渊之眼在底部注视","motif_usage":["水","黑暗"],"high_humanity_text":"你走到了竖井边缘。深渊之眼在底部注视着你。你知道了——人类的存在是多么渺小。但你没有跳下去。你只是坐在边缘，看着那无尽的黑暗。你哭了。不是因为恐惧——是因为你终于理解了。你站起来，离开了墓穴。你还有选择。","fragile_humanity_text":"你坠入了深渊。你没有挣扎。也许是因为你太累了。也许是因为你已经不在乎了。坠落的过程中，你看到了一切——从宇宙的诞生到终结。你微笑了。这不是恐惧。这是理解。","lost_humanity_text":"你张开双臂，向竖井迈出了一步。坠落的过程中，你看到了一切。当你落地时，你感到的是平静。永恒的、无尽的平静。然后，你睁开了新的眼睛。不再是人类的眼睛。你开始向上攀爬。","last_line":"你睁开了眼睛。眼睛的颜色不对。但你已经不在乎了。"},"ending_transcendence":{"core_emotion":"不属于任何地方的清醒","final_image":"玩家站在时间之外","motif_usage":["雾","星辰"],"high_humanity_text":"你超越了人类的视角。你看到了时间的全貌。你理解了封印的本质。但你选择了回来——回到人类的视角，用你学到的一切来守护这个世界。你不再是完全的人，但你选择了做人该做的事。你站在沃切斯特的街道上。雾散了。你看到了天空。它和你记忆中的不一样。","fragile_humanity_text":"你超越了。你看到了一切。你理解了。但你不知道自己还是不是你。你的身体在沃切斯特，但你的心在别处。在时间之外。你看着自己的手。它在发光。你把手放进口袋里。光芒透过了布料。","lost_humanity_text":"你超越了人类。你看到了宇宙的全貌。人类的恐惧、希望、爱——在你看来都是化学反应。你不再属于这个世界。你也不再关心它。你站在沃切斯特的街道上。雾在你身边散开了。不是因为风——是因为它怕你。","last_line":"你站在时间之外。你看到了沃切斯特的过去和未来。它们是一样的。"},"ending_loop_truth":{"core_emotion":"清醒的轮回","final_image":"玩家走进深渊之眼，光芒包裹","motif_usage":["钟声","雾","水"],"high_humanity_text":"你终于明白了。轮回本身就是封印。你不是被困在这里——你是封印的一部分。你微笑了。这一次，你选择打破轮回。不是因为你想逃——而是因为你想让沃切斯特的人得到安宁。你走进了深渊之眼。光芒包裹了你。封印重铸了——永恒地。因为你这一次是自愿的。","fragile_humanity_text":"你明白了轮回的真相。你选择打破它。也许是因为你厌倦了。也许是因为你终于理解了。你走进了深渊之眼。光芒包裹了你。你不知道自己是在拯救还是在逃避。但至少——轮回结束了。也许吧。","lost_humanity_text":"你明白了。轮回是封印。你是钥匙。你选择继续轮回——不是因为你想守护，而是因为你已经不知道如何做别的事了。你微笑了。这一次和上一次一样。也许下一次也会一样。你已经不在乎了。","last_line":"钟声响了。十三声。你数了。然后你微笑了。你知道下一次，你还会数的。"}}},"ending_system_v2":{"description":"三层结局判定系统——先判断世界结果，再判断代价承担者，最后判断人性温度","judgement_layers":{"layer_1_world_outcome":{"name":"第一层：沃切斯特发生了什么","possible_outcomes":["seal_restored","escaped_by_sea","evidence_escape","heretical_dawn","abyss_consumed","transcendence","loop_truth"]},"layer_2_cost_bearer":{"name":"第二层：谁承担了代价","possible_bearers":["player","hilda","old_fisher","isabella","shared","no_one","unknown"]},"layer_3_humanity_evaluation":{"name":"第三层：结局文本温度","possible_evaluations":["humanity_high","humanity_fragile","humanity_lost"],"criteria":{"humanity_high":"玩家始终把NPC当人，没有强迫牺牲，没有隐瞒关键真相，没有把人当工具","humanity_fragile":"玩家在压力下做出妥协，但核心人性仍在","humanity_lost":"玩家把NPC当工具，隐瞒真相诱导牺牲，或主动参与非人行为"}}},"humanity_tracking":{"npc_redemption_score":{"description":"记录有多少NPC完成了救赎","calculation":"count of NPCs with redemption_state == redeemed","affects":"ending text warmth, ending availability"},"humanity_retained_score":{"description":"记录玩家是否仍然把别人当人","tracking_events":[{"event":"player_forces_npc_sacrifice","score_change":-10,"description":"诱导NPC牺牲"},{"event":"player_hides_critical_truth","score_change":-8,"description":"隐瞒关键真相"},{"event":"player_uses_npc_as_tool","score_change":-5,"description":"把NPC当工具使用"},{"event":"player_gives_last_food_to_npc","score_change":5,"description":"把最后一份食物给NPC"},{"event":"player_warns_npc_of_danger","score_change":3,"description":"警告NPC危险"},{"event":"player_tells_truth_at_cost","score_change":8,"description":"即使代价高昂也说出真相"},{"event":"player_chooses_self_sacrifice","score_change":15,"description":"选择自己承担代价"},{"event":"player_treats_hybrid_as_human","score_change":5,"description":"把混血者当人对待"},{"event":"player_abandons_npc_in_danger","score_change":-7,"descrip "玛莎擦着杯子，抬头看了你一眼：外乡人？这个季节可没人来沃切斯特。","loop_2":"玛莎擦着杯子，抬头看了你一眼：外乡人？不，我是不是说过这句话？","loop_3":"玛莎没有抬头。这个季节可没人来沃切斯特。除了你。","loop_4":"你推门前，已经听见里面有人说：他来了。","loop_5_plus":"玛莎给你倒了一杯酒。你没有点单。她也没有问。"},"death_restart_example":{"death_type":"physical_death","cause":"by_monster","death_text":"你倒在了沃切斯特的某个角落。血从伤口流出，渗入鹅卵石的缝隙。你最后看到的是雾。雾很安静。","restart_text_loop_1":"你醒来时，发现自己在沃切斯特的入口。你的头很疼。你不记得自己是怎么到这里的。你的衣服是干的。伤口不见了。","restart_text_loop_3":"你醒来时，发现自己在沃切斯特的入口。你没有头疼。你记得一切。这比头疼更糟糕。"}}},"accessibility":{"description":"可访问性与安全选项——所有感官污染必须有强度控制或关闭选项","core_rules":["伪报错不得使用真实操作系统弹窗样式","伪报错不得让玩家误以为游戏真实崩溃、设备故障或存档损坏","输入阻尼只允许短时出现在强叙事节点，不得影响基础操作","所有视觉污染必须可关闭或降低强度","所有音频异化必须可关闭或降低强度","闪烁效果必须有频率控制"],"options":{"visual_distortion":{"name":"视觉扰动","settings":{"off":"关闭所有视觉污染效果","low":"降低强度50%，仅保留轻微边缘雾化","medium":"默认强度","high":"完整视觉污染效果"},"default":"medium"},"audio_distortion":{"name":"音频异化","settings":{"off":"关闭所有音频污染，仅保留基础环境音","low":"降低异化音量，移除低频嗡鸣","medium":"默认强度","high":"完整音频污染效果"},"default":"medium"},"input_resistance":{"name":"输入阻尼","settings":{"off":"关闭所有输入阻尼效果","on":"在强叙事节点启用短暂输入阻尼（每次不超过2秒）"},"default":"on"},"flicker_control":{"name":"闪烁控制","settings":{"off":"关闭所有闪烁效果","low":"闪烁频率降低50%","medium":"默认频率","high":"完整闪烁效果"},"default":"medium"},"pseudo_error_style":{"name":"伪系统提示样式","settings":{"safe":"所有伪系统提示使用游戏内对话框样式，明确标注[游戏内文本]","immersive":"伪系统提示使用游戏内样式，但不标注","full":"完整伪系统提示效果"},"default":"immersive","critical_rule":"即使在full模式下，伪报错也绝不能使用操作系统原生弹窗样式、浏览器alert样式、或任何可能被误认为真实系统消息的样式"},"text_speed":{"name":"文本速度","settings":{"instant":"立即显示全部文本","fast":"快速逐字显示","normal":"正常速度","slow":"慢速显示，适合需要仔细阅读的玩家"},"default":"instant"},"content_warnings":{"name":"内容警告","settings":{"on":"在可能引起不适的事件前显示内容警告","off":"不显示内容警告"},"default":"on"}},"pseudo_error_rules":{"allowed_styles":["游戏内对话框","游戏内系统消息栏","游戏内日志文本","游戏内选项文字"],"forbidden_styles":["操作系统原生弹窗（Windows MessageBox、macOS Alert）","浏览器alert/confirm/prompt","蓝屏样式","应用崩溃报告样式","任何可能被误认为真实系统消息的样式"],"safety_disclaimer":"所有伪系统提示必须在游戏重新加载或检查设置时可以被识别为游戏内容"}},"chapter_progressi
