{id:"mythos_perception_001",name:"隐藏的门",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","hidden"],trigger:{areas:["town_center"],min_mythos:5,probability:0.2,once_per_run:true},description:"你走过一面墙。墙上的砖块有一块颜色不对——比其他的深了一点。\n你用手推了一下。砖块动了。\n墙后面是一条狭窄的通道。通道尽头有微弱的光。\n你以前走过这面墙无数次。但只有现在才看到。",effects:{add_clue:"clue_mythos_hidden_door",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_perception_002",name:"墙壁上的字",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","text"],trigger:{areas:["harbor_district"],min_mythos:5,probability:0.2,once_per_run:true},description:"仓库的墙壁上有字。你以前从来没看到过。\n字是用一种近乎透明的墨水写的——只有在特定的角度才能看到。\n你调整了站位。字迹变得清晰了：\n「月圆之夜。潮水最低的时候。第三根柱子。」\n你记下来了。当你再次看向墙壁时，字迹消失了。",effects:{add_clue:"clue_mythos_wall_text",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_perception_003",name:"隐藏的符号",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","symbol"],trigger:{areas:["catacombs_entrance"],min_mythos:5,probability:0.2,once_per_run:true},description:"墓穴入口的石柱上有一个符号。你以前从来没注意到。\n符号刻得很浅，几乎和石头的纹理融为一体。\n你用手摸了摸。指尖传来一阵微弱的震动。\n你认出了这个符号——在某本书里见过。是关于封印的。",effects:{add_clue:"clue_mythos_symbol",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_perception_004",name:"地板下的空洞",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","hidden"],trigger:{areas:["voxchester_manor"],min_mythos:5,probability:0.2,once_per_run:true},description:"你走在庄园的走廊里。脚下的地板有一块声音不对——是空的。\n你蹲下来，用手指敲了敲。确实是空的。\n你用匕首撬开了地板。下面是一个小小的暗格。\n暗格里放着一个铁盒。盒子很旧，但没有生锈。",effects:{add_item:{item_id:"iron_box",name:"铁盒",uses:1},add_clue:"clue_mythos_hidden_compartment",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_perception_005",name:"隐藏的照片",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","photo"],trigger:{areas:["town_center"],min_mythos:6,probability:0.15,once_per_run:true},description:"你在汤米的店铺里看到一张照片。照片夹在其他照片中间，你以前从来没注意到。\n照片上是灯塔的地下室。你认出了那些管道和阀门。\n但照片的角落里有一个人影。模糊的，像是在移动。\n你把照片翻过来。背面写着一个日期——三年前。",effects:{add_clue:"clue_mythos_hidden_photo",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_perception_006",name:"空气中的文字",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","air"],trigger:{areas:["whispering_forest"],min_mythos:5,probability:0.15,once_per_run:true},description:"你站在森林里。空气中有什么东西在闪烁。\n你眯起眼睛。是文字——悬浮在半空中的文字。\n文字很淡，像是用光写成的。你只能看清几个词：\n「门。钥匙。代价。」\n然后文字消失了。你感到一阵头晕。",effects:{san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_007",name:"水下的结构",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","water"],trigger:{areas:["harbor_district"],min_mythos:6,probability:0.15,time_phase:["midnight"],once_per_run:true},description:"你站在码头边，低头看水。水面很暗。\n但你看到了一些东西——在水下。\n是某种结构。线条很整齐，不像是自然形成的。\n你眨了眨眼。结构变得更清晰了。像是一个建筑的轮廓。\n在沃切斯特的水面下，有一座建筑。",effects:{add_clue:"clue_mythos_underwater_structure",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_008",name:"树上的刻痕",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","tree"],trigger:{areas:["whispering_forest"],min_mythos:5,probability:0.2,once_per_run:true},description:"你走过一棵老橡树。树干上有刻痕。\n你以前从来没注意到——因为刻痕和树皮的纹理几乎一模一样。\n但你的目光自动聚焦在了上面。刻痕是一个图案。一个你认识的图案。\n是封印的一部分。\n你用手摸了摸。指尖传来一阵微弱的热量。",effects:{add_clue:"clue_mythos_tree_seal",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_perception_009",name:"镜中的文字",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","mirror"],trigger:{areas:["voxchester_manor"],min_mythos:6,probability:0.15,once_per_run:true},description:"你经过一面镜子。镜面上有字。\n你凑近看。字是反过来的，但你认出了内容：\n「地下室。第三根柱子。」\n你伸手去摸字迹。指尖碰到镜面时，字迹消失了。\n镜面上只留下了一滴水珠。你没有看到水珠是从哪里来的。",effects:{add_clue:"clue_mythos_mirror_text",san:-1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_010",name:"隐藏的路径",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","path"],trigger:{areas:["forbidden_grove"],min_mythos:7,probability:0.15,once_per_run:true},description:"你站在一片灌木丛前。灌木很密，看起来无法通过。\n但你看到了——灌木的枝条之间有一条缝隙。缝隙很窄，但刚好能让人侧身通过。\n你以前从来没看到过。现在它就在那里，清晰得像是有人特意留下的。\n你侧身挤了过去。另一边是一片空地。空地中央有一块石头。",effects:{add_clue:"clue_mythos_hidden_path",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_perception_011",name:"空气中的符号",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","symbol"],trigger:{areas:["catacombs_entrance","deep_catacombs"],min_mythos:7,probability:0.15,once_per_run:true},description:"你站在墓穴里。空气中有什么东西在闪烁。\n你眯起眼睛。是符号——悬浮在半空中的符号。\n符号排列成一个圆环。圆环的中心有一个空缺。\n你伸手去摸。手指穿过了符号，什么也没碰到。\n但你感到了一阵微弱的震动。像是什么东西在回应你的触碰。",effects:{san:-2,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_012",name:"光线中的图案",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","light"],trigger:{areas:["lighthouse"],min_mythos:6,probability:0.15,once_per_run:true},description:"你站在灯塔的灯室里。灯光透过玻璃射向远方。\n你注意到光线中有图案——不是光的折射，而是某种有规律的闪烁。\n你调整了站位。图案变得更清晰了。像是某种编码。\n你记下了闪烁的节奏。三短。三长。三短。\n你认出了这个编码。是莫尔斯电码。SOS。",effects:{add_clue:"clue_mythos_light_code",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_perception_013",name:"石头中的脉络",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","stone"],trigger:{areas:["ruins_of_yith"],min_mythos:8,probability:0.15,once_per_run:true},description:"你触摸伊斯遗迹的墙壁。石头里有脉络。\n不是自然的纹理——是某种管道系统。很细，肉眼几乎看不到。\n但你的指尖能感觉到它们。脉络里有什么东西在流动。\n你把手贴在墙上。流动的速度加快了。\n像是遗迹感应到了你的存在。",effects:{san:-2,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_014",name:"雾中的轮廓",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","fog"],trigger:{areas:["harbor_district","town_center"],min_mythos:5,probability:0.15,once_per_run:true},description:"雾很浓。你几乎看不到前方的路。\n但你看到了一些东西——在雾中。轮廓。模糊的，高大的，不像是人。\n轮廓在移动。缓慢地，像是在巡逻。\n你停下了脚步。轮廓也停下了。\n它在看着你。你能感觉到。\n然后轮廓消散了。雾变薄了一些。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_015",name:"声音中的编码",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","sound"],trigger:{areas:["whispering_forest"],min_mythos:6,probability:0.15,time_phase:["midnight"],once_per_run:true},description:"森林里的低语声变了。\n你以前只听到过模糊的呢喃。但现在你能分辨出一些词。\n不是任何你认识的语言——但你的大脑自动把它们翻译了出来。\n「门。开启。代价。血。」\n你摇了摇头。低语声恢复了模糊的状态。\n但你知道——你刚才确实听懂了。",effects:{san:-2,mythos:2,add_clue:"clue_mythos_forest_words"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_016",name:"影子的不同步",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","shadow"],trigger:{areas:["town_center","harbor_district"],min_mythos:5,probability:0.15,once_per_run:true},description:"你走过一盏路灯。你的影子投在墙上。\n你抬起手。影子也抬起了手——但慢了一拍。\n你放下手。影子没有放下。\n你转过身。影子也转过来了，和你面对面。\n你眨了眨眼。影子回到了正常的位置。\n但你注意到——影子的轮廓比你大了一圈。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_017",name:"石头上的温度",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","temperature"],trigger:{areas:["catacombs_entrance"],min_mythos:5,probability:0.15,once_per_run:true},description:"你走进墓穴。墙壁应该是冰冷的。\n但你摸到了一块温热的石头。只有那一块。\n你把手贴在上面。温度在上升。\n你把耳朵贴上去。石头里有声音——低沉的，有节奏的。\n像是心跳。\n你把手移开。石头变冷了。",effects:{san:-2,add_clue:"clue_mythos_warm_stone"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_018",name:"数字的浮现",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","number"],trigger:{areas:["town_center"],min_mythos:5,probability:0.15,once_per_run:true},description:"你看着教堂的钟楼。钟面上的数字在变化。\n你以前从来没注意到——但钟面上有十三个数字。不是十二个。\n第十三个数字在最下面，很小，几乎看不清。\n你眯起眼睛。是「0」。\n钟面上有「0」到「12」。十三个数字。\n你把目光移开。再看时，只有十二个数字了。",effects:{san:-1,add_clue:"clue_mythos_clock_13"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_019",name:"墙壁中的声音",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","sound"],trigger:{areas:["voxchester_manor"],min_mythos:6,probability:0.15,once_per_run:true},description:"你走过庄园的走廊。墙壁里有声音。\n你以前从来没听到过——但这次你听到了。是敲击声。有节奏的。\n你把手贴在墙上。敲击声停了。\n你把手移开。敲击声又开始了。\n节奏是：三短。停顿。三长。停顿。三短。\n又是SOS。\n你沿着墙壁走。敲击声一直跟着你。",effects:{san:-2,add_clue:"clue_mythos_wall_sos"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_perception_020",name:"空气的密度",type:"mythos",subtype:"perception",weight:1,tier:"normal",tags:["mythos","perception","air"],trigger:{areas:["deep_catacombs"],min_mythos:8,probability:0.15,once_per_run:true},description:"你走进深渊墓穴的深处。空气变了。\n不是变冷了——是变稠了。你感到呼吸变得困难。\n你伸出手。空气像是有了实体。你的手指在空气中划过，能感到轻微的阻力。\n你把手放到面前。指尖上有一层薄薄的凝结物。你闻了闻——是海水和铁锈的味道。\n在深渊墓穴的深处，空气本身就是某种存在的体液。",effects:{san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"mythos_forbidden_001",name:"古籍的残页",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","book"],trigger:{areas:["town_center"],min_mythos:10,probability:0.15,once_per_run:true},description:"你在图书馆的角落里找到了一本古籍。书页已经泛黄，边缘破损。\n你翻开了一页。上面画着一个图案——你认出了它。是封印的完整图样。\n你以前只见过碎片。现在你看到了全貌。\n图案比你想象的复杂得多。不是简单的几何——是某种多维结构的投影。\n你感到一阵头晕。书页上的图案在你眼前旋转。",effects:{san:-3,mythos:3,add_clue:"clue_mythos_full_seal"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_002",name:"石碑的铭文",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","stone"],trigger:{areas:["catacombs_entrance"],min_mythos:10,probability:0.15,once_per_run:true},description:"你找到了一块石碑。碑文是用一种你不认识的文字写的。\n但你读得懂。\n碑文记载了封印的建造过程。建造者不是人类——是某种更古老的存在。\n封印不是为了保护人类。是为了把什么东西关在里面。\n你读到最后一行时，字迹开始模糊。你的鼻子流血了。",effects:{san:-4,mythos:3,hp:-1,add_clue:"clue_mythos_seal_truth"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_003",name:"禁忌的章节",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","book"],trigger:{areas:["town_center"],min_mythos:10,probability:0.12,once_per_run:true,npc_alive:["伊莱亚斯·沃德"]},description:"伊莱亚斯递给你一本书。「第七章，」他说，「我一直不敢读完。」\n你翻到第七章。标题是《沃切斯特的建造者》。\n你读了下去。书里记载了沃切斯特建城的历史——但不是官方的版本。\n真正的建造者不是清教徒。是某种从海里来的东西。它们建造了这座城市，作为某种……门。\n你合上书。手在发抖。",effects:{san:-4,mythos:3,add_clue:"clue_mythos_voxchester_truth"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_004",name:"旧档案",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","archive"],trigger:{areas:["voxchester_manor"],min_mythos:10,probability:0.12,once_per_run:true},description:"你在庄园的书房里找到了一箱旧档案。是莫里斯家族的私人记录。\n你翻开了第一本日记。日期是1847年。\n日记的主人写道：「今天，我见到了祂们。不是在梦里——是真实的。」\n「祂们从海里来。祂们建造了封印。祂们把钥匙留在了莫里斯家族的血脉里。」\n你翻到最后一页。日记的主人写道：「我不能再写了。祂们知道我在记录。」",effects:{san:-4,mythos:3,add_clue:"clue_mythos_morris_truth"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_005",name:"灯塔的蓝图",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","lighthouse"],trigger:{areas:["lighthouse"],min_mythos:12,probability:0.12,once_per_run:true},description:"你在灯塔的地下室找到了一张蓝图。是灯塔的建造图纸。\n但图纸上有一些不属于灯塔的结构——一个巨大的圆形房间，在灯塔正下方。\n圆形房间的中心画着一个符号。你认出了它。是封印的核心。\n图纸的角落里写着一行字：「灯塔不是灯塔。灯塔是钥匙。」\n你把图纸翻过来。背面画着一个你从未见过的东西。",effects:{san:-4,mythos:3,add_clue:"clue_mythos_lighthouse_blueprint"},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_006",name:"伊斯档案",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","yith"],trigger:{areas:["ruins_of_yith"],min_mythos:15,probability:0.1,once_per_run:true},description:"伊斯机器的表面亮了起来。你看到了一段文字——不是刻上去的，而是投影在空气中的。\n文字是用一种你不认识的语言写的。但你读得懂。\n文字记载了伊斯文明的历史。它们曾经统治过地球。然后它们离开了。\n它们留下了封印——不是为了保护人类，而是为了保护它们的遗产。\n最后一行写道：「遗产的守护者已经堕落。封印正在衰弱。」\n文字消散了。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_yith_archive"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_007",name:"深渊的记录",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","deep"],trigger:{areas:["deep_catacombs"],min_mythos:15,probability:0.1,once_per_run:true},description:"你在深渊墓穴的最深处找到了一块石板。石板上刻满了文字。\n你开始阅读。文字记载了封印下面的东西——不是怪物，不是神，而是某种……存在。\n它没有名字。它没有形状。它只是存在。\n封印把它关在下面已经几千年了。它一直在等待。\n石板的最后一段写道：「当封印破碎，它将醒来。不是毁灭——是改变。一切都会改变。」\n你读完了。石板裂开了。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_deep_truth"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_008",name:"仪式手册",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","ritual"],trigger:{areas:["town_center"],min_mythos:10,probability:0.12,once_per_run:true,npc_alive:["伊莎贝拉·韦伯"]},description:"伊莎贝拉从教堂的密室里拿出一本手册。「这是异端研究者的记录，」她说，「他们研究了封印的运作方式。」\n你翻开手册。里面记载了一个仪式——一个可以暂时打开封印的仪式。\n仪式需要三样东西：钥匙碎片、莫里斯家族的血、和一个自愿的牺牲者。\n「牺牲者不是死，」伊莎贝拉解释，「是永远留在封印的另一边。」",effects:{san:-3,mythos:3,add_clue:"clue_mythos_ritual_manual"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_009",name:"旧照片的秘密",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","photo"],trigger:{areas:["town_center"],min_mythos:10,probability:0.12,once_per_run:true},description:"你找到了一张旧照片。照片上是一群人站在灯塔前。\n你仔细看。照片的角落里有一个不属于人类的轮廓。模糊的，但你能看出——它的四肢比例不对。\n照片的背面写着日期：1873年。还有一行字：「封印守护者的最后一次合影。」\n你数了数照片上的人。七个。\n你知道沃切斯特有八个NPC。但照片上只有七个人。第八个位置是空的——或者说，被那个不属于人类的轮廓占据了。",effects:{san:-3,mythos:2,add_clue:"clue_mythos_old_photo"},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_010",name:"莫里斯家族的血脉",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","blood"],trigger:{areas:["voxchester_manor"],min_mythos:12,probability:0.1,once_per_run:true,npc_alive:["希尔达·莫里斯"]},description:"希尔达带你去了庄园的地下室。墙上挂着一幅家族谱系图。\n你仔细看。莫里斯家族的血脉可以追溯到1690年代——沃切斯特建城之前。\n「我们家族不是人类的后裔，」希尔达平静地说，「至少不完全是。」\n她指着谱系图的一个分支。「这一支——是从海里来的。」\n你看着那些名字。有些名字的旁边画着一个符号——和封印上的符号一样。",effects:{san:-4,mythos:3,add_clue:"clue_mythos_morris_bloodline"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_011",name:"灯塔守灯人的日记",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","lighthouse","diary"],trigger:{areas:["lighthouse"],min_mythos:12,probability:0.1,once_per_run:true},description:"你在灯塔的灯室里找到了一本日记。是上一任守灯人写的。\n日记的内容越来越混乱。最后几页几乎无法辨认。\n你能看清的只有：\n「它在灯下面。不是灯——是门。灯是钥匙。」\n「我看到了它。不是怪物——是真相。真相比怪物更可怕。」\n「我不能再守灯了。我看到了太多。」\n最后一页只有一句话：「它醒了。」",effects:{san:-4,mythos:3,add_clue:"clue_mythos_keeper_diary"},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_012",name:"封印的代价",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","seal"],trigger:{areas:["catacombs_entrance"],min_mythos:15,probability:0.1,once_per_run:true},description:"你在墓穴的深处找到了一段铭文。铭文记载了封印的真正代价。\n封印不是永久的。它需要维护。维护的方式是——牺牲。\n每隔一段时间，一个人必须留在封印的另一边，用自己的意识来维持封印的运作。\n「被选中的人不会死。他们会变成封印的一部分。永远。」\n你想到了那些失踪的人。他们不是死了——是被封印吸收了。",effects:{san:-5,mythos:3,add_clue:"clue_mythos_seal_cost"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_013",name:"禁忌的知识",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","knowledge"],trigger:{areas:["ruins_of_yith"],min_mythos:15,probability:0.08,once_per_run:true},description:"伊斯机器完全亮了起来。你看到了一段影像——\n是地球。几百万年前的地球。\n海里有什么东西在移动。巨大的，缓慢的，像是大陆本身在呼吸。\n然后它们来了——从星空中。它们落在地球上，建造了城市，建造了封印。\n影像的最后，它们离开了。但封印留下了。\n你知道了——伊斯文明不是地球的原住民。它们是外来者。\n而封印下面的东西——是地球原住民。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_is_origin"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_014",name:"血色种子",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","grove"],trigger:{areas:["forbidden_grove"],min_mythos:12,probability:0.1,once_per_run:true},description:"你在禁忌之林的深处找到了一棵树。树上结着果实——深红色的，像是凝固的血液。\n你摘下一颗。果实是温热的。\n你切开果实。里面不是果肉——是一颗种子。种子的形状像一个蜷缩的人。\n你把种子放在耳边。种子在呼吸。\n你知道这不是普通的种子。这是某种……生命的容器。",effects:{san:-3,mythos:3,add_item:{item_id:"curse_blood_seed",name:"血色种子",uses:1},add_clue:"clue_mythos_curse_blood_seed"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_forbidden_015",name:"写给你的信",type:"mythos",subtype:"forbidden_knowledge",weight:1,tier:"rare",tags:["mythos","forbidden","letter"],trigger:{areas:["forbidden_grove"],min_mythos:15,probability:0.08,once_per_run:true},description:"你在一棵古树的树洞里找到了一封信。信封上写着你的名字。\n你打开信。信是用你的笔迹写的。\n「如果你读到这封信，说明你已经走了足够远。」\n「封印下面的东西不是邪恶的。它只是不同。」\n「钥匙不是用来打开封印的——是用来和它沟通的。」\n「做出你的选择。但要知道——每个选择都有代价。」\n信的末尾没有签名。但你知道——这是你写的。另一个你。",effects:{san:-4,mythos:4,add_clue:"clue_mythos_letter_to_self"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"mythos_backlash_001",name:"名字的污染",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","name"],trigger:{areas:["town_center"],min_mythos:15,san_lte:30,probability:0.2,once_per_run:true},description:"你试图回忆一个名字。但你想到的不是名字——是一个符号。\n符号在你脑海里旋转。你闭上眼睛，符号还在那里。\n你睁开眼睛。笔记本上的某个名字变了——变成了那个符号。\n你用手指描摹符号。指尖传来一阵刺痛。\n你知道了——神话知识正在污染你的认知。",effects:{san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_002",name:"笔记的篡改",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","notebook"],trigger:{areas:["town_center"],min_mythos:15,san_lte:30,probability:0.2,once_per_run:true},description:"你翻开笔记本。你写的字在变化。\n不是幻觉——字迹确实在改变。你写的是中文，但它们正在变成另一种文字。\n你认出了那种文字——是伊斯文明的。\n你合上笔记本。手在发抖。\n你再次打开。字迹恢复了正常。但某些字的笔画变多了——像是有什么东西在你的笔迹里添加了什么。",effects:{san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_003",name:"影子的独立",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","shadow"],trigger:{areas:["town_center","harbor_district"],min_mythos:15,san_lte:25,probability:0.15,once_per_run:true},description:"你的影子不再跟着你了。\n你停下脚步。影子继续走了两步才停下来。\n你抬起手。影子没有动。\n你转过身。影子面对着你——但它的轮廓不对。比你高。比你瘦。\n你眨了眨眼。影子回到了正常的位置。\n但你知道——刚才影子是独立的。",effects:{san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_004",name:"NPC的变形",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","npc"],trigger:{areas:["town_center"],min_mythos:15,san_lte:25,probability:0.15,once_per_run:true},description:"你看着汤米的脸。他的脸在变化——缓慢地，细微地。\n眼睛变大了一点。下巴变尖了一点。皮肤的颜色变深了一点。\n你揉了揉眼睛。汤米的脸恢复了正常。\n「怎么了？」汤米问。\n你告诉他没事。但你知道——你刚才看到的不是幻觉。你的认知正在被神话知识污染。",effects:{san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_005",name:"记忆的替换",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","memory"],trigger:{areas:["town_center"],min_mythos:18,san_lte:25,probability:0.12,once_per_run:true},description:"你试图回忆你来到沃切斯特之前的事。你想到了——\n一片海。不是你见过的海——是某种更古老、更深的海。\n你在海里游过。你的皮肤上有鳞片。你的肺不需要空气。\n你摇了摇头。记忆消失了。\n你从未有过这样的经历。但你的身体记得——记得在水里呼吸的感觉。",effects:{san:-4,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_006",name:"文字的流动",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","text"],trigger:{areas:["town_center"],min_mythos:15,san_lte:20,probability:0.12,once_per_run:true},description:"你看着书页。文字在流动。\n不是你的眼睛在动——是文字本身在移动。它们从一行流到另一行，像是活的。\n你试图阅读。但文字在重组——变成了你不认识的句子。\n你合上书。再打开。文字恢复了正常。\n但你知道——你刚才看到的不是幻觉。文字确实在流动。",effects:{san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_007",name:"声音的叠加",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","sound"],trigger:{areas:["whispering_forest"],min_mythos:15,san_lte:25,probability:0.15,once_per_run:true},description:"你听到了声音。不是森林的低语——是另一种声音。\n声音在你脑海里响起。不是通过耳朵——是直接在你的意识里。\n声音在说话。用一种你不认识的语言。但你听得懂。\n「你已经走得太远了。你听到了太多。」\n你捂住耳朵。声音还在。\n「现在，你再也回不去了。」",effects:{san:-4,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_008",name:"现实的裂缝",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","reality"],trigger:{areas:["deep_catacombs"],min_mythos:18,san_lte:20,probability:0.1,once_per_run:true},description:"你看到了裂缝——在空气中。不是比喻。是真的裂缝。\n裂缝从地面延伸到天花板，像是玻璃碎裂的纹路。\n裂缝的另一边有光。不是灯光——是某种更原始的光。\n你把手伸向裂缝。指尖碰到了——冰冷。比冰更冷。\n你抽回手。裂缝合上了。\n但你的指尖上留下了一个印记——一个小小的、发烫的符号。",effects:{san:-5,mythos:3,hp:-1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_009",name:"自我认知的动摇",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","self"],trigger:{areas:["town_center"],min_mythos:18,san_lte:20,probability:0.1,once_per_run:true},description:"你看着镜子里的自己。你的脸在变化——不是变形，而是……变得陌生。\n你认出了五官。但它们组合在一起的方式变了。像是另一个人的脸。\n你伸手摸了摸脸。触感是正常的。但镜子里的人不是你。\n你知道它是你。但你的直觉说——不是。\n你闭上眼睛。再睁开。镜子里的脸恢复了正常。\n但你花了三秒钟才认出自己。",effects:{san:-4,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_010",name:"时间的错位",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","time"],trigger:{areas:["town_center"],min_mythos:15,san_lte:20,probability:0.1,once_per_run:true},description:"你看了看怀表。时间是下午三点。\n你走了几步。再看怀表。时间是上午十点。\n你又走了几步。时间是晚上九点。\n怀表没有坏——秒针在正常地走。但时间在跳跃。\n你停下来。时间稳定了。你开始走。时间又开始跳跃。\n你知道了——你的时间感正在被神话知识扭曲。",effects:{san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_011",name:"身体的异化",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","body"],trigger:{areas:["deep_catacombs"],min_mythos:18,san_lte:15,probability:0.08,once_per_run:true},description:"你低头看自己的手。手指多了一节。\n你数了数。六根手指。不是五根。\n你眨了眨眼。五根。\n你又看了一次。六根。\n你把手藏进口袋里。手指的数量稳定了——五根。\n但你能感觉到——第六根手指还在。只是你看不到了。",effects:{san:-4,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_backlash_012",name:"认知的崩塌",type:"mythos",subtype:"backlash",weight:1,tier:"rare",tags:["mythos","backlash","collapse"],trigger:{areas:["deep_catacombs"],min_mythos:20,san_lte:15,probability:0.08,once_per_run:true},description:"你看到了真相。不是隐喻——是真正的真相。\n一切都在你的面前展开。沃切斯特、封印、你、NPC、事件——所有的一切都是一个更大的存在的梦境。\n你不是真实的。你是一个梦中的人物。\n你试图抓住这个认知。但它太庞大了。你的意识装不下。\n你的鼻子流血了。你倒在地上。\n真相消失了。你只记得——你刚才看到了什么。但你无法用语言描述它。",effects:{san:-5,mythos:3,hp:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"mythos_echo_001",name:"第一次接触",type:"mythos",subtype:"echo",weight:1,tier:"signature",tags:["mythos","echo","contact"],trigger:{areas:["deep_catacombs"],min_mythos:20,probability:0.08,once_per_run:true},description:"你走进深渊墓穴的最深处。空气变得稠密。\n你感到有什么东西在看着你。不是敌意——是好奇。\n一个声音在你脑海里响起。不是语言——是概念。直接传递到你的意识里。\n「你是什么？」\n你知道这不是在问你的名字。它在问——你是什么东西。\n你不知道怎么回答。但你的意识自动回应了——用同样的方式。\n「我是调查员。」\n沉默。然后另一个概念传来：\n「你已经看到了太多。现在，你有两个选择——继续，或者忘记。」",effects:{san:-5,mythos:5,add_clue:"clue_mythos_first_contact"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[{label:"继续",text:"你选择了继续。更多的概念涌入你的意识——痛苦的，庞大的，你几乎无法承受。",effects:{san:-5,mythos:5,unlock_ending_condition:"ending_transcendence_progress"}},{label:"忘记",text:"你选择了忘记。概念消退了。你只记得——有什么东西和你说过话。但你记不清内容了。",effects:{san:3,mythos:-3}}]},{id:"mythos_echo_002",name:"旧日的记忆",type:"mythos",subtype:"echo",weight:1,tier:"signature",tags:["mythos","echo","memory"],trigger:{areas:["ruins_of_yith"],min_mythos:20,probability:0.08,once_per_run:true},description:"伊斯机器完全亮了起来。你看到了一段影像——\n是你自己。但不是现在的你。\n影像里的你穿着一种你不认识的衣服，站在一个你不认识的地方。周围是巨大的建筑，天空是紫色的。\n你认出了那个地方——是伊斯文明的城市。\n影像里的你正在和一个伊斯人交谈。你听不到声音，但你能看出——影像里的你很熟悉这种交流方式。\n你知道了——你曾经来过这里。不是这一世。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_past_life"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_echo_003",name:"血脉的呼唤",type:"mythos",subtype:"echo",weight:1,tier:"signature",tags:["mythos","echo","blood"],trigger:{areas:["voxchester_manor"],min_mythos:20,probability:0.08,once_per_run:true},description:"你站在莫里斯家族的地下室里。墙壁上的符号在发光。\n你感到一阵眩晕。然后你看到了——\n一段记忆。不是你的记忆——是莫里斯家族祖先的记忆。\n你看到了他们建造封印的过程。你看到了他们从海里来。你看到了他们的面孔——不是人类的面孔。\n你知道了——你和莫里斯家族有某种联系。不是血缘——是更深层的东西。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_blood_call"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_echo_004",name:"星间的低语",type:"mythos",subtype:"echo",weight:1,tier:"signature",tags:["mythos","echo","stars"],trigger:{areas:["lighthouse"],min_mythos:22,probability:0.06,time_phase:["midnight"],once_per_run:true},description:"你站在灯塔的灯室里。灯光射向夜空。\n你抬头看星星。星星在移动——缓慢地，有规律地。\n你认出了它们的排列方式。不是星座——是某种更大的图案。\n图案在你的脑海里展开。你看到了——星图。一张巨大的、跨越光年的星图。\n星图上有一个标记。标记的位置是——地球。\n你知道了——伊斯文明不是来自太阳系的某个角落。它们来自星图的另一端。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_star_map"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_echo_005",name:"深渊的回音",type:"mythos",subtype:"echo",weight:1,tier:"signature",tags:["mythos","echo","abyss"],trigger:{areas:["deep_catacombs"],min_mythos:22,probability:0.06,once_per_run:true},description:"你站在深渊墓穴的最深处。下面还有更深的地方。\n你听到了声音——从深渊的底部传来的。\n不是声音。是概念。一个巨大的概念。\n「我在这里。我一直在等。」\n你知道了——封印下面的东西不是邪恶的。它只是……孤独。\n它在这里等了几千年。等待有人来听它说话。\n你无法回答。你的意识还不够强大。但你知道了——它在。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_abyss_voice"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_echo_006",name:"时间的尽头",type:"mythos",subtype:"echo",weight:1,tier:"signature",tags:["mythos","echo","time"],trigger:{areas:["ruins_of_yith"],min_mythos:25,probability:0.05,once_per_run:true},description:"伊斯机器完全亮了起来。你看到了一段影像——\n是未来。或者过去。你无法分辨。\n影像里，沃切斯特已经不存在了。海平面升高了，城市被淹没了。\n但在水下，封印还在运作。灯塔的废墟在水面上露出一个尖端。\n影像里有一个人——站在灯塔的废墟上。你认出了那个人。\n是你。\n你知道了——你注定要来到这里。不是巧合——是命运。或者更准确地说——是时间的循环。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_time_end"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_echo_007",name:"封印的真面目",type:"mythos",subtype:"echo",weight:1,tier:"signature",tags:["mythos","echo","seal"],trigger:{areas:["catacombs_entrance"],min_mythos:22,probability:0.06,once_per_run:true},description:"你站在封印的入口。封印的符号在发光。\n你闭上眼睛。封印在你脑海里展开了——不是你以前看到的二维图案。是一个三维的结构。不——是四维的。\n你看到了封印的真面目——它不是一道门。它是一个笼子。\n笼子里关着的东西——不是怪物。是另一个现实。\n封印把两个现实隔开了。如果封印破碎——两个现实会合并。\n合并的结果——你无法想象。但你知道——那将是所有事物的终结。或者开始。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_seal_truth_full"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"mythos_echo_008",name:"最后的启示",type:"mythos",subtype:"echo",weight:1,tier:"signature",tags:["mythos","echo","final"],trigger:{areas:["deep_catacombs"],min_mythos:25,probability:0.05,once_per_run:true},description:"你站在深渊墓穴的最深处。你已经看到了很多。\n但还有最后一层。\n你闭上眼睛。意识开始下沉——穿过石壁，穿过封印，穿过——\n你看到了它。\n不是怪物。不是神。是某种更基本的东西。是现实本身的底层代码。\n一切都在这里——沃切斯特、封印、你、NPC、事件——所有的一切都是这个底层代码的产物。\n你看到了代码的漏洞。封印就是代码的漏洞。\n你知道了——如果你愿意，你可以修改代码。\n但代价是——你自己。",effects:{san:-5,mythos:5,add_clue:"clue_mythos_final_revelation",unlock_ending_condition:"ending_transcendence_available"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},

{id:"resource_food_001",name:"垃圾桶里的食物",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","survival"],trigger:{areas:["town_center"],food_lte:2,probability:0.25,once_per_run:true},description:"你路过一个垃圾桶。里面有半块面包。面包有点发霉，但还能吃。\n你环顾四周。没有人看到你。\n你的胃在叫。你已经很久没吃东西了。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"捡起来吃掉",text:"你把面包上的霉斑刮掉，塞进了嘴里。味道不好，但你的胃安静了下来。",effects:{food:1,san:-1,add_run_memory:{text:"从垃圾桶里捡了食物。"}}},{label:"继续走",text:"你加快了脚步。胃还在叫。但你的尊严还在。",effects:{add_run_memory:{text:"忍住饥饿，没有吃垃圾桶里的食物。"}}}]},{id:"resource_food_002",name:"渔民的鱼干",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","harbor"],trigger:{areas:["harbor_district"],food_lte:2,probability:0.2,once_per_run:true},description:"码头边晾着一排鱼干。没有人看守。\n你闻到了鱼干的咸香味。你的胃在叫。\n但这些鱼干是渔民的财产。如果你拿了——\n你看了看四周。远处有一个渔民在补网。他没有看你。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"拿两条鱼干",text:"你快速拿了两条鱼干，塞进口袋，离开了。",effects:{food:2,humanity:-3,add_run_memory:{text:"偷了渔民的鱼干。"}}},{label:"找渔民买",text:"你走过去，用身上仅有的钱买了两条鱼干。",effects:{food:2,add_run_memory:{text:"用钱买了鱼干。"}}},{label:"忍住",text:"你转身走了。背后是鱼干的香味。前面是未知的黑暗。",effects:{san:-1,add_run_memory:{text:"忍住饥饿，没有偷鱼干。"}}}]},{id:"resource_food_003",name:"玛莎的施舍",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","npc","martha"],trigger:{areas:["harbor_district"],food_lte:1,probability:0.2,once_per_run:true,npc_alive:["玛莎·格雷"]},description:"你走进酒吧。玛莎看到你，叹了口气。\n「你又没吃东西。」\n她从后厨端出一碗汤。汤很稀，但里面有土豆和一点鱼肉。\n「吃吧，」她说，「别客气。」\n你犹豫了。你不想欠她太多。",effects:{},event_classification:"NPC互动",normalcy_anchor:true,choices:[{label:"接受",text:"你坐下来喝完了汤。味道很好。你的胃安静了下来。",effects:{food:1,san:1,npc_trust:{"玛莎·格雷":1},add_run_memory:{text:"接受了玛莎的施舍。"}}},{label:"拒绝",text:"「我没事。」玛莎看了你一眼。她不信。但她没有坚持。",effects:{san:-1,add_run_memory:{text:"拒绝了玛莎的施舍。"}}}]},{id:"resource_food_004",name:"野猫的猎物",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","animal"],trigger:{areas:["town_center","harbor_district"],food_lte:2,probability:0.15,once_per_run:true},description:"一只野猫叼着一只老鼠从你面前跑过。\n它停下来，看着你。老鼠还活着，在猫嘴里挣扎。\n猫的眼睛在月光下闪着绿光。\n它似乎在考虑要不要把猎物让给你。或者——它在考虑你是不是下一个猎物。",effects:{},event_classification:"轻微异常",normalcy_anchor:false,choices:[{label:"和猫对视",text:"你和猫对视了几秒钟。猫转身跑了，带走了它的猎物。",effects:{add_run_memory:{text:"和野猫对视。"}}},{label:"试图抢夺",text:"你朝猫走了一步。猫发出了嘶嘶声，弓起了背。",effects:{hp:-1,add_run_memory:{text:"试图从野猫嘴里抢食物，被抓伤了。"}}}]},{id:"resource_food_005",name:"偷窃的诱惑",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","theft"],trigger:{areas:["town_center"],food_lte:1,probability:0.2,once_per_run:true},description:"你路过一家杂货店。门没锁。\n你推开门。店主不在。货架上摆着食物——面包、罐头、水果。\n你的手在发抖。不是因为冷——是因为饥饿。\n你只需要拿一点。一点就够了。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"偷一些食物",text:"你快速拿了几个面包和一罐肉，塞进外套里，离开了。",effects:{food:3,humanity:-8,add_run_memory:{text:"从杂货店偷了食物。"}}},{label:"离开",text:"你关上了门。走了。胃在叫。但你的良心没有。",effects:{humanity:3,add_run_memory:{text:"忍住饥饿，没有偷杂货店的食物。"}}}]},{id:"resource_food_006",name:"分享的抉择",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","share"],trigger:{areas:["harbor_district"],food_lte:2,probability:0.15,once_per_run:true},description:"你在码头边遇到一个孩子。他比你更瘦。\n他看着你手里的食物。你看着他的眼睛。\n你还有最后一点食物。如果分给他，你今天就要饿着了。\n但如果不分——他大概撑不到明天。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"分一半给他",text:"你把食物分成两半。一半给了他，一半留给自己。",effects:{food:-1,humanity:5,add_run_memory:{text:"把食物分给了饥饿的孩子。"}}},{label:"全部给他",text:"你把所有食物都给了他。他没有说谢谢，只是抱着食物跑了。",effects:{food:-2,humanity:8,add_run_memory:{text:"把所有食物都给了饥饿的孩子。"}}},{label:"走开",text:"你加快了脚步。背后的目光像针一样扎着你。",effects:{humanity:-3,add_run_memory:{text:"无视了饥饿的孩子。"}}}]},{id:"resource_food_007",name:"钓鱼",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","fishing"],trigger:{areas:["harbor_district"],food_lte:2,probability:0.2,once_per_run:true},description:"你坐在码头边。海面很平静。\n你有一些绳子和一个弯钉。如果你花点时间，也许能钓到什么。\n但你知道——在沃切斯特的海里，你钓上来的东西可能不是鱼。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"试着钓鱼",text:"你把钩子放进了水里。等了很久。钓上来一条小鱼。不大，但够吃一顿。",effects:{food:1,add_run_memory:{text:"在码头钓到了一条小鱼。"}}},{label:"不钓了",text:"你收起了绳子。水下的东西不值得冒险。",effects:{add_run_memory:{text:"决定不在沃切斯特的海里钓鱼。"}}}]},{id:"resource_food_008",name:"汤米的零食",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","npc","tommy"],trigger:{areas:["town_center"],food_lte:2,probability:0.2,once_per_run:true,npc_alive:["汤米·陈"]},description:"你走进汤米的店铺。他看到你，从柜台下面拿出一个小包裹。\n「我猜你又没吃东西，」他说，「这是我老婆做的包子。还热着。」\n他把包裹推到你面前。\n「不用钱。就当是我请你。」",effects:{food:2,npc_trust:{"汤米·陈":1},add_run_memory:{text:"汤米给了你一些食物。"}},event_classification:"NPC互动",normalcy_anchor:true,choices:[]},{id:"resource_food_009",name:"饥饿的幻觉",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","hallucination"],trigger:{areas:["town_center"],food_lte:0,probability:0.25,once_per_run:true},description:"你已经很久没吃东西了。你的视线开始模糊。\n你看到了一桌丰盛的饭菜——就在街角。烤鸡、面包、热汤。\n你走过去。饭菜消失了。只剩下空荡荡的地面。\n你的胃在叫。你的头在痛。你知道这是幻觉。但你的身体不知道。",effects:{san:-2,hp:-1},event_classification:"轻微异常",normalcy_anchor:false,choices:[]},{id:"resource_food_010",name:"交换",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","trade"],trigger:{areas:["town_center"],food_lte:2,probability:0.2,once_per_run:true},description:"一个人拦住了你。他手里拿着一些食物。\n「我有吃的，」他说，「但我需要一些东西来换。」\n他看着你手里的手电筒。\n「用你的手电筒换。我需要光。」",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"交换",text:"你把手电筒给了他。他给了你一些食物和一瓶水。",effects:{food:3,remove_item:{item_id:"flashlight"},add_run_memory:{text:"用手电筒换了食物。"}}},{label:"拒绝",text:"「我需要手电筒。」他耸了耸肩，走了。",effects:{add_run_memory:{text:"拒绝了用手电筒换食物的交易。"}}}]},{id:"resource_food_011",name:"垃圾堆里的罐头",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","scavenge"],trigger:{areas:["harbor_district"],food_lte:2,probability:0.2,once_per_run:true},description:"你在码头的垃圾堆里找到了一个罐头。标签已经模糊了，但你能看出是肉罐头。\n罐头有点凹陷，但没有生锈。你摇了摇——里面有东西。\n你不确定这个罐头还能不能吃。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"打开吃掉",text:"你用匕首撬开了罐头。里面的肉看起来还正常。你吃了一半。",effects:{food:2,san:-1,add_run_memory:{text:"吃了垃圾堆里的罐头。"}}},{label:"扔掉",text:"你把罐头扔回了垃圾堆。不值得冒险。",effects:{add_run_memory:{text:"扔掉了可疑的罐头。"}}}]},{id:"resource_food_012",name:"面包店的香气",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","bakery"],trigger:{areas:["town_center"],food_lte:2,probability:0.2,time_phase:["morning"],once_per_run:true},description:"你闻到了面包的香气。是从一家面包店飘出来的。\n你走过去。店主正在把新鲜的面包摆上货架。\n面包金黄酥脆，还在冒着热气。\n你的胃在叫。但你没有钱。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"乞讨",text:"你站在店门口，犹豫了很久。店主看到你，叹了口气，递给你一个面包。",effects:{food:1,humanity:-2,add_run_memory:{text:"向面包店主乞讨了食物。"}}},{label:"离开",text:"你转身走了。面包的香气跟着你走了很远。",effects:{add_run_memory:{text:"忍住饥饿，没有向面包店乞讨。"}}}]},{id:"resource_food_013",name:"老费舍的鱼",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","npc","fisher"],trigger:{areas:["harbor_district"],food_lte:1,probability:0.2,once_per_run:true,npc_alive:["老费舍"],npc_trust_gte:{"老费舍":2}},description:"老费舍看到你，从桶里捞出一条鱼。\n「拿着，」他说，「别客气。」\n鱼还是活的，在你手里挣扎。\n「你会处理鱼吗？」他问。\n你摇了摇头。\n他叹了口气，从你手里拿回鱼，三两下就处理好了。\n「给你。下次自己学。」",effects:{food:2,npc_trust:{"老费舍":1},add_run_memory:{text:"老费舍给了你一条处理好的鱼。"}},event_classification:"NPC互动",normalcy_anchor:true,choices:[]},{id:"resource_food_014",name:"食物中毒",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","poison"],trigger:{areas:["town_center","harbor_district"],food_lte:2,probability:0.15,once_per_run:true},description:"你吃了一些东西。味道不太对。但你太饿了，没有在意。\n过了半个小时，你的胃开始绞痛。你蹲在路边，额头上冒出了冷汗。\n你吐了。吐出来的东西里有一些你没吃过的——像是某种黑色的液体。\n你知道了——沃切斯特的食物不全是安全的。",effects:{hp:-2,san:-1,food:-1,add_run_memory:{text:"食物中毒，吐出了黑色液体。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"resource_food_015",name:"最后的储备",type:"resource_pressure",subtype:"food_choice",weight:1,tier:"normal",tags:["resource","food","safehouse"],trigger:{areas:["town_center"],food_lte:0,probability:0.2,once_per_run:true},description:"你回到安全屋。翻遍了所有角落。\n在一块松动的地板下面，你找到了一些东西——两罐罐头和一瓶水。\n是之前的住户留下的。罐头的标签已经褪色了，但生产日期还能看清——是去年的。\n你不确定这些罐头还能不能吃。但你已经没有别的选择了。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"吃掉",text:"你打开了罐头。里面的肉看起来还正常。你吃了一罐，留了一罐。",effects:{food:2,san:-1,add_run_memory:{text:"吃了安全屋里的旧罐头。"}}},{label:"不吃",text:"你把罐头放回了原处。不值得冒险。",effects:{add_run_memory:{text:"没有吃安全屋里的旧罐头。"}}}]},
{id:"resource_light_001",name:"黑暗中的脚步",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","darkness"],trigger:{areas:["catacombs_entrance"],light_lte:1,probability:0.25,once_per_run:true},description:"你走进墓穴。灯光很暗——几乎看不到前方的路。\n你听到了脚步声。不是你的是——\n你停下来。脚步声也停了。\n你继续走。脚步声又开始了。\n你什么都看不到。但你知道——有什么东西在跟着你。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[{label:"大声呼喊",text:"你大声喊了一声。回声在墓穴里回荡。脚步声消失了。",effects:{san:-1,add_run_memory:{text:"在黑暗的墓穴里大声呼喊，驱赶了跟踪者。"}}},{label:"加快脚步",text:"你加快了脚步。脚步声也加快了。你跑了起来。",effects:{san:-2,add_run_memory:{text:"在黑暗的墓穴里奔跑。"}}}]},{id:"resource_light_002",name:"手电筒的闪烁",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","flashlight"],trigger:{areas:["whispering_forest","catacombs_entrance"],light_lte:1,probability:0.2,once_per_run:true},description:"你的手电筒开始闪烁。光一明一暗，像是快要没电了。\n你拍了拍手电筒。光稳定了一会儿，然后又开始闪烁。\n你知道——手电筒撑不了多久了。\n在沃切斯特的黑暗中，没有光意味着——\n你不敢想下去。",effects:{san:-1},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"节省电量",text:"你关掉了手电筒，只在需要的时候打开。黑暗包围了你。",effects:{san:-2,add_run_memory:{text:"手电筒快没电了，节省使用。"}}},{label:"寻找光源",text:"你开始在黑暗中摸索，寻找任何可以发光的东西。",effects:{add_clue:"clue_resource_light_search",add_run_memory:{text:"手电筒快没电了，寻找替代光源。"}}}]},{id:"resource_light_003",name:"蜡烛",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","candle"],trigger:{areas:["voxchester_manor"],light_lte:1,probability:0.2,once_per_run:true},description:"你在庄园的走廊里摸索。几乎什么都看不到。\n你的手碰到了什么东西——是蜡烛。一支半截的蜡烛，插在烛台上。\n你摸了摸口袋。你有火柴吗？\n你记得——你有。是上周从杂货店买的。\n你划亮了火柴。火光照亮了走廊的一小段。你看到了——墙壁上有字。",effects:{san:1,add_clue:"clue_resource_candle_message"},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"resource_light_004",name:"黑暗中的声音",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","sound"],trigger:{areas:["deep_catacombs"],light_lte:0,probability:0.25,once_per_run:true},description:"你什么都看不到。完全的黑暗。\n但你能听到声音。很多声音。\n有脚步声。有呼吸声。有低语声。\n你知道——你不是一个人。在这片黑暗中，有什么东西在看着你。\n你伸出手。碰到了什么——冰冷的，光滑的。像是石头。又像是皮肤。\n你抽回了手。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[{label:"闭上眼睛",text:"你闭上了眼睛。在完全的黑暗中，闭不闭眼没有区别。但你感到了一丝安慰。",effects:{san:-1,add_run_memory:{text:"在完全的黑暗中闭上了眼睛。"}}},{label:"大声唱歌",text:"你开始唱歌。声音在黑暗中回荡。声音渐渐变小——被什么东西吸收了。",effects:{san:-2,add_run_memory:{text:"在完全的黑暗中唱歌，声音被吸收了。"}}}]},{id:"resource_light_005",name:"月光",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","moon"],trigger:{areas:["whispering_forest"],light_lte:1,probability:0.2,time_phase:["evening","midnight"],once_per_run:true},description:"你走出了森林的树冠覆盖区。月光洒了下来。\n你松了一口气。在沃切斯特，月光是少有的安全光源。\n你抬头看月亮。月亮是红色的。\n你记得——今天不是血月。但月亮确实是红色的。\n你低头看地上的影子。影子比平时更长了。而且——影子的方向不对。",effects:{san:-2},event_classification:"轻微异常",normalcy_anchor:false,choices:[]},{id:"resource_light_006",name:"发光的蘑菇",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","mushroom"],trigger:{areas:["forbidden_grove"],light_lte:1,probability:0.2,once_per_run:true},description:"你在黑暗中看到了光——微弱的，蓝绿色的光。\n是蘑菇。长在一棵枯树的根部。蘑菇的伞盖在发光。\n你凑近看。光很微弱，但足以照亮周围一小片区域。\n你摘了一朵。光在你手里继续发光。但你能感觉到——蘑菇是温热的。像是活的。",effects:{san:-1,add_item:{item_id:"glowing_mushroom",name:"发光蘑菇",uses:3}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"resource_light_007",name:"灯光的代价",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","cost"],trigger:{areas:["town_center"],light_lte:1,probability:0.2,once_per_run:true},description:"你需要光。你走进一家杂货店。\n店主有灯油。但价格是平时的三倍。\n「雾季涨价，」他解释，「灯油不好进。」\n你看着手里的钱。够买一瓶。但买了灯油，你就没钱买别的了。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"买灯油",text:"你付了钱，拿走了灯油。至少今晚你有光了。",effects:{modify_resource:{resource:"light",amount:1},add_run_memory:{text:"花高价买了灯油。"}}},{label:"不买",text:"你把钱收了回去。你还有别的办法。",effects:{add_run_memory:{text:"拒绝了高价灯油。"}}}]},{id:"resource_light_008",name:"火把",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","torch"],trigger:{areas:["catacombs_entrance"],light_lte:0,probability:0.2,once_per_run:true},description:"你在墓穴入口的角落里找到了一些木棍和布条。你可以做一个简易的火把。\n但你需要火源。你摸了摸口袋——火柴还在。\n你用布条缠住了木棍，划亮了火柴。火把点着了。\n火光照亮了墓穴的入口。你看到了——墙壁上有很多字。",effects:{san:1,add_clue:"clue_resource_torch_wall"},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"resource_light_009",name:"黑暗中的怪物",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","monster"],trigger:{areas:["deep_catacombs"],light_lte:0,probability:0.2,time_phase:["midnight"],once_per_run:true},description:"你什么都看不到。但你能听到——呼吸声。很近。\n有什么东西在你身边。你能感觉到它的体温——冰冷的。\n你伸出手。碰到了什么——滑腻的，有鳞片的。\n你抽回了手。呼吸声变得更重了。\n你知道——它在看着你。在完全的黑暗中。",effects:{san:-3,hp:-1},event_classification:"怪物遭遇",normalcy_anchor:false,choices:[{label:"保持不动",text:"你屏住了呼吸。一动不动。过了很久——也许是几分钟，也许是几小时——呼吸声远去了。",effects:{san:-2,add_run_memory:{text:"在完全的黑暗中遇到了怪物，保持不动逃过一劫。"}}},{label:"逃跑",text:"你转身就跑。撞到了墙壁。你爬起来继续跑。身后的呼吸声越来越近。",effects:{hp:-2,san:-2,add_run_memory:{text:"在完全的黑暗中逃跑，撞伤了自己。"}}}]},{id:"resource_light_010",name:"灯油的残渣",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","oil"],trigger:{areas:["lighthouse"],light_lte:1,probability:0.2,once_per_run:true},description:"你在灯塔的地下室找到了一些灯油。不多——大概够用一天。\n灯油是从一个破桶里漏出来的。你用布条吸收了一些。\n你闻了闻——是灯油。但味道有点不对。像是混了什么别的东西。\n你不确定这种灯油能不能用。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"使用",text:"你把布条做成了简易灯芯。点燃后，火光是绿色的。但至少有光。",effects:{modify_resource:{resource:"light",amount:1},san:-1,add_run_memory:{text:"使用了混有杂质的灯油。"}}},{label:"不用",text:"你把布条扔了。不值得冒险。",effects:{add_run_memory:{text:"没有使用可疑的灯油。"}}}]},{id:"resource_light_011",name:"眼睛",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","eyes"],trigger:{areas:["whispering_forest"],light_lte:0,probability:0.2,time_phase:["midnight"],once_per_run:true},description:"你在森林里。没有光。\n你什么都看不到。但你感到了注视——从四面八方。\n然后你看到了眼睛。很多双眼睛。在树丛中，在草丛里，在树干上。\n眼睛是绿色的。不是动物的眼睛——动物的眼睛不会那么多。\n你停下了脚步。眼睛也在看着你。没有敌意。只是看着。\n然后眼睛消失了。一只一只地，像是灯泡熄灭了。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_light_012",name:"灯塔的光",type:"resource_pressure",subtype:"light_exhaustion",weight:1,tier:"normal",tags:["resource","light","lighthouse"],trigger:{areas:["harbor_district"],light_lte:1,probability:0.15,time_phase:["midnight"],once_per_run:true},description:"你站在码头边。远处灯塔的光扫过海面。\n你看着灯光。灯光的节奏不对——不是正常的旋转。\n灯光在闪烁。三短。三长。三短。\nSOS。\n你知道——灯塔里有人在发信号。但灯塔应该是空的。\n灯光停了。然后又开始了。同样的节奏。",effects:{san:-2,add_clue:"clue_resource_lighthouse_signal"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},
{id:"resource_med_001",name:"草药",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","herb"],trigger:{areas:["whispering_forest"],hp_lte_ratio:0.3,probability:0.2,once_per_run:true},description:"你在森林里找到了一些草药。你认出了其中一种——是止血草。\n你摘了一些，嚼碎了敷在伤口上。伤口的疼痛减轻了。\n但你知道——在沃切斯特，草药可能不只是草药。你闻到了草药里有一股奇怪的味道。",effects:{hp:2,san:-1,add_run_memory:{text:"用森林里的草药处理了伤口。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"resource_med_002",name:"危险的交易",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","trade"],trigger:{areas:["town_center"],hp_lte_ratio:0.3,probability:0.2,once_per_run:true},description:"一个人拦住了你。他看到了你身上的伤。\n「你需要药？」他问。\n他从口袋里掏出一个小瓶。「这个能治你的伤。但代价是——」\n他看着你的眼睛。\n「一个秘密。告诉我一个你没有告诉过任何人的秘密。」",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"交换",text:"你告诉了他一个秘密。他把小瓶递给了你。",effects:{hp:3,add_run_memory:{text:"用秘密换了一瓶药。"}}},{label:"拒绝",text:"「我的秘密不是用来交换的。」他耸了耸肩，走了。",effects:{add_run_memory:{text:"拒绝了用秘密换药的交易。"}}}]},{id:"resource_med_003",name:"伊莱亚斯的药",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","npc","elias"],trigger:{areas:["town_center"],hp_lte_ratio:0.3,probability:0.2,once_per_run:true,npc_alive:["伊莱亚斯·沃德"]},description:"伊莱亚斯看到你的伤，皱了皱眉。\n「你受伤了，」他说，「进来。」\n他从书架后面拿出一个小盒子。里面是一些药粉和绷带。\n「这是我以前研究时准备的。对伤口有效。」\n他帮你处理了伤口。手法很熟练。",effects:{hp:3,npc_trust:{"伊莱亚斯·沃德":1},add_run_memory:{text:"伊莱亚斯帮你处理了伤口。"}},event_classification:"NPC互动",normalcy_anchor:true,choices:[]},{id:"resource_med_004",name:"忍耐",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","endurance"],trigger:{areas:["town_center","harbor_district"],hp_lte_ratio:0.3,probability:0.15,once_per_run:true},description:"你没有药。你的伤口还在流血。\n你用布条紧紧地缠住了伤口。疼痛让你的眼前发黑。\n你深吸一口气。疼痛减轻了一点。但你知道——如果不处理，伤口会感染。\n你需要找到药。或者找到一个能帮你的人。",effects:{san:-1,add_run_memory:{text:"没有药品，只能忍耐伤口的疼痛。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"resource_med_005",name:"教堂的急救",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","church"],trigger:{areas:["town_center"],hp_lte_ratio:0.3,probability:0.15,once_per_run:true},description:"你走进教堂。伊莎贝拉看到你，立刻站起来。\n「你受伤了，」她说，「坐下。」\n她从祭坛下面拿出一个急救箱。里面有一些基本的药品和绷带。\n她帮你处理了伤口。手法很温柔。\n「你应该更小心，」她说，「沃切斯特已经够危险了。」",effects:{hp:2,add_run_memory:{text:"伊莎贝拉在教堂帮你处理了伤口。"}},event_classification:"NPC互动",normalcy_anchor:true,choices:[]},{id:"resource_med_006",name:"感染",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","infection"],trigger:{areas:["town_center","harbor_district"],hp_lte_ratio:0.3,probability:0.15,once_per_run:true},description:"你的伤口开始发炎。红肿、发热、疼痛加剧。\n你知道——伤口感染了。如果不处理，会越来越严重。\n你需要抗生素。或者至少需要一些干净的绷带和消毒水。\n但你现在什么都没有。",effects:{hp:-1,san:-1,add_run_memory:{text:"伤口感染了。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"resource_med_007",name:"玛莎的药酒",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","npc","martha"],trigger:{areas:["harbor_district"],hp_lte_ratio:0.3,probability:0.15,once_per_run:true,npc_alive:["玛莎·格雷"]},description:"玛莎看到你的伤，从吧台下面拿出一瓶酒。\n「这不是普通的酒，」她说，「是药酒。泡了一些草药。」\n她倒了一杯递给你。「喝下去。然后用剩下的洗伤口。」\n你喝了一口。酒很烈，但你能尝到草药的味道。伤口的疼痛减轻了一些。",effects:{hp:2,san:1,add_run_memory:{text:"玛莎用药酒帮你处理了伤口。"}},event_classification:"NPC互动",normalcy_anchor:true,choices:[]},{id:"resource_med_008",name:"自愈",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","self_heal"],trigger:{areas:["town_center"],hp_lte_ratio:0.3,probability:0.15,once_per_run:true},description:"你坐在安全屋里。伤口还在痛。\n你用布条紧紧地缠住了伤口。然后你躺下来，闭上了眼睛。\n你不知道过了多久。但当你醒来时，伤口的疼痛减轻了。\n你的身体正在自愈。很慢，但确实在愈合。\n你知道——在沃切斯特，自愈是少有的安慰。",effects:{hp:1,san:1,add_run_memory:{text:"在安全屋里休息，伤口自愈了一些。"}},event_classification:"正常事件",normalcy_anchor:true,choices:[]},{id:"resource_med_009",name:"代价",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","cost"],trigger:{areas:["town_center"],hp_lte_ratio:0.3,probability:0.12,once_per_run:true},description:"你在街上遇到了一个人。他看到了你的伤。\n「我可以帮你，」他说，「但代价很大。」\n他从口袋里掏出一个小瓶。里面的液体是红色的。\n「喝下去。你的伤会好。但你会忘记一些东西。」\n他看着你。\n「你愿意吗？」",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"喝下去",text:"你把红色液体喝了下去。伤口的疼痛立刻消失了。但你忘记了——什么？你记不清了。",effects:{hp:5,san:-3,add_run_memory:{text:"喝了一种奇怪的药，伤好了但失去了部分记忆。"}}},{label:"拒绝",text:"「不。」他点了点头，收起了小瓶。",effects:{add_run_memory:{text:"拒绝了代价不明的药物。"}}}]},{id:"resource_med_010",name:"简陋的手术",type:"resource_pressure",subtype:"medicine_shortage",weight:1,tier:"normal",tags:["resource","medicine","surgery"],trigger:{areas:["harbor_district"],hp_lte_ratio:0.2,probability:0.1,once_per_run:true},description:"你的伤口很深。需要缝合。\n你没有针线。但你找到了一根鱼钩和一些渔线。\n你看着这些东西。你知道你需要做什么。\n你深吸一口气。把鱼钩穿过了伤口边缘的皮肤。疼痛让你的眼前发黑。\n你缝了三针。粗糙、不整齐，但至少伤口合上了。",effects:{hp:2,san:-2,add_run_memory:{text:"用鱼钩和渔线给自己缝了伤口。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},
{id:"resource_safehouse_001",name:"墙上的手印",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","invasion"],trigger:{areas:["town_center"],safehouse_corruption_gte:50,probability:0.2,once_per_run:true},description:"你回到安全屋。门是锁着的。你进去了。\n墙上多了一些手印。很小，像是孩子的。\n但手印的高度不对——太高了，孩子够不到。\n手印是黑色的。你用手指碰了碰——是湿的。你闻了闻——是铁锈和海水的味道。\n你知道——有东西进过你的安全屋。",effects:{san:-2,safehouseCorruption:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_safehouse_002",name:"被翻动的物品",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","invasion"],trigger:{areas:["town_center"],safehouse_corruption_gte:50,probability:0.2,once_per_run:true},description:"你回到安全屋。你的物品被动过了。\n笔记本被翻到了不同的页码。食物少了一些。急救包被打开了。\n但门是锁着的。窗户也是关着的。\n有东西进来过。但它是怎么进来的？\n你检查了所有可能的入口。没有痕迹。\n除了——地板上有一滩水。",effects:{san:-2,food:-1,safehouseCorruption:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_safehouse_003",name:"NPC的闯入",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","npc","invasion"],trigger:{areas:["town_center"],safehouse_corruption_gte:60,probability:0.15,once_per_run:true},description:"你回到安全屋。门开着。\n你走进去。一个人坐在你的椅子上。\n你认出了他——是镇上的一个居民。但他的眼睛不对——瞳孔太大了，像是没有光的深井。\n他看到你，站了起来。\n「我来找你，」他说，「它让我来找你。」\n他朝你走了一步。你注意到他的脚是湿的。",effects:{san:-3,safehouseCorruption:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[{label:"把他赶出去",text:"你用力把他推出了门外。他没有反抗。但他站在门外，看着你。\n「它还会来的，」他说，「它总会来的。」\n然后他转身走了。",effects:{san:-1,add_run_memory:{text:"把一个被控制的人赶出了安全屋。"}}},{label:"和他交谈",text:"你问他：「它是谁？」\n他的嘴角抽搐了一下。\n「它在水下面。它一直在看着。」\n然后他倒下了。你扶住他。他的身体很冷。",effects:{san:-2,add_clue:"clue_safehouse_invader",add_run_memory:{text:"和一个被控制的人交谈。"}}}]},{id:"resource_safehouse_004",name:"地板下的声音",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","sound"],trigger:{areas:["town_center"],safehouse_corruption_gte:50,probability:0.2,time_phase:["midnight"],once_per_run:true},description:"你躺在床上。地板下面有声音。\n是敲击声。有节奏的。三短。三长。三短。\n你把耳朵贴在地板上。声音更清晰了。\n你知道——地板下面没有地下室。至少图纸上没有。\n但声音确实在那里。像是有什么东西在地板下面。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_safehouse_005",name:"被污染的食物",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","food"],trigger:{areas:["town_center"],safehouse_corruption_gte:50,probability:0.2,once_per_run:true},description:"你回到安全屋。你储存的食物变了。\n面包上长了霉——但霉的形状不对。像是某种文字。\n你凑近看。确实是文字。但你不认识。\n你把面包扔了。你检查了其他食物。罐头的标签也变了——变成了那种你不认识的文字。\n你知道——你的食物被污染了。",effects:{food:-2,san:-2,safehouseCorruption:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_safehouse_006",name:"NPC的信任危机",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","npc","trust"],trigger:{areas:["town_center"],safehouse_corruption_gte:60,probability:0.15,once_per_run:true},description:"你邀请一个NPC来你的安全屋。他看到安全屋的状态，皱了皱眉。\n「你住在这种地方？」他问。\n你解释说安全屋被污染了。他看着墙上的痕迹，摇了摇头。\n「我不会再来这里了，」他说，「这里不安全。」\n他走了。你知道——安全屋的状态正在影响你和NPC的关系。",effects:{npc_trust:{"汤米·陈":-1},add_run_memory:{text:"NPC因为安全屋的状态拒绝来访。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"resource_safehouse_007",name:"灯光的异常",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","light"],trigger:{areas:["town_center"],safehouse_corruption_gte:50,probability:0.2,time_phase:["midnight"],once_per_run:true},description:"你躺在床上。灯突然灭了。\n你起来检查。灯油还有。灯芯也正常。但灯就是点不着。\n你划了火柴。火柴亮了，但灯光照不远——像是被什么东西吸收了。\n你环顾四周。安全屋里很暗。比外面还暗。\n你知道——安全屋的光源正在被什么东西吞噬。",effects:{san:-2,modify_resource:{resource:"light",amount:-1}},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_safehouse_008",name:"墙壁的变化",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","wall"],trigger:{areas:["town_center"],safehouse_corruption_gte:70,probability:0.15,once_per_run:true},description:"你回到安全屋。墙壁变了。\n不是颜色变了——是形状变了。墙壁变得不平整了，像是有什么东西从里面往外推。\n你用手摸了摸。墙壁是软的。像皮肤。\n"+DESC.WALL_HAND_REMOVE+"",effects:{san:-3,safehouseCorruption:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_safehouse_009",name:"入侵者",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","invasion"],trigger:{areas:["town_center"],safehouse_corruption_gte:70,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你被声音吵醒了。是脚步声。在安全屋里。\n你睁开眼睛。一个人影站在房间中央。\n你看不清它的脸。但你能看出——它不是人。四肢太长了。比例不对。\n它看着你。你看着它。\n然后它走了。穿过了墙壁。像是墙壁不存在一样。\n你起来检查。墙壁完好无损。但你注意到——墙壁上有一片潮湿的印记。",effects:{san:-3,safehouseCorruption:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_safehouse_010",name:"净化",type:"resource_pressure",subtype:"safehouse_invasion",weight:1,tier:"normal",tags:["resource","safehouse","purify"],trigger:{areas:["town_center"],safehouse_corruption_gte:50,probability:0.15,once_per_run:true},description:"你决定净化安全屋。你用盐在门口和窗户上画了线。你点燃了所有的灯。\n你坐在房间中央，闭上眼睛，集中精神。\n你感到了什么——在安全屋的角落里。是某种存在。微弱的，但确实存在。\n你睁开眼睛。角落里什么都没有。但空气变清新了。\n你知道——你的净化起了作用。至少暂时。",effects:{safehouseCorruption:-10,san:2,add_run_memory:{text:"净化了安全屋。"}},event_classification:"正常事件",normalcy_anchor:true,choices:[]},
{id:"resource_extreme_001",name:"大雾中的声音",type:"resource_pressure",subtype:"extreme_weather",weight:1,tier:"normal",tags:["resource","weather","fog","sound"],trigger:{areas:["town_center","harbor_district"],san_lte:40,requires_weather:["大雾"],probability:0.2,once_per_run:true},description:"雾很浓。你几乎看不到前方的路。\n你听到了声音。是从雾里传来的。\n是脚步声。很多脚步声。像是有一群人在雾里走。\n你停下了。脚步声也停了。\n你继续走。脚步声又开始了。\n你知道——雾里有什么东西。但你看不到它。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[{label:"朝声音走去",text:"你朝着声音走去。走了几步，声音消失了。你站在雾中，什么也看不到。",effects:{san:-2,add_clue:"clue_extreme_fog_sound",add_run_memory:{text:"在大雾中追寻神秘的脚步声。"}}},{label:"背离声音",text:"你转身朝相反的方向走去。脚步声渐渐远了。",effects:{add_run_memory:{text:"在大雾中背离了神秘的脚步声。"}}}]},{id:"resource_extreme_002",name:"血月下的影子",type:"resource_pressure",subtype:"extreme_weather",weight:1,tier:"normal",tags:["resource","weather","blood_moon","shadow"],trigger:{areas:["whispering_forest"],san_lte:40,requires_weather:["血月"],probability:0.2,once_per_run:true},description:"血月的光照在森林里。一切都是红色的。\n你的影子投在地上。但影子的形状不对——不是你的形状。\n影子太长了。太瘦了。四肢的比例不对。\n你动了动。影子也动了。但不是你的动作——是它自己的。\n你停下了。影子也停下了。然后影子转过头来——看着你。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_extreme_003",name:"迷路",type:"resource_pressure",subtype:"extreme_weather",weight:1,tier:"normal",tags:["resource","weather","fog","lost"],trigger:{areas:["whispering_forest"],san_lte:40,requires_weather:["大雾"],probability:0.2,once_per_run:true},description:"你在森林里迷路了。雾太浓了，你分不清方向。\n你走了很久。但你感觉——你没有前进。周围的树木看起来都一样。\n你停下来。你听到了水声。你知道——附近有一条小溪。小溪会带你走出森林。\n但你不确定小溪在哪个方向。水声从四面八方传来。",effects:{san:-2},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"跟着声音走",text:"你选了一个方向，朝着水声走去。走了很久，你找到了小溪。沿着小溪，你走出了浓雾区。",effects:{add_run_memory:{text:"在大雾中迷路，跟着水声找到了出路。"}}},{label:"原地等待",text:"你坐下来，等待雾散去。等了很久。雾没有散。但你感到了一丝平静。",effects:{san:1,add_run_memory:{text:"在大雾中原地等待。"}}}]},{id:"resource_extreme_004",name:"血月的低语",type:"resource_pressure",subtype:"extreme_weather",weight:1,tier:"normal",tags:["resource","weather","blood_moon","whisper"],trigger:{areas:["town_center","harbor_district"],san_lte:40,requires_weather:["血月"],probability:0.2,once_per_run:true},description:"血月的光照在你身上。你感到了——什么？不是热，不是冷。是某种更基本的东西。\n你听到了低语。不是从外面来的——是从你自己的脑海里来的。\n低语在说话。用一种你不认识的语言。但你听得懂。\n「血月之夜。门会变薄。」\n你摇了摇头。低语消失了。但你知道——你刚才听到的是真的。",effects:{san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"resource_extreme_005",name:"大雾中的灯",type:"resource_pressure",subtype:"extreme_weather",weight:1,tier:"normal",tags:["resource","weather","fog","light"],trigger:{areas:["harbor_district"],san_lte:40,requires_weather:["大雾"],probability:0.15,once_per_run:true},description:"你在大雾中看到了一盏灯。灯光很远，但你能看清——是一盏手提灯。\n灯光在移动。朝你的方向移动。\n你等着。灯光越来越近。\n然后灯光停下了。距离你大概十步远。\n你看不清灯光后面是什么。但你能看到——灯光的颜色不对。是绿色的。\n你知道——沃切斯特的雾里，绿色的灯光不是好事。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[{label:"朝灯光走去",text:"你朝着灯光走去。走了几步，灯光消失了。你站在雾中，什么也看不到。",effects:{san:-2,add_run_memory:{text:"在大雾中追寻绿色的灯光。"}}},{label:"转身离开",text:"你转身走了。背后是绿色的灯光。前面是未知的黑暗。",effects:{add_run_memory:{text:"在大雾中回避了绿色的灯光。"}}}]},{id:"resource_extreme_006",name:"血月下的野兽",type:"resource_pressure",subtype:"extreme_weather",weight:1,tier:"normal",tags:["resource","weather","blood_moon","monster"],trigger:{areas:["whispering_forest"],san_lte:35,requires_weather:["血月"],probability:0.15,once_per_run:true},description:"血月的光照在森林里。你听到了嚎叫声。\n不是狼——是某种更大的东西。嚎叫声从远处传来，但你能感觉到震动。\n你躲到了一棵大树后面。你看到了它——在树林间移动。\n它很大。比熊还大。它的轮廓在血月的光照下显得——不对。四肢太长了。比例不对。\n它停下了。转过头。看着你。\n然后它继续走了。消失在树林里。",effects:{san:-3,hp:-1},event_classification:"怪物遭遇",normalcy_anchor:false,choices:[]},{id:"resource_extreme_007",name:"大雾中的陷阱",type:"resource_pressure",subtype:"extreme_weather",weight:1,tier:"normal",tags:["resource","weather","fog","trap"],trigger:{areas:["harbor_district"],san_lte:40,requires_weather:["大雾"],probability:0.15,once_per_run:true},description:"你在大雾中走着。突然，你的脚踩空了。\n你掉了下去。不深——大概一米。但你的脚踝扭了。\n你抬头看。雾太浓了，你看不到洞口的边缘。\n你摸索着爬了上去。你的脚踝在痛。\n你知道——在沃切斯特的大雾里，连地面都不是安全的。",effects:{hp:-2,san:-1,add_run_memory:{text:"在大雾中踩到了陷阱，扭伤了脚踝。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"resource_extreme_008",name:"血月下的真相",type:"resource_pressure",subtype:"extreme_weather",weight:1,tier:"normal",tags:["resource","weather","blood_moon","truth"],trigger:{areas:["catacombs_entrance"],san_lte:35,requires_weather:["血月"],probability:0.1,once_per_run:true},description:"血月的光照在墓穴入口。你看到了——\n封印的符号在发光。不是反射月光——是自己在发光。\n你走近了。符号的颜色在变化。从蓝色变成了红色。和月亮一样的红色。\n你知道了——血月不是自然现象。血月是封印在衰弱的信号。\n符号的光越来越亮。然后突然灭了。你的眼前一片黑暗。",effects:{san:-3,mythos:2,add_clue:"clue_extreme_blood_moon_seal"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]}];var resourceEvents=_events_resourceEvents;
const _events_npcCrossEvents=[
{id:"npc_cross_duo_001",name:"玛莎与老费舍的争执",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","martha","fisher"],trigger:{areas:["harbor_district"],npc_trust_gte:{"玛莎·格雷":2,"老费舍":2},probability:0.15,once_per_run:true,npc_alive:["玛莎·格雷","老费舍"]},description:"你走进酒吧。玛莎和老费舍在争吵。\n「你不能总是一个人出海！」玛莎说，「太危险了。」\n老费舍摇了摇头。「海里有我需要的东西。」\n「你需要的是活着！」玛莎的声音提高了。\n他们看到你，都停了下来。\n「你来得正好，」玛莎说，「你来告诉他，他不能一个人出海。」\n老费舍看着你。「你觉得呢？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"支持玛莎",text:"「她说得对。一个人出海太危险了。」老费舍沉默了很久。",effects:{npc_trust:{"玛莎·格雷":1,"老费舍":-1},add_run_memory:{text:"在玛莎和老费舍的争执中支持了玛莎。"}}},{label:"支持老费舍",text:"「他知道自己在做什么。」玛莎看了你一眼，表情复杂。",effects:{npc_trust:{"玛莎·格雷":-1,"老费舍":1},add_run_memory:{text:"在玛莎和老费舍的争执中支持了老费舍。"}}},{label:"沉默",text:"你没有说话。玛莎叹了口气，老费舍继续喝酒。",effects:{add_run_memory:{text:"在玛莎和老费舍的争执中保持了沉默。"}}}]},{id:"npc_cross_duo_002",name:"伊莱亚斯与汤米的讨论",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","elias","tommy"],trigger:{areas:["town_center"],npc_trust_gte:{"伊莱亚斯·沃德":2,"汤米·陈":2},probability:0.15,once_per_run:true,npc_alive:["伊莱亚斯·沃德","汤米·陈"]},description:"你走进汤米的店铺。伊莱亚斯也在。他们正在看一张照片。\n「你看这个，」汤米指着照片，「这是我在码头拍的。」\n照片上是一艘船。船身很旧，但你注意到——船的名字是用一种你不认识的文字写的。\n伊莱亚斯凑近看。「这不是英文。也不是拉丁文。」\n他看着你。「你见过这种文字吗？」",effects:{add_clue:"clue_npc_cross_strange_text"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"告诉他们你见过",text:"你告诉他们在墓穴里见过类似的符号。伊莱亚斯的眼睛亮了。",effects:{npc_trust:{"伊莱亚斯·沃德":1,"汤米·陈":1},add_run_memory:{text:"告诉伊莱亚斯和汤米你见过类似的文字。"}}},{label:"说没见过",text:"你摇了摇头。伊莱亚斯看起来有些失望。",effects:{add_run_memory:{text:"对伊莱亚斯和汤米隐瞒了信息。"}}}]},{id:"npc_cross_duo_003",name:"希尔达与伊莎贝拉的密谈",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","hilda","isabella"],trigger:{areas:["town_center"],npc_trust_gte:{"希尔达·莫里斯":2,"伊莎贝拉·韦伯":2},probability:0.12,once_per_run:true,npc_alive:["希尔达·莫里斯","伊莎贝拉·韦伯"]},description:"你在教堂附近看到了希尔达和伊莎贝拉。她们在低声交谈。\n你走近时，她们停了下来。\n希尔达看了你一眼。「你来得正好。」她说。\n伊莎贝拉点了点头。「我们需要你的帮助。」\n她们交换了一个眼神。然后希尔达说：\n「关于封印——我们知道一些事情。但我们不确定该不该告诉你。」",effects:{add_clue:"clue_npc_cross_seal_secret"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"请求她们告诉你",text:"「请告诉我。我需要知道真相。」她们又交换了一个眼神。",effects:{npc_trust:{"希尔达·莫里斯":1,"伊莎贝拉·韦伯":1},add_clue:"clue_npc_cross_seal_truth",add_run_memory:{text:"希尔达和伊莎贝拉告诉你了关于封印的秘密。"}}},{label:"说你会自己调查",text:"「我会自己找到答案的。」希尔达看起来有些失望。",effects:{add_run_memory:{text:"拒绝了希尔达和伊莎贝拉的帮助。"}}}]},{id:"npc_cross_duo_004",name:"约书亚与老费舍的沉默",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","joshua","fisher"],trigger:{areas:["harbor_district"],npc_trust_gte:{"约书亚·布莱克":2,"老费舍":2},probability:0.12,once_per_run:true,npc_alive:["约书亚·布莱克","老费舍"]},description:"你在码头边看到约书亚和老费舍坐在一起。他们没有说话。\n你走过去坐下。他们看了你一眼，继续沉默。\n过了很久，约书亚开口了：\n「你有没有想过——海下面有什么？」\n老费舍补充道：「不是鱼。是别的什么。」\n他们看着海面。海面很平静。但你知道——水下面不是。",effects:{add_clue:"clue_npc_cross_sea_below"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"问他们知道什么",text:"「你们知道什么？」他们交换了一个眼神。然后老费舍说：\n「灯塔下面有东西。不是灯——是门。",effects:{npc_trust:{"约书亚·布莱克":1,"老费舍":1},add_clue:"clue_npc_cross_lighthouse_door",add_run_memory:{text:"约书亚和老费舍告诉你灯塔下面有门。"}}},{label:"保持沉默",text:"你没有说话。你们三个坐在码头边，看着海面。",effects:{add_run_memory:{text:"和约书亚、老费舍一起沉默地看着海面。"}}}]},{id:"npc_cross_duo_005",name:"埃德加与伊莱亚斯的辩论",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","edgar","elias"],trigger:{areas:["town_center"],npc_trust_gte:{"埃德加·洛夫克拉夫特":2,"伊莱亚斯·沃德":2},probability:0.12,once_per_run:true,npc_alive:["埃德加·洛夫克拉夫特","伊莱亚斯·沃德"]},description:"你走进图书馆。埃德加和伊莱亚斯在辩论。\n「真相应该被公开！」埃德加说，「人们有权知道！」\n「有些真相太危险了，」伊莱亚斯反驳，「公开会导致恐慌。」\n他们看到你，都停了下来。\n「你来得正好，」埃德加说，「你觉得真相应该被公开吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"支持埃德加",text:"「人们有权知道真相。」伊莱亚斯叹了口气。",effects:{npc_trust:{"埃德加·洛夫克拉夫特":1,"伊莱亚斯·沃德":-1},add_run_memory:{text:"在埃德加和伊莱亚斯的辩论中支持了公开真相。"}}},{label:"支持伊莱亚斯",text:"「有些真相确实太危险了。」埃德加看起来很失望。",effects:{npc_trust:{"埃德加·洛夫克拉夫特":-1,"伊莱亚斯·沃德":1},add_run_memory:{text:"在埃德加和伊莱亚斯的辩论中支持了隐瞒真相。"}}},{label:"两不相帮",text:"「你们都有道理。」他们看起来都不太满意。",effects:{add_run_memory:{text:"在埃德加和伊莱亚斯的辩论中保持中立。"}}}]},{id:"npc_cross_duo_006",name:"玛莎与伊莎贝拉的交易",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","martha","isabella"],trigger:{areas:["town_center"],npc_trust_gte:{"玛莎·格雷":2,"伊莎贝拉·韦伯":2},probability:0.12,once_per_run:true,npc_alive:["玛莎·格雷","伊莎贝拉·韦伯"]},description:"你在教堂附近看到玛莎和伊莎贝拉在交谈。她们的表情都很严肃。\n你走近时，玛莎说：\n「我们需要你的帮助。伊莎贝拉找到了一些东西——关于封印的。但需要有人去取。」\n伊莎贝拉补充道：「东西在灯塔的地下室。很危险。」\n她们看着你。\n「你愿意去吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"答应",text:"「我去。」她们都松了一口气。",effects:{npc_trust:{"玛莎·格雷":1,"伊莎贝拉·韦伯":1},add_clue:"clue_npc_cross_lighthouse_quest",add_run_memory:{text:"答应帮玛莎和伊莎贝拉去灯塔取东西。"}}},{label:"拒绝",text:"「我不能去。太危险了。」她们看起来很失望。",effects:{add_run_memory:{text:"拒绝了玛莎和伊莎贝拉的请求。"}}}]},{id:"npc_cross_duo_007",name:"汤米与希尔达的相遇",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","tommy","hilda"],trigger:{areas:["town_center"],npc_trust_gte:{"汤米·陈":2,"希尔达·莫里斯":2},probability:0.1,once_per_run:true,npc_alive:["汤米·陈","希尔达·莫里斯"]},description:"你在镇中心看到汤米和希尔达在交谈。这很不寻常——希尔达很少来镇中心。\n你走近时，希尔达说：\n「汤米给我看了一些照片。是庄园的。」\n汤米补充道：「我拍的时候没有看到任何人。但照片里有人影。」\n希尔达看着你。「你觉得庄园里还有什么？」",effects:{add_clue:"clue_npc_cross_manor_photo"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"告诉他们你的发现",text:"你告诉了他们在庄园里的发现。希尔达的脸色变了。",effects:{npc_trust:{"汤米·陈":1,"希尔达·莫里斯":1},add_run_memory:{text:"和汤米、希尔达分享了庄园的发现。"}}},{label:"隐瞒",text:"「我不确定。」他们看起来不太相信你。",effects:{add_run_memory:{text:"对汤米和希尔达隐瞒了信息。"}}}]},{id:"npc_cross_duo_008",name:"老费舍与伊莱亚斯的交流",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","fisher","elias"],trigger:{areas:["harbor_district"],npc_trust_gte:{"老费舍":2,"伊莱亚斯·沃德":2},probability:0.1,once_per_run:true,npc_alive:["老费舍","伊莱亚斯·沃德"]},description:"你在码头看到伊莱亚斯和老费舍在交谈。这很不寻常——他们平时不怎么来往。\n你走近时，伊莱亚斯说：\n「老费舍告诉我一些关于海里的事。很有趣。」\n老费舍补充道：「教授想知道为什么海水有时候是黑色的。」\n伊莱亚斯看着你。「你知道吗？」",effects:{add_clue:"clue_npc_cross_black_sea"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"告诉他们你知道的",text:"你告诉了他们你关于海水变黑的观察。伊莱亚斯记了下来。",effects:{npc_trust:{"老费舍":1,"伊莱亚斯·沃德":1},add_run_memory:{text:"和伊莱亚斯、老费舍讨论了黑色海水。"}}},{label:"说不知道",text:"你摇了摇头。伊莱亚斯有些失望。",effects:{add_run_memory:{text:"对伊莱亚斯和老费舍隐瞒了信息。"}}}]},{id:"npc_cross_duo_009",name:"约书亚与玛莎的争执",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","joshua","martha"],trigger:{areas:["harbor_district"],npc_trust_gte:{"约书亚·布莱克":2,"玛莎·格雷":2},probability:0.12,once_per_run:true,npc_alive:["约书亚·布莱克","玛莎·格雷"]},description:"你走进酒吧。约书亚和玛莎在争吵。\n「你不能告诉他！」玛莎说。\n「他需要知道！」约书亚反驳。\n他们看到你，都停了下来。\n约书亚看着你。「你想知道灯塔下面有什么吗？」\n玛莎摇了摇头。「别告诉他。那太危险了。」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"想知道",text:"「告诉我。」约书亚开始说。玛莎转身走了。",effects:{npc_trust:{"约书亚·布莱克":1,"玛莎·格雷":-1},add_clue:"clue_npc_cross_lighthouse_below",add_run_memory:{text:"从约书亚那里知道了灯塔下面的秘密。"}}},{label:"听玛莎的",text:"「也许我不该知道。」约书亚叹了口气。",effects:{npc_trust:{"约书亚·布莱克":-1,"玛莎·格雷":1},add_run_memory:{text:"听从了玛莎的建议，没有追问灯塔的秘密。"}}}]},{id:"npc_cross_duo_010",name:"伊莎贝拉与埃德加的合作",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","isabella","edgar"],trigger:{areas:["town_center"],npc_trust_gte:{"伊莎贝拉·韦伯":2,"埃德加·洛夫克拉夫特":2},probability:0.1,once_per_run:true,npc_alive:["伊莎贝拉·韦伯","埃德加·洛夫克拉夫特"]},description:"你在教堂看到伊莎贝拉和埃德加在合作。他们在整理一些古老的文献。\n「我们在找关于封印的记录，」伊莎贝拉解释，「埃德加的写作技巧很有用。」\n埃德加补充道：「这些文献记载了封印的历史。如果我们能理解——」\n他停住了。看着你。\n「你能帮我们翻译一些段落吗？」",effects:{add_clue:"clue_npc_cross_seal_records"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"帮忙翻译",text:"你花了一些时间帮他们翻译了几个段落。内容很惊人。",effects:{npc_trust:{"伊莎贝拉·韦伯":1,"埃德加·洛夫克拉夫特":1},add_clue:"clue_npc_cross_seal_translation",add_run_memory:{text:"帮伊莎贝拉和埃德加翻译了封印文献。"}}},{label:"拒绝",text:"「我现在太忙了。」他们看起来很失望。",effects:{add_run_memory:{text:"拒绝了伊莎贝拉和埃德加的翻译请求。"}}}]},{id:"npc_cross_duo_011",name:"希尔达与老费舍的秘密",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","hilda","fisher"],trigger:{areas:["harbor_district"],npc_trust_gte:{"希尔达·莫里斯":3,"老费舍":3},probability:0.08,once_per_run:true,npc_alive:["希尔达·莫里斯","老费舍"]},description:"你在码头看到希尔达和老费舍坐在一起。他们看到你，停下了交谈。\n希尔达犹豫了一下，然后说：\n「我们在讨论家族的事。老费舍知道一些关于莫里斯家族的秘密。」\n老费舍补充道：「我知道的不多。但我知道——你的血脉和海有关系。」\n希尔达看着你。「你想听吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"听",text:"他们告诉你了莫里斯家族和海的关系。内容很惊人。",effects:{npc_trust:{"希尔达·莫里斯":1,"老费舍":1},add_clue:"clue_npc_cross_morris_sea",add_run_memory:{text:"知道了莫里斯家族和海的秘密关系。"}}},{label:"不听",text:"「也许我不该知道。」他们看起来松了一口气。",effects:{add_run_memory:{text:"拒绝了希尔达和老费舍的秘密。"}}}]},{id:"npc_cross_duo_012",name:"汤米与约书亚的交换",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","tommy","joshua"],trigger:{areas:["harbor_district"],npc_trust_gte:{"汤米·陈":2,"约书亚·布莱克":2},probability:0.1,once_per_run:true,npc_alive:["汤米·陈","约书亚·布莱克"]},description:"你在码头看到汤米和约书亚在交换东西。汤米给了约书亚一些照片，约书亚给了汤米一些……\n你看不清是什么。\n他们看到你，立刻停止了交换。\n汤米说：「只是朋友之间的小交易。」\n约书亚补充道：「没什么特别的。」\n你注意到约书亚的手在发抖。",effects:{add_clue:"clue_npc_cross_tommy_joshua_trade"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"追问",text:"「你们在交换什么？」他们交换了一个眼神。然后汤米说：\n「照片。约书亚有灯塔的照片。我有庄园的照片。",effects:{npc_trust:{"汤米·陈":-1,"约书亚·布莱克":-1},add_clue:"clue_npc_cross_photo_trade",add_run_memory:{text:"追问了汤米和约书亚的交换内容。"}}},{label:"不追问",text:"你点了点头。没有追问。",effects:{add_run_memory:{text:"没有追问汤米和约书亚的交换。"}}}]},{id:"npc_cross_duo_013",name:"伊莱亚斯与玛莎的密谈",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","elias","martha"],trigger:{areas:["harbor_district"],npc_trust_gte:{"伊莱亚斯·沃德":2,"玛莎·格雷":2},probability:0.1,once_per_run:true,npc_alive:["伊莱亚斯·沃德","玛莎·格雷"]},description:"你走进酒吧。伊莱亚斯和玛莎在角落里低声交谈。\n你走近时，他们停了下来。\n伊莱亚斯说：「我们正在讨论一些……学术问题。」\n玛莎补充道：「关于酒吧的历史。」\n你注意到玛莎的手在吧台上敲着一种有节奏的敲击。伊莱亚斯也在敲——同样的节奏。",effects:{add_clue:"clue_npc_cross_elias_martha_rhythm"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"问他们在讨论什么",text:"「你们在讨论什么？」他们交换了一个眼神。然后伊莱亚斯说：\n「关于封印。玛莎知道一些我不知道的事。",effects:{npc_trust:{"伊莱亚斯·沃德":1,"玛莎·格雷":1},add_clue:"clue_npc_cross_seal_martha",add_run_memory:{text:"知道了伊莱亚斯和玛莎在讨论封印。"}}},{label:"不追问",text:"你点了点头。没有追问。",effects:{add_run_memory:{text:"没有追问伊莱亚斯和玛莎的密谈。"}}}]},{id:"npc_cross_duo_014",name:"希尔达与伊莱亚斯的联盟",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","hilda","elias"],trigger:{areas:["town_center"],npc_trust_gte:{"希尔达·莫里斯":3,"伊莱亚斯·沃德":3},probability:0.08,once_per_run:true,npc_alive:["希尔达·莫里斯","伊莱亚斯·沃德"]},description:"你在伊莱亚斯的书房里看到希尔达。他们正在研究一些古老的文献。\n「我们找到了一些东西，」伊莱亚斯说，「关于封印的运作方式。」\n希尔达补充道：「封印需要维护。维护的方式是——」\n她停住了。看着你。\n「你愿意加入我们吗？我们需要一个能去危险地方的人。」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"加入",text:"「我加入。」他们看起来很高兴。",effects:{npc_trust:{"希尔达·莫里斯":1,"伊莱亚斯·沃德":1},add_clue:"clue_npc_cross_alliance",add_run_memory:{text:"加入了希尔达和伊莱亚斯的联盟。"}}},{label:"拒绝",text:"「我需要更多时间考虑。」他们点了点头。",effects:{add_run_memory:{text:"拒绝了希尔达和伊莱亚斯的联盟邀请。"}}}]},{id:"npc_cross_duo_015",name:"玛莎与汤米的友谊",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","martha","tommy"],trigger:{areas:["town_center"],npc_trust_gte:{"玛莎·格雷":2,"汤米·陈":2},probability:0.12,once_per_run:true,npc_alive:["玛莎·格雷","汤米·陈"]},description:"你在镇中心看到玛莎和汤米在交谈。玛莎手里拿着一张照片。\n「汤米帮我拍了一些照片，」玛莎解释，「是酒吧的。」\n汤米补充道：「酒吧有些角落很有趣。光线很特别。」\n玛莎看着你。「你想看看吗？」\n她递给你一张照片。照片上是酒吧的吧台。你注意到——吧台的木纹里有字。",effects:{add_clue:"clue_npc_cross_bar_text"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"仔细看照片",text:"你仔细看了照片。吧台的木纹里确实有字。你认出了几个词。",effects:{npc_trust:{"玛莎·格雷":1,"汤米·陈":1},add_clue:"clue_npc_cross_bar_message",add_run_memory:{text:"在玛莎和汤米的照片里发现了隐藏的文字。"}}},{label:"还给玛莎",text:"你把照片还给了玛莎。没有仔细看。",effects:{add_run_memory:{text:"没有仔细看玛莎和汤米的照片。"}}}]},{id:"npc_cross_duo_016",name:"老费舍与伊莎贝拉的相遇",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","fisher","isabella"],trigger:{areas:["harbor_district"],npc_trust_gte:{"老费舍":2,"伊莎贝拉·韦伯":2},probability:0.08,once_per_run:true,npc_alive:["老费舍","伊莎贝拉·韦伯"]},description:"你在码头看到伊莎贝拉和老费舍在交谈。这很不寻常——伊莎贝拉很少来码头。\n你走近时，伊莎贝拉说：\n「老费舍告诉我一些关于海里的事。关于……那些东西。」\n老费舍补充道：「她想知道为什么海水有时候是黑色的。」\n伊莎贝拉看着你。「你知道吗？黑色的海水意味着什么？」",effects:{add_clue:"clue_npc_cross_black_sea_meaning"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"告诉他们你知道的",text:"你告诉了他们你的观察。伊莎贝拉的表情变得严肃。",effects:{npc_trust:{"老费舍":1,"伊莎贝拉·韦伯":1},add_clue:"clue_npc_cross_sea_knowledge",add_run_memory:{text:"和伊莎贝拉、老费舍讨论了黑色海水的含义。"}}},{label:"说不知道",text:"你摇了摇头。伊莎贝拉看起来有些失望。",effects:{add_run_memory:{text:"对伊莎贝拉和老费舍隐瞒了信息。"}}}]},{id:"npc_cross_duo_017",name:"约书亚与伊莱亚斯的交流",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","joshua","elias"],trigger:{areas:["town_center"],npc_trust_gte:{"约书亚·布莱克":2,"伊莱亚斯·沃德":2},probability:0.1,once_per_run:true,npc_alive:["约书亚·布莱克","伊莱亚斯·沃德"]},description:"你在伊莱亚斯的书房里看到约书亚。他们在看一张地图。\n「约书亚在海军的时候见过一些东西，」伊莱亚斯解释，「关于海里的。」\n约书亚补充道：「我在太平洋服役的时候，看到过一些……不应该存在的东西。」\n他指着地图上的一个位置。「在这里。深海里。」\n伊莱亚斯看着你。「你想听吗？」",effects:{add_clue:"clue_npc_cross_pacific_deep"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"听",text:"约书亚告诉你了他在太平洋的见闻。内容很惊人。",effects:{npc_trust:{"约书亚·布莱克":1,"伊莱亚斯·沃德":1},add_clue:"clue_npc_cross_pacific_truth",add_run_memory:{text:"知道了约书亚在太平洋的见闻。"}}},{label:"不听",text:"「也许我不该知道。」他们看起来很失望。",effects:{add_run_memory:{text:"拒绝了约书亚和伊莱亚斯的分享。"}}}]},{id:"npc_cross_duo_018",name:"希尔达与玛莎的对话",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","hilda","martha"],trigger:{areas:["harbor_district"],npc_trust_gte:{"希尔达·莫里斯":2,"玛莎·格雷":2},probability:0.08,once_per_run:true,npc_alive:["希尔达·莫里斯","玛莎·格雷"]},description:"你在酒吧看到希尔达和玛莎在交谈。希尔达很少来酒吧。\n你走近时，希尔达说：\n「玛莎在告诉我关于码头的事。关于那些失踪的人。」\n玛莎补充道：「有些人失踪了。但他们的船还在。」\n希尔达看着你。「你觉得他们去了哪里？」",effects:{add_clue:"clue_npc_cross_missing_sailors"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"告诉他们你的猜测",text:"你告诉了他们你的猜测。希尔达的脸色变了。",effects:{npc_trust:{"希尔达·莫里斯":1,"玛莎·格雷":1},add_run_memory:{text:"和希尔达、玛莎讨论了失踪水手的事。"}}},{label:"说不知道",text:"你摇了摇头。她们看起来很失望。",effects:{add_run_memory:{text:"对希尔达和玛莎隐瞒了信息。"}}}]},{id:"npc_cross_duo_019",name:"汤米与埃德加的合作",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","tommy","edgar"],trigger:{areas:["town_center"],npc_trust_gte:{"汤米·陈":2,"埃德加·洛夫克拉夫特":2},probability:0.1,once_per_run:true,npc_alive:["汤米·陈","埃德加·洛夫克拉夫特"]},description:"你在汤米的店铺里看到埃德加。他们正在看一些照片。\n「埃德加在帮我整理照片，」汤米解释，「他在写一篇关于沃切斯特的文章。」\n埃德加补充道：「这些照片很有价值。它们记录了沃切斯特的变化。」\n他指着一张照片。「你看这个——这是灯塔。但灯塔的光不对。」\n你仔细看。灯塔的光确实是绿色的。",effects:{add_clue:"clue_npc_cross_green_light"},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"问他们灯塔的光",text:"「灯塔的光为什么是绿色的？」他们交换了一个眼神。",effects:{npc_trust:{"汤米·陈":1,"埃德加·洛夫克拉夫特":1},add_clue:"clue_npc_cross_green_light_truth",add_run_memory:{text:"知道了灯塔的绿光之谜。"}}},{label:"不追问",text:"你点了点头。没有追问。",effects:{add_run_memory:{text:"没有追问灯塔的绿光。"}}}]},{id:"npc_cross_duo_020",name:"老费舍与伊莱亚斯的联盟",type:"npc_cross",subtype:"duo_dialogue",weight:1,tier:"normal",tags:["npc","cross","fisher","elias"],trigger:{areas:["harbor_district"],npc_trust_gte:{"老费舍":3,"伊莱亚斯·沃德":3},probability:0.08,once_per_run:true,npc_alive:["老费舍","伊莱亚斯·沃德"]},description:"你在码头看到伊莱亚斯和老费舍坐在一起。他们的表情都很严肃。\n伊莱亚斯说：「我们决定合作。老费舍知道海里的事，我知道文献里的事。」\n老费舍补充道：「我们需要一个人去灯塔下面。」\n他们看着你。\n「你愿意去吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"答应",text:"「我去。」他们看起来松了一口气。",effects:{npc_trust:{"老费舍":1,"伊莱亚斯·沃德":1},add_clue:"clue_npc_cross_lighthouse_mission",add_run_memory:{text:"答应帮伊莱亚斯和老费舍去灯塔下面。"}}},{label:"拒绝",text:"「我现在不能去。」他们看起来很失望。",effects:{add_run_memory:{text:"拒绝了伊莱亚斯和老费舍的请求。"}}}]},
{id:"npc_cross_secret_001",name:"送信",type:"npc_cross",subtype:"secret_exchange",weight:1,tier:"normal",tags:["npc","cross","secret","letter"],trigger:{areas:["town_center"],npc_trust_gte:{"伊莱亚斯·沃德":3,"希尔达·莫里斯":3},probability:0.12,once_per_run:true,npc_alive:["伊莱亚斯·沃德","希尔达·莫里斯"]},description:"伊莱亚斯递给你一封信。「帮我把这封信交给希尔达，」他说，「不要打开。」\n你接过信。信封是用蜡封住的。蜡的颜色是深红色。\n你把信送到了希尔达手里。希尔达看到信封，脸色变了。\n「他终于……」她低声说。然后她看着你。\n「你想知道信里写了什么吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"想知道",text:"希尔达犹豫了一下，然后打开了信。她读了信，脸色变得苍白。\n「封印的钥匙……在莫里斯家族的血脉里。」\n她看着你。\n「伊莱亚斯说——如果封印破碎，我必须——」\n她没有说完。",effects:{npc_trust:{"希尔达·莫里斯":1},add_clue:"clue_npc_cross_seal_key_blood",add_run_memory:{text:"知道了封印的钥匙在莫里斯家族的血脉里。"}}},{label:"不想知道",text:"「那是你们的事。」希尔达点了点头。",effects:{add_run_memory:{text:"没有追问伊莱亚斯给希尔达的信。"}}}]},{id:"npc_cross_secret_002",name:"转交物品",type:"npc_cross",subtype:"secret_exchange",weight:1,tier:"normal",tags:["npc","cross","secret","item"],trigger:{areas:["harbor_district"],npc_trust_gte:{"玛莎·格雷":3,"老费舍":3},probability:0.1,once_per_run:true,npc_alive:["玛莎·格雷","老费舍"]},description:"玛莎递给你一个小包裹。「帮我把这个给老费舍，」她说，「不要打开。」\n你把包裹送到了老费舍手里。老费舍打开包裹，里面是一瓶酒和一张纸条。\n他读了纸条，沉默了很久。\n「她还是知道了，」他低声说。\n他看着你。「你知道玛莎是谁吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"问他是谁",text:"「她是……」老费舍停住了。「她是我女儿。」\n他看着海面。\n「她不知道。我不能告诉她。",effects:{npc_trust:{"老费舍":1},add_clue:"clue_npc_cross_martha_fisher",add_run_memory:{text:"知道了玛莎是老费舍的女儿。"}}},{label:"不追问",text:"「那是你们的事。」老费舍点了点头。",effects:{add_run_memory:{text:"没有追问玛莎和老费舍的关系。"}}}]},{id:"npc_cross_secret_003",name:"偷看内容",type:"npc_cross",subtype:"secret_exchange",weight:1,tier:"normal",tags:["npc","cross","secret","peek"],trigger:{areas:["town_center"],npc_trust_gte:{"汤米·陈":3,"埃德加·洛夫克拉夫特":3},probability:0.1,once_per_run:true,npc_alive:["汤米·陈","埃德加·洛夫克拉夫特"]},description:"汤米递给你一叠照片。「帮我把这些给埃德加，」他说，「他需要这些。」\n你看着照片。照片上是沃切斯特的各种场景。但你注意到——有些照片里有一些不应该存在的东西。\n你想偷看更多。但你答应了汤米不打开。",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"偷看",text:"你快速翻看了所有照片。你看到了——在某张照片的角落里，有一个不属于人类的轮廓。\n你把照片送到了埃德加手里。埃德加看到照片，脸色变了。\n「你看了？」他问。\n你点了点头。\n「那你现在知道了——沃切斯特不是你看到的那样。",effects:{npc_trust:{"汤米·陈":-1,"埃德加·洛夫克拉夫特":1},add_clue:"clue_npc_cross_photo_secret",add_run_memory:{text:"偷看了汤米给埃德加的照片。"}}},{label:"不偷看",text:"你把照片原封不动地送到了埃德加手里。",effects:{npc_trust:{"汤米·陈":1,"埃德加·洛夫克拉夫特":1},add_run_memory:{text:"没有偷看汤米给埃德加的照片。"}}}]},{id:"npc_cross_secret_004",name:"改变关系",type:"npc_cross",subtype:"secret_exchange",weight:1,tier:"normal",tags:["npc","cross","secret","relationship"],trigger:{areas:["town_center"],npc_trust_gte:{"伊莎贝拉·韦伯":3,"伊莱亚斯·沃德":3},probability:0.08,once_per_run:true,npc_alive:["伊莎贝拉·韦伯","伊莱亚斯·沃德"]},description:"伊莎贝拉递给你一本旧书。「帮我把这个给伊莱亚斯，」她说，「这是他一直在找的。」\n你把书送到了伊莱亚斯手里。伊莱亚斯看到书，眼睛亮了。\n「这是——」他翻开书，「《封印之书》。我找了二十年。」\n他看着你。「伊莎贝拉怎么会有这个？」\n你想起了伊莎贝拉的话——「不要告诉他这是从教堂的密室里找到的。」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"告诉他真相",text:"「这是从教堂的密室里找到的。」伊莱亚斯的表情变得复杂。\n「她一直在隐瞒这个……",effects:{npc_trust:{"伊莱亚斯·沃德":1,"伊莎贝拉·韦伯":-1},add_run_memory:{text:"告诉了伊莱亚斯书的来源，导致伊莎贝拉不满。"}}},{label:"隐瞒",text:"「她没有说。」伊莱亚斯点了点头。",effects:{npc_trust:{"伊莱亚斯·沃德":1,"伊莎贝拉·韦伯":1},add_run_memory:{text:"隐瞒了书的来源，维护了伊莎贝拉和伊莱亚斯的关系。"}}}]},{id:"npc_cross_secret_005",name:"秘密的传递",type:"npc_cross",subtype:"secret_exchange",weight:1,tier:"normal",tags:["npc","cross","secret","pass"],trigger:{areas:["harbor_district"],npc_trust_gte:{"约书亚·布莱克":3,"玛莎·格雷":3},probability:0.08,once_per_run:true,npc_alive:["约书亚·布莱克","玛莎·格雷"]},description:"约书亚递给你一个密封的信封。「帮我把这个给玛莎，」他说，「不要打开。」\n你把信封送到了玛莎手里。玛莎看到信封，脸色变了。\n「他终于说了……」她低声说。\n她看着你。「你知道约书亚是谁吗？」\n你摇了摇头。\n「他是——」她停住了。「他是我哥哥。",effects:{npc_trust:{"玛莎·格雷":1},add_clue:"clue_npc_cross_joshua_martha"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_secret_006",name:"希尔达的委托",type:"npc_cross",subtype:"secret_exchange",weight:1,tier:"normal",tags:["npc","cross","secret","commission"],trigger:{areas:["voxchester_manor"],npc_trust_gte:{"希尔达·莫里斯":3,"汤米·陈":3},probability:0.08,once_per_run:true,npc_alive:["希尔达·莫里斯","汤米·陈"]},description:"希尔达递给你一把钥匙。「帮我把这个给汤米，」她说，「他会知道怎么用。」\n你把钥匙送到了汤米手里。汤米看到钥匙，眼睛亮了。\n「这是庄园地下室的钥匙。」\n他看着你。「希尔达终于信任我了。」\n他从柜台下面拿出一个包裹。「帮我把这个给她。」\n包裹里是一些照片——庄园的照片。你注意到——照片里有一些不应该存在的东西。",effects:{add_clue:"clue_npc_cross_manor_photos_secret"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_secret_007",name:"伊莱亚斯的托付",type:"npc_cross",subtype:"secret_exchange",weight:1,tier:"normal",tags:["npc","cross","secret","trust"],trigger:{areas:["town_center"],npc_trust_gte:{"伊莱亚斯·沃德":4,"约书亚·布莱克":3},probability:0.06,once_per_run:true,npc_alive:["伊莱亚斯·沃德","约书亚·布莱克"]},description:"伊莱亚斯递给你一个密封的包裹。「帮我把这个给约书亚，」他说，「这是他一直在找的东西。」\n他看着你。\n「我信任你。不要让我失望。」\n你把包裹送到了约书亚手里。约书亚打开包裹，里面是一本旧日记。\n「这是我父亲的日记，」约书亚的声音在发抖。\n「他……他在灯塔下面。」\n他看着你。「你想知道灯塔下面有什么吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"想知道",text:"约书亚告诉你了灯塔下面的秘密。内容很惊人。",effects:{npc_trust:{"约书亚·布莱克":1,"伊莱亚斯·沃德":1},add_clue:"clue_npc_cross_lighthouse_father",add_run_memory:{text:"知道了灯塔下面的秘密。"}}},{label:"不想知道",text:"「那是你们的事。」约书亚点了点头。",effects:{add_run_memory:{text:"没有追问灯塔下面的秘密。"}}}]},{id:"npc_cross_secret_008",name:"老费舍的信物",type:"npc_cross",subtype:"secret_exchange",weight:1,tier:"normal",tags:["npc","cross","secret","token"],trigger:{areas:["harbor_district"],npc_trust_gte:{"老费舍":4,"伊莎贝拉·韦伯":3},probability:0.06,once_per_run:true,npc_alive:["老费舍","伊莎贝拉·韦伯"]},description:"老费舍递给你一个贝壳。「帮我把这个给伊莎贝拉，」他说，「她会知道这是什么。」\n你把贝壳送到了伊莎贝拉手里。伊莎贝拉看到贝壳，脸色变了。\n「这是——」她把贝壳翻过来。背面刻着一个符号。\n「这是封印的符号。」\n她看着你。「老费舍怎么会有这个？」\n你想起了老费舍的话——「不要告诉她这是从海里找到的。」",effects:{add_clue:"clue_npc_cross_shell_symbol"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_secret_009",name:"汤米的发现",type:"npc_cross",subtype:"secret_exchange",weight:1,tier:"normal",tags:["npc","cross","secret","discovery"],trigger:{areas:["town_center"],npc_trust_gte:{"汤米·陈":3,"伊莱亚斯·沃德":3},probability:0.08,once_per_run:true,npc_alive:["汤米·陈","伊莱亚斯·沃德"]},description:"汤米递给你一张照
