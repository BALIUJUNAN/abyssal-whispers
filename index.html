择了黑暗。黑暗也选择了你。"]},"resource_as_moral_pressure":{"description":"最后一份食物、最后一盏灯、最后一支镇静剂、最后一根绳索，都不应只是资源，而应成为人性审判","last_food_choices":[{"target":"self","effect":"降低明日疲劳","moral_weight":"neutral"},{"target":"joshua","effect":"降低癫狂概率","moral_weight":"compassion","description":"你把食物给了一个疯子。但他是人。"},{"target":"tommy","effect":"他愿意冲洗危险照片","moral_weight":"pragmatic_compassion","description":"他接过食物时手在发抖。不是因为害怕——是因为很久没人把他当人了。"},{"target":"hilda","effect":"帮她熬过血脉低语之夜","moral_weight":"deep_compassion","description":"她看着你递过来的食物，眼眶红了。三百年了，第一次有人记得她也会饿。"},{"target":"safehouse","effect":"提高幸存者士气","moral_weight":"collective"},{"target":"old_fisher","effect":"他愿意多说一些关于海的事","moral_weight":"understanding"}],"last_light_choices":[{"target":"bring_to_catacombs","effect":"墓穴探索安全","moral_weight":"self_preservation"},{"target":"leave_at_safehouse","effect":"安全屋当晚安全","moral_weight":"collective"},{"target":"give_to_isabella","effect":"让她完成第十二声后的选择","moral_weight":"faith_in_other"},{"target":"give_to_joshua","effect":"他守住灯塔入口","moral_weight":"trust"}]}},"ending_text_rewrite":{"description":"十个主结局的艺术化文本方向——结局不能只说明结果，要留下余味","principles":["每个结局根据humanity_evaluation分为三种文本温度","结局最后一句话应留有余味，不要总结性收尾","使用雾、钟声、水三个母题","允许玩家通关后仍无法确认真相是否唯一"],"endings":{"ending_seal_player_keeper":{"core_emotion":"沉重的平静","final_image":"多年后外乡人来到沃切斯特，听见十二声钟","motif_usage":["钟声","雾"],"high_humanity_text":"多年后，外乡人来到沃切斯特。他在镇中心听见钟声响了十二下。他松了一口气。只有你知道，第十三声被谁咽了回去。你站在深渊之眼前方。封印的光芒包裹着你。你闭上眼。你听到了远处的潮声。它很平静。像一首摇篮曲。","fragile_humanity_text":"封印重铸了。代价是你。你不是第一个，也许不是最后一个。你站在深渊之眼前方，听着自己的心跳。它和封印的脉动同步了。你不确定自己是在守护还是在被囚禁。但至少——今晚的钟声只有十二下。","lost_humanity_text":"封印重铸了。你成为了新的守门人。你已经不记得自己的名字了。但你记得钟声。十三声。你每天都在数。你不确定是在数钟声，还是在数自己还剩多少次。","last_line":"钟声响了十二下。第十三声没有来。你知道它在哪里。"},"ending_seal_hilda_choice":{"core_emotion":"被允许的告别","final_image":"庄园安静得像一口合上的棺","motif_usage":["雾","肖像画"],"high_humanity_text":"希尔达走进了封印核心。她转身看了你最后一眼。三百年了，她说，终于有人让我自己选。你没有阻止她。因为你知道——这是她的选择，不是你的。她把庄园祖先肖像一幅幅翻向墙面。最后一幅画翻过去时，庄园安静得像一口合上的棺。","fragile_humanity_text":"希尔达走进了封印核心。你不知道她是真的想这么做，还是因为你给了她太多信息让她觉得这是唯一选择。你永远不会知道。庄园的肖像画全都面向墙壁。你走过大厅时，有一幅画的眼睛还在看你。","lost_humanity_text":"希尔达走进了封印核心。你精心安排了一切——告诉她真相，给她选择的假象，让她以为这是自主决定。但你知道，你从一开始就在引导她走向这里。庄园的肖像画全都面向你。它们在微笑。","last_line":"庄园安静了。没有钟声。没有潮声。只有风穿过空走廊的声音。"},"ending_seal_old_fisher_blood":{"core_emotion":"最后的温度","final_image":"码头边只剩一双鞋","motif_usage":["水","月光"],"high_humanity_text":"老费舍坐在码头边，第一次在人前脱下鞋。脚趾之间的薄膜在月光下轻轻张开。他没有解释，只把刀递给你：趁我还知道疼。血流入封印核心。光芒爆发。老费舍倒下了。但他没有死。他还是人。勉强是。你扶他坐起来。他看着海面，很久没有说话。最后他说：谢谢你让我自己选。","fragile_humanity_text":"老费舍交出了钥匙之血。你不确定他是自愿的还是被你的期望所迫。他的眼睛里有释然，也有疲惫。封印重铸了。你扶他坐起来。他看着海面。你不知道他在想什么。也许他在想，如果他没有脱下那双鞋，结局会不会不一样。","lost_humanity_text":"老费舍的血流入了封印核心。你把他带到这里，他知道会发生什么。但你没有给他选择。你只是需要他的血。封印重铸了。你站起来时，码头边只剩一双鞋。鞋里是空的。海面很平静。","last_line":"码头边的鞋还在。海水没有碰它们。也许是出于尊重。"},"ending_isabella_twelfth_bell":{"core_emotion":"被拒绝的神谕","final_image":"第十二声之后的沉默","motif_usage":["钟声","蜡烛"],"high_humanity_text":"伊莎贝拉站在钟楼上。她敲了十二下。第十三下，她松开了手。钟绳在空中轻轻摆动。整座教堂都在等待。但第十三声没有来。伊莎贝拉走下钟楼。她的脸上没有泪水。只有疲惫。她经过你身边时轻声说：谢谢你让我看清了。","fragile_humanity_text":"伊莎贝拉敲了十二下钟。然后她松开了手。你不知道她是因为真相而悔悟，还是因为你给了她太多证据让她无法自欺。但结果是一样的——第十三声没有来。教堂的蜡烛同时熄灭了。不是风吹的。","lost_humanity_text":"伊莎贝拉敲了十二下钟。你用真相击溃了她的信仰。她不再相信任何东西了。第十三声没有来。但你知道——你不只是为了阻止仪式。你是为了证明你比她更正确。蜡烛的火焰朝你倾斜。像是在鞠躬。","last_line":"教堂安静了。钟绳还在轻轻摆动。像是有人刚刚松开手。"},"ending_escape_by_sea":{"core_emotion":"带不走的潮声","final_image":"船离岸后，雾仍然没有散","motif_usage":["雾","水","罐头"],"high_humanity_text":"你在黎明前登上了渔船。海风吹在脸上，那是你很长时间以来第一次感受到真实的风。你自由了。但你知道——沃切斯特还在那里。那些人还在那里。船离岸很远后，雾仍然没有散。玛莎给你的罐头在包里轻轻晃动。你忽然意识到，那不是罐头的声音。是潮水。从里面传来。","fragile_humanity_text":"你逃离了沃切斯特。你活下来了。但你没有带走所有人。有些人留在了雾里。你告诉自己你已经尽力了。也许这是真的。船离岸后，你回头看了一眼。沃切斯特已经消失在雾中。但你仍然能听到钟声。十二声。然后是沉默。","lost_humanity_text":"你逃离了沃切斯特。你带出了证据和情报。你活下来了。那些留在城里的人——你甚至没有回头看一眼。船离岸后，你打开罐头。里面不是食物。是海水。你把罐头扔进了海里。它没有沉。","last_line":"海很平静。但你知道，海的下面不平静。"},"ending_evidence_escape":{"core_emotion":"无人相信的真相","final_image":"多年后另一个港口响起第十三声钟","motif_usage":["钟声","旧照片"],"high_humanity_text":"你带着证据离开了沃切斯特。你把它们交给了需要知道的人。他们不相信你。但证据在那里。多年后，你在另一个港口城市听到了钟声。十三声。你知道——一切还没有结束。但至少，真相在你手中。","fragile_humanity_text":"你带着证据离开了。你把它们交给了需要知道的人。他们不相信你。你开始怀疑自己。也许沃切斯特只是一场梦。但你的口袋里有一张照片。照片上是码头。码头边有一双儿童鞋。鞋里是空的。","lost_humanity_text":"你带着证据离开了。你把它们卖给了最高出价者。钱到手了。真相？真相只是商品。多年后，你在报纸上看到沃切斯特的旅游业正在蓬勃发展。游客们称赞那里的神秘氛围。你笑了。","last_line":"报纸上说沃切斯特的钟声很好听。每天十二下。你数了三遍。是十二下。"},"ending_heretical_dawn":{"core_emotion":"被接受的启示","final_image":"天空裂开，玩家跪下","motif_usage":["钟声","光"],"high_humanity_text":"你不知道自己是怎么走到这一步的。你本想阻止仪式。但你看到了真相——或者说，你看到了它想让你看到的真相。天空裂开了。你跪下了。不是出于恐惧——是出于敬畏。也许这就是疯狂。也许这就是真相。你永远不会知道了。","fragile_humanity_text":"仪式完成了。你不确定自己是被欺骗了还是主动选择了。也许两者没有区别。新的时代开始了。你站在教堂门口，看着天空裂开。光从裂缝中涌出。你闭上了眼。你听到了钟声。很多声。你数不清了。","lost_humanity_text":"你完成了仪式。你从一开始就知道会发生什么。你想要这个结果。你欢迎它们。你张开了双臂。天空裂开了。光涌入了沃切斯特。你微笑了。这是你作为人类的最后一个表情。","last_line":"钟声响了。不是十三声。是很多声。你已经数不清了。"},"ending_abyss_consumed":{"core_emotion":"平静的坠落","final_image":"深渊之眼在底部注视","motif_usage":["水","黑暗"],"high_humanity_text":"你走到了竖井边缘。深渊之眼在底部注视着你。你知道了——人类的存在是多么渺小。但你没有跳下去。你只是坐在边缘，看着那无尽的黑暗。你哭了。不是因为恐惧——是因为你终于理解了。你站起来，离开了墓穴。你还有选择。","fragile_humanity_text":"你坠入了深渊。你没有挣扎。也许是因为你太累了。也许是因为你已经不在乎了。坠落的过程中，你看到了一切——从宇宙的诞生到终结。你微笑了。这不是恐惧。这是理解。","lost_humanity_text":"你张开双臂，向竖井迈出了一步。坠落的过程中，你看到了一切。当你落地时，你感到的是平静。永恒的、无尽的平静。然后，你睁开了新的眼睛。不再是人类的眼睛。你开始向上攀爬。","last_line":"你睁开了眼睛。眼睛的颜色不对。但你已经不在乎了。"},"ending_transcendence":{"core_emotion":"不属于任何地方的清醒","final_image":"玩家站在时间之外","motif_usage":["雾","星辰"],"high_humanity_text":"你超越了人类的视角。你看到了时间的全貌。你理解了封印的本质。但你选择了回来——回到人类的视角，用你学到的一切来守护这个世界。你不再是完全的人，但你选择了做人该做的事。你站在沃切斯特的街道上。雾散了。你看到了天空。它和你记忆中的不一样。","fragile_humanity_text":"你超越了。你看到了一切。你理解了。但你不知道自己还是不是你。你的身体在沃切斯特，但你的心在别处。在时间之外。你看着自己的手。它在发光。你把手放进口袋里。光芒透过了布料。","lost_humanity_text":"你超越了人类。你看到了宇宙的全貌。人类的恐惧、希望、爱——在你看来都是化学反应。你不再属于这个世界。你也不再关心它。你站在沃切斯特的街道上。雾在你身边散开了。不是因为风——是因为它怕你。","last_line":"你站在时间之外。你看到了沃切斯特的过去和未来。它们是一样的。"},"ending_loop_truth":{"core_emotion":"清醒的轮回","final_image":"玩家走进深渊之眼，光芒包裹","motif_usage":["钟声","雾","水"],"high_humanity_text":"你终于明白了。轮回本身就是封印。你不是被困在这里——你是封印的一部分。你微笑了。这一次，你选择打破轮回。不是因为你想逃——而是因为你想让沃切斯特的人得到安宁。你走进了深渊之眼。光芒包裹了你。封印重铸了——永恒地。因为你这一次是自愿的。","fragile_humanity_text":"你明白了轮回的真相。你选择打破它。也许是因为你厌倦了。也许是因为你终于理解了。你走进了深渊之眼。光芒包裹了你。你不知道自己是在拯救还是在逃避。但至少——轮回结束了。也许吧。","lost_humanity_text":"你明白了。轮回是封印。你是钥匙。你选择继续轮回——不是因为你想守护，而是因为你已经不知道如何做别的事了。你微笑了。这一次和上一次一样。也许下一次也会一样。你已经不在乎了。","last_line":"钟声响了。十三声。你数了。然后你微笑了。你知道下一次，你还会数的。"}}},"ending_system_v2":{"description":"三层结局判定系统——先判断世界结果，再判断代价承担者，最后判断人性温度","judgement_layers":{"layer_1_world_outcome":{"name":"第一层：沃切斯特发生了什么","possible_outcomes":["seal_restored","escaped_by_sea","evidence_escape","heretical_dawn","abyss_consumed","transcendence","loop_truth"]},"layer_2_cost_bearer":{"name":"第二层：谁承担了代价","possible_bearers":["player","hilda","old_fisher","isabella","shared","no_one","unknown"]},"layer_3_humanity_evaluation":{"name":"第三层：结局文本温度","possible_evaluations":["humanity_high","humanity_fragile","humanity_lost"],"criteria":{"humanity_high":"玩家始终把NPC当人，没有强迫牺牲，没有隐瞒关键真相，没有把人当工具","humanity_fragile":"玩家在压力下做出妥协，但核心人性仍在","humanity_lost":"玩家把NPC当工具，隐瞒真相诱导牺牲，或主动参与非人行为"}}},"humanity_tracking":{"npc_redemption_score":{"description":"记录有多少NPC完成了救赎","calculation":"count of NPCs with redemption_state == redeemed","affects":"ending text warmth, ending availability"},"humanity_retained_score":{"description":"记录玩家是否仍然把别人当人","tracking_events":[{"event":"player_forces_npc_sacrifice","score_change":-10,"description":"诱导NPC牺牲"},{"event":"player_hides_critical_truth","score_change":-8,"description":"隐瞒关键真相"},{"event":"player_uses_npc_as_tool","score_change":-5,"description":"把NPC当工具使用"},{"event":"player_gives_last_food_to_npc","score_change":5,"description":"把最后一份食物给NPC"},{"event":"player_warns_npc_of_danger","score_change":3,"description":"警告NPC危险"},{"event":"player_tells_truth_at_cost","score_change":8,"description":"即使代价高昂也说出真相"},{"event":"player_chooses_self_sacrifice","score_change":15,"description":"选择自己承担代价"},{"event":"player_treats_hybrid_as_human","score_change":5,"description":"把混血者当人对待"},{"event":"player_abandons_npc_in_danger","score_change":-7,"description":"在危险中抛弃NPC"}],"thresholds":{"humanity_high":60,"humanity_fragile":30,"humanity_lost":0}}},"tool_usage_tracking":{"description":"记录玩家是否在NPC高信任但低自主性时诱导其牺牲","tracked_patterns":[{"pattern":"npc_high_trust_low_agency_sacrifice","description":"NPC信任高但自主性低时被引导牺牲","humanity_penalty":-15},{"pattern":"player_withholds_ritual_cost","description":"玩家知道仪式代价但不告诉NPC","humanity_penalty":-12},{"pattern":"player_uses_npc_as_blood_source","description":"把NPC当作血液来源","humanity_penalty":-10},{"pattern":"player_sends_npc_to_die_alone","description":"派NPC独自面对死亡","humanity_penalty":-10}]}},"implementation_examples":{"description":"每个模块的完整JSON对象示例，可直接进入游戏数据","examples":{"silent_event_example":{"id":"silent_harbor_children_shoes","name":"码头儿童鞋","location":"harbor_district","trigger_condition":"always","text":"你在码头边看到一双儿童鞋，整齐地摆在水边。鞋里没有水。你站了一会儿。什么也没有发生。","mechanical_effect":null,"emotional_function":"让玩家感到失踪案不是数字，而是缺席的人","repeat_behavior":"only_once","silent_event":true,"motif":"water","reward_policy":"none","purpose":"atmosphere"},"san_text_variant_example":{"event_id":"evt_strange_clock","normal_text":"教堂钟声响了十三下。你数了三遍。是十三下。","subtle_wrong_text":"教堂钟声响了十三下。你数了三遍。每一遍都是十三下。但你总觉得少数了一声。","san_mid_text":"你数到十二，准备离开。第十三声替你数了下去。你低头看笔记，那里写着十一。","san_low_text":"没有钟声。是你在响。","abyssal_text":"你就是钟声。你一直在响。你只是不知道自己在响。"},"ui_corruption_example":{"layer":2,"name":"重复","trigger":"SAN<55 or loop_count>=3","location_name":"沉锚酒馆二楼 / 沉锚酒馆二楼 / 沉锚酒馆二楼","item_message":"你获得了：潮汐时刻表。你确认自己刚才没有已经拿过它。","system_message":"行动点不足。你上次也这么说。","option_text":"调查钟楼 / 调查钟楼 / 你确定要去吗","save_name":"Day 2 - 你又回来了"},"npc_redemption_beat_example":{"npc":"old_fisher","normal_behavior":"坐在码头边看着海面，偶尔低声说话","corrupted_behavior":"深夜走向大海，皮肤大面积变为灰绿色","redemption_trigger":"在彻底归海前做最后一件属于人的事","redemption_action":"他终于脱下鞋，让玩家看见已经非人的脚，然后平静地交出钥匙之血","redemption_text":"老费舍坐在码头边，第一次在人前脱下鞋。脚趾之间的薄膜在月光下轻轻张开。他没有解释，只把刀递给你：趁我还知道疼。","no_monologue":true,"failure_variant":"你早上醒来时，码头边只有他的鞋。鞋里是空的。海面很平静。"},"loop_text_variant_example":{"npc":"martha_grey","loop_1":"玛莎擦着杯子，抬头看了你一眼：外乡人？这个季节可没人来沃切斯特。","loop_2":"玛莎擦着杯子，抬头看了你一眼：外乡人？不，我是不是说过这句话？","loop_3":"玛莎没有抬头。这个季节可没人来沃切斯特。除了你。","loop_4":"你推门前，已经听见里面有人说：他来了。","loop_5_plus":"玛莎给你倒了一杯酒。你没有点单。她也没有问。"},"death_restart_example":{"death_type":"physical_death","cause":"by_monster","death_text":"你倒在了沃切斯特的某个角落。血从伤口流出，渗入鹅卵石的缝隙。你最后看到的是雾。雾很安静。","restart_text_loop_1":"你醒来时，发现自己在沃切斯特的入口。你的头很疼。你不记得自己是怎么到这里的。你的衣服是干的。伤口不见了。","restart_text_loop_3":"你醒来时，发现自己在沃切斯特的入口。你没有头疼。你记得一切。这比头疼更糟糕。"}}},"accessibility":{"description":"可访问性与安全选项——所有感官污染必须有强度控制或关闭选项","core_rules":["伪报错不得使用真实操作系统弹窗样式","伪报错不得让玩家误以为游戏真实崩溃、设备故障或存档损坏","输入阻尼只允许短时出现在强叙事节点，不得影响基础操作","所有视觉污染必须可关闭或降低强度","所有音频异化必须可关闭或降低强度","闪烁效果必须有频率控制"],"options":{"visual_distortion":{"name":"视觉扰动","settings":{"off":"关闭所有视觉污染效果","low":"降低强度50%，仅保留轻微边缘雾化","medium":"默认强度","high":"完整视觉污染效果"},"default":"medium"},"audio_distortion":{"name":"音频异化","settings":{"off":"关闭所有音频污染，仅保留基础环境音","low":"降低异化音量，移除低频嗡鸣","medium":"默认强度","high":"完整音频污染效果"},"default":"medium"},"input_resistance":{"name":"输入阻尼","settings":{"off":"关闭所有输入阻尼效果","on":"在强叙事节点启用短暂输入阻尼（每次不超过2秒）"},"default":"on"},"flicker_control":{"name":"闪烁控制","settings":{"off":"关闭所有闪烁效果","low":"闪烁频率降低50%","medium":"默认频率","high":"完整闪烁效果"},"default":"medium"},"pseudo_error_style":{"name":"伪系统提示样式","settings":{"safe":"所有伪系统提示使用游戏内对话框样式，明确标注[游戏内文本]","immersive":"伪系统提示使用游戏内样式，但不标注","full":"完整伪系统提示效果"},"default":"immersive","critical_rule":"即使在full模式下，伪报错也绝不能使用操作系统原生弹窗样式、浏览器alert样式、或任何可能被误认为真实系统消息的样式"},"text_speed":{"name":"文本速度","settings":{"instant":"立即显示全部文本","fast":"快速逐字显示","normal":"正常速度","slow":"慢速显示，适合需要仔细阅读的玩家"},"default":"instant"},"content_warnings":{"name":"内容警告","settings":{"on":"在可能引起不适的事件前显示内容警告","off":"不显示内容警告"},"default":"on"}},"pseudo_error_rules":{"allowed_styles":["游戏内对话框","游戏内系统消息栏","游戏内日志文本","游戏内选项文字"],"forbidden_styles":["操作系统原生弹窗（Windows MessageBox、macOS Alert）","浏览器alert/confirm/prompt","蓝屏样式","应用崩溃报告样式","任何可能被误认为真实系统消息的样式"],"safety_disclaimer":"所有伪系统提示必须在游戏重新加载或检查设置时可以被识别为游戏内容"}},"chapter_progression_events":[{"day":3,"id":"evt_day3_fog","name":"异常浓雾","description":"一场史无前例的浓雾笼罩 const{useState,useReducer,useEffect,useRef,useMemo,useCallback,memo}=React;const GD={"version":"1.1.0","game_title":"深渊低语：沃切斯特之影","language":"zh-CN","design_intent":{"core_experience":"玩家在沃切斯特的28天倒计时中，通过探索、对话、调查、失败与轮回积累真相。每次轮回既带来知识，也带来污染。结局不仅判断封印是否成功，还判断玩家是否在恐怖中保住人性。","genre":"克苏鲁文字 Roguelite 调查游戏","key_mechanics":["SAN系统","轮回记忆与污染","NPC信任与背叛","线索链推理","28天倒计时","人性判定"],"art_philosophy":"人在不可掌控、不可理解、不断重组自身的世界里，仍然尝试保留人的选择","text_style":{"principles":["优先使用冷静叙述，不要用感叹号或强调语气描写恐怖","优先写动作和感官细节，少写内心独白和判断","每段最多保留一个强意象，不要堆叠","优先写门把手上有海盐，少写这里充满不可名状的恐怖","少用不可名状、疯狂、恐怖、诡异、扭曲等直接判断词","用具体细节代替抽象判断","关键句尽量短，留余味","沉默和空白也是文本的一部分"],"forbidden_words":["不可名状","疯狂","恐怖","诡异","扭曲","令人毛骨悚然","骇人听闻","极度恐惧"],"imagery_isolation":"每个区域只保留1-2个主意象，禁止堆砌"}},"core_loop":{"description":"每日12 AP，探索区域、对话NPC、调查物品、触发事件。HP=0死亡/SAN=0疯狂，触发轮回。28天倒计时，封印状态逐步恶化。","action_points_per_day":12,"day_length":28,"ap_costs":"每日行动循环：玩家每天有12个行动点（AP），每次行动消耗1-3AP。探索新区域消耗2AP，区域内移动消耗1AP，与NPC对话消耗1AP，调查物品消耗1AP，使用道具消耗1AP，战斗消耗2-3AP。每日结束时未使用的AP会转化为休息恢复（HP恢复1点，SAN恢复1d3-1点，最低0）。当HP≤0时角色死亡，当SAN≤0时角色疯狂，均触发重开流程。","daily_events":"每天午夜自动触发'第十三声钟响'事件，之后随机抽取一个该区域事件池中的事件作为夜间事件。夜间事件的SAN损失加倍。","death_triggers":{"hp_zero":"角色死亡，触发轮回","san_zero":"角色疯狂，触发轮回"},"difficulty_levels":{"normal":{"san_loss_multiplier":1.0,"monster_hp_multiplier":1.0,"skill_check_bonus":0},"hard":{"san_loss_multiplier":1.5,"monster_hp_multiplier":1.3,"skill_check_bonus":-10},"nightmare":{"san_loss_multiplier":2.0,"monster_hp_multiplier":1.5,"skill_check_bonus":-20}},"weather_system":""},"world":{"setting":"公元1926年，美国马萨诸塞州东南海岸，一座名为沃切斯特（Voxchester）的古老港口城市。这座城市曾因繁荣的海运贸易而闻名，但自1923年那场莫名的大雾之后，一切都变了。码头区的工人开始失踪，渔夫们声称在深海中看到了不应存在的东西——巨大的、蠕动的阴影在月光下缓缓移动。城中的学者们夜夜被噩梦折磨，醒来后疯狂地在笔记本上描绘着螺旋状的符号和无数触手纠缠的图案。沃切斯特建城于1692年，由一群自称'晨星会'的清教徒建立。他们带来的不仅仅是信仰，还有一本用非人类语言写成的古书——《扎尔之卷》。三百年来，这本书被秘密保管在城市地下的石室中，据说它的存在维持着某种古老的封印。如今，封印正在松动。深潜者从海岸线的裂隙中爬出，夜魔在森林中低语，而城市地下那无尽的墓穴网络中，传来了沉闷的、有节奏的敲击声——仿佛某个庞然之物正在苏醒。玩家扮演一位因种种原因来到沃切斯特的调查员：也许是受失踪亲友之托，也许是受学术机构之邀，也许只是在错误的时间出现在了错误的地点。无论是哪种原因，一旦踏入这座城市，就再也无法轻易离开。街道会在夜间改变布局，港口的船只莫名搁浅，而城中居民的眼神中隐藏着某种非人的狂热。玩家必须在这座逐渐被疯狂吞噬的城市中寻找真相，收集散落在各处的线索，与尚存理智的NPC合作，在理智崩塌之前揭开古老封印的秘密。然而，真相本身或许就是最大的诅咒——当你凝视深渊时，深渊也在凝视着你。","game_rules":"1. 玩家通过文字指令探索区域、与NPC对话、调查物品、使用道具。2. 每次行动消耗行动点（AP），每日有固定行动点数。3. 遭遇事件时进行技能检定（d100），低于技能值为成功，大失败（96-100）触发严重后果。4. HP归零则角色死亡，SAN归零则角色疯狂，均触发重开流程。5. 每轮死亡后保留：已解锁的知识碎片（永久解锁区域暗道）、已确认的NPC信任（部分NPC记忆保留）、成就标记。6. 地图区域随机排列，事件池每轮洗牌，NPC位置和状态随机化。7. 收集足够线索可解锁结局判定，结局好坏取决于SAN值、线索数量、NPC存活数。","mythos_logic":"克苏鲁神话是本世界的底层真实。古神（Great Old Ones）如克苏鲁、哈斯塔等真实存在，但处于沉睡或封印状态。外神（Outer Gods）如阿撒托斯、尤格-索托斯的影响以梦境、幻觉、知识污染的形式渗透现实。深潜者（Deep Ones）是克苏鲁的仆从种族，与海岸城市的居民有古老的混血契约。夜魔（Night-Gaunts）栖息于森林和山巅，是尤格-索托斯的眷族。接触神话知识会直接侵蚀理智（SAN值），越是深入了解真相，越是难以维持人类的认知框架。某些区域存在'现实薄弱点'，那里的物理法则不再可靠，空间可能折叠，时间可能倒流。古神的梦境会周期性影响城市，触发'疯狂之夜'事件，所有NPC行为模式改变，新怪物出现。","day_phases":[{"id":"morning","name":"清晨","time_range":"06:00-12:00","event_weight_modifier":{"怪物遭遇":0.5,"神秘事件":0.7,"线索":1.5,"NPC互动":1.3,"陷阱":0.8},"description":"阳光尚可穿透薄雾，居民活动频繁，危险相对较低"},{"id":"afternoon","name":"午后","time_range":"12:00-18:00","event_weight_modifier":{"怪物遭遇":0.7,"神秘事件":1.0,"线索":1.2,"NPC互动":1.2,"陷阱":1.0},"description":"日光渐弱，码头的雾气开始加重"},{"id":"evening","name":"傍晚","time_range":"18:00-00:00","event_weight_modifier":{"怪物遭遇":1.3,"神秘事件":1.2,"线索":0.8,"NPC互动":0.7,"陷阱":1.3},"description":"黑暗降临，街道上行人减少，非人之物开始活跃"},{"id":"midnight","name":"深夜","time_range":"00:00-06:00","event_weight_modifier":{"怪物遭遇":2.0,"神秘事件":2.0,"线索":0.5,"NPC互动":0.3,"陷阱":1.5},"description":"万物沉眠，唯有深渊在呼吸，SAN损失加倍"}],"seal_state_machine":[{"id":"intact","name":"封印完整","trigger_day":1,"description":"封印仍在运作，城市的异常尚可解释为巧合","global_modifier":{"san_loss_multiplier":0.8,"monster_event_chance":0.5,"npc_corruption_rate":0.02},"npc_behavior_change":"NPC大多保持正常，只有少数感知敏锐者察觉异常"},{"id":"weakening","name":"封印松动","trigger_day":7,"description":"第七天，封印出现第一道裂隙。夜间事件频率增加，深潜者开始在浅水区出没","global_modifier":{"san_loss_multiplier":1.0,"monster_event_chance":1.0,"npc_corruption_rate":0.05},"npc_behavior_change":"部分NPC开始出现异常行为，约书亚进入更频繁的癫狂周期"},{"id":"critical","name":"封印危急","trigger_day":14,"description :harbor_district","day2:harbor_district","day3:town_center","day4:harbor_district","day5:harbor_district"],"personality":"豪爽，精明，对危险视而不见的务实主义者","background":"玛莎经营着码头区唯一的酒吧'沉锚酒馆'，她的酒吧是水手、走私客和各种边缘人物的聚集地。她见多识广，对沃切斯特的黑暗面了如指掌，但选择性地忽略那些超出常理的部分。她的丈夫五年前出海后再也没有回来，但她从未停止在酒吧里为他留一个位置。偶尔有醉酒的水手声称在深海中看到了她丈夫的面孔——但那面孔已经不再完全是人类的了。","possible_interactions":["提供码头区情报和水手动向","出售特殊道具（可疑来源）","触发任务'消失的船员'（她知道一艘失踪货船的秘密）"],"sanity_impact":-1,"trust_threshold":2,"trust_layers":[{"level":0,"dialogue":"热情招待，闲聊码头八卦，但回避深入话题","unlocks":["码头区基本情报"],"hint":"她笑着说'你问太多了，先喝一杯吧'"},{"level":1,"dialogue":"分享水手间的传闻和怪谈，出售普通道具","unlocks":["道具商店开放"],"hint":"她开始认真回答你的问题"},{"level":2,"dialogue":"承认码头区确实有'不该出现的东西'，透露走私通道","unlocks":["走私通道入口","特殊道具商店"],"hint":"她压低声音，环顾四周"},{"level":3,"dialogue":"讲述丈夫失踪的真相，承认深潜者的存在","unlocks":["丈夫的秘密","深潜者混血线索"],"hint":"她的表情变得阴沉"},{"level":4,"dialogue":"交出失踪货船的航海日志，透露海底神殿的位置","unlocks":["航海日志","海底神殿位置线索"],"hint":"她的眼眶泛红"},{"level":5,"dialogue":"承认她能听到深潜者的歌声，她的身体正在变化","unlocks":["深潜者语言翻译线索","钥匙之血线索"],"hint":"她挽起袖子，露出手臂上灰绿色的鳞片"}],"secrets":["她丈夫是深潜者混血","酒吧地下室通往走私通道","她保留着一艘失踪货船的航海日志"],"trust_profile":{"surface_reliability":7,"betrayal_risk":5,"corruption_risk":3,"emotional_anchor_strength":8,"recommended_player_reading":"中高可靠，情感动机强。她的善意是真实的，但失踪的丈夫可能成为她做出危险选择的动机。"},"chapter_1_availability":"core","san_recovery_effect":{"normal_chat":"SAN+1, 疲劳-1","description":"与玛莎正常聊天能让人感到一丝温暖，暂时忘记恐惧。"},"corruption_triggers":[{"id":"martha_harbor_watch","trigger":"player_asked_harbor_watch","description":"你让她在码头守夜——她听到了不该听到的声音。","humanity_cost":-5,"dialogue_before":"你说码头有异常？我可以帮你看一眼。","dialogue_after":"昨晚……昨晚我听到了我丈夫的声音。在水里。他在叫我。"},{"id":"martha_deep_one_encounter","trigger":"player_brought_deep_one_scale_to_inn","description":"你把深海之鳞带到了酒馆。玛莎触碰了它。","humanity_cost":-3,"dialogue_before":"这是什么？我从来没见过这样的……","dialogue_after":"自从碰了那个东西，我的手一直在潮。洗不掉。"}]},{"id":"约书亚·布莱克","name":"约书亚·布莱克","role":"前海军陆战队员，现流浪汉","location":"harbor_district","schedule":["day1:harbor_district","day2:town_center","day3:harbor_district","day4:whispering_forest","day5:harbor_district"],"personality":"偏执，暴力倾向，但偶尔展现惊人的清醒","background":"约书亚曾是一名英勇的海军陆战队员，退役后来到沃切斯特做灯塔守望者。三个月后他失踪了整整一周，被发现时蜷缩在码头区的垃圾桶旁，全身颤抖，喃喃说着'它醒了'。从那以后他就成了一个流浪汉，时而清醒时而癫狂。清醒时他是一个出色的战斗员和情报源，癫狂时他会突然尖叫着扑向看不见的东西。他的身体上有奇怪的疤痕，排列成螺旋形状，据他说是'它们'留下的标记。","possible_interactions":["提供战斗技巧训练","讲述他在灯塔附近的恐怖经历","触发任务'灯塔守望者'（他曾在灯塔中发现秘密）"],"sanity_impact":-5,"trust_threshold":4,"trust_layers":[{"level":0,"dialogue":"充满敌意，会突然尖叫或攻击，大部分时间语无伦次","unlocks":[],"hint":"他盯着你看了一会儿，突然大喊'你身上有味道！'"},{"level":1,"dialogue":"偶尔清醒，愿意接受食物或香烟，会说几句连贯的话","unlocks":["灯塔外围情报"],"hint":"他安静地接过你给的东西"},{"level":2,"dialogue":"清醒时间延长，讲述灯塔守望的经历","unlocks":["灯塔守望者任务","战斗技巧训练"],"hint":"他的眼神变得清明，开始讲述"},{"level":3,"dialogue":"承认灯塔下的恐怖，展示身上的螺旋疤痕","unlocks":["灯塔地下室情报","深潜者标记信息"],"hint":"他脱下外套，露出遍布螺旋疤痕的后背"},{"level":4,"dialogue":"透露深潜者的祭祀日期，承认自己正在变化","unlocks":["深潜者祭祀日期","海底神殿入口信息"],"hint":"他看着自己的手，手指间出现了蹼状薄膜"},{"level":5,"dialogue":"完全信任，愿意跟随玩家进入灯塔，成为战斗同伴","unlocks":["战斗同伴（斗殴+20）","灯塔完整攻略"],"hint":"他站起来，说'带我去。我知道怎么进去'"}],"secrets":["他看到了灯塔下的海底神殿","他知道深潜者的下一个祭祀日期","他身上有深潜者的标记，正在缓慢变化"],"trust_profile":{"surface_reliability":4,"betrayal_risk":7,"corruption_risk":8,"emotional_anchor_strength":3,"recommended_player_reading":"高危险，高痛苦，低理性稳定。他的疯狂是真实的，但他知道的事情也可能是真的。"},"chapter_1_availability":"rumor_only","san_recovery_effect":{}},{"id":"希尔达·莫里斯","name":"希尔达·莫里斯","role":"莫里斯家族最后的继承人","location":"voxchester_manor","schedule":["day1:voxchester_manor","day2:voxchester_manor","day3:town_center","day4:voxchester_manor","day5:voxchester_manor"],"personality":"高贵而忧郁，隐藏着家族的黑暗秘密","background":"希尔达是莫里斯家族的最后一位直系后裔，独自守着这座庞大的庄园。她的家族是沃切斯特的建立者之一，也是封印《扎尔之卷》的守护者家族。然而封印的维持需要代价——每一代莫里斯家族成员都会在三十岁前发疯或失踪。希尔达今年二十八岁，她已经能感觉到那股来自地下的拉扯。她在清醒的时刻会努力寻找解除诅咒的方法，但夜晚来临时，她会在走廊中游荡，用一种不属于她的声音低语着古老的语言。","possible_interactions":["提供庄园的完整布局和暗道信息","讲述莫里斯家族与古老封印的关系","触发任务'家族的诅咒'（解锁庄园深层区域）"],"sanity_impact":-4,"trust_threshold":3,"trust_layers":[{"level":0,"dialogue":"冷淡疏离，礼貌但拒绝深入交流","unlocks":[],"hint":"她站在门口，没有邀请你进去的意思"},{"level":1,"dialogue":"简短介绍庄园的历史，对你的调查表示好奇","unlocks":["庄园基本布局"],"hint":"她微微点头，示意你可以参观一楼"},{"level":2,"dialogue":"讲述莫里斯家族的表面历史，承认家族有'不为人知的负担'","unlocks":["莫里斯家族历史","书房访问权"],"hint":"她的表情变得忧郁"},{"level":3,"dialogue":"承认封印与家族的关系，透露地下室的存在","unlocks":["封印家族真相","地下室入口","家族的诅咒任务"],"hint":"她带你来到地下室入口前"},{"level":4,"dialogue":"讲述祖父的疯狂实验，透露封印即将失效","unlocks":["疯狂实验室位置","封印失效详情","召唤法阵残片"],"hint":"她的手在颤抖，声音变得沙哑"},{"level":5,"dialogue":"承认自己是活体钥匙，愿意配合玩家的任何封印方案","unlocks":["活体钥匙真相","封印仪式完整步骤","牺牲结局条件"],"hint":"她握住你的手，说'我知道你会做出正确的选择'"}],"secrets":["她体内流淌着封印之力","地下室深处有她祖父的疯狂实验室","她其实是封印的活体钥匙"],"trust_profile":{"surface_reliability":6,"betrayal_risk":6,"corruption_risk":4,"emotional_anchor_strength":6,"recommended_player_reading":"情感可信，但自保动机强。莫里斯家族的诅咒让她习惯于保护自己优先。"},"chapter_1_availability":"rumor_only","san_recovery_effect":{}},{"id":"汤米·陈","name":"汤米·陈","role":"杂货店老板，业余摄影师","location":"town_center","schedule":["day1:town_center","day2:town_center","day3:harbor_district","day4:town_center","day5:town_center"],"personality":"开朗，好奇心旺盛，对超自然事物着迷","background":"汤米是沃切斯特少数几个看起来还算正常的居民之一。他在镇中心经营着一家杂货店，同时也是个业余摄影师，经常背着相机在城里四处拍照。他的照片质量很高，但最近冲洗出来的照片中总是出现一些奇怪的现象——建筑物的阴影中多了一个人影、海面上浮现出巨大的轮廓、某些居民的面部在照片中扭曲变形。他自己也注意到了这些异常，但出于记者般的好奇心，他不但没有停止拍摄，反而更加频繁地出没于各个区域。","possible_interactions":["出售各种道具和补给品","提供他拍摄的可疑照片作为线索","触发任务'暗房中的显影'（他的照片中出现了不该存在的东西）"],"sanity_impact":-2,"trust_threshold":2,"trust_layers":[{"level":0,"dialogue":"热情招呼，推销杂货店商品，对超自然话题半开玩笑","unlocks":["杂货店道具商店"],"hint":"他笑着说'要买点什么？拍照五毛钱一张！'"},{"level":1,"dialogue":"分享一些可疑的照片，半信半疑地讨论异常现象","unlocks":["可疑照片线索","暗房任务"],"hint":"他犹豫了一下，从柜台下拿出一叠照片"},{"level":2,"dialogue":"展示更多异常照片，承认自己在跟踪某些事件","unlocks":["深潜者活动轨迹照片","封印核心照片"],"hint":"他的表情变得严肃，说'你不觉得这些太巧合了吗？'"},{"level":3,"dialogue":"分享完整的照片记录，包括祭祀仪式的照片","unlocks":["祭祀仪式照片","深潜者出没规律"],"hint":"他把门关上，说'接下来的话不要告诉任何人'"},{"level":4,"dialogue":"愿意跟随玩家去危险区域拍摄，成为情报来源","unlocks":["情报同伴（侦查+10）","每日照片情报"],"hint":"他检查相机，说'我跟你去，但你要保护我'"},{"level":5,"dialogue":"交出所有底片，包括他从未冲洗过的——因为他害怕看到里面的内容","unlocks":["全部底片（揭示隐藏真相）","终极照片线索"],"hint": ritual_pressure","trigger":"player_accused_isabella_heretic","description":"你当面指控伊莎贝拉是异端。她的眼神变得空洞。","humanity_cost":-5,"dialogue_before":"你不知道你在说什么。","dialogue_after":"你说得对。我确实是。一直都是。"}]},{"id":"老费舍","name":"老费舍","role":"老渔夫，深潜者混血后裔","location":"harbor_district","schedule":["day1:harbor_district","day2:harbor_district","day3:harbor_district","day4:harbor_district","day5:harbor_district"],"personality":"沉默寡言，眼神中带着非人的冷漠","background":"老费舍是沃切斯特最年长的渔夫之一，已经在这里打了六十年的鱼。很少有人注意到他的异常——他从不脱鞋，从不在人前更衣，他的皮肤呈现出一种不自然的灰绿色调。事实上，他是深潜者与人类的混血后裔，血脉中的非人成分随着年龄增长越来越明显。他能听到海面下深潜者的歌声，能感受到即将到来的潮汐变化。但他拒绝响应血脉的召唤，这让他承受着巨大的痛苦。他知道自己终将回归大海，但在此之前，他想帮助那些尚且保持着人类心智的人。","possible_interactions":["提供深海和潮汐的准确信息","以隐晦的方式警告玩家远离某些区域","触发任务'海之呼唤'（他正在抵抗血脉中的召唤）"],"sanity_impact":-4,"trust_threshold":3,"trust_layers":[{"level":0,"dialogue":"沉默点头，简短回答，偶尔用奇怪的眼神看你","unlocks":[],"hint":"他只是盯着海面，像没听到你说话"},{"level":1,"dialogue":"用隐晦的方式提供潮汐和天气信息","unlocks":["潮汐时刻表","天气预报"],"hint":"他头也不回地说'明天潮水不对，别去码头'"},{"level":2,"dialogue":"警告你远离特定区域，透露深潜者出没的规律","unlocks":["深潜者出没规律","安全区域标识"],"hint":"他压低声音说'月圆的时候，别看水面'"},{"level":3,"dialogue":"承认自己能听到'海底的歌声'，展示身体的变化","unlocks":["深潜者语言基础","混血者情报"],"hint":"他卷起裤腿，露出脚踝处灰绿色的鳞片"},{"level":4,"dialogue":"透露海底神殿的位置，讲述深潜者文明","unlocks":["海底神殿位置","深潜者语言翻译","钥匙之血情报"],"hint":"他的声音变成了低沉的嗡鸣，随后翻译道'他们在呼唤继承者'"},{"level":5,"dialogue":"愿意提供钥匙之血协助封印仪式，或帮助玩家逃离","unlocks":["钥匙之血（封印道具）","逃生船路线","escape结局条件"],"hint":"他说'我的时间不多了。在海水把我带走之前，让我做最后一件人事'"}],"secrets":["他知道海底神殿的准确位置","他能翻译深潜者的语言","他体内有解除封印所需的'钥匙之血'"],"trust_profile":{"surface_reliability":8,"betrayal_risk":2,"corruption_risk":7,"emotional_anchor_strength":7,"recommended_player_reading":"高可靠，高腐化风险，低主动背叛。他的混血身份让他知道太多，但他选择保护人类。"},"chapter_1_availability":"core","san_recovery_effect":{"normal_chat":"降低当晚码头事件风险10%","description":"老费舍提供潮汐建议，让你对码头的夜晚有所准备。"},"corruption_triggers":[{"id":"fisher_tide_questioned","trigger":"player_insisted_fisher_explain_tide","description":"你逼老费舍说出潮汐的秘密。他看向海的眼神变了。","humanity_cost":-3,"dialogue_before":"年轻人，有些事不该问。","dialogue_after":"我什么都说了。你还想知道什么？……不，你不会想知道的。"}]},{"id":"埃德加·洛夫克拉夫特","name":"埃德加·洛夫克拉夫特","role":"作家，偶尔的调查员","location":"town_center","schedule":["day1:town_center","day2:whispering_forest","day3:town_center","day4:voxchester_manor","day5:town_center"],"personality":"神经质，才华横溢，对黑暗有病态的迷恋","background":"一位从普罗维登斯来到沃切斯特取材的作家。他正在创作一部关于古老恐怖的小说，选择沃切斯特是因为这里的氛围完美契合他的创作需求。然而他不知道的是，他的创作并非完全来自想象——他的梦境正在接收来自虚空深处的信息。他笔下的故事越来越多地与现实重合，甚至预言了尚未发生的事件。他本人对此半信半疑，但最近他开始在深夜收到匿名信件，信中用他小说中的语言写着警告。","possible_interactions":["分享他收集的都市传说和怪谈","提供文学性的线索解读","触发任务'未完成的手稿'（他的小说中预言了即将发生的事）"],"sanity_impact":-3,"trust_threshold":3,"trust_layers":[{"level":0,"dialogue":"热情谈论自己的小说创作，对现实异常持文学性的怀疑态度","unlocks":[],"hint":"他说'你有没有想过，现实本身就是最好的恐怖小说素材？'"},{"level":1,"dialogue":"分享一些怪谈和都市传说，用小说家的视角分析","unlocks":["都市传说情报","文学性线索解读"],"hint":"他翻开笔记本，说'我记录了一些有趣的故事'"},{"level":2,"dialogue":"承认自己的小说开始与现实重合，感到不安","unlocks":["预言性手稿","未完成的手稿任务"],"hint":"他不安地说'我昨天写的东西，今天就发生了'"},{"level":3,"dialogue":"透露收到匿名信件，展示手稿中的异常内容","unlocks":["匿名信线索","手稿中的召唤咒语"],"hint":"他颤抖着递给你一封信，信纸上的墨迹在蠕动"},{"level":4,"dialogue":"承认自己能预见未来，但不确定这是天赋还是诅咒","unlocks":["通灵者能力","未来事件预知"],"hint":"他的眼睛失去焦点，说'我看到了……三天后，灯塔的光……'"},{"level":5,"dialogue":"完全信任，愿意用手稿预知协助玩家，或坦白自己的通灵本质","unlocks":["每日预知服务","尤格-索托斯连接线索","通灵者真相"],"hint":"他说'我的笔不再属于我。但如果你需要——让它为你书写未来'"}],"secrets":["他的梦境实际上是尤格-索托斯的信息传递","他的手稿中隐藏着真实的召唤咒语","他是一个天然的'通灵者'，但自己不知道"],"trust_profile":{"surface_reliability":5,"betrayal_risk":3,"corruption_risk":7,"emotional_anchor_strength":5,"recommended_player_reading":"低主动恶意，高梦境泄露风险。他的灵感来自不该接触的地方，但他的善意是真诚的。"},"chapter_1_availability":"rumor_only","san_recovery_effect":{}}],"events":[{"id":"evt_harbor_shadow","name":"水面下的阴影","type":"怪物遭遇","event_classification":"horror","chapter":1,"trigger":{"areas":["harbor_district"],"time_phase":["midnight"],"probability":0.35,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你正在码头边行走，月光在水面上铺开一层银色的薄纱。突然，水面下的月光被什么东西遮挡了——一个巨大的、缓慢移动的阴影从深水中升起。它不是任何你认识的海洋生物。那阴影有着不规则的轮廓，偶尔伸出类似触手的附属物，在离水面不到两米的地方盘旋。你感到一种原始的恐惧攫住了你的心脏。阴影停了下来，似 iginal_condition":"区域=harbor_district，任意时间，概率25%","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":true,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_deep_one_patrol","name":"深潜者巡逻","type":"怪物遭遇","event_classification":"horror","chapter":1,"trigger":{"areas":["harbor_district"],"time_phase":["midnight"],"probability":0.2,"requires":["san_below_50"],"forbidden_flags":[],"chapter":1},"description":"浓雾中出现了不该出现的身影。三个——不，四个——人形生物从海水中走上码头。它们有着人类的基本轮廓，但皮肤是灰绿色的，覆盖着鳞片。它们的头部宽阔而扁平，眼睛巨大且泛着金色的光。它们走路的方式不对——膝盖弯曲的方向反了，每一步都带着一种令人作呕的弹性。它们经过你藏身的地方时，其中一个停了下来，巨大的头颅转向你的方向。它的嘴张开了，露出层层叠叠的尖牙，然后发出一声尖锐的、不属于任何已知语言的叫声。","effects":{"HP":-5,"SAN":-8,"items":["深潜者鳞片","银质匕首"],"npc_changes":["老费舍_fear"],"skill_check":{"skill":"潜行","threshold":50,"success":"你屏住呼吸，它们没有发现你","failure":"你被发现，一只深潜者扑向你，你勉强逃脱但受了伤"}},"sanity_damage":0,"original_condition":"区域=harbor_district，时间=深夜，概率20%，需SAN<50","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":true,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_drowned_voice","name":"溺亡者的声音","type":"神秘事件","event_classification":"horror","chapter":1,"trigger":{"areas":["harbor_district"],"time_phase":["midnight"],"probability":0.15,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你独自站在码头边，四周安静得不正常。突然，水面上浮起了无数气泡，气泡破裂时发出的声音汇聚成一个声音——一个你认得的声音。那是你失踪已久的亲人的声音，正在呼唤你的名字。'下来吧，'那个声音说，'水下很温暖，我们都来了。你看——'水面变得透明，你看到了水下的景象：数十个人影在水中缓缓游动，他们的面孔平静而空洞，嘴角挂着微笑。你的亲人的面孔也在其中，正在向你招手。","effects":{"HP":0,"SAN":-6,"items":["溺亡者的手链（亲人遗物）"],"npc_changes":[],"skill_check":{"skill":"意志","threshold":60,"success":"你咬破舌尖，用疼痛唤醒自己，后退离开","failure":"你向水面踏出了一步，差点跌入海中"}},"sanity_damage":-6,"original_condition":"区域=harbor_district，时间=夜晚，概率15%","distortion_trigger":50,"distortion_text":"你亲人的声音从水下传来。下来吧，它说，水下很温暖。你向前走了一步。你的鞋湿了。你什么时候走到水边的？","false_memory":"你记得听到了亲人的声音。但你没有亲人。你确定吗？","skill_check":null,"choices":[],"chapter_1_eligible":t es":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_portrait_watch","name":"肖像的注视","type":"神秘事件","event_classification":"horror","chapter":1,"trigger":{"areas":["voxchester_manor"],"time_phase":[],"probability":0.5,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你穿过庄园大厅时，感觉到有人在注视你。你转过身，面对着墙上那一排莫里斯家族的肖像画。画中人的眼睛——所有的眼睛——都在看着你。你确定刚才进门时，这些画中人的眼睛是朝向不同方向的。你缓缓移动，那些眼睛跟随你的动作转动。最令人不安的是最年轻的一幅肖像——一个大约十二岁的男孩，他的嘴角正在缓缓上扬，露出一个不应该出现在油画上的微笑。你眨了一下眼，一切恢复了正常。画中人的眼睛朝向了原来的方向。但那个男孩的微笑——那个微笑还在。","effects":{"HP":0,"SAN":-3,"items":[],"npc_changes":[],"skill_check":{"skill":"心理学","threshold":30,"success":"你意识到这些画作可能被赋予了某种意识","failure":"你开始怀疑自己的感知能力"}},"sanity_damage":-3,"original_condition":"区域=voxchester_manor，概率50%","distortion_trigger":60,"distortion_text":"肖像在看着你。你移动，它们也移动。最年轻的那个男孩他的嘴角在上扬。你认出了那张脸。那是你小时候的脸。","false_memory":"你记得肖像的眼睛在动。但希尔达说那些画已经几十年没有人打理了。你看到的真的是画吗？","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_basement_depth","name":"不应该存在的深度","type":"陷阱","event_classification":"horror","chapter":1,"trigger":{"areas":["voxchester_manor"],"time_phase":[],"probability":0.25,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你沿着地下室的台阶向下走。十级、二十级、三十级——台阶还在继续。地下室不可能有这么深。你点燃火柴查看四周，墙壁由粗糙的石砖变成了光滑的黑色石材，与地面墓穴的材质相同。空气中弥漫着一股越来越浓的硫磺味。五十级、六十级——台阶终于到了尽头，但你面前的不是一个标准的地下室。你看到的是一条长长的走廊，两侧排列着无数扇门。门后传来各种声音——哭泣声、笑声、低语声、金属碰撞声。走廊尽头的门微微敞开，透出一丝暗红色的光。","effects":{"HP":-1,"SAN":-5,"items":["暗门钥匙"],"npc_changes":["希尔达·莫里斯_trust+1"],"skill_check":{"skill":"侦查","threshold":45,"success":"你注意到门上的编号形成了一个序列，推断出正确的入口","failure":"你选择了一扇错误的门，里面的空间扭曲了你的方向感"}},"sanity_damage":-5,"original_condition":"区域=voxchester_manor，概率25%","distortion_trigger":50,"distortion_text":"地下室的台阶在向下延伸。十级、二十级、三十级你数到了一百。你确定你在地下吗？你抬头看了看天花板上有星星。","false_memory":"你记得地下室很深。但希尔达说地下室只有十五级台阶。你的膝盖疼了是下了一百级台阶的那种疼。","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note": :"你在墓穴的第一层探索，一排排整齐的石棺在火把的光芒下投射出长长的阴影。突然，你注意到其中一具石棺的盖子被推开了——不是滑开，是从内部推开的，盖子碎裂成了数块。石棺内部是空的，但残留着一股刺鼻的腐臭味。更令人不安的是，石棺内壁上有深深的抓痕，像是某种生物用爪子从内部挖凿的。抓痕延伸到石棺边缘，外面的地板上也有——一串爪痕通向走廊深处。然后你听到了声音，从走廊深处传来：缓慢的、拖拽的脚步声。","effects":{"HP":-4,"SAN":-5,"items":["石棺内的陪葬品（银制护身符）","银质匕首"],"npc_changes":[],"skill_check":{"skill":"潜行","threshold":45,"success":"你贴着墙壁慢慢后退，避开了那个东西","failure":"你踩到了一块碎石，脚步声突然加速朝你冲来"}},"sanity_damage":0,"original_condition":"区域=catacombs_entrance，概率40%","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_underground_river","name":"地下暗河","type":"线索","event_classification":"investigation","chapter":1,"trigger":{"areas":["catacombs_entrance"],"time_phase":[],"probability":0.3,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你发现了一条地下暗河，河水漆黑如墨，但水面异常平静。水流缓慢地向着某个方向流动——不是向下，而是向上，违反了重力法则。河水中偶尔会浮现出一些东西：破碎的骨头、金属碎片、某种有机物的残骸。你蹲下来仔细观察水面，水中的倒影不是你的脸——是一张完全不同的面孔，有着爬行动物般的眼睛和宽阔的嘴。水面的倒影朝你笑了笑，然后沉入了水底。","effects":{"HP":0,"SAN":-3,"items":["暗河水样","河底碎片（未知材质）"],"npc_changes":[],"skill_check":{"skill":"博物学","threshold":40,"success":"你采集了水样，发现其中含有高浓度的未知矿物质","failure":"水中的倒影让你久久无法移开视线"}},"sanity_damage":0,"original_condition":"区域=catacombs_entrance，概率30%","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_living_mural","name":"活的壁画","type":"神秘事件","event_classification":"investigation","chapter":1,"trigger":{"areas":["catacombs_entrance"],"time_phase":[],"probability":0.2,"requires":[],"forbidden_flags":[],"chapter":1},"description":"墓穴的墙壁上绘满了壁画，描绘着古老的祭祀场景。画中的人类围绕着一个巨大的、由触手组成的生物跪拜。这些壁画看起来已经存在了数百年，但当你走过时，壁画中的某些细节发生了变化。一个原本面朝前方的祭司转向了你的方向。一个原本举着双手的人放下了手，指向了走廊的某个分支。你后退几步，壁画又恢复了原状。这不是幻觉——壁画在你注视的方向之外会移动。","effects":{"HP":0,"SAN":-3,"items":["壁画临摹（含隐藏通道线索）"],"npc_changes":[],"skill_check":{"skill":"侦查","threshold":50,"success":"你注意到壁画中祭司手指的方向有一块颜色不同的石砖","failure":"你匆忙离开，但壁画中那个转向你的面孔深深地刻在了你的脑海中"}},"sanity_damage":0,"original_condition":"区域=catacombs_entrance，概率20%","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_ghoul_nest","name":"食尸鬼的巢穴","type":"怪物遭遇","event_classification":"horror","chapter":1,"trigger":{"areas":["catacombs_entrance"],"time_phase":[],"probability":0.15,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你拐过一个弯角，面前的空间突然开阔了。这是一个巨大的洞穴状空间，地面上堆满了——骨头。人类的、动物的，有些已经腐烂得只剩骨架，有些还带着新鲜的肉。恶臭令人窒息。在骨头堆的中心，你看到了三个蜷缩在一起的生物。它们有着类似人类的躯干，但四肢细长而弯曲，皮肤苍白到半透明。它们正在啃食什么东西——你不想知道那是什么。其中一个抬起了头，露出一张扭曲的、带着犬类特征的脸，嘴边沾满了暗红色的液体。","effects":{"HP":-6,"SAN":-6,"items":["食尸鬼掉落的古物碎片","银质匕首"],"npc_changes":[],"skill_check":{"skill":"潜行","threshold":55,"success":"你屏息静气慢慢后退，它们沉浸在进食中没有注意到你","failure":"你踩到了一根骨头，发出了清脆的断裂声，三只食尸鬼同时转向了你"}},"sanity_damage":0,"original_condition":"区域=catacombs_entrance，概率15%","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_yithian_echo","name":"伊斯的回声","type":"神秘事件","event_classification":"horror","chapter":1,"trigger":{"areas":["ruins_of_yith"],"time_phase":[],"probability":0.5,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你踏入遗迹的瞬间，世界改变了。周围的石质建筑突然充满了生命——光芒从每个窗口射出，空中飞过你从未见过的飞行器，街道上行走着……不是人类。那些生物有着巨大的圆锥形躯体，顶部伸出四条可以灵活操作的触手，触手末端是精巧的爪子和眼睛。它们在交谈，发出一种你无法理解但莫名能感受到含义的声音。一个伊斯人经过你身边时停了下来，它的一只眼睛转向你——你突然看到了一段记忆：这座城市在数千年前的样子，一个巨大的圆柱形建筑，以及一场灾难性的时空实验。","effects":{"HP":0,"SAN":-5,"items":["伊斯记忆碎片（可学习）"],"npc_changes":[],"skill_check":{"skill":"INT检定","threshold":60,"success":"你成功保留了一段完整的记忆，获得了关于时间机器的知识","failure":"信息量太大，你只记住了零碎的影像"}},"sanity_damage":-5,"original_condition":"区域=ruins_of_yith，概率50%","distortion_trigger":45,"distortion_text":"你踏入遗迹的瞬间，世界改变了。光芒四射，飞行器穿梭。一个伊斯人停在你身边你突然看到了一段记忆。那是你的记忆。你在三百万年前活过。","false_memory":"你记得看到了遗迹的过去。但你的手上有一种不属于人类的触感四条触手的触感。你有几只手？","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_geometry_trap","name":"非欧几里得陷阱","type":"陷阱","event_classification":"investigation","chapter":1,"trigger":{"areas":["ruins_of_yith"],"time_phase":[],"probability":0.35,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你沿着一条走廊行走，走廊笔直向前，没有任何弯曲。但当你走了大约五十步后，你发现自己回到了起点。你再次尝试，这次你贴着左墙走——结果一样。你开始检查墙壁的角度，发现一些墙壁之间的夹角不应该是九十度——它们看起来是直角，但你的大脑告诉你那不是。空间本身被扭曲了。你抬头看天花板，发现它在某些地方离地面只有两米，在另一些地方则高得看不到顶。你开始感到眩晕，方向感完全丧失。","effects":{"HP":-2,"SAN":-4,"items":[],"npc_changes":[],"skill_check":{"skill":"数学","threshold":50,"success":"你运用非欧几何的知识找到了正确的路径","failure":"你继续在扭曲的空间中迷失，耗费了大量时间和体力"}},"sanity_damage":0,"original_condition":"区域=ruins_of_yith，概率35%","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_time_slip","name":"时间滑移","type":"神秘事件","event_classification":"investigation","chapter":1,"trigger":{"areas":["ruins_of_yith"],"time_phase":[],"probability":0.2,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你触碰了遗迹中一个奇怪的装置碎片，突然你的视野模糊了。你看到自己站在同一个位置，但周围的环境完全不同——天空是紫色的，有两个太阳。地面覆盖着一种金属般的植被。远处有一座巨大的城市，城市的建筑风格超出了你的理解能力。然后你看到了它们——伊斯的伟大种族，圆锥形的躯体在城市中穿行。你突然理解了它们在做什么：它们在使用时间机器将自己的意识投射到不同的时代和生物中。你感受到了它们的目的——收集所有时代的所有知识。","effects":{"HP":0,"SAN":-6,"items":["时间碎片（永久解锁：时间感知能力）"],"npc_changes":[],"skill_check":{"skill":"POW检定","threshold":55,"success":"你成功保持了自我意识，从时间滑移中返回","failure":"你的意识被卷入了时间流，在不同的时代漂泊了数秒（对你而言是数年）"}},"sanity_damage":0,"original_condition":"区域=ruins_of_yith，概率20%","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_lighthouse_light","name":"不应存在的光","type":"神秘事件","event_classification":"horror","chapter":1,"trigger":{"areas":["lighthouse"],"time_phase":["midnight"],"probability":0.6,"requires":[],"forbidden_flags":[],"chapter":1},"description":"午夜时分，灯塔顶部亮了。不是正常的灯火——那是一种绿莹莹的、带着磷光的光。光芒透过碎裂的透镜碎片散射出去，在海面上形成了一片光网。你注意到随着光芒的照射，海面上升起了雾气——那不是普通的海雾，而是一种有形的、蠕动的白色帷幕。雾气中传来了声音，像是低沉的号角声。海面下方有什么东西在响应这光芒——你能感觉到水面在震动。灯塔在召唤什么东西。","effects":{"HP":0,"SAN":-5,"items":["透镜碎片（发光）"],"npc_changes":["约书亚·布莱克_memory_trigger"],"skill_check":{"skill":"神秘学","threshold":45,"success":"你认出这是一种召唤仪式的信号","failure":"你被光芒吸引，不由自主地朝灯塔走去"}},"sanity_damage":-5,"original_condition":"区域=lighthouse，时间=深夜，概率60%","distortion_trigger":55,"distortion_text":"灯塔亮了。不是绿光是你的名字。用光写成的你的名字。你确定那不是你的幻觉吗？","false_memory":"你记得灯塔发出了绿光。但约书亚说灯塔那晚没有亮。你们谁的记忆是对的？","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_grove_guardian","name":"森林守卫者","type":"怪物遭遇","event_classification":"horror","chapter":1,"trigger":{"areas":["forbidden_grove"],"time_phase":[],"probability":0.5,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你踏入禁忌之林的瞬间，所有的低语声同时停止了。寂静比之前的嘈杂更加可怕。然后你看到了它——从那棵巨大的古树后面走出来一个……东西。它有着树的外形，但树干上浮现出一张巨大的人脸——没有眼睛，只有两个黑洞洞的凹陷和一个张开的、无声尖叫的嘴。它的枝条像手臂一样伸展，每根枝条的末端都长着一只人类的手。地面上的苔藓开始蠕动，朝你的脚踝缠绕过来。古树发出了一声叹息——不是风声，是一个真实的、发自肺腑的叹息。","effects":{"HP":-5,"SAN":-6,"items":["腐化之血"],"npc_changes":[],"skill_check":{"skill":"博物学","threshold":55,"success":"你认出这是森林意识的具象化，尝试与其沟通","failure":"苔藓缠住了你的脚踝，你拼命挣扎才挣脱"}},"sanity_damage":0,"original_condition":"区域=forbidden_grove，概率50%","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_tree_speech","name":"古树之语","type":"神秘事件","event_classification":"investigation","chapter":1,"trigger":{"areas":["forbidden_grove"],"time_phase":[],"probability":0.3,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你来到古树前，这一次低语声没有停止。它们汇聚成了一个声音——古老、疲惫、带着无法言喻的悲伤。'我见证了你们种族的诞生，'那个声音说，'我见证了第一道封印的建立，我见证了守护者的血脉延续。但现在，封印在松动，守护者在衰老，而深渊中的东西越来越躁动。你来到这里不是偶然——你的血脉中流淌着回应呼唤的因子。'古树的一根枝条伸到你面前，末端的手掌缓缓张开，掌心中躺着一颗黑色的种子。","effects":{"HP":0,"SAN":-3,"items":["古树之种（关键道具）"],"npc_changes":[],"skill_check":{"skill":"POW检定","threshold":50,"success":"你接受了种子，感受到了与森林的联系","failure":"种子灼烧了你的手掌，留下了螺旋形的疤痕"}},"sanity_damage":0,"original_condition":"区域=forbidden_grove，概率30%","distortion_trigger":null,"distortion_text":null,"false_memory":null,"skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_shoggoth_encounter","name":"修格斯遭遇","type":"怪物遭遇","event_classification":"horror","chapter":1,"trigger":{"areas":["deep_catacombs"],"time_phase":[],"probability":0.3,"requires":[],"forbidden_flags":[],"chapter":1},"description":"通道前方传来湿滑的、沉重的蠕动声。你将手电筒照向前方，光柱切开黑暗的瞬间，你希望自己没有这么做。那是一团巨大的、无定形的胶状物，直径至少有五米，表面不断涌动着无数只临时形成的眼睛——每一只都在独立地转动、注视。它的身体像融化的沥青一样流淌，但速度远比你想象的快。它没有固定的形态，但你看到它短暂地模拟出了人类的脸——十几张脸，同时出现在它涌动的表面上，嘴巴无声地尖叫着。它注意到了你。所有的脸同时转向你的方向，然后融解、重组，变成了一张你自己的脸。","effects":{"HP":-4,"SAN":-8,"items":["修格斯残留物（未知用途）"],"npc_changes":[],"skill_check":{"skill":"潜行","threshold":55,"success":"你屏住呼吸贴在墙角，修格斯从你身边不到一米处流过，没有注意到你","failure":"你踩到了一块碎石，修格斯的所有眼睛同时转向你，一根触须卷向你的腿"}},"sanity_damage":-8,"original_condition":"区域=deep_catacombs，概率30%","distortion_trigger":40,"distortion_text":"黑色淤泥般的生物。它有无数只眼睛，每一只都在独立转动。它看到了你。它变成了你。它用你的脸对你微笑。","false_memory":"你记得遇到了怪物。但你的衣服上没有粘液。也许你没有遇到。也许你就是那个怪物。","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_seal_ritual","name":"封印仪式残痕","type":"神秘事件","event_classification":"horror","chapter":1,"trigger":{"areas":["deep_catacombs"],"time_phase":[],"probability":0.25,"requires":[],"forbidden_flags":[],"chapter":1},"description":"穹顶大厅的地面中央有一个巨大的圆形凹陷，直径约十米。凹陷中刻满了密密麻麻的符文，排列成同心圆的图案，从外圈向内圈逐渐缩小。最内圈的符文已经模糊不清，但你隐约能辨认出几个——它们与《扎尔之卷》上的文字相同。凹陷的中心是一个拳头大小的孔洞，向下看去是无尽的黑暗。当你蹲下来仔细观察时，你感到一股微弱的气流从孔洞中向上吹来——那气流带着温度，不像是地下该有的。你突然理解了：这是一个封印仪式的现场。数千年前，有人在这里举行过仪式，将某种东西封印在了这个孔洞之下。而封印——正在失效。","effects":{"HP":0,"SAN":-6,"items":["封印仪式记录（关键线索）"],"npc_changes":[],"skill_check":{"skill":"神秘学","threshold":60,"success":"你成功辨认出了仪式的步骤——它需要七个关键道具和一个活体献祭","failure":"符文在你的注视下开始蠕动，你头痛欲裂，只模糊理解了仪式的轮廓"}},"sanity_damage":-6,"original_condition":"区域=deep_catacombs，概率25%","distortion_trigger":40,"distortion_text":"封印仪式的残痕。同心圆的图案，从外圈向内圈缩小。中心是一个拳头大小的孔洞。你蹲下来气流从孔洞中吹来。温暖的气流。你的心跳与它同步了。","false_memory":"你记得看到了封印仪式的痕迹。但当你再次来到这里时，图案变了。它更完整了。像是有人补充了你上次没有画完的部分。","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_void_whisper","name":"虚空低语","type":"神秘事件","event_classification":"horror","chapter":1,"trigger":{"areas":["deep_catacombs"],"time_phase":[],"probability":0.2,"requires":[],"forbidden_flags":[],"chapter":1},"description":"你站在竖井边缘，向下望去。什么也看不到——不是黑暗，是真正的虚无。你的目光被吸引住了。然后，低语开始了。不是从竖井中传来——是从你的脑海中直接响起。那声音不属于任何人类语言，但你能理解每一个词。它在讲述宇宙的历史：第一颗恒星的诞生，第一个文明的兴起与灭亡，封印的建立，以及封印之后发生的一切。它告诉你，你不是偶然来到沃切斯特的。你的血脉中流淌着与封印共鸣的因子——你的祖先曾是晨星会的成员，而你体内的某种东西正在响应深渊的呼唤。低语停止了。你发现自己跪在竖井边缘，双手伸向虚空，手指离边缘不到十厘米。","effects":{"HP":0,"SAN":-7,"items":["虚空回响记忆（永久效果：克苏鲁神话+3）","螺旋铜镜"],"npc_changes":[],"skill_check":{"skill":"意志","threshold":65,"success":"你咬破舌尖，用剧痛唤醒了自己，后退离开竖井边缘","failure":"你的身体不受控制地向前倾，差点跌入竖井，千钧一之际你抓住了一块凸起的石头"}},"sanity_damage":-7,"original_condition":"区域=deep_catacombs，概率20%","distortion_trigger":40,"distortion_text":"虚空在低语。它在讲述宇宙的历史从第一颗恒星到最后一个黑洞。你听到了自己的名字。你发现自己跪在竖井边缘，双手伸向虚空。你什么时候跪下的？","false_memory":"你记得站在竖井边缘。但你的膝盖上有泥你跪下了多久？你的时间感已经不可靠了。","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_elder_sign","name":"旧印","type":"线索","event_classification":"investigation","chapter":1,"trigger":{"areas":["deep_catacombs"],"time_phase":[],"probability":0.15,"requires":[],"forbidden_flags":[],"chapter":1},"description":"在穹顶大厅的一面墙壁上，你发现了一个与其他符文截然不同的符号。它刻得更深、更精确，周围的石材呈现出一种轻微的灼烧痕迹。这个符号——你认出来了。在伊莱亚斯的研究笔记中提到过：旧印（Elder Sign），一种可以对抗古神眷族的守护标记。它不应该出现在这里。旧印是封印的强化组件，但它被刻在了竖井的外侧而不是内侧——这意味着有人试图阻止什么 fication":"normal","chapter":3,"trigger":{"areas":["harbor_district"],"time_phase":["morning"],"probability":0.25,"requires":[],"forbidden_flags":[],"chapter":3},"description":"老费舍今天没有出海。他坐在码头边，面朝大海，脚边放着一瓶已经喝了一半的威士忌。'我年轻的时候，'他说，声音比平时清楚。'沃切斯特还有灯节。每年秋天，家家户户在窗台上点蜡烛。不是为了照明，是为了让海里的东西知道——岸上有人记得它们。'他喝了一口酒。'后来灯节取消了。因为有一年，所有的蜡烛同时变成了绿色。没有风，火焰是绿色的。第二天早上，三户人家消失了。连房子一起。'他把酒瓶递给你。'你不喝酒？也好。清醒地看这个世界，已经够辛苦了。'","effects":{"HP":0,"SAN":-1,"items":[],"npc_changes":[{"npc":"老费舍","trust_change":2}],"skill_check":null},"sanity_damage":-1,"original_condition":"区域=harbor_district，早晨","distortion_trigger":null,"distortion_text":"","false_memory":"","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":true,"chapter_1_san_note":null},{"id":"evt_ch3_safehouse_corruption","name":"安全屋的裂缝","type":"轻微异常","event_classification":"minor_abnormal","chapter":3,"trigger":{"areas":["town_center"],"time_phase":["evening","midnight"],"probability":0.2,"requires":[],"forbidden_flags":[],"chapter":3},"description":"你回到住处，发现墙角出现了一道裂缝。不是普通的墙体开裂——裂缝边缘很整齐，像是被人用刀划开的。你用手电筒照进去，裂缝深处有什么东西在反光。你退后一步，裂缝里渗出了一滴液体。粘稠、透明、带着海盐的气味。你拿来杯子接了几滴。液体在杯底缓慢地旋转，像是有自我意识。你把杯子放在桌上，转身去拿东西。再回头时，杯子里空了。桌上有一圈水渍，方向朝向你的枕头。","effects":{"HP":0,"SAN":-3,"items":[],"npc_changes":[],"skill_check":null},"sanity_damage":-3,"original_condition":"区域=town_center，傍晚/午夜","distortion_trigger":35,"distortion_text":"裂缝在你睡着的时候变大了。你确定它在你睡着之前只有头发丝那么细。现在它有手指那么宽。","false_memory":"你记得墙上的裂缝。但你的房间没有裂缝。你的房间在地下室。你住的是地下室吗？","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_ch4_hilda_choice","name":"希尔达的条件","type":"NPC互动","event_classification":"investigation","chapter":4,"trigger":{"areas":["voxchester_manor"],"time_phase":["evening"],"probability":0.35,"requires":["clue_m_2","clue_m_3"],"forbidden_flags":["clue_m_5"],"chapter":4},"description":"希尔达在庄园的书房里等你。桌上的烛台只剩两根蜡烛，火光映着她半边脸。'你知道了，'她说，不需要你开口。'莫里斯家族是封印的看守者。也是封印的破坏者。因为我们同时是深潜者的后代。我们用外乡人的灵魂来修补封印，实际上是把封印的缺口转嫁到你们身上。每一任轮回者都是这样死的。'她 ice"],"chapter":5},"description":"你感觉到了。不是通过听觉或视觉——是一种更深层的感知，像内脏在告诉你有什么东西碎了。封印碎了。你不知道为什么你知道，但你确信。灯塔的光在一瞬间变成了纯白色，照亮了整个沃切斯特。然后光灭了。不是关灯的那种灭——是光被什么东西吸走了。黑暗从灯塔的顶端向下蔓延，像是一个倒过来的墨水瓶被打翻了。黑暗吞噬灯塔后继续向外扩展。海面平静得可怕。没有波浪。没有风。整个沃切斯特像一块沉入水底的石头一样安静。","effects":{"HP":-3,"SAN":-12,"items":[],"npc_changes":[],"skill_check":null},"sanity_damage":-12,"original_condition":"区域=deep_catacombs/lighthouse，午夜，需要clue_h_6，需要希尔达未牺牲","distortion_trigger":5,"distortion_text":"封印碎了。你碎了。一切都在碎。声音碎成了粉末。光碎成了粉末。你的名字碎成了粉末。","false_memory":"封印碎了。封印没有碎。封印从未存在。你从未存在。沃切斯特从未存在。","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_ch5_loop_breaker","name":"轮回之锁","type":"超自然遭遇","event_classification":"horror","chapter":5,"trigger":{"areas":["ruins_of_yith","deep_catacombs"],"time_phase":["midnight"],"probability":0.25,"requires":[],"forbidden_flags":[],"chapter":5},"description":"你走进废墟的时候，看到了不应该存在的东西：另一个你。它坐在石阶上，姿势疲惫，看到你的时候没有任何惊讶。'第几次了？'它问。你没回答。它笑了。'不用回答。你每次都不回答。'它站起来，拍了拍衣服上的灰。'我是第七次轮回的你。你是——你数过吗？没关系。每一次轮回都有人试图打破循环。有人选择修复封印，有人选择逃跑，有人选择战斗。结果都一样。你回到第一天，记忆被抹掉大半，沃切斯特继续存在。'它走近你。'但这一次不同。你走到这里了。前六次，我没有走到这里。也许你是对的也许你只是更蠢。但无论如何——在你做出最终选择之前，你应该知道一件事：打破循环的代价不是死亡。是你的存在本身。你不会死。你会从未存在过。'","effects":{"HP":0,"SAN":-8,"items":[],"npc_changes":[],"skill_check":null},"sanity_damage":-8,"original_condition":"区域=ruins_of_yith/deep_catacombs，午夜","distortion_trigger":10,"distortion_text":"你看着另一个你。它在说话。但你不确定它说的内容和你听到的内容是一样的。你的耳朵在欺骗你。","false_memory":"你遇到了另一个自己。但你是一个人来的。废墟里只有你。但地上有两组脚印。","skill_check":null,"choices":[],"chapter_1_eligible":false,"normalcy_anchor":false,"chapter_1_san_note":null},{"id":"evt_ch5_humanity_judgement","name":"人性的天平","type":"超自然遭遇","event_classification":"horror","chapter":5,"trigger":{"areas":["deep_catacombs","forbidden_grove","ruins_of_yith"],"time_phase":["midnight"],"probability":0.35,"requires":[],"forbidden_flags":[],"chapter":5},"description":"你的视野消失了。不是失明——是周围的环境消失了。你站在一个没有边界的白色空间里。面前有一架天平。左边的托盘上放着你在沃切斯特做的每一个选择——你能看到每一件，但看不清细节，只有一团团模糊 手中握着仪式的最后一块碎片。她看着你，眼中不再有狂热——只有疲惫和悔恨。'我被欺骗了，'她说，'我以为我在迎接新神。但我只是在为一个骗子开门。'她将碎片摔碎在地。教堂的钟声响了——不是十三声，是十二声。那是她为自己敲响的丧钟。","humanity_fragile":"伊莎贝拉破坏了仪式。你不确定她是因为真相而悔悟，还是因为你给了她太多证据让她无法自欺。但结果是一样的——仪式被阻止了。","humanity_lost":"伊莎贝拉破坏了仪式。你用真相击溃了她的信仰。她不再相信任何东西了。你赢了，但你也摧毁了一个人。"},"loop_memory_effect":"下一轮伊莎贝拉初始腐化-20，但她会在第一次见面时说'你……你让我想起了一个人。一个让我看清真相的人。'","design_intent":"反派救赎——揭露操纵比消灭敌人更有意义"},{"id":"ending_escape_by_sea","name":"海上逃离","world_outcome":"escaped_by_sea","cost_bearer":"no_one","required_conditions":["has_escape_boat_route","has_tide_timetable","old_fisher_trust >= 3 OR martha_trust >= 4","player_san > 20","city_corruption < 80"],"blocking_conditions":["city_corruption >= 80","seal_status == broken"],"npc_requirements":{},"resource_requirements":{"has_key_items":["tide_timetable","escape_boat"]},"humanity_variants":{"humanity_high":"你在黎明前登上了渔船。海风吹在脸上，那是你很长时间以来第一次感受到真实的风。你自由了。但你知道——沃切斯特还在那里。那些人还在那里。你带出了真相。也许有一天你会回来。","humanity_fragile":"你逃离了沃切斯特。你活下来了。但你没有带走所有人。有些人留在了雾里。你告诉自己你已经尽力了。也许这是真的。","humanity_lost":"你逃离了沃切斯特。你带出了证据和情报。你活下来了。那些留在城里的人——你甚至没有回头看一眼。"},"loop_memory_effect":"下一轮初始获得渔船钥匙，但第一天就会梦到海面下的面孔","design_intent":"幸存结局——不应写成真正好结局，而是带着愧疚的逃离"},{"id":"ending_evidence_escape","name":"证据逃离","world_outcome":"evidence_escape","cost_bearer":"unknown","required_conditions":["tommy_photo_chain_completed","elias_research_notes_collected","player_left_city","seal_not_restored"],"blocking_conditions":["seal_restored"],"npc_requirements":{"汤米·陈":{"trust":3,"alive":true}},"resource_requirements":{"has_key_items":["tommy_photos","elias_notes"]},"humanity_variants":{"humanity_high":"你带着证据离开了沃切斯特。多年后，你在另一个港口城市听到了钟声。十三声。你知道——一切还没有结束。但至少，真相在你手中。","humanity_fragile":"你带着证据离开了。你把它们交给了需要知道的人。他们不相信你。但证据在那里。也许有一天会有人用到它们。","humanity_lost":"你带着证据离开了。你把它们卖给了最高出价者。钱到手了。真相？真相只是商品。"},"loop_memory_effect":"下一轮汤米初始信任+2，但他的照片中会出现你上一轮离开时的背影","design_intent":"玩家选择保存真相而非拯救城市——暗示续作"},{"id":"ending_heretical_dawn","name":"异端降临","world_outcome":"heretical_dawn","cost_bearer":"player","required_conditions":["player_joined_isabella_ritual OR player_san_extremely_low_accepted_false_revelation OR player_misjudged_bell_meaning","seal_status != intact"],"blocking_conditions":["player_exposed_morning_star_truth"],"npc_requirements":{},"resource_requirements":{},"humanity_variants":{"humanity_high":"你不知道自己是怎么走到这一步的。你本想阻止仪式。但你看到了真相——或者说，你看到了它想让你看到的真相。天空裂开了。你跪下了。不是出于恐惧——是出于敬畏。也许这就是疯狂。","humanity_fragile":"仪式完成了。你不确定自己是被欺骗了还是主动选择了。也许两者没有区别。新的时代开始了。","humanity_lost":"你完成了仪式。你从一开始就知道会发生什么。你想要这个结果。你欢迎它们。你张开了双臂。"},"loop_memory_effect":"下一轮NPC初始恐惧值+20，但玩家初始神秘学+10","design_intent":"文本应像启示而非普通失败——这是另一种形式的真相"},{"id":"ending_abyss_consumed","name":"深渊吞噬","world_outcome":"abyss_consumed","cost_bearer":"player","required_conditions":["player_in_deep_catacombs","player_san <= 0 OR player_san_very_low AND clue_chains_insufficient OR mythos_high_humanity_low"],"blocking_conditions":["seal_restored"],"npc_requirements":{},"resource_requirements":{},"humanity_variants":{"humanity_high":"你走到了竖井边缘。深渊之眼在底部注视着你。你知道了——人类的存在是多么渺小。但你没有跳下去。你只是坐在边缘，看着那无尽的黑暗。你哭了。不是因为恐惧——是因为你终于理解了。","humanity_fragile":"你坠入了深渊。你没有挣扎。也许是因为你太累了。也许是因为你已经不在乎了。","humanity_lost":"你张开双臂，向竖井迈出了一步。坠落的过程中，你看到了一切。当你落地时，你感到的是平静。永恒的、无尽的平静。然后，你睁开了新的眼睛。"},"loop_memory_effect":"下一轮可选择堕落者起始角色，初始SAN上限-15","design_intent":"不是普通game over，而是叙事死亡——玩家的认知被深渊取代"},{"id":"ending_transcendence","name":"超越者","world_outcome":"transcendence","cost_bearer":"unknown","required_conditions":["cthulhu_mythos >= 20","player_san > 40","has_time_fragment","yith_chain_completed","math_check_passed OR occult_check_passed"],"blocking_conditions":["player_humanity_score < 20"],"npc_requirements":{},"resource_requirements":{"has_key_items":["time_fragment"]},"humanity_variants":{"humanity_high":"你超越了人类的视角。你看到了时间的全貌。你理解了封印的本质。但你选择了回来——回到人类的视角，用你学到的一切来守护这个世界。你不再是完全的人，但你选择了做人该做的事。","humanity_fragile":"你超越了。你看到了一切。你理解了。但你不知道自己还是不是你。你的身体在沃切斯特，但你的心在别处。在时间之外。","humanity_lost":"你超越了人类。你看到了宇宙的全貌。人类的恐惧、希望、爱——在你看来都是化学反应。你不再属于这个世界。你也不再关心它。"},"loop_memory_effect":"下一轮全属性+5，所有隐藏特性自动可见，但初始SAN上限-10","design_intent":"不是奖励式好结局——玩家脱离人类视角并失去人类身份"},{"id":"ending_loop_truth","name":"轮回破壁","world_outcome":"loop_truth","cost_bearer":"shared","required_conditions":["loop_count >= 5","multiple_npc_deja_vu_triggered","completed_clue_chains >= 2","discovered_loop_pollutes_world","discovered_loop_is_seal_mechanism"],"blocking_conditions":[],"npc_requirements":{"multiple_npcs":{"deja_vu_recognized":true}},"resource_requirements":{},"humanity_variants":{"humanity_high":"你终于明白了。轮回本身就是封印。你不是被困在这里——你是封印的一部分。你微笑了。这一次，你选择打破轮回。不是因为你想逃——而是因为你想让沃切斯特的人得到安宁。你走进了深渊之眼。光芒包裹了你。封印重铸了——永恒地。因为你这一次是自愿的。","humanity_fragile":"你明白了轮回的真相。你选择打破它。也许是因为你厌倦了。也许是因为你终于理解了。你走进了深渊之眼。光芒包裹了你。你不知道自己是在拯救还是在逃避。但至少——轮回结束了。","humanity_lost":"你明白了。轮回是封印。你是钥匙。你选择继续轮回——不是因为你想守护，而是因为你已经不知道如何做别的事了。你微笑了。这一次和上一次一样。也许下一次也会一样。"},"loop_memory_effect":"若选择打破轮回：下一轮为最终轮回，所有NPC初始信任+5，但SAN上限-20。若选择管理轮回：下一轮正常开始但携带全部轮回记忆。","ending_sub_branches":{"break_loop":"打破轮回——玩家进入深渊之眼，封印永恒重铸","manage_loop":"管理轮回——玩家接受自己是封印的一部分，继续循环","false_escape":"误以为逃离——玩家以为逃出了沃切斯特，但醒来时发现自己又在前往沃切斯特的路上"},"design_intent":"玩家不能掌控世界，不能救下所有人，甚至不能完全相信自己的认知，但仍然可以决定在一切失控时自己还要不要像人一样对待别人"}],"ending_judgement":{"description":"结局判定逻辑——基于world_outcome、cost_bearer、humanity_evaluation三层判定","judgement_process":[{"step":1,"action":"检查所有结局的required_conditions和blocking_conditions","result":"确定可用结局列表"},{"step":2,"action":"按priority_order选择最高优先级结局","result":"确定world_outcome"},{"step":3,"action":"根据NPC状态和玩家选择确定cost_bearer","result":"确定cost_bearer"},{"step":4,"action":"根据humanity_retained_score和npc_redemption_score确定humanity_evaluation","result":"确定结局文本温度"},{"step":5,"action":"应用humanity_variants生成最终结局文本","result":"输出结局"}],"priority_order":["ending_loop_truth","ending_transcendence","ending_abyss_consumed","ending_heretical_dawn","ending_isabella_twelfth_bell","ending_seal_player_keeper","ending_seal_hilda_choice","ending_seal_old_fisher_blood","ending_escape_by_sea","ending_evidence_escape"],"conflict_resolution":"当多个结局条件同时满足时，按优先级选择。若优先级相同，选择humanity_evaluation更高的结局。"},"deprecated_endings_archive":{"description":"旧版module7_endings，不再参与正式判定。保留供参考。","note":"以ending_definitions中的10个结局为准。","old_endings":[{"id":"ending_good_seal_restored","type":"good","name":"封印重铸","description":"你站在深渊之眼前方，手中握着从各处收集而来的线索和道具。封印的核心就在竖井底部，发出微弱但稳定的光芒。你知道如何完成仪式——莫里斯家族的记录、《扎尔之卷》的残页、古树的种子，所有碎片都在你手中拼合。你开始了仪式。低语声从四面八方涌来，试图阻止你，拉扯你的意识。但你挺住了。光芒从封印核心爆发出来，沿着竖井壁向上攀升，照亮了整个穹顶空间。那些低语声变成了尖叫，然后渐渐安静下来。当你走出墓穴时，沃切斯特变了。阳光——真实的、温暖的阳光——照在街道上。码头区的雾散了，你能看到远处的海平线。人们从家中走出来，脸上带着困惑但释然的表情。你做到了。封印重铸了。但你知道这只是暂时的——封印终将再次松动，到那时，需要另一个人来完成同样的事。但那不是今天的事了。","conditions":"SAN>30，收集所有7个关键线索道具，希尔达·莫里斯存活，完成封印仪式技能检定（神秘学≥60）","rewards":["永久解锁：封印守护者称号","永久解锁：下轮起始SAN+10","成就：深渊守望者"]},{"id":"ending_good_escape","type":"good","name":"逃离沃切斯特","description":"你意识到封印无法由你来修复——你不是莫里斯家族的人，你没有那种血脉。但你收集到了足够的情报，知道沃切斯特的危险。你选择了另一条路：离开。在老费舍的帮助下，你在黎明前登上了一艘小型渔船。当船驶离港口时，你回头看了一眼沃切斯特——灯塔的绿光正在闪烁，海面上的雾气越来越浓，你能听到从城市深处传来的隆隆声。但你已经走远了。海风吹在脸上，那是你很长时间以来第一次感受到真实的、不带恐惧的风。你活下来了。你带着真相离开了。也许有一天，你会把这些告诉需要知道的人。也许有一天，你会回来。但现在——你自由了。","conditions":"SAN>20，与老费舍信任≥3，拥有潮汐时刻表，未进入深渊墓穴","rewards":["永久解锁：逃生路线记忆","永久解锁：下轮起始道具（渔船钥匙）","成就：生还者"]},{"id":"ending_bad_consumed","type":"bad","name":"被深渊吞噬","description":"你走到了竖井的边缘，向下望去。深渊之眼在底部注视着你。它的瞳孔中映射出你无法理解的景象——无数的世界、无数的时间线、无数种可能性。你知道了。你终于知道了。人类的存在是多么渺小，人类的恐惧是多么可笑。封印不需要修复，封印从一开始就是一种傲慢。那些沉睡的存在不应该被封印，它们应该被迎接。你张开双臂，向竖井迈出了一步。坠落的过程中，你看到了一切——从宇宙的诞生到终结，从第一个细胞到最后一个黑洞。当你终于落地时，你没有感到疼痛。你感到的是平静。永恒的、无尽的平静。然后，你睁开了新的眼睛——不再是人类的眼睛——开始向上攀爬。","conditions":"SAN≤0，位于深渊墓穴","rewards":["成就：深渊的居民","永久解锁：下轮可选择'堕落者'起始（特殊角色）"]},{"id":"ending_bad_ritual","type":"bad","name":"异端的胜利","description":"你在与伊莎贝拉的对抗中失败了——或者，你选择了加入她。无论哪种方式，仪式完成了。第十三声钟响与潮汐大潮同时发生，封印核心碎裂成无数光点，向天空飞去。沃切斯特的天空裂开了——不是比喻，是字面意义上的裂开了。裂缝中涌出了一种不属于这个维度的光，照亮了整座城市。然后，声音来了。不是从某个方向传来的声音，而是从每个方向、每个维度、每个可能的现实中同时传来的声音。那是古神苏醒的宣告。海面沸腾了，城市中的每一个人同时跪倒在地，不是出于恐惧——是出于敬畏。新的时代开始了。人类的时代结束了。","conditions":"帮助伊莎贝拉完成仪式，或SAN<10时无法阻止仪式","rewards":["成就：末日的使者","永久解锁：下轮NPC初始恐惧值+20"]},{"id":"ending_neutral_madness","type":"no","name":"永恒的疯狂","description":"你没有死，你也没有离开。你就这样留在了沃切斯特，成为了这座城市的一部分。你开始在街道上游荡，向每一个路过的人讲述你在地下看到的景象。人们起初会躲开你，但渐渐地，有些人会停下来听。你的语言混乱而破碎，但其中包含着真相——可怕的、不可名状的真相。你的笔记本散落在城市的各个角落，被不同的人捡到。有些人把它们当作疯言疯语扔掉，有些人开始研究其中的内容。你不知道自己游荡了多久。季节似乎不再变化，白天和黑夜的界限变得模糊。但你知道一件事——你的眼睛看到了别人看不到的东西，而你再也无法关闭它们了。","conditions":"SAN在1-10之间，未触发任何结局条件","rewards":["成就：徘徊者","永久解锁：下轮起始时获得额外神秘学技能+10"]},{"id":"ending_hidden_transcendence","type":"hidden","name":"超越者","description":"在伊斯遗迹的核心区域，你发现了那台时间机器的残骸。经历了无数次尝试和失败，你终于让它运转了一瞬间——仅仅一瞬间。但那一瞬间足够了。你的意识被投射到了时间之外，你看到了沃切斯特的过去、现在和未来。你看到了封印的建立——那不是三千年前，而是三百万年前，由一个你从未听说过的名字的种族完成。你看到了封印的每一次松动和重铸。你看到了无数个你，在无数条时间线上，做出了不同的选择。然后你回来了。你的身体没有变化，但你的眼睛——你的眼睛里现在装着宇宙的一部分。你不再完全属于这个世界，但你也不属于深渊。你是中间的存在，超越了恐惧，超越了疯狂。封印在你面前安静了下来，仿佛认出了你。","conditions":"克苏鲁神话技能≥20，SAN>40，拥有时间碎片，在伊斯遗迹完成时间机器修复检定（数学≥70且神秘学≥60）","rewards":["永久解锁：超越者称号","永久解锁：下轮起始全属性+5","永久解锁：所有区域隐藏特性自动可见","成就：时间之外的存在"]},{"id":"ending_hidden_sacrifice","type":"hidden","name":"最后的守护者","description":"希尔达告诉你真相的时候，你已经隐约猜到了。封印需要一个活体钥匙——一个自愿将自己与封印核心绑定的人。希尔达已经为此准备了一生，但她的血脉已经稀薄到无法独自完成仪式。需要另一个人类的意志来补充。你知道这意味着什么——永恒的守望，永恒的孤独，永远无法离开沃切斯特。但你也看到了如果不这样做会发生什么。你同意了。仪式在深渊之眼完成，你和希尔达面对面站立，手牵着手，封印核心的光芒包裹了你们。当你再次睁开眼睛时，你感觉到了城市的一切——每一条街道、每一个居民、每一片海浪。你就是封印。你就是沃切斯特。你闭上了眼睛，开始了漫长的、无尽的守望。","conditions":"希尔达·莫里斯信任=5，SAN>50，拥有古树之种和扎尔之卷残页，在深渊墓穴选择牺牲选项","rewards":["永久解锁：最后的守护者称号","永久解锁：下轮起始全技能+5","永久解锁：希尔达·莫里斯在下轮初始信任+5","成就：永恒的守望"]}],"old_extensions":{"ending_condition_table":[{"ending_id":"ending_good_seal_restored","conditions":{"all":[{"stat":"SAN","op":">","value":30},{"stat":"key_items_collected","op":"==","value":7},{"stat":"npc_希尔达莫里斯","field":"alive","op":"==","value":true},{"skill_check":{"skill":"神秘学","threshold":60}}]},"priority":1},{"ending_id":"ending_good_escape","conditions":{"all":[{"stat":"SAN","op":">","value":20},{"npc_trust":{"npc":"老费舍","min_trust":3}},{"has_item":"潮汐时刻表"},{"stat":"deepest_area_danger","op":"<","value":5}]},"priority":2},{"ending_id":"ending_hidden_transcendence","conditions":{"all":[{"stat":"克苏鲁神话","op":">=","value":20},{"stat":"SAN","op":">","value":40},{"has_item":"时间碎片" lowed_imagery":["空间异常","UI矛盾","NPC记忆污染","地图连接改变","时间回声"],"forbidden_imagery":[],"focus":"地图、UI和NPC记忆开始不可靠。空间不再伪装成城市。","abnormal_examples":["你走过转角时回到了原地","NPC说出了你上周目才知道的话","存档名出现了异常"],"normal_examples":["玛莎的酒馆还在，但灯光变暗了"]},"chapter_5":{"name":"深渊低语","allowed_sensory_level":{"visual_distortion":4,"audio_intrusion":4,"input_resistance":3,"text_unreliability":4},"allowed_imagery":["一切"],"forbidden_imagery":[],"focus":"强烈感官污染、空间崩坏和结局审判。但仍需保留喘息空间。","abnormal_examples":["UI被完全污染","空间崩坏","NPC完全不可信"],"normal_examples":["即使在终局，也应有片刻的安静——例如老费舍坐在码头边看海"]}},"pacing_rule":"每个章节的异常比例不得超过horror_density_control中定义的上限。异常事件之间必须插入正常或沉默事件。"},"death_restart_text":{"description":"死亡、SAN归零、逃跑失败、NPC死亡和重开的轮回痕迹文本——死亡不是结束，而是城市重新摆放了他","text_principles":["死亡文本应带有轮回痕迹，让玩家感到城市在重新排列自己","不要只显示Game Over，让死亡本身成为叙事的一部分","不同死因应有不同的死亡文本","重开文本应反映轮回次数"],"death_types":{"physical_death":{"name":"肉体死亡","death_text":{"by_monster":["你倒在了沃切斯特的某个角落。血从伤口流出，渗入鹅卵石的缝隙。你最后看到的是雾。雾很安静。","你闭上了眼睛。你听到了潮声。很远。像是从另一个世界传来的。","你倒在了地上。地面是温的。你不知道是因为太阳，还是因为别的什么。"],"by_fall":["你坠落了。风从你身边掠过。你看到了沃切斯特的屋顶。它们很小。像玩具。","你落地了。没有疼痛。只有安静。你听到了远处的钟声。"],"by_infection":["你的身体不再听你的了。你倒在了某个地方。你闻到了海水的味道。你不在海边。","你的皮肤变成了灰蓝色。你看着自己的手。它已经不是你的了。你闭上了眼睛。"],"by_exposure":["你太冷了。你蜷缩在某个角落。你的呼吸越来越慢。你看到了自己的呼吸雾气。然后雾气散了。你也散了。"]},"restart_text":{"loop_1":"你醒来时，发现自己在沃切斯特的入口。你的头很疼。你不记得自己是怎么到这里的。你的衣服是干的。伤口不见了。","loop_2":"你醒来时，发现自己在沃切斯特的入口。你的头很疼。你好像来过这里。你的口袋里有一张纸条，上面写着：别去码头。你不记得自己写过这个。","loop_3":"你醒来时，发现自己在沃切斯特的入口。你没有头疼。你记得一切。这比头疼更糟糕。你的口袋里有三张纸条。你只写过一张。","loop_4":"你醒来时，发现自己在沃切斯特的入口。门开着。里面有人在等你。你的口袋里有一张纸条，上面是你的笔迹：这次不要相信她。","loop_5_plus":"你醒来时，发现自己在沃切斯特的入口。你已经不需要纸条了。你记得所有的路。但路变了。"}},"mental_death":{"name":"精神死亡","death_text":["你的理智碎裂了。你开始在街道上游荡，向每一个路过的人讲述你在地下看到的景象。他们躲开了你。你的笔记本散落在城市的各个角落。","你坐在教堂的长椅上。你已经不记得自己为什么在这里了。你开始数蜡烛。数到第十三根时，你停了。你笑了。","你站在码头边。你听到了歌声。从海底传来的歌声。你向前走了一步。海水没过了你的鞋子。你没有停下来。"],"restart_text":{"loop_1":"你醒来时，发现自己在沃切斯特的入口。你的笔记本不见了。你口袋里有一支铅笔。铅笔的笔尖是湿的。","loop_2":"你醒来时，发现自己在沃切斯特的入口。你的笔记本在你手里。你翻开它。最后一页写着一句话，不是你的笔迹：别再写了。","loop_3_plus":"你醒来时，发现自己在沃切斯特的入口。你的笔记本在你手里。你翻开它。每一页都写着同一句话。你的笔迹。"}},"identity_death":{"name":"身份死亡","death_text":["你看着镜子中的自己。那张脸是你的。但眼睛不是。你已经不再是调查员了。你是封印的一部分。","你醒来时，发现自己无法移动。你的身体不再属于你。你听到了希尔达的声音：对不起。你闭上了眼睛。"],"restart_text":{"loop_1":"你醒来时，发现自己在沃切斯特的入口。你看了看自己的手。手指之间没有薄膜。你松了一口气。但你不确定自己在担心什么。","loop_2_plus":"你醒来时，发现自己在沃切斯特的入口。你看了看自己的手。手指之间没有薄膜。但你的手心有一个螺旋形的印记。你不记得它什么时候出现的。"}},"time_death":{"name":"时间死亡","death_text":["你被困在了时间的缝隙中。你看到同样的日子一遍又一遍地重复。你知道这一切即将发生，但你无法改变任何事。","你听到了钟声。十三声。你数了。然后又是十三声。你数了。然后又是十三声。你已经数不清了。"],"restart_text":{"loop_1":"你醒来时，发现自己在沃切斯特的入口。你看了看怀表。时间不对。你确定你刚才还在别的地方。","loop_2_plus":"你醒来时，发现自己在沃切斯特的入口。你看了看怀表。时间不对。你已经习惯了。"}},"narrative_death":{"name":"叙事死亡","death_text":["你从未来过沃切斯特。调查员名单上没有这个名字。你的存档无法读取，因为此人并不存在。","你是一个故事。一个被讲述了太多次的故事。一个连讲述者都已经忘记的故事。"],"restart_text":{"loop_any":"你醒来时，发现自己在沃切斯特的入口。你不确定自己是谁。但你知道你要去哪里。你已经去过很多次了。"}}},"npc_death_texts":{"hilda_morris":{"text":"希尔达倒在了庄园的大厅里。肖像画的眼睛全都闭上了。你走过去时，有一幅画从墙上掉了下来。画框碎了。画布是空白的。","restart_hint":"下一轮庄园的肖像画数量少了一幅。"},"old_fisher":{"text":"你早上醒来时，码头边只有老费舍的鞋。鞋里是空的。海面很平静。你等了很久。他没有回来。","restart_hint":"下一轮码头边的鞋还在。但鞋里有水。"},"isabella_weber":{"text":"教堂的钟声响了十三下。你走进去时，伊莎贝拉倒在钟楼下。钟绳还缠在她的手腕上。蜡烛全都灭了。","restart_hint":"下一轮教堂的蜡烛比上次少了一支。"},"joshua_black":{"text":"你从墓穴出来时，约书亚不在灯塔入口。入口的墙上写满了同一个词：醒了。醒了。醒了。你数了数。一共四十七遍。","restart_hint":"下一轮灯塔入口的墙上仍然有字。但字迹更新了。"},"martha_grey":{"text":"你早上醒来时，酒馆的门是开的。玛莎不在。角落那张空桌上放着一杯酒，酒还是温的。你等了很久。她没有回来。","restart_hint":"下一轮酒馆还在。但角落那张空桌上没有酒杯了。"},"tommy_chen":{"text":"你在暗房里找到了汤米。他的相机掉在地上。镜头碎了。他的眼睛睁着，但瞳孔已经扩散了。他最后一张照片还在显影液里。你没有去看那张照片。","restart_hint":"下一轮汤米的相机还在暗房里。但镜头是完好的。"},"elias_ward":{"text":"教授倒在了他的研究室里。桌上摊开着一本笔记。最后一页只写了一行字：我终于理解了。墨迹还没有干。","restart_hint":"下一轮教授的笔记还在桌上。但最后一页是空白的。"}},"escape_failure_text":{"text":"你试图逃离沃切斯特。你走到了城市的边缘。雾很浓。你走了很久。当你走出雾时，你发现自己又回到了镇中心。你看了看怀表。时间没有变。","restart_hint":"下一轮城市的边缘仍然有雾。但雾的形状不同了。"}},"silent_events":{"description":"无奖励、无解释、无功能悲伤事件——不是所有事件都要给道具、线索、战斗、数值或主线推进。有些事件只负责让世界更真实、更冷。","principle":"沉默事件没有任何数值奖励，不推进主线，不提供线索。它们只是存在。像缺席的人一样存在。","event_pool":[{"id":"silent_harbor_children_shoes","name":"码头儿童鞋","location":"harbor_district","trigger_condition":"always","text":"你在码头边看到一双儿童鞋，整齐地摆在水边。鞋里没有水。你站了一会儿。什么也没有发生。","mechanical_effect":null,"emotional_function":"让玩家感到失踪案不是数字，而是缺席的人","repeat_behavior":"only_once"},{"id":"silent_safehouse_empty_chair","name":"酒馆空椅子","location":"safehouse","trigger_condition":"always","text":"玛莎照例给角落那张空桌倒了一杯酒。你看见杯沿有水痕。玛莎没有看那边。","mechanical_effect":null,"emotional_function":"暗示玛莎的丈夫仍在某种意义上'在场'","repeat_behavior":"daily"},{"id":"silent_manor_reversed_portrait","name":"庄园翻反的画","location":"voxchester_manor","trigger_condition":"corruption>=30","text":"你经过大厅时，有一幅肖像被人翻向墙面。希尔达说不是她做的。画框后面很潮。","mechanical_effect":{"san":-1},"emotional_function":"暗示庄园有自己的意志","repeat_behavior":"only_once"},{"id":"silent_church_unsent_letter","name":"教堂未寄出的信","location":"catacombs_entrance","trigger_condition":"always","text":"长椅下有一封没有收件人的信。纸已经软了，只剩一句话还能看清：如果我回来时不像我，请不要开门。","mechanical_effect":null,"emotional_function":"让玩家思考'被改变的人还是不是同一个人'","repeat_behavior":"only_once"},{"id":"silent_forest_silent_birds","name":"森林无声鸟群","location":"whispering_forest","trigger_condition":"always","text":"树上停满了鸟。它们没有叫，也没有飞。你走过时，它们一起闭上眼。","mechanical_effect":{"san":-1},"emotional_function":"森林在观察玩家，但不干预","repeat_behavior":"only_once"},{"id":"silent_town_clock_stopped","name":"镇中心停摆的钟","location":"town_center","trigger_condition":"day>=3","text":"你路过钟表店时，橱窗里所有的钟同时停止了。你看了三秒。它们又开始走了。但时间不对——每只钟显示的都不一样。","mechanical_effect":null,"emotional_function":"时间在沃切斯特不可靠","repeat_behavior":"only_once"},{"id":"silent_harbor_wet_cup","name":"码头湿杯子","location":"harbor_district","trigger_condition":"always","text":"码头边的长椅上放着一个杯子。杯子里有半杯水。你没有碰它。你走过去又走回来时，杯子还在那里。水位高了一点。","mechanical_effect":null,"emotional_function":"水在不该出现的地方自己增加","repeat_behavior":"only_once"},{"id":"silent_manor_empty_room","name":"庄园空房间","location":"voxchester_manor","trigger_condition":"always","text":"你推开一扇门。房间里什么都没有。但床上有人躺过的痕迹。枕头是温的。","mechanical_effect":{"san":-1},"emotional_function":"有人刚刚离开，但你不知道是谁","repeat_behavior":"only_once"},{"id":"silent_church_extra_candle","name":"教堂多出的蜡烛","location":"town_center","trigger_condition":"day>=5","text":"你走进教堂时，烛台上多了一支蜡烛。火焰朝没有风的方向倾斜。伊莎贝拉说她没有点过它。","mechanical_effect":null,"emotional_function":"有别的什么东西在教堂里祈祷","repeat_behavior":"only_once"},{"id":"silent_forest_footprints_ahead","name":"森林前方的脚印","location":"whispering_forest","trigger_condition":"always","text":"你在森林里走着。前方的泥地上有脚印。鞋码和你的一样。但脚印的方向是朝你走来的。你没有遇到任何人。","mechanical_effect":{"san":-2},"emotional_function":"另一个你正在走你即将走的路","repeat_behavior":"only_once"},{"id":"silent_lighthouse_wet_handrail","name":"灯塔湿扶手","location":"lighthouse","trigger_condition":"always","text":"你扶着灯塔楼梯的扶手往上走。扶手是湿的。你看了看手心，没有水。但扶手上留下了你的指印。","mechanical_effect":null,"emotional_function":"灯塔在回应你的触碰","repeat_behavior":"only_once"},{"id":"silent_catacombs_breath_wall","name":"墓穴呼吸的墙","location":"catacombs_entrance","trigger_condition":"always","text":"你把手放在墓穴的墙壁上。墙是温的。你把手移开时，墙壁微微凹陷，像是在挽留你。","mechanical_effect":{"san":-1},"emotional_function":"墓穴是活的","repeat_behavior":"only_once"},{"id":"silent_safehouse_cold_tea","name":"安全屋冷掉的茶","location":"safehouse","trigger_condition":"day>=4","text":"你回到安全屋时，桌上放着一杯茶。茶是冷的。你不记得自己泡过它。玛莎说她也没有。","mechanical_effect":null,"emotional_function":"有人在你不在时来过","repeat_behavior":"only_once"},{"id":"silent_town_new_graffiti","name":"镇中心新涂鸦","location":"town_center","trigger_condition":"day>=2","text":"墙上出现了昨天还没有的螺旋形涂鸦。颜料还是湿的。你问路人，他们说什么都没看到。","mechanical_effect":null,"emotional_function":"有些东西只有玩家能看到","repeat_behavior":"only_once"},{"id":"silent_harbor_bell_sound","name":"码头的钟声","location":"harbor_district","trigger_condition":"time==evening","text":"你站在码头边。远处传来钟声。你数了十二下。然后安静了。你等了很久。第十三声没有来。也许它来过了，只是你没有听到。","mechanical_effect":null,"emotional_function":"第十三声钟响在玩家不知道的时候可能已经发生过","repeat_behavior":"daily"},{"id":"silent_manor_mirror","name":"庄园镜子","location":"voxchester_manor","trigger_condition":"always","text":"你路过一面镜子。镜子里的你比你慢了一步。你停下来。镜子里的你也停了。但它的嘴角还在动。","mechanical_effect":{"san":-2},"emotional_function":"镜中的你有自己的意志","repeat_behavior":"only_once"},{"id":"silent_church_prayer_book","name":"教堂祈祷书","location":"town_center","trigger_condition":"always","text":"你翻开教堂的祈祷书。书页上有人用铅笔写了一行字。字迹很轻，几乎看不清：请不要让我回来。","mechanical_effect":null,"emotional_function":"有人在你之前也害怕过同样的事","repeat_behavior":"only_once"},{"id":"silent_forest_broken_branch","name":"森林折断的树枝","location":"whispering_forest","trigger_condition":"always","text":"一根树枝从高处落下，插在你面前的泥地里。你抬头看，树上什么都没有。树枝的断口是新鲜的，但没有汁液。像是被什么东西咬断的。","mechanical_effect":null,"emotional_function":"森林里有东西在移动，但你看不到","repeat_behavior":"only_once"},{"id":"silent_lighthouse_old_photo","name":"灯塔旧照片","location":"lighthouse","trigger_condition":"always","text":"灯室角落有一张泛黄的照片。照片上是灯塔完好的样子。照片背面写着一行字，墨迹已经模糊，只剩两个字可以辨认：救我。","mechanical_effect":null,"emotional_function":"以诺·沃特在消失前留下过求助信号","repeat_behavior":"only_once"},{"id":"silent_catacombs_water_drip","name":"墓穴温水滴","location":"catacombs_entrance","trigger_condition":"always","text":"天花板滴下一滴水，落在你手上。是温的。你闻了闻，有铁锈的气味。你抬头看，天花板是干的。","mechanical_effect":{"san":-1},"emotional_function":"水从不存在的地方滴落","repeat_behavior":"only_once"}]},"loop_text_variants":{"description":"多周目重复但变化的文本机制——世界逐渐认出玩家","design_principle":"轮回知识应同时是成长和污染。玩家越理解规律，世界越主动躲避、误导、重组自己。","npc_variants":{"martha_grey":{"loop_1":"玛莎擦着杯子，抬头看了你一眼：外乡人？这个季节可没人来沃切斯特。","loop_2":"玛莎擦着杯子，抬头看了你一眼：外乡人？不，我是不是说过这句话？","loop_3":"玛莎没有抬头。这个季节可没人来沃切斯特。除了你。","loop_4":"你推门前，已经听见里面有人说：他来了。","loop_5_plus":"玛莎给你倒了一杯酒。你没有点单。她也没有问。"},"old_fisher":{"loop_1":"老费舍坐在码头边，看着海面。他没有理你。","loop_2":"老费舍坐在码头边。你走近时，他说：你又来了。海记得你。","loop_3":"老费舍没有坐在码头边。但他的位置是湿的。","loop_4":"你到码头时，老费舍已经在等你。他什么也没说，只是看着你的鞋子。","loop_5_plus":"老费舍脱下了鞋。你已经看过他的脚了。他知道你知道。"},"hilda_morris":{"loop_1":"希尔达站在门口。你来做什么？","loop_2":"希尔达站在门口。你的眼神你来过这里。","loop_3":"希尔达没有站在门口。门是开的。你走进去时，听到楼上有人在翻找什么东西。","loop_4":"你到庄园时，希尔达坐在大厅里。她在等你。她面前放着两杯茶。","loop_5_plus":"希尔达看着你。这一次，你会让我自己选吗？"},"isabella_weber":{"loop_1":"伊莎贝拉微笑着引导你做祷告。","loop_2":"伊莎贝拉微笑着引导你做祷告。她的微笑和上次一模一样。完全一模一样。","loop_3":"伊莎贝拉没有微笑。你来了。她的声音很疲惫。","loop_4":"你推开教堂门时，伊莎贝拉已经在等你。钟绳在她手中。她看着你，像是在等你说什么。","loop_5_plus":"伊莎贝拉闭上了眼。你不用说了。我知道你要说什么。"},"joshua_black":{"loop_1":"约书亚蜷缩在码头角落。他看到你时尖叫了一声。","loop_2":"约书亚看到你时安静了。他的眼睛清醒了一瞬间。你来过。你上次来过。","loop_3":"约书亚没有尖叫。他看着你，像是在辨认一张模糊的照片。","loop_4":"约书亚站起来。带我去。他的声音很平静。你知道他要去哪里。","loop_5_plus":"约书亚已经在灯塔入口等你。这次我看着门。"},"elias_ward":{"loop_1":"教授看着你的眼神充满警惕。","loop_2":"教授看着你。你的眼神像是在看一个你已经知道结局的故事。","loop_3":"教授没有看你。他在翻一本笔记。笔记上写着你的名字。你确定那不是你的笔记。","loop_4":"教授合上笔记。你又来了。这一次，你准备好听我说完了吗？","loop_5_plus":"教授把笔记递给你。你已经看过了。但这次的内容不一样。"}},"location_variants":{"town_center":{"loop_1":"鹅卵石街道在雨后泛着暗沉的光泽。市政厅前的广场上矗立着一座建城者雕像。","loop_2":"鹅卵石街道在雨后泛着暗沉的光泽。你走过雕像时，觉得它的姿势和上次不太一样。","loop_3":"广场上的雕像面向大海。你确定它上次不是这个方向。","loop_4":"你到达镇中心时，广场上空无一人。雕像不见了。你问路人，他们说这里从来没有雕像。","loop_5_plus":"镇中心。你不需要描述它了。你已经来过太多次。"},"harbor_district":{"loop_1":"浓重的海雾终年不散。码头的木板在脚下发出腐朽的呻吟。","loop_2":"码头的木板在脚下发出呻吟。你注意到有几块木板的磨损位置和上次不同。","loop_3":"码头的栈桥少了一座。你问玛莎，她说一直都是两座。","loop_4":"码头的雾比以往任何时候都浓。你走进雾里，走出来时发现自己回到了原点。","loop_5_plus":"码头。你闭上眼也能走。但你睁开眼时，路变了。"},"lighthouse":{"loop_1":"灯塔矗立在海角上。塔内的螺旋楼梯通向顶部的灯室。","loop_2":"灯塔的螺旋楼梯。你数了台阶。和上次不一样。","loop_3":"灯塔的楼梯比你记忆中更长了。你走了很久才到灯室。灯室里的透镜碎片和上次排列不同。","loop_4":"灯塔。你已经不需要楼梯了。你发现自己直接站在灯室里。","loop_5_plus":"灯塔认出了你。门在你走近之前就开了。"},"voxchester_manor":{"loop_1":"庄园矗立在山丘上。哥特式宅邸在阴沉的天空下如同指向某种不可名状之物的手指。","loop_2":"庄园的大门。你注意到门上的纹章和上次不同。你确定上次是什么图案吗？","loop_3":"庄园的大厅。肖像画的位置变了。你不确定是希尔达移动的，还是它们自己移动的。","loop_4":"你走进庄园时，大厅里所有的肖像画都面向墙壁。你没有翻转它们。希尔达说她也没有。","loop_5_plus":"庄园已经不需要伪装了。走廊直接通向地下室。你不需要找暗门。"}},"death_restart_text":{"loop_1":"你醒来时，发现自己在沃切斯特的入口。你的头很疼。你不记得自己是怎么到这里的。","loop_2":"你醒来时，发现自己在沃切斯特的入口。你的头很疼。你好像来过这里。","loop_3":"你醒来时，发现自己在沃切斯特的入口。你没有头疼。你记得一切。这比头疼更糟糕。","loop_4":"你醒来时，发现自己在沃切斯特的入口。你口袋里有一张纸条，上面是你的笔迹：别相信灯塔。","loop_5_plus":"你醒来时，发现自己在沃切斯特的入口。门开着。里面有人在等你。"}},"npc_redemption":{"description":"NPC救赎的动作化表现——通过小动作、沉默、重复行为的改变来表现，不要长篇煽情独白","principle":"救赎不等于活下来。救赎不等于变好。救赎是NPC在不可逆腐化中，仍然有一次作为人的选择。","characters":{"hilda_morris":{"normal_behavior":"她在庄园中徘徊，偶尔看向祖先肖像画","corrupted_behavior":"夜晚用非人类语言低语，在走廊中游荡","redemption_trigger":"停止寻找替身，以自己的意志面对家族诅咒","redemption_action":"她把庄园祖先肖像一幅幅翻过去，不再被家族观看","redemption_text":"希尔达没有祈祷。她只是走过大厅，把每一幅祖先肖像翻向墙面。最后一幅画翻过去时，庄园安静得像一口合上的棺。","no_monologue":true,"ending_hook":"ending_seal_hilda_choice","failure_variant":"她在你睡着时把你绑在封印核心。你醒来时，她已经不在了。庄园的肖像画全都面向墙壁。"},"old_fisher":{"normal_behavior":"坐在码头边看着海面，偶尔低声说话","corrupted_behavior":"深夜走向大海，皮肤大面积变为灰绿色","redemption_trigger":"在彻底归海前做最后一件属于人的事","redemption_action":"他终于脱下鞋，让玩家看见已经非人的脚，然后平静地交出钥匙之血","redemption_text":"老费舍坐在码头边，第一次在人前脱下鞋。脚趾之间的薄膜在月光下轻轻张开。他没有解释，只把刀递给你：趁我还知道疼。","no_monologue":true,"ending_hook":"ending_seal_old_fisher_blood","failure_variant":"你早上醒来时，码头边只有他的鞋。鞋里是空的。海面很平静。"},"isabella_weber":{"normal_behavior":"在教堂祈祷，敲响十三声钟","corrupted_behavior":"用非人类语言祈祷，皮肤下出现蠕动纹路","redemption_trigger":"亲手否定自己信奉的神谕","redemption_action":"她敲完第十二声钟后松开钟绳，第一次拒绝回应所谓神明","redemption_text":"第十二声落下后，整座教堂都在等待。钟绳在伊莎贝拉掌心颤抖。她闭上眼，松开了手。第十三声没有来。","no_monologue":true,"ending_hook":"ending_isabella_twelfth_bell","failure_variant":"她敲了第十三声。你站在教堂门口，看着她的背影。她的影子比她高出很多。"},"martha_grey":{"normal_behavior":"擦杯子，给空桌倒酒，和客人聊天","corrupted_behavior":"在酒中下药，眼睛偶尔闪过金色","redemption_trigger":"承认归来的东西已不再是丈夫，选择保护活人","redemption_action":"她烧掉走私通道里的深潜者标记，把酒馆门闩从里面扣死","redemption_text":"玛莎没有哭。她把丈夫的照片从墙上摘下来，放进抽屉里。然后她走下楼，把走私通道的标记点着了。火光照亮了她的脸。她把门闩从里面扣死了。","no_monologue":true,"ending_hook":"ending_escape_by_sea","failure_variant":"你早上醒来时，酒馆的门是开的。玛莎不在。角落那张空桌上放着一杯酒，酒还是温的。"},"joshua_black":{"normal_behavior":"蜷缩在角落，时而清醒时而癫狂","corrupted_behavior":"癫狂发作，尖叫着扑向看不见的东西","redemption_trigger":"不再逃离灯塔，重新成为守望者","redemption_action":"他守住灯塔地下入口，不再喊它醒了，而是对玩家说这次我看着门","redemption_text":"约书亚站在灯塔入口。他的手在发抖。但他的声音很平静。这次我看着门。你走下去时，听到他在身后轻声说：别怕。我在。","no_monologue":true,"ending_hook":"ending_seal_player_keeper","failure_variant":"你从墓穴出来时，约书亚不在灯塔入口。入口的墙上写满了同一个词：醒了。醒了。醒了。"}}},"map_surrealism":{"description":"随机地图的审美逻辑——沃切斯特不是城市，而是一座封印装置。玩家越接近真相，城市越不再伪装成人类能理解的街区。","progression_phases":{"phase_1_city":{"name":"城市伪装期","corruption_range":[0,30],"description":"早期城市应像正常城市","connections":["镇中心连接码头、森林、庄园","酒馆是安全屋","教堂在镇中心","灯塔在码头远端"],"map_randomizatio
