{id:"loop_whisper_001",name:"熟悉的声音",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","early"],trigger:{areas:["town_center"],min_loop:2,probability:0.3,once_per_run:true},description:"你经过公告栏时，一个声音从你背后传来——音色和你自己的一模一样：「你又选了这条路。」\n你转身。没有人。\n公告栏上多了一张告示，墨迹还没干。上面是你的笔迹。",effects:{san:-1,mythos:1},event_classification:"轻微异常",normalcy_anchor:false,choices:[]},{id:"loop_whisper_002",name:"重复的脚步",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","harbor"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.25,once_per_run:true},description:"码头的木板在你脚下嘎吱作响。你停下脚步，但嘎吱声又响了一次。\n不是回声。节奏不对。\n像是有人在你身后，踩着和你完全相同的步伐，但慢了半拍。",effects:{san:-1},event_classification:"轻微异常",normalcy_anchor:false,choices:[]},{id:"loop_whisper_003",name:"未写完的信",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","safehouse"],trigger:{areas:["town_center"],min_loop:2,probability:0.2,once_per_run:true},description:"你在安全屋的桌上发现一封信。笔迹是你的。\n开头写着：「如果你又读到这封信——」\n后面的内容被水渍模糊了。你没有写过这封信的记忆。\n纸张的折痕说明它已经被打开过很多次。",effects:{san:-1,add_clue:"clue_loop_letter"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_whisper_004",name:"钟表的异常",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","time"],trigger:{areas:["town_center","harbor_district"],min_loop:2,probability:0.25,once_per_run:true},description:"怀表停了。你拧了拧表冠，秒针开始倒转。\n你盯着它看了整整一分钟。它确实在倒着走。\n然后它突然恢复正常，仿佛什么都没发生。表盘上多了一道细小的裂纹，上次没有的。",effects:{san:-1},event_classification:"轻微异常",normalcy_anchor:false,choices:[]},{id:"loop_whisper_005",name:"镜中的延迟",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","mirror"],trigger:{areas:["voxchester_manor","town_center"],min_loop:3,probability:0.2,once_per_run:true},description:"你在镜子里看到了自己。你抬起右手，镜像也抬起了右手。\n你放下手。镜像没有。\n它又举了两秒，然后缓缓放下。嘴角似乎动了一下。\n你眨了眨眼，一切恢复正常。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_whisper_006",name:"旧报纸",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","clue"],trigger:{areas:["town_center"],min_loop:2,probability:0.3,once_per_run:true},description:"你从地上捡起一张报纸。日期是今天的。\n头版标题：《沃切斯特失踪案调查员被发现死于码头》\n配图是一个人的背影。穿着和你现在一样的外套。\n你把报纸翻过来。背面是空白的，除了一个手写的数字——和你当前的周目数一样。",effects:{san:-1,add_clue:"clue_loop_newspaper"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_whisper_007",name:"汤米的困惑",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","npc"],trigger:{areas:["town_center"],min_loop:3,probability:0.2,once_per_run:true,npc_alive:["汤米·陈"]},description:"汤米看到你时愣了一下。\n「你……你昨天不是走了吗？我看到你坐上了去波士顿的长途车。」\n你告诉他你没有离开过。\n他揉了揉眼睛：「也许我记错了。最近总觉得日子过得……重叠。」",effects:{san:-1},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_whisper_008",name:"玛莎的回避",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","npc"],trigger:{areas:["harbor_district"],min_loop:3,probability:0.2,once_per_run:true,npc_alive:["玛莎·格雷"]},description:"你走进酒吧。玛莎看到你时，手指在吧台上敲了三下——一种无意识的节奏。\n「又来了，」她说，然后立刻改口，「我是说，欢迎。」\n她给你倒了一杯酒，手微微发抖。\n「你让我想起一个人。一个总是回来的人。」",effects:{san:-1},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_whisper_009",name:"重复的梦",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","rest"],trigger:{areas:["town_center","harbor_district"],min_loop:2,probability:0.2,time_phase:["midnight"],once_per_run:true},description:"你在半梦半醒间听到一个声音在数数。\n「一。二。三。四。五——」\n每数一个数字，你感到身体轻了一点。\n「六。」\n你猛地睁开眼。安全屋的墙壁上，有人用指甲刮出了六道竖痕。你的指甲缝里有石灰粉。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_whisper_010",name:"地图上的标注",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","map"],trigger:{areas:["town_center"],min_loop:3,probability:0.2,once_per_run:true},description:"你打开笔记本查看地图。上面多了一些标注——红色的叉号标记着你上次死亡的位置。\n你没有画过这些。\n笔迹确实是你的，但墨水的颜色比你用的更深，像是被什么东西浸染过。",effects:{san:-1,add_clue:"clue_loop_map_marks"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_whisper_011",name:"渔夫的低语",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","npc"],trigger:{areas:["harbor_district"],min_loop:3,probability:0.2,once_per_run:true,npc_alive:["老费舍"]},description:"老费舍坐在码头边补网。你走近时，他没有抬头。\n「第几次了？」他问。\n你问他什么意思。\n「没什么。只是……你身上的雾气比别人重。像是走过很多次同样的路。」\n他继续补网，手指灵活得不像一个老人。",effects:{san:-1},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_whisper_012",name:"重复的对话",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","npc"],trigger:{areas:["town_center"],min_loop:4,probability:0.15,once_per_run:true,npc_alive:["伊莱亚斯·沃德"]},description:"伊莱亚斯看到你，话说到一半突然停住。\n「……我刚才说过这些话，对吗？」\n你告诉他没有。\n「奇怪。我记得很清楚。你问了一个关于封印的问题，然后——」他揉了揉太阳穴，「算了。也许是我太累了。最近总是分不清记忆和……别的什么。」",effects:{san:-1},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_whisper_013",name:"脚印",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","forest"],trigger:{areas:["whispering_forest"],min_loop:2,probability:0.2,once_per_run:true},description:"雨后的泥地上有一串脚印。你蹲下来仔细看。\n鞋底的纹路和你的一模一样。\n脚印从你站的位置开始，向前延伸了十几步，然后突然消失——像是走路的人凭空蒸发了。\n你低头看了看自己的鞋。鞋底是干的。",effects:{san:-1},event_classification:"轻微异常",normalcy_anchor:false,choices:[]},{id:"loop_whisper_014",name:"回声",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","catacombs"],trigger:{areas:["catacombs_entrance"],min_loop:3,probability:0.2,once_per_run:true},description:"你在墓穴入口喊了一声。回声传来——但回声说的是不同的话。\n你喊的是「有人吗？」\n回声说的是「又来了。」\n你又喊了一次。这次没有回声。沉默持续了太久，久到你开始怀疑自己刚才是不是真的喊过。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_whisper_015",name:"照片的增减",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","photo"],trigger:{areas:["town_center"],min_loop:2,probability:0.2,once_per_run:true,npc_alive:["汤米·陈"]},description:"汤米给你看了一张照片。是码头的全景。\n「数数船，」他说。\n你数了。六艘。\n「你上次来的时候也是六艘。但我拍的时候只有五艘。」\n他翻出之前的照片给你看。确实是五艘。多出来的那艘船，你认出了它的名字——是你上一周目死前最后看到的那艘。",effects:{san:-2,add_clue:"clue_loop_photo_boat"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_whisper_016",name:"教堂的钟声",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","church"],trigger:{areas:["town_center"],min_loop:2,probability:0.25,time_phase:["evening","midnight"],once_per_run:true},description:"教堂的钟响了。\n你数了一下。十三下。\n然后又响了十三下。\n你等了一会儿。没有第三次。\n伊莎贝拉从教堂里走出来，看到你站在原地。\n「你听到了？」她问。\n你点头。\n「只有回来过的人才会听到第二次。」",effects:{san:-1,add_clue:"clue_loop_bell"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_whisper_017",name:"被覆盖的涂鸦",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","wall"],trigger:{areas:["harbor_district","town_center"],min_loop:3,probability:0.2,once_per_run:true},description:"墙上有一片新刷的白漆。漆面还没完全干。\n你用指甲抠了一下。底下有字。\n是一句话，反复写了十几遍，字迹越来越潦草：\n「不要去灯塔。不要去灯塔。不要去灯塔。不要去灯塔。」\n最后几行变成了另一种笔迹。你的笔迹。",effects:{san:-1,add_clue:"clue_loop_wall_writing"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_whisper_018",name:"怀表的温度",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","item"],trigger:{areas:["town_center","harbor_district","whispering_forest"],min_loop:2,probability:0.2,once_per_run:true},description:"怀表突然变得很烫。你把它拿出来，表壳上的温度足以灼伤手指。\n表盘上的数字在融化——不是真的融化，但看起来像是被高温扭曲。\n你闭上眼睛再睁开。怀表是凉的，表盘正常。但你的指尖确实有一小块红肿。",effects:{san:-1,hp:-1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_whisper_019",name:"记错的路",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","navigation"],trigger:{areas:["whispering_forest"],min_loop:4,probability:0.2,once_per_run:true},description:"你确信这条路通往禁忌之林。你走过很多次了。\n但走了二十分钟后，你回到了起点。\n树上有一道你刚才刻下的标记——用来确认方向的那道。\n你没有转弯。你一直走的是直线。\n你又走了一次。这次用了三十分钟回到了起点。距离变长了。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_whisper_020",name:"告示栏的增生",type:"loop_locked",subtype:"loop_whisper",weight:1,tier:"normal",tags:["loop","whisper","notice"],trigger:{areas:["town_center"],min_loop:5,probability:0.15,once_per_run:true},description:"公告栏上的失踪告示变多了。你仔细数了一下——比昨天多了七张。\n每张告示上都是同一个人的名字。你的名字。\n日期各不相同，横跨了三年。\n你伸手去撕。告示粘得很牢，像是长在了木板上。\n旁边路过的人什么也没注意到。",effects:{san:-2,add_clue:"clue_loop_missing_posters"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"loop_memory_001",name:"礁石上的名字",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","harbor"],trigger:{areas:["harbor_district"],min_loop:3,requires_prev_area_death:"harbor_district",probability:0.4,once_per_run:true},description:"你在码头看到一块礁石。上面刻着你的名字和一个日期。\n日期是你上一轮死亡的那天。\n刻痕很旧，像是被海水冲刷了很多年。但你上周目才第一次来这个码头。\n你用手指摸了摸刻痕。石头是温热的。",effects:{san:-2,add_clue:"clue_memory_rock"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_002",name:"血迹的位置",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","forest"],trigger:{areas:["whispering_forest"],min_loop:3,requires_prev_area_death:"whispering_forest",probability:0.4,once_per_run:true},description:"地面上有一片深色的污渍。你蹲下来闻了闻——是血，已经干涸很久了。\n但你认出了这个位置。上周目你就是在这里倒下的。\n污渍的形状和你记忆中倒下的姿势完全吻合。\n你抬头看了看树。树干上有一道新的抓痕。",effects:{san:-2,add_clue:"clue_memory_blood"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_003",name:"断裂的武器",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","manor"],trigger:{areas:["voxchester_manor"],min_loop:3,requires_prev_area_death:"voxchester_manor",probability:0.35,once_per_run:true},description:"走廊角落里有一把断裂的刀。刀柄上缠着和你外套相同颜色的布条。\n你摸了摸自己的外套——下摆确实少了一块，切口整齐，像是被利刃割断的。\n你没有这把刀的记忆。但你的手握上刀柄时，姿势异常熟练。",effects:{san:-2,add_clue:"clue_memory_blade"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_004",name:"地下的蜡烛",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","catacombs"],trigger:{areas:["catacombs_entrance"],min_loop:3,requires_prev_area_death:"catacombs_entrance",probability:0.35,once_per_run:true},description:"墓穴墙壁的缝隙里插着一根蜡烛。蜡油已经凝固成层层叠叠的形状。\n你数了一下蜡油的层数——和你的周目数一样。\n最底层的蜡油里封着一张纸条。你小心翼翼地剥开。\n纸条上只有一句话：「这次带够了蜡烛吗？」",effects:{san:-2,add_clue:"clue_memory_candle"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_005",name:"灯塔的划痕",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","lighthouse"],trigger:{areas:["lighthouse"],min_loop:3,requires_prev_area_death:"lighthouse",probability:0.35,once_per_run:true},description:"灯塔的螺旋楼梯扶手上有一道道划痕。你用手指划过——间距和你的指距完全一致。\n楼梯转角处的墙壁上刻着一个数字。是你上次死在灯塔时的天数。\n你继续往上走。每一层都有一个新的数字，像是倒计时。",effects:{san:-2,add_clue:"clue_memory_lighthouse_marks"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_006",name:"树洞里的东西",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","forest"],trigger:{areas:["whispering_forest"],min_loop:4,requires_prev_area_death:"whispering_forest",probability:0.3,once_per_run:true},description:"一棵老橡树的树洞里塞着一个布包。你打开它。\n里面是你的笔记本——但不是你手上的这本。封面磨损更严重，内页写满了你的笔迹。\n最后一页写着：「第三次了。每次都在这里停下来。为什么？」\n你翻回第一页。日期是未来的。",effects:{san:-3,add_clue:"clue_memory_notebook_copy",mythos:2},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_007",name:"码头的绳结",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","harbor"],trigger:{areas:["harbor_district"],min_loop:3,requires_prev_area_death:"harbor_district",probability:0.3,once_per_run:true},description:"系缆桩上有一个绳结。你认出了打法——是海军陆战队常用的系泊结。\n你不会打这种结。但你的手在碰到绳子时自动完成了动作。\n绳结里缠着一张照片。照片上是码头，但角度是从水面向上拍的。\n拍照的人在水里。",effects:{san:-2,add_clue:"clue_memory_knot_photo"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_008",name:"庄园的门牌",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","manor"],trigger:{areas:["voxchester_manor"],min_loop:4,requires_prev_area_death:"voxchester_manor",probability:0.3,once_per_run:true},description:"庄园侧门的门牌翻了过来。你伸手把它翻正。\n背面刻着你的名字。不是写上去的——是用什么工具深深凿进木头里的。\n门牌的正面是正常的房间号码。但你发现这个号码和你上次在庄园死去的房间号一样。",effects:{san:-2,add_clue:"clue_memory_door_number"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_009",name:"深渊的回音",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","deep"],trigger:{areas:["deep_catacombs"],min_loop:4,requires_prev_area_death:"deep_catacombs",probability:0.3,once_per_run:true},description:"竖井深处传来声音。不是回声——是有人在说话。\n你听到了自己的声音，说的是一句你完全不记得说过的话：\n「如果这次还不行，我会在第七天去灯塔。」\n声音停了。竖井里吹上来一阵风，带着海水和铁锈的气味。\n你知道自己从未去过灯塔。至少这一周目没有。",effects:{san:-3,mythos:2,add_clue:"clue_memory_abyss_voice"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_memory_010",name:"遗迹的投影",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","yith"],trigger:{areas:["ruins_of_yith"],min_loop:4,requires_prev_area_death:"ruins_of_yith",probability:0.3,once_per_run:true},description:"伊斯机器的表面泛起一层涟漪。你看到了一段影像——\n是你自己，站在同一个位置，但穿着不同的衣服。你在影像里做了一个手势，然后影像消失了。\n你下意识地重复了那个手势。机器亮了一下。\n一道光从机器里射出，在你手心留下了一个发烫的符号。",effects:{san:-3,mythos:3,add_clue:"clue_memory_yith_projection"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_memory_011",name:"禁林的记号",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","grove"],trigger:{areas:["forbidden_grove"],min_loop:4,requires_prev_area_death:"forbidden_grove",probability:0.3,once_per_run:true},description:"一棵古树的树皮被剥去了一块。裸露的木质上刻着符号。\n你认出了这些符号——不是因为你学过，而是因为你的手记得刻它们的感觉。\n符号排列成一个圆环，中间有一个空缺。\n你口袋里的某样东西正好能嵌入那个空缺。",effects:{san:-2,mythos:2,add_clue:"clue_memory_grove_symbol"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_012",name:"安全屋的记号",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","safehouse"],trigger:{areas:["town_center"],min_loop:3,probability:0.25,once_per_run:true},description:"你检查安全屋的门框。上面有一道浅浅的刻痕。\n你用手指量了一下——正好是你食指的长度。\n你确信上周目你在这里做了这个记号。但那是为了什么？\n门框下方还有一行小字，需要蹲下才能看到：「门会换位置。」",effects:{san:-1,add_clue:"clue_memory_safehouse_mark"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_013",name:"伊莱亚斯的笔记",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","npc"],trigger:{areas:["town_center"],min_loop:3,probability:0.2,once_per_run:true,npc_alive:["伊莱亚斯·沃德"]},description:"伊莱亚斯递给你一张纸。\n「这个掉在了我的书桌上。不是我写的。」\n纸上是你的笔迹。记录着一个仪式的步骤——你从未学过的仪式。\n但你的身体记得每一个动作。你的舌尖能尝到仪式中使用的草药味道。\n你上周目一定做过这个仪式。",effects:{san:-2,add_clue:"clue_memory_ritual_notes",mythos:1},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_memory_014",name:"水中的倒影",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","water"],trigger:{areas:["harbor_district"],min_loop:3,probability:0.25,once_per_run:true,time_phase:["midnight"]},description:"你走到码头边缘，低头看水。\n水面映出了你的脸。但倒影里的你穿着不同的衣服，脸上多了一道伤疤。\n倒影动了——它抬起手，在水面上写了什么。\n你只能看清最后一个字：「逃。」\n然后水面恢复了平静。你的倒影和你一样了。",effects:{san:-2,add_clue:"clue_memory_water_reflection"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_memory_015",name:"灰尘中的脚印",type:"loop_locked",subtype:"memory_fragment",weight:1,tier:"rare",tags:["loop","memory","manor"],trigger:{areas:["voxchester_manor"],min_loop:3,probability:0.25,once_per_run:true},description:"你推开一扇积满灰尘的门。地板上的灰尘里有脚印。\n你低头看了看自己的鞋。纹路完全吻合。\n脚印在房间中央转了一个圈，然后走向窗户。窗户是锁着的。\n你试着打开窗户。窗外是庄园的后花园——但花园里的植物全部枯死了，像是被什么东西吸干了水分。",effects:{san:-2,add_clue:"clue_memory_dusty_footprints"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},
{id:"loop_contradiction_001",name:"玛莎的困惑",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc","martha"],trigger:{areas:["harbor_district"],min_loop:4,probability:0.25,once_per_run:true,npc_alive:["玛莎·格雷"]},description:"玛莎看着你，眉头紧锁。\n「你昨天不是问过了吗？关于灯塔的事。」\n你告诉她这是你第一次问。\n「不可能。我记得很清楚。你坐在那个位置，问了一模一样的问题。我还给了你同样的回答。」\n她停顿了一下。\n「……也许我记错了。最近总觉得时间在打转。」",effects:{san:-2,npc_trust:{"玛莎·格雷":-1}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_002",name:"伊莱亚斯的预言",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc","elias"],trigger:{areas:["town_center"],min_loop:4,probability:0.2,once_per_run:true,npc_alive:["伊莱亚斯·沃德"]},description:"伊莱亚斯正在翻阅一本古籍。看到你时，他合上了书。\n「你会问我关于封印的事，」他说。\n你还没开口。\n「你还会问我希尔达和莫里斯家族的关系。然后你会去码头。」\n他的眼神很疲惫。\n「我也不知道我是怎么知道的。也许我做了一个梦。一个很长的梦。」",effects:{san:-2,add_clue:"clue_contradiction_elias_prophecy"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_003",name:"汤米的照片墙",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc","tommy"],trigger:{areas:["town_center"],min_loop:4,probability:0.2,once_per_run:true,npc_alive:["汤米·陈"]},description:"汤米的店铺墙上挂满了照片。你注意到其中有几张拍的是你。\n「这些都是我拍的，」汤米说，「但我不记得什么时候拍的。」\n你仔细看照片。背景是你从未去过的地方——至少你没有去过。\n「还有一张更奇怪的，」汤米指着角落里一张模糊的照片，「这张是在你来之前就挂在那里的。」",effects:{san:-2,add_clue:"clue_contradiction_tommy_photos"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_004",name:"希尔达的等待",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc","hilda"],trigger:{areas:["voxchester_manor"],min_loop:5,probability:0.2,once_per_run:true,npc_alive:["希尔达·莫里斯"]},description:"希尔达站在庄园门口，像是在等你。\n「你来了，」她说，语气平淡得像在陈述天气。\n你问她怎么知道你会来。\n「我不知道。但我知道你会问这个问题。」\n她转身走进庄园。\n「你还会问我关于地下室的事。然后你会犹豫。然后你会下去。」\n她回头看了你一眼。\n「每次都一样。」",effects:{san:-3,add_clue:"clue_contradiction_hilda_wait"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_005",name:"约书亚的拒绝",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc","joshua"],trigger:{areas:["harbor_district"],min_loop:4,probability:0.2,once_per_run:true,npc_alive:["约书亚·布莱克"]},description:"你走向约书亚。他看到你时后退了一步。\n「不，」他说，「我不会再告诉你了。」\n你问他告诉过你什么。\n「灯塔下面的事。我上周告诉过你了。」\n你坚持说这是第一次。\n约书亚盯着你看了很久。\n「你的眼睛……和上次不一样。但你确实问过同样的问题。我记得因为那天晚上下了雨。」",effects:{san:-2},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_006",name:"伊莎贝拉的警告",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc","isabella"],trigger:{areas:["town_center"],min_loop:5,probability:0.2,once_per_run:true,npc_alive:["伊莎贝拉·韦伯"]},description:"伊莎贝拉看到你时，在胸前画了一个十字。\n「你不应该来的，」她低声说。\n你问她为什么。\n「因为你上次来的时候……」她停住了。\n「你上次什么时候来的？今天是……」她看了看日历，困惑地摇了摇头。\n「我记不清了。但我知道你来过。你问过我关于第十二声钟响的事。」\n你没有问过。至少你不记得。",effects:{san:-2,add_clue:"clue_contradiction_isabella_warn"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_007",name:"老费舍的沉默",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc","fisher"],trigger:{areas:["harbor_district"],min_loop:4,probability:0.2,once_per_run:true,npc_alive:["老费舍"]},description:"老费舍坐在码头边，看着海面。你走过去坐下。\n他没有转头，但开了口：\n「你又来了。」\n你告诉他你今天第一次来。\n「不。你来过。你坐在这里，问了我关于海里的东西。我告诉了你。然后你走了。」\n他终于转头看你。\n「但你的眼睛变了。上次更暗一些。」",effects:{san:-2},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_008",name:"埃德加的书稿",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc","edgar"],trigger:{areas:["town_center"],min_loop:5,probability:0.15,once_per_run:true,npc_alive:["埃德加·洛夫克拉夫特"]},description:"埃德加递给你几页手稿。\n「我写了这个故事。但我不记得写过。」\n你读了手稿。故事讲的是一个人来到一座被雾笼罩的城市，调查一系列失踪案。\n故事里的主角死了。然后又回来了。一次又一次。\n「你看，」埃德加指着最后一段，「这里写了主角的反应。和你现在一模一样。」\n你看向最后一段。确实一样。",effects:{san:-3,add_clue:"clue_contradiction_edgar_manuscript",mythos:2},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_009",name:"重复的日期",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","time"],trigger:{areas:["town_center","harbor_district"],min_loop:5,probability:0.15,once_per_run:true},description:"你问路人今天是几号。\n「三月十五号，」他说。\n你昨天问的也是三月十五号。\n你又问了另一个人。\n「三月十四号，」她回答。\n你看了看教堂的日历。三月十六号。\n三个答案。同一天。",effects:{san:-3,add_clue:"clue_contradiction_date"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_010",name:"NPC的重叠",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc"],trigger:{areas:["town_center"],min_loop:6,probability:0.15,once_per_run:true},description:"你在镇中心同时看到了两个汤米。\n一个在店铺门口整理货架。另一个在街对面拍照。\n你眨了眨眼。街对面的汤米消失了。\n店铺门口的汤米抬头看你。\n「怎么了？」\n你问他刚才有没有看到街对面有人。\n「没有。我一直在这里。」\n但他的相机里确实有一张照片——拍的是街对面的他。",effects:{san:-3,add_clue:"clue_contradiction_double"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_011",name:"未完成的对话",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","npc","martha"],trigger:{areas:["harbor_district"],min_loop:5,probability:0.2,once_per_run:true,npc_alive:["玛莎·格雷"]},description:"你走进酒吧。玛莎看到你，话说到一半：\n「——所以你觉得封印的关键在——」\n她突然停住。\n「等等。我刚才在和谁说话？」\n你告诉她你刚进来。\n「不可能。我刚才明明在……」她看了看吧台。上面有两个杯子。一个在你面前，一个在角落的空位前。\n角落的杯子里还有半杯酒。酒是温的。",effects:{san:-2,add_clue:"clue_contradiction_unfinished"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"loop_contradiction_012",name:"地图的矛盾",type:"loop_locked",subtype:"loop_contradiction",weight:1,tier:"rare",tags:["loop","contradiction","map"],trigger:{areas:["town_center"],min_loop:4,probability:0.2,once_per_run:true},description:"你打开笔记本上的地图。路线和你记忆中的不一样。\n有一条路你从未画过——从镇中心直接通往一个你从未去过的地方。\n但你认出了那个地方的名字。你梦到过它。\n你问伊莱亚斯那个地方在哪里。\n「那里？那里什么都没有。只有一片空地。」\n你去了。确实什么都没有。但地上的土是新翻过的。",effects:{san:-2,add_clue:"clue_contradiction_map"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},
{id:"loop_wall_001",name:"招手的手指",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse","horror"],trigger:{areas:["town_center"],min_loop:5,probability:0.15,time_phase:["midnight"],once_per_run:true},description:"墙上的裂缝里伸出几根手指。\n手指很细，关节比正常人多一节。它们朝你招了招。\n你眨了眨眼。只剩裂缝。\n但裂缝比昨天宽了一点。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_wall_002",name:"墙壁的呼吸",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse"],trigger:{areas:["town_center"],min_loop:5,probability:0.15,time_phase:["evening","midnight"],once_per_run:true},description:"你靠在墙上休息。墙壁是温热的。\n你把手掌贴紧墙面。有节奏的起伏——很轻，但确实存在。\n像是呼吸。\n你把手移开。墙壁变冷了。\n你重新贴上去。又是温热的。节奏比刚才快了一点。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_wall_003",name:"墙后的低语",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse","whisper"],trigger:{areas:["town_center"],min_loop:5,probability:0.15,time_phase:["midnight"],once_per_run:true},description:"你把耳朵贴在墙上。另一边有声音。\n不是风。是有人在说话。声音很轻，你只能听清几个词：\n「……他还不知道……」\n「……再给他一次机会……」\n「……第七天……」\n你猛地把耳朵移开。墙面上留下了一小片潮湿的印记——像是有人从另一边贴着墙呼出的气。",effects:{san:-3,add_clue:"clue_wall_whisper"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_wall_004",name:"裂缝中的眼睛",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse","eye"],trigger:{areas:["town_center"],min_loop:6,probability:0.1,time_phase:["midnight"],once_per_run:true},description:"裂缝里有什么东西在反光。\n你凑近看。是一只眼睛。\n眼睛没有眼白。整个瞳孔是深灰色的，像是被雾填满了。\n它在看着你。你知道它在看着你，因为当你移动时，它也跟着移动。\n然后它眨了一下。裂缝合上了。\n墙壁上留下了一滴液体。你没有去碰它。",effects:{san:-4},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_wall_005",name:"墙壁的凹陷",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse"],trigger:{areas:["town_center"],min_loop:5,probability:0.15,once_per_run:true},description:"墙上出现了一个凹陷。形状像一个人的轮廓——侧躺着，蜷缩着。\n凹陷不深，但你能看出肩膀、手肘、膝盖的位置。\n你伸手摸了摸。凹陷里是温热的。\n第二天你再看。凹陷更深了一点。姿势也变了——像是翻了个身。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_wall_006",name:"墙中的心跳",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse","heartbeat"],trigger:{areas:["town_center"],min_loop:5,probability:0.15,once_per_run:true},description:"你把耳朵贴在墙上。能听到心跳声。\n节奏和你的一样。但当你屏住呼吸时，心跳声没有停。\n你的心跳在加速。墙里的心跳也加速了——但比你慢半拍。\n像是什么东西在模仿你。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_wall_007",name:"渗出的液体",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse","liquid"],trigger:{areas:["town_center"],min_loop:5,probability:0.15,once_per_run:true},description:"墙角渗出了一滩液体。你蹲下来查看。\n液体是黑色的，粘稠，带着铁锈和海水混合的气味。\n你用手指蘸了一点。液体是温热的。\n你把手指放到鼻子下面闻了闻。有一股淡淡的血腥味。\n你用布擦掉了液体。第二天同一位置又渗出了一滩。这次更多。",effects:{san:-3,hp:-1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_wall_008",name:"墙壁的文字",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse","text"],trigger:{areas:["town_center"],min_loop:6,probability:0.1,once_per_run:true},description:"你醒来时发现墙上有字。\n字迹是凸起的，像是从墙里长出来的。你摸了摸——触感像骨头。\n字写的是：「你不属于这里。」\n你试图用手刮掉它们。刮不动。字迹像是墙体的一部分。\n到了晚上，字变了：「但你无处可去。」",effects:{san:-3,add_clue:"clue_wall_text"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_wall_009",name:"地板的脉络",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse","floor"],trigger:{areas:["town_center"],min_loop:5,probability:0.12,once_per_run:true},description:"地板的缝隙里长出了什么东西。你蹲下来看。\n是细小的、半透明的丝线，像是某种菌丝。它们从墙角的裂缝中蔓延出来，在地板上形成了一个图案。\n图案看起来像一张地图。你认出了沃切斯特的轮廓。\n丝线在缓慢生长。到了第二天，它们覆盖了半个房间的地板。",effects:{san:-3,safehouseCorruption:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_wall_010",name:"墙后的呼唤",type:"loop_locked",subtype:"wall_entity",weight:1,tier:"rare",tags:["loop","wall","safehouse","call"],trigger:{areas:["town_center"],min_loop:6,probability:0.1,time_phase:["midnight"],once_per_run:true},description:"你听到有人在叫你的名字。\n声音从墙后传来。你认出了那个声音——是你自己的。\n「过来，」它说，「这边有出路。」\n你把手贴在墙上。墙壁是软的。\n你的手指陷了进去。像是按在皮肤上。\n你抽回手。墙上留下了五个指印。指印慢慢消失了。\n声音没有再响起。",effects:{san:-4},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"loop_correction_001",name:"被划掉的线索",type:"loop_locked",subtype:"world_correction",weight:1,tier:"signature",tags:["loop","correction","clue"],trigger:{areas:["town_center"],min_loop:6,probability:0.2,once_per_run:true},description:"你翻开笔记本。上周目记录的一条关键线索被划掉了。\n不是你划的——笔迹不同，力度更大，像是有人用力地、反复地涂抹。\n你试图辨认被划掉的内容。依稀能看到几个字：「灯塔……地下室……钥匙……」\n系统提示：世界试图隐藏它。",effects:{san:-3,add_clue:"clue_correction_redacted",mythos:2},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_correction_002",name:"消失的路径",type:"loop_locked",subtype:"world_correction",weight:1,tier:"signature",tags:["loop","correction","navigation"],trigger:{areas:["whispering_forest"],min_loop:6,probability:0.2,once_per_run:true},description:"你记得这里有一条小路。上周目你走过。\n但小路不见了。灌木丛长得很密，像是从来没有路通过。\n你拨开灌木。底下是泥土——但泥土的纹路不对。像是被什么机器翻整过，然后重新种上了植物。\n你蹲下来仔细看。泥土里有一小截石板路的碎片。路确实存在过。",effects:{san:-3,add_clue:"clue_correction_path"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_correction_003",name:"修改的记忆",type:"loop_locked",subtype:"world_correction",weight:1,tier:"signature",tags:["loop","correction","memory"],trigger:{areas:["town_center","harbor_district"],min_loop:6,probability:0.15,once_per_run:true},description:"你试图回忆上周目的某个细节。你记得很清楚——某个人告诉了你一个重要的信息。\n但当你去验证时，那个人说他从未说过那些话。\n你翻开笔记本。你确实记下了那段对话。但笔记的字迹变了——变成了你不认识的笔迹。\n只有关键的几个字还是你的：不要相信修正。",effects:{san:-3,add_clue:"clue_correction_memory"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_correction_004",name:"被替换的物品",type:"loop_locked",subtype:"world_correction",weight:1,tier:"signature",tags:["loop","correction","item"],trigger:{areas:["town_center"],min_loop:6,probability:0.15,once_per_run:true},description:"你打开抽屉。里面的东西和你记忆中的不一样。\n上周目你放在这里的钥匙碎片不见了。取而代之的是一张照片——拍的是同一把钥匙，但已经碎成了更多块。\n照片背面写着一行字：「它不想被找到。」\n你翻过照片。正面的钥匙碎片在照片里慢慢消失，像是被什么抹去了。",effects:{san:-3,add_clue:"clue_correction_replaced"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_correction_005",name:"被篡改的日历",type:"loop_locked",subtype:"world_correction",weight:1,tier:"signature",tags:["loop","correction","time"],trigger:{areas:["town_center"],min_loop:7,probability:0.15,once_per_run:true},description:"你查看教堂的日历。三月十五日被撕掉了。\n不是被人撕掉的——纸张的边缘是光滑的，像是从来没有那一页。\n你问伊莎贝拉。\n「三月十五？今年没有那一天。三月十四直接跳到了三月十六。」\n她看着你的表情，补充道：「一直都是这样。」",effects:{san:-3,add_clue:"clue_correction_calendar"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_correction_006",name:"被封锁的房间",type:"loop_locked",subtype:"world_correction",weight:1,tier:"signature",tags:["loop","correction","manor"],trigger:{areas:["voxchester_manor"],min_loop:6,probability:0.15,once_per_run:true},description:"你走到庄园二楼尽头的房间。上周目你进去过。\n但门不见了。\n墙壁是完整的——没有门框的痕迹，没有被封堵的迹象。墙纸的花纹是连续的，像是从来没有过一扇门。\n你用手敲了敲墙壁。实心的。\n但你清楚地记得房间里有一本日记。",effects:{san:-3,add_clue:"clue_correction_room"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_correction_007",name:"被修改的墓碑",type:"loop_locked",subtype:"world_correction",weight:1,tier:"signature",tags:["loop","correction","catacombs"],trigger:{areas:["catacombs_entrance"],min_loop:7,probability:0.15,once_per_run:true},description:"你找到了上周目标记过的那块墓碑。碑文不一样了。\n你记得上面刻的是一个日期和一个名字。现在变成了完全不同的日期和名字。\n你蹲下来仔细看。石面没有任何修改的痕迹——字像是从一开始就刻成这样的。\n但石缝里卡着一小块石屑。你认出了上面的字。是你记忆中的碑文。",effects:{san:-3,add_clue:"clue_correction_tombstone"},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},{id:"loop_correction_008",name:"被重写的历史",type:"loop_locked",subtype:"world_correction",weight:1,tier:"signature",tags:["loop","correction","library"],trigger:{areas:["town_center"],min_loop:7,probability:0.1,once_per_run:true},description:"你在图书馆找到一本关于沃切斯特历史的书。你翻到关于莫里斯家族的章节。\n和你记忆中的不一样。上周目你读到的内容被整段替换了。\n你对比了两个版本。关键的差异只有一个：原版提到了一个封印的位置。新版完全没有。\n书页的边缘有一行极小的铅笔字：「它会修改记录。小心。」\n是你的笔迹。",effects:{san:-3,add_clue:"clue_correction_history",mythos:2},event_classification:"神秘事件",normalcy_anchor:false,choices:[]},
{id:"loop_endpoint_001",name:"墓碑上的结局",type:"loop_locked",subtype:"loop_endpoint",weight:1,tier:"signature",tags:["loop","endpoint","ending"],trigger:{areas:["catacombs_entrance"],min_loop:8,probability:0.1,once_per_run:true},description:"你在墓穴深处找到一块墓碑。上面刻着字——不是名字，而是结局。\n你逐行阅读：\n「献祭者。希尔达的选择。古老血脉。第十二声。」\n「逃离海岸。证据逃离。异端黎明。深渊吞噬。」\n「超越者。命运漂流。」\n最后有一行空格。还没填上。\n你伸手去摸那个空格。石头是温热的。",effects:{san:-4,mythos:3,add_clue:"clue_endpoint_tombstone"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_endpoint_002",name:"倒计时",type:"loop_locked",subtype:"loop_endpoint",weight:1,tier:"signature",tags:["loop","endpoint","countdown"],trigger:{areas:["town_center"],min_loop:8,probability:0.1,once_per_run:true},description:"你打开怀表。表盘上的数字在变化——不是时间，而是数字。\n从十开始倒数。九。八。七。\n你试着合上表盖。合不上。\n六。五。四。\n你把怀表翻过来。背面刻着一行字：「当数字归零，你将不再回来。」\n三。二。一。\n表盘恢复了正常时间。但你注意到——今天是第「数字」天。你记不清具体是第几天了。",effects:{san:-4,add_clue:"clue_endpoint_countdown"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_endpoint_003",name:"所有周目的你",type:"loop_locked",subtype:"loop_endpoint",weight:1,tier:"signature",tags:["loop","endpoint","self"],trigger:{areas:["lighthouse"],min_loop:9,probability:0.08,once_per_run:true},description:"灯塔的灯室里有一面镜子。镜子里映出了很多个人影。\n你数了一下。数量和你的周目数一样。\n每个人影的姿势都不同——有的在奔跑，有的在战斗，有的蜷缩在地上，有的面朝深渊。\n你走到镜子前。所有的人影同时转头看你。\n它们的嘴同时动了。你读出了唇语：\n「选一个结局。」",effects:{san:-5,mythos:3,add_clue:"clue_endpoint_mirror"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_endpoint_004",name:"最后一次机会",type:"loop_locked",subtype:"loop_endpoint",weight:1,tier:"signature",tags:["loop","endpoint","final"],trigger:{areas:["deep_catacombs"],min_loop:9,probability:0.08,once_per_run:true},description:"深渊墓穴的最深处。你看到了一面墙。墙上写满了名字——你认出了几个。\n是其他调查员的名字。有些你见过，在失踪告示上。有些你没见过。\n每个名字旁边都有一个结局：疯狂、死亡、逃离、献祭……\n最后一个名字是你的。旁边的结局栏是空的。\n墙的底部刻着一行字：「这是你的最后一次机会。选择你的结局。」",effects:{san:-5,mythos:3,add_clue:"clue_endpoint_final_wall"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"loop_endpoint_005",name:"循环的尽头",type:"loop_locked",subtype:"loop_endpoint",weight:1,tier:"signature",tags:["loop","endpoint","loop_truth"],trigger:{areas:["ruins_of_yith"],min_loop:10,probability:0.05,once_per_run:true},description:"伊斯机器完全亮了起来。你看到了一段影像——\n是你自己。很多个你。每一个都在做不同的选择。\n有的你重铸了封印。有的你逃离了沃切斯特。有的你沉入了深渊。\n影像的最后，所有的你同时看向你。\n一个声音响起——不是任何人的声音，而是机器本身的声音：\n「你已经看到了所有的可能。现在，做出你的选择。这是最后一次循环。」\n机器的光芒开始消退。",effects:{san:-5,mythos:5,add_clue:"clue_endpoint_yith_final",unlock_ending_condition:"ending_loop_truth_available"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]}];var loopEvents=_events_loopEvents;

{id:"humanity_bad_001",name:"涨价",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","price"],trigger:{areas:["town_center"],humanity_max:30,probability:0.3,once_per_run:true},description:"你走进杂货店。店主看到你，脸色变了。\n「东西涨价了，」他说，语气冰冷。\n你问为什么。\n「因为你。你做的那些事，镇上的人都知道。」\n他没有看你。「要么付双倍，要么走。」",effects:{food:-1,add_run_memory:{text:"镇民因为你的恶行拒绝正常交易。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_bad_002",name:"拒绝入内",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","church","rejection"],trigger:{areas:["town_center"],humanity_max:25,probability:0.25,once_per_run:true},description:"你走到教堂门口。门从里面锁上了。\n你敲了敲门。伊莎贝拉的声音从里面传来：\n「你不适合待在这里。走吧。」\n你问为什么。\n「你自己清楚。教堂是给有需要的人的。你已经不是了。」\n你听到脚步声远去了。",effects:{san:-1,add_run_memory:{text:"教堂拒绝你进入。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_bad_003",name:"儿童投石",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","violence"],trigger:{areas:["town_center"],humanity_max:20,probability:0.2,once_per_run:true},description:"一块石头砸中了你的后脑。\n你转过身。三个孩子站在街角，手里还握着石头。\n「怪物！」他们喊道，「离开我们的城市！」\n又一块石头飞过来，砸中了你的肩膀。\n大人们站在旁边看着。没有人阻止。\n没有人。",effects:{hp:-1,san:-1,add_run_memory:{text:"镇上的孩子向你投掷石块。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_bad_004",name:"汤米的回避",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","npc"],trigger:{areas:["town_center"],humanity_max:30,probability:0.2,once_per_run:true,npc_alive:["汤米·陈"]},description:"你走进汤米的店铺。他看到你时，手指不自觉地握紧了柜台边缘。\n「有什么事？」他问，声音比平时高了一个调。\n你还没开口，他就说：「我今天很忙。改天再来。」\n你注意到他的另一只手在柜台下面——你猜是握着什么东西。",effects:{npc_trust:{"汤米·陈":-1}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"humanity_bad_005",name:"玛莎的沉默",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","harbor","npc"],trigger:{areas:["harbor_district"],humanity_max:25,probability:0.2,once_per_run:true,npc_alive:["玛莎·格雷"]},description:"你走进酒吧。玛莎看到你，停止了和客人的交谈。\n酒吧里安静了下来。所有人都在看你。\n玛莎慢慢擦着杯子，没有说话。\n你走到吧台前。她把杯子放下，转身走进了后厨。\n没有人来招呼你。你待了一会儿，走了。",effects:{npc_trust:{"玛莎·格雷":-1},add_run_memory:{text:"酒吧里的人集体回避你。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"humanity_bad_006",name:"被跟踪",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","danger"],trigger:{areas:["town_center","harbor_district"],humanity_max:20,probability:0.2,once_per_run:true},description:"你注意到身后有脚步声。你走快，脚步声也快。你转弯，脚步声也转弯。\n你突然停下来转头。一个男人站在巷口，看到你转身，立刻缩了回去。\n你认出了他——是镇上的一个居民。上次你见到他时，你做了……\n你不想回忆那件事。\n他手里握着什么东西。在月光下闪了一下。是刀。",effects:{san:-2,add_run_memory:{text:"有人在跟踪你。手里拿着刀。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_bad_007",name:"锁上的门",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","safehouse","danger"],trigger:{areas:["town_center"],humanity_max:20,probability:0.2,once_per_run:true},description:"你回到安全屋。门被从外面锁上了。\n你用力推了推。推不开。\n门上贴着一张纸条：「我们知道你做了什么。滚出沃切斯特。」\n纸条是用红墨水写的。或者是别的什么。\n你绕到后面。后门也被锁了。你只好翻窗进去。\n屋里的东西被动过了。有人翻过你的物品。",effects:{safehouseCorruption:10,san:-1,add_run_memory:{text:"安全屋被人从外面锁上。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_bad_008",name:"伊莱亚斯的警告",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","npc"],trigger:{areas:["town_center"],humanity_max:25,probability:0.2,once_per_run:true,npc_alive:["伊莱亚斯·沃德"]},description:"伊莱亚斯拦住了你。他的表情很严肃。\n「我听说了你做的事，」他说，「我不知道全部真相。但你变了。」\n他看着你的眼睛。\n「你来的时候，眼里有光。现在没有了。\n」沃切斯特会改变每一个人。但有些人改变得太多了。我不希望你是其中之一。「\n他走了。你注意到他手里握着一本圣经。他以前从不带这个。",effects:{san:-1,add_run_memory:{text:"伊莱亚斯警告你正在堕落。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"humanity_bad_009",name:"拒绝交易",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","trade"],trigger:{areas:["town_center"],humanity_max:20,probability:0.25,once_per_run:true},description:"你需要买一些补给。你走进商店。\n店主看到你，摇了摇头。\n「不卖。」\n你问为什么。\n「你知道为什么。你的钱在这里不好使。」\n你想争辩，但看到他的眼神。是恐惧。也是厌恶。\n你走了。街上的人给你让出了比平时更宽的距离。",effects:{add_run_memory:{text:"商店拒绝卖东西给你。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_bad_010",name:"被举报",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","danger"],trigger:{areas:["town_center"],humanity_max:15,probability:0.15,once_per_run:true},description:"你听到远处有脚步声。很多人。\n你转过街角，看到三个男人朝你的方向走来。其中一个手里拿着猎枪。\n你认出了他们——镇上的居民。其中一个你对他做过……\n你转身就跑。身后传来喊声：「他在那里！」\n你跑了很久才甩掉他们。你的手在发抖。",effects:{san:-2,add_run_memory:{text:"镇民试图围捕你。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_bad_011",name:"恶意的涂鸦",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","vandalism"],trigger:{areas:["town_center"],humanity_max:25,probability:0.2,once_per_run:true},description:"你回到安全屋。门上被涂了字。\n红漆写着：「凶手。」\n你试图擦掉。擦不掉。漆已经干了。\n你看了看四周。邻居的窗户里有人在看你。看到你的目光，窗帘立刻拉上了。\n你进了屋。桌上放着一只死鸟。脖子被拧断了。",effects:{san:-2,safehouseCorruption:5,add_run_memory:{text:"安全屋被涂上了侮辱性的文字。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_bad_012",name:"被孤立",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","isolation"],trigger:{areas:["town_center"],humanity_max:20,probability:0.2,once_per_run:true},description:"你走进酒吧。酒吧里有十几个人。\n你走到吧台。玛莎看了你一眼，继续擦杯子。\n你等了一会儿。没有人来招呼你。\n你环顾四周。所有人都在做自己的事——喝酒、聊天、打牌。但没有一个人的目光和你对上。\n你就像一个透明人。\n你坐了十分钟。走了。没有人看你离开。",effects:{san:-2,add_run_memory:{text:"你被彻底孤立了。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_bad_013",name:"老费舍的沉默",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","harbor","npc"],trigger:{areas:["harbor_district"],humanity_max:25,probability:0.2,once_per_run:true,npc_alive:["老费舍"]},description:"你走到老费舍旁边坐下。他没有看你。\n你叫他的名字。他没有回应。\n你又叫了一次。他慢慢站起来，收起了渔网，走了。\n从头到尾没有看你一眼。\n你坐在码头边，看着海面。海面很平静。但你知道水下面有什么东西在看着你。",effects:{npc_trust:{"老费舍":-1},add_run_memory:{text:"老费舍完全无视了你。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"humanity_bad_014",name:"埃德加的质问",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","town","npc"],trigger:{areas:["town_center"],humanity_max:25,probability:0.15,once_per_run:true,npc_alive:["埃德加·洛夫克拉夫特"]},description:"埃德加站在你面前。他没有拿出笔记本。\n「我本来想把你的故事写成小说，」他说，「但我现在不想了。」\n你问他为什么。\n「因为你变成了一个我写不出来的人物。没有动机，没有挣扎，只有——」\n他停住了。\n「只有本能。那不是故事。那是事故。」\n他走了。你注意到他的手在发抖。",effects:{san:-1,add_run_memory:{text:"埃德加说你不再是一个值得书写的人。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"humanity_bad_015",name:"希尔达的恐惧",type:"humanity",subtype:"bad_consequence",weight:1,tier:"normal",tags:["humanity","bad","manor","npc"],trigger:{areas:["voxchester_manor"],humanity_max:20,probability:0.15,once_per_run:true,npc_alive:["希尔达·莫里斯"]},description:"你走到庄园门口。门没有开。\n你敲了敲。希尔达的声音从门后传来：\n「你走吧。我不开门。」\n你问为什么。\n「因为你让我想起了……想起了庄园里的某些东西。那些我不愿意面对的东西。」\n她的声音在发抖。\n「你的眼睛。和它们一样。冷的。空的。」\n你听到锁扣上的声音。她又加了一道锁。",effects:{npc_trust:{"希尔达·莫里斯":-2},add_run_memory:{text:"希尔达因为恐惧拒绝为你开门。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},
{id:"humanity_trial_001",name:"饥饿的孩子",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","food"],trigger:{areas:["town_center"],humanity_min:40,humanity_max:60,probability:0.2,once_per_run:true,food_lte:3},description:"一个孩子站在巷口。他的眼睛盯着你手里的食物。\n他很瘦。肋骨的轮廓透过薄衬衫清晰可见。\n你还有最后一点食物。如果你给了他，你今天就要饿着肚子了。\n但如果你不给——他还能撑多久？",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"把食物分给他",text:"你蹲下来，把食物放在他手里。他没有说谢谢，只是抱着食物跑了。",effects:{food:-1,humanity:5,add_run_memory:{text:"把最后的食物分给了饥饿的孩子。"}}},{label:"假装没看到",text:"你加快了脚步。背后的目光像针一样扎着你。",effects:{humanity:-5,san:-1,add_run_memory:{text:"无视了饥饿的孩子。"}}},{label:"用食物换信息",text:"「你知道镇上最近有什么异常吗？」孩子犹豫了一下，点了点头。",effects:{food:-1,humanity:2,add_clue:"clue_humanity_child_info",add_run_memory:{text:"用食物换取了孩子的情报。"}}}]},{id:"humanity_trial_002",name:"受伤的陌生人",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","heal"],trigger:{areas:["harbor_district"],humanity_min:40,humanity_max:60,probability:0.2,once_per_run:true},description:"你在码头的角落里发现一个人。他倒在地上，腹部有一道伤口。\n血还在流。他看到你，伸出手。\n「帮我……」\n你的急救包里还有药品。但你自己也可能随时需要用到。\n如果你帮他，他会告诉你一些事情。如果你不帮——他大概撑不到天亮。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"用急救包帮他",text:"你撕开他的衣服，清理了伤口，用绷带包扎好。他的脸色慢慢恢复了一些。",effects:{remove_item:{item_id:"first_aid_kit",amount:1},humanity:5,npc_trust:{"玛莎·格雷":1},add_run_memory:{text:"救治了一个受伤的陌生人。"}}},{label:"查看他的口袋",text:"他还有意识。你假装帮他检查伤口，快速摸了摸他的口袋。",effects:{humanity:-5,add_item:{item_id:"strange_key_fragment",name:"奇怪的钥匙碎片",uses:1},add_run_memory:{text:"趁人之危搜了伤者的口袋。"}}},{label:"走开",text:"你不是医生。你有自己的事要忙。",effects:{humanity:-3,san:-1,add_run_memory:{text:"无视了码头的伤者。"}}}]},{id:"humanity_trial_003",name:"偷窃的机会",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","theft"],trigger:{areas:["town_center"],humanity_min:40,humanity_max:60,probability:0.15,once_per_run:true},description:"你路过一个无人看管的摊位。上面摆着一些食物和药品。\n摊主大概去上厕所了。四周没有人注意你。\n你只需要伸出手。\n你确实需要这些东西。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"拿走食物和药品",text:"你快速拿了两样东西，塞进口袋，离开了。",effects:{food:1,hp:1,humanity:-8,add_run_memory:{text:"从无人摊位偷了食物和药品。"}}},{label:"等摊主回来再买",text:"你等了一会儿。摊主回来了。你用正常价格买了需要的东西。",effects:{food:1,humanity:3,add_run_memory:{text:"老实等待摊主回来，正常交易。"}}},{label:"留下一些钱",text:"你拿了东西，但留下了一些钱。不够，但总比没有好。",effects:{food:1,humanity:-2,add_run_memory:{text:"从摊位拿了东西但留了部分钱。"}}}]},{id:"humanity_trial_004",name:"告密者",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","betrayal"],trigger:{areas:["town_center"],humanity_min:40,humanity_max:60,probability:0.15,once_per_run:true},description:"一个人拦住了你。他的眼睛里满是恐惧。\n「我知道你在调查，」他低声说，「我可以告诉你一些事。但你不能告诉任何人是我告诉你的。」\n他告诉你了一个关于灯塔的秘密。\n然后他说：「如果他们知道我说了——他们会来找我的。」\n你收下了他的信息。但你也可以选择把这个信息作为筹码——告诉其他人。",effects:{add_clue:"clue_humanity_informant"},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"承诺保密",text:"你点了点头。他松了一口气，转身消失在雾中。",effects:{humanity:3,add_run_memory:{text:"答应保护告密者的身份。"}}},{label:"把这个信息告诉伊莱亚斯",text:"信息需要验证。伊莱亚斯也许能帮你。",effects:{humanity:-5,npc_trust:{"伊莱亚斯·沃德":1},add_run_memory:{text:"把告密者的信息转告了伊莱亚斯。"}}}]},{id:"humanity_trial_005",name:"求救声",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","rescue"],trigger:{areas:["harbor_district"],humanity_min:40,humanity_max:60,probability:0.15,time_phase:["evening","midnight"],once_per_run:true},description:"你听到仓库后面有声音。是一个女人的声音，在喊救命。\n你走过去。声音从一扇锁着的门后面传来。\n你用力撞了一下门。门很结实。\n你可以去找人帮忙——但这需要时间。你也可以试着撬锁。\n但你注意到门缝里有光。里面不止一个人。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"撞开门救人",text:"你用肩膀撞开了门。里面有两个人——一个女人和一个男人。男人手里拿着刀。",effects:{hp:-2,humanity:5,add_run_memory:{text:"撞开门救了一个女人。受了伤。"}}},{label:"去找人帮忙",text:"你跑去叫了几个码头工人。回来的时候，门开着，里面空了。",effects:{humanity:-2,add_run_memory:{text:"去找人帮忙，回来时人已经不见了。"}}},{label:"假装没听到",text:"你转身走了。背后的声音渐渐变小。然后停了。",effects:{humanity:-8,san:-2,add_run_memory:{text:"无视了仓库里的求救声。"}}}]},{id:"humanity_trial_006",name:"秘密的代价",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","secret"],trigger:{areas:["town_center"],humanity_min:40,humanity_max:60,probability:0.15,once_per_run:true},description:"你发现了一条关于封印的重要线索。但这条线索涉及一个NPC的秘密。\n如果你公开这条线索，所有人都会知道那个秘密。\n如果你保密，你可能无法解开谜题。\n你需要做一个选择。",effects:{add_clue:"clue_humanity_secret_cost"},event_classification:"调查",normalcy_anchor:false,choices:[{label:"保密，独自调查",text:"你把线索藏在心里。这会让你的调查更困难，但不会伤害任何人。",effects:{humanity:3,add_run_memory:{text:"选择保密一条涉及他人隐私的线索。"}}},{label:"公开线索",text:"你把线索告诉了其他人。调查的进度加快了，但——",effects:{humanity:-5,add_clue:"clue_humanity_public_secret",add_run_memory:{text:"公开了涉及他人秘密的线索。"}}}]},{id:"humanity_trial_007",name:"分配药品",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","medicine"],trigger:{areas:["town_center"],humanity_min:40,humanity_max:60,probability:0.15,hp_lte_ratio:0.5,once_per_run:true},description:"你找到了一些药品。但你知道镇上有人比你更需要它们——一个生病的孩子。\n你自己的伤也不轻。药品只够一个人用。\n孩子的母亲看着你。她没有说话。但她的眼神在请求。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"把药品给孩子",text:"你把药品递给了母亲。她没有说谢谢，只是紧紧抱住了孩子。",effects:{humanity:8,add_run_memory:{text:"把急需的药品让给了生病的孩子。"}}},{label:"留给自己",text:"你需要这些药品来继续调查。这是理性的选择。",effects:{hp:3,humanity:-5,add_run_memory:{text:"把药品留给了自己，没有给生病的孩子。"}}},{label:"分一半",text:"你把药品分成了两份。都不够，但至少都有一点希望。",effects:{hp:1,humanity:3,add_run_memory:{text:"把药品分给了自己和生病的孩子。"}}}]},{id:"humanity_trial_008",name:"背叛的诱惑",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","betrayal"],trigger:{areas:["harbor_district"],humanity_min:40,humanity_max:60,probability:0.12,once_per_run:true,npc_trust_gte:{"玛莎·格雷":2}},description:"玛莎告诉你一个秘密——关于老费舍的秘密。\n「如果你把这个告诉别人，」她说，「你就能获得一些人的信任。但老费舍会——」\n她没有说完。\n你看着她。她在等你的回答。",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"拒绝出卖",text:"「我不会告诉任何人。」玛莎松了一口气。",effects:{humanity:5,npc_trust:{"玛莎·格雷":1},add_run_memory:{text:"拒绝出卖老费舍的秘密。"}}},{label:"利用这个信息",text:"你把这个信息告诉了约书亚。他给了你一些有用的东西。",effects:{humanity:-8,npc_trust:{"约书亚·布莱克":1,"老费舍":-2},add_run_memory:{text:"出卖了老费舍的秘密。"}}}]},{id:"humanity_trial_009",name:"沉默的选择",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","silence"],trigger:{areas:["town_center"],humanity_min:40,humanity_max:60,probability:0.15,once_per_run:true},description:"你看到了一些事情。一些关于沃切斯特真相的事情。\n你可以选择说出来——但说出来可能会导致恐慌。\n你也可以选择沉默——但沉默意味着更多人可能受害。\n你站在广场上，周围是毫不知情的镇民。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"保持沉默",text:"你闭上了嘴。有些真相太沉重了，不适合说出来。",effects:{humanity:-3,san:-1,add_run_memory:{text:"选择对镇民隐瞒真相。"}}},{label:"告诉少数人",text:"你找到了几个你信任的人，告诉了他们真相。",effects:{humanity:3,add_run_memory:{text:"选择性地告知了少数人真相。"}}},{label:"公开真相",text:"你在广场上大声说出了真相。人们开始恐慌。",effects:{humanity:-5,san:-2,add_run_memory:{text:"在广场上公开了真相，导致恐慌。"}}}]},{id:"humanity_trial_010",name:"牺牲的抉择",type:"humanity",subtype:"trial",weight:1,tier:"normal",tags:["humanity","trial","choice","sacrifice"],trigger:{areas:["town_center"],humanity_min:40,humanity_max:60,probability:0.1,once_per_run:true},description:"你面前有两条路。一条是安全的——能让你活着离开沃切斯特。另一条是危险的——但能救更多人。\n你没有太多时间做决定。雾正在变浓。",effects:{},event_classification:"正常事件",normalcy_anchor:false,choices:[{label:"选择安全的路",text:"你转身走向安全的方向。背后传来的声音渐渐变远。",effects:{humanity:-5,san:1,add_run_memory:{text:"在关键时刻选择了自保。"}}},{label:"选择危险的路",text:"你深吸一口气，走向了雾的深处。",effects:{humanity:8,hp:-2,san:-1,add_run_memory:{text:"在关键时刻选择了冒险救人。"}}}]},
{id:"humanity_collective_001",name:"镇民的欢迎",type:"humanity",subtype:"collective",weight:1,tier:"rare",tags:["humanity","collective","positive"],trigger:{areas:["town_center"],humanity_min:85,probability:0.15,once_per_run:true},description:"你走进镇中心。人们看到你，停下了手里的事。\n一个老人朝你点了点头。一个女人微微笑了一下。一个孩子朝你挥手。\n没有人说话。但你能感觉到——他们认识你。不是因为你做了什么大事，而是因为你一直在。\n在这个被雾笼罩的城市里，你是一个可以信任的人。",effects:{san:3,add_run_memory:{text:"镇民集体向你表示信任。"}},event_classification:"正常事件",normalcy_anchor:true,choices:[]},{id:"humanity_collective_002",name:"安全屋的改善",type:"humanity",subtype:"collective",weight:1,tier:"rare",tags:["humanity","collective","positive","safehouse"],trigger:{areas:["town_center"],humanity_min:85,probability:0.1,once_per_run:true},description:"你回到安全屋。门口放着一些东西——木板、钉子、灯油、食物。\n旁边有一张纸条：「我们知道你在这里。这些是大家凑的。」\n你用了半个小时把安全屋加固了一下。屋顶的漏洞补上了，窗户也钉了新木板。\n晚上睡觉的时候，你感到了久违的安全感。",effects:{safehouseCorruption:-10,food:2,san:2,add_run_memory:{text:"镇民集体为你的安全屋提供了补给和修缮。"}},event_classification:"正常事件",normalcy_anchor:true,choices:[]},{id:"humanity_collective_003",name:"集体的庇护",type:"humanity",subtype:"collective",weight:1,tier:"rare",tags:["humanity","collective","positive","protection"],trigger:{areas:["town_center"],humanity_min:90,probability:0.08,once_per_run:true},description:"你听到敲门声。你打开门。\n门口站着五六个镇民。他们手里拿着各种东西——猎枪、灯笼、食物。\n「我们来帮你，」领头的人说，「不管你在做什么，你不是一个人。」\n你看着他们。他们的眼睛里没有恐惧。只有决心。\n在沃切斯特，这比任何武器都珍贵。",effects:{san:5,food:3,add_run_memory:{text:"镇民主动组队来帮助你。"}},event_classification:"正常事件",normalcy_anchor:true,choices:[]},{id:"humanity_collective_004",name:"被放逐",type:"humanity",subtype:"collective",weight:1,tier:"rare",tags:["humanity","collective","negative"],trigger:{areas:["town_center"],humanity_max:15,probability:0.2,once_per_run:true},description:"你走进镇中心。人们看到你，立刻散开了。\n不是回避——是逃跑。\n一个男人挡在你面前。他手里拿着一根木棍。\n「你不能再待在这里了，」他说，「镇上的人投票了。你必须在日落前离开。」\n你看着他的眼睛。里面没有愤怒。只有恐惧。\n「求你了，」他低声说，「别让我们更害怕。」",effects:{san:-3,add_run_memory:{text:"镇民投票决定驱逐你。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_collective_005",name:"围捕",type:"humanity",subtype:"collective",weight:1,tier:"rare",tags:["humanity","collective","negative","danger"],trigger:{areas:["town_center"],humanity_max:10,probability:0.15,once_per_run:true},description:"你听到远处的喊声。很多人。\n你转过街角。十几个人站在广场上，手里拿着各种武器——猎枪、铁锹、木棍。\n他们看到你。领头的人举起了手。\n「他在这里！」\n你转身就跑。身后传来脚步声和喊声。\n你跑进了一条小巷。他们没有追上来——但他们封锁了巷口。\n你被困住了。",effects:{san:-3,hp:-1,add_run_memory:{text:"镇民试图围捕你。你勉强逃脱。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_collective_006",name:"集体的感激",type:"humanity",subtype:"collective",weight:1,tier:"rare",tags:["humanity","collective","positive"],trigger:{areas:["town_center"],humanity_min:80,probability:0.1,once_per_run:true},description:"教堂的钟声响了。不是十三下——是正常的十二下。\n镇民们走出家门，站在街道两旁。他们看着你。\n没有人说话。但你能感觉到他们的目光——不是恐惧，不是警惕，而是某种你在这个城市里从未感受过的东西。\n感激。\n一个孩子跑过来，递给你一束野花。你蹲下来接住了。",effects:{san:5,humanity:3,add_run_memory:{text:"镇民集体向你表达感激。教堂的钟声恢复正常。"}},event_classification:"正常事件",normalcy_anchor:true,choices:[]},{id:"humanity_collective_007",name:"集体的恐惧",type:"humanity",subtype:"collective",weight:1,tier:"rare",tags:["humanity","collective","negative"],trigger:{areas:["town_center"],humanity_max:15,probability:0.15,once_per_run:true},description:"你走在街上。所有人看到你都停下了脚步。\n不是为了打招呼。是为了让你先走。\n他们退到路边，低着头，不敢看你。\n你走过的时候，听到有人在低声祈祷。\n你走了很远，回头看了一眼。他们还站在那里，像一排雕像。",effects:{san:-2,add_run_memory:{text:"镇民在你面前集体恐惧退缩。"}},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"humanity_collective_008",name:"篝火旁的团结",type:"humanity",subtype:"collective",weight:1,tier:"rare",tags:["humanity","collective","positive"],trigger:{areas:["harbor_district"],humanity_min:80,probability:0.1,time_phase:["evening"],once_per_run:true},description:"码头边点着一堆篝火。几个渔民围坐在旁边。\n他们看到你，让出了一个位置。\n「过来坐，」一个渔民说，「今晚的鱼多了一条。」\n你坐下来。有人递给你一碗鱼汤。你喝了一口。\n没有人问你在调查什么。没有人问你经历了什么。\n他们只是让你坐在那里。在沃切斯特，这已经是一种奢侈。",effects:{food:1,san:3,add_run_memory:{text:"和渔民围坐在篝火旁，得到了片刻的温暖。"}},event_classification:"正常事件",normalcy_anchor:true,choices:[]},
{id:"humanity_trade_001",name:"伊莎贝拉的危险仪式",type:"humanity",subtype:"special_trade",weight:1,tier:"rare",tags:["humanity","trade","npc","isabella","ritual"],trigger:{areas:["town_center"],humanity_max:30,probability:0.15,once_per_run:true,npc_alive:["伊莎贝拉·韦伯"],npc_trust_gte:{"伊莎贝拉·韦伯":3}},description:"伊莎贝拉把你拉到教堂的地下室。\n「你变了，」她说，「但也许这是必要的。」\n她从祭坛下面拿出一本古老的书。\n「这个仪式可以让你看到封印的真面目。但代价是——」\n她停顿了一下。\n「你的部分人性。永久的。」\n她看着你。「你愿意吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"接受仪式",text:"伊莎贝拉开始念诵。你感到一阵冰冷从脊椎蔓延到四肢。",effects:{humanity:-15,mythos:5,add_clue:"clue_humanity_isabella_ritual",san:-3,add_run_memory:{text:"接受了伊莎贝拉的危险仪式。失去了部分人性。"}}},{label:"拒绝",text:"「不。」伊莎贝拉点了点头。「也许你是对的。」",effects:{san:1,add_run_memory:{text:"拒绝了伊莎贝拉的危险仪式。"}}}]},{id:"humanity_trade_002",name:"老费舍的交易",type:"humanity",subtype:"special_trade",weight:1,tier:"rare",tags:["humanity","trade","npc","fisher","blood"],trigger:{areas:["harbor_district"],humanity_max:35,probability:0.12,once_per_run:true,npc_alive:["老费舍"],npc_trust_gte:{"老费舍":4}},description:"老费舍把你拉到码头的角落。他的眼睛在月光下闪着异样的光。\n「你需要的东西，我可以给你，」他低声说，「但你需要给我一些东西。」\n他伸出手臂。袖子下面是一片鳞片。\n「血，」他说，「你的血。混在我的血里。这样我就能告诉你水下的秘密。」\n你知道这不是正常的要求。但他眼里的认真让你无法拒绝。",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"同意交换血液",text:"他用一把小刀割开了你的手掌，也割开了自己的。你们的血混在了一起。",effects:{hp:-2,humanity:-5,mythos:3,add_clue:"clue_humanity_fisher_blood",add_run_memory:{text:"和老费舍交换了血液。知道了水下的秘密。"}}},{label:"拒绝",text:"「不。」老费舍叹了口气。「也许下次。」",effects:{add_run_memory:{text:"拒绝了老费舍的血液交易。"}}}]},{id:"humanity_trade_003",name:"希尔达的交换",type:"humanity",subtype:"special_trade",weight:1,tier:"rare",tags:["humanity","trade","npc","hilda","knowledge"],trigger:{areas:["voxchester_manor"],humanity_min:70,probability:0.12,once_per_run:true,npc_alive:["希尔达·莫里斯"],npc_trust_gte:{"希尔达·莫里斯":4}},description:"希尔达坐在壁炉旁。火光映在她的脸上，让她看起来比实际年龄更老。\n「我可以告诉你莫里斯家族的秘密，」她说，「但你需要帮我一个忙。」\n她从口袋里掏出一封信。\n「把这封信送到灯塔。不要打开。不要看里面的内容。」\n信封是用蜡封住的。蜡的颜色是深红色——像血。",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"同意送信",text:"你接过信封。信封很重，不像是只装了一张纸。",effects:{add_item:{item_id:"hilda_letter",name:"希尔达的信",uses:1},add_clue:"clue_humanity_hilda_letter",add_run_memory:{text:"答应帮希尔达送信到灯塔。"}}},{label:"拒绝",text:"「我不能答应。」希尔达点了点头。「我理解。」",effects:{add_run_memory:{text:"拒绝了希尔达的请求。"}}}]},{id:"humanity_trade_004",name:"汤米的暗房",type:"humanity",subtype:"special_trade",weight:1,tier:"rare",tags:["humanity","trade","npc","tommy","photo"],trigger:{areas:["town_center"],humanity_min:60,probability:0.12,once_per_run:true,npc_alive:["汤米·陈"],npc_trust_gte:{"汤米·陈":3}},description:"汤米把你拉进暗房。红色的灯光下，他给你看了一些照片。\n「这些不是我拍的，」他低声说，「它们自己出现在我的暗房里。」\n照片上是沃切斯特的各种场景。但角度很奇怪——像是从很高的地方俯拍。\n「我可以给你看更多。但你需要帮我一件事——帮我查清楚这些照片是从哪里来的。」\n他的手在发抖。",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"答应调查",text:"你点了点头。汤米从暗房深处拿出了一叠照片。",effects:{add_clue:"clue_humanity_tommy_mystery_photos",add_run_memory:{text:"答应帮汤米调查神秘照片的来源。"}}},{label:"拒绝",text:"「我现在太忙了。」汤米看起来很失望。",effects:{add_run_memory:{text:"拒绝了汤米的请求。"}}}]},{id:"humanity_trade_005",name:"约书亚的条件",type:"humanity",subtype:"special_trade",weight:1,tier:"rare",tags:["humanity","trade","npc","joshua","military"],trigger:{areas:["harbor_district"],humanity_min:50,humanity_max:70,probability:0.12,once_per_run:true,npc_alive:["约书亚·布莱克"],npc_trust_gte:{"约书亚·布莱克":3}},description:"约书亚坐在码头边，看着海面。你走过去坐下。\n「我可以告诉你灯塔下面有什么，」他说，「但你需要帮我一件事。」\n他从口袋里掏出一张照片。照片上是一个女人和一个孩子。\n「帮我找到他们。他们应该在波士顿。但我不确定。」\n他的眼神很复杂——期待、恐惧、还有某种你认不出来的东西。",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"答应帮忙",text:"「我试试。」约书亚点了点头，开始告诉你灯塔下面的事。",effects:{add_clue:"clue_humanity_joshua_lighthouse",add_run_memory:{text:"答应帮约书亚寻找他的家人。"}}},{label:"拒绝",text:"「我可能活不到去波士顿。」约书亚沉默了很久。「我知道。」",effects:{add_run_memory:{text:"拒绝了约书亚的请求。"}}}]},{id:"humanity_trade_006",name:"埃德加的灵感",type:"humanity",subtype:"special_trade",weight:1,tier:"rare",tags:["humanity","trade","npc","edgar","story"],trigger:{areas:["town_center"],humanity_min:60,probability:0.1,once_per_run:true,npc_alive:["埃德加·洛夫克拉夫特"],npc_trust_gte:{"埃德加·洛夫克拉夫特":3}},description:"埃德加找到你。他的眼睛里闪着一种狂热的光。\n「我需要你的故事，」他说，「全部。从你来到沃切斯特开始。」\n他拿出笔记本。\n「作为交换，我可以给你看一些我写的东西。关于沃切斯特的真相。我调查了很久。」\n他翻开笔记本。你看到了一些字——是关于封印的。\n「成交？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"交换故事",text:"你花了一个小时告诉埃德加你的经历。他不停地记录。",effects:{add_clue:"clue_humanity_edgar_truth",add_run_memory:{text:"和埃德加交换了信息。"}}},{label:"拒绝",text:"「我的故事不是用来写的。」埃德加看起来很失望。",effects:{add_run_memory:{text:"拒绝和埃德加交换信息。"}}}]}];var humanityEvents=_events_humanityEvents;
