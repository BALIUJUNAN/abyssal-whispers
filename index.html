{id:"npc_cross_death_001",name:"玛莎的哀悼",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","martha"],trigger:{areas:["harbor_district"],npc_dead:["老费舍"],npc_alive:["玛莎·格雷"],npc_trust_gte:{"玛莎·格雷":2},probability:0.2,once_per_run:true},description:"你走进酒吧。玛莎坐在吧台后面，眼睛红红的。\n「老费舍走了，」她说，声音很轻。\n她擦了擦眼睛。「他……他是我父亲。」\n她看着你。「你知道吗？」\n你点了点头。\n「他一直在这里。一直在沃切斯特。但他从来没有告诉我——」\n她的声音哽咽了。",effects:{npc_trust:{"玛莎·格雷":1},san:-1,add_run_memory:{text:"玛莎告诉你老费舍是她的父亲。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_death_002",name:"伊莱亚斯的悲伤",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","elias"],trigger:{areas:["town_center"],npc_dead:["伊莎贝拉·韦伯"],npc_alive:["伊莱亚斯·沃德"],npc_trust_gte:{"伊莱亚斯·沃德":2},probability:0.2,once_per_run:true},description:"你走进伊莱亚斯的书房。他坐在椅子上，手里握着一本旧书。\n「伊莎贝拉走了，」他说，声音很平静。\n他翻开书。「她知道很多关于封印的事。现在——」\n他合上了书。\n「现在这些知识都消失了。」\n他看着你。「你还记得她告诉过你什么吗？」",effects:{npc_trust:{"伊莱亚斯·沃德":1},san:-1,add_run_memory:{text:"伊莱亚斯因为伊莎贝拉的死而悲伤。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_death_003",name:"希尔达的崩溃",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","hilda"],trigger:{areas:["voxchester_manor"],npc_dead:["伊莱亚斯·沃德"],npc_alive:["希尔达·莫里斯"],npc_trust_gte:{"希尔达·莫里斯":3},probability:0.15,once_per_run:true},description:"你走进庄园。希尔达坐在壁炉旁，手里握着一封信。\n「伊莱亚斯走了，」她说，声音很轻。\n她把信递给你。信是伊莱亚斯写的。你读了信。\n信里写道：「希尔达，如果我走了，请把地下室的东西交给那个调查员。他会知道怎么做。」\n希尔达看着你。「你想知道地下室有什么吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"想知道",text:"「告诉我。」希尔达带你去了地下室。",effects:{npc_trust:{"希尔达·莫里斯":1},add_clue:"clue_npc_cross_elias_basement",add_run_memory:{text:"希尔达告诉你了伊莱亚斯留在地下室的东西。"}}},{label:"不追问",text:"「也许现在不是时候。」希尔达点了点头。",effects:{add_run_memory:{text:"没有追问伊莱亚斯留在地下室的东西。"}}}]},{id:"npc_cross_death_004",name:"汤米的愤怒",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","tommy","anger"],trigger:{areas:["town_center"],npc_dead:["埃德加·洛夫克拉夫特"],npc_alive:["汤米·陈"],npc_trust_gte:{"汤米·陈":2},probability:0.15,once_per_run:true},description:"你走进汤米的店铺。他的眼睛红红的。\n「埃德加走了，」他说，声音很愤怒。\n他把一叠照片摔在柜台上。「他一直在写关于沃切斯特的文章。他知道了太多。」\n他看着你。「你觉得他是怎么死的？」\n你没有回答。\n「我知道是怎么死的。是沃切斯特杀了他。是这个该死的城市。」",effects:{npc_trust:{"汤米·陈":1},san:-1,add_run_memory:{text:"汤米因为埃德加的死而愤怒。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_death_005",name:"约书亚的沉默",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","joshua","silence"],trigger:{areas:["harbor_district"],npc_dead:["玛莎·格雷"],npc_alive:["约书亚·布莱克"],npc_trust_gte:{"约书亚·布莱克":2},probability:0.15,once_per_run:true},description:"你走到码头边。约书亚坐在那里，看着海面。\n你坐下来。他没有看你。\n过了很久，他开口了：\n「玛莎走了。」\n他沉默了很久。\n「她是我妹妹。」\n他看着海面。「我一直在这里。一直在保护她。但我——」\n他的声音哽咽了。\n「我没能保护她。」",effects:{npc_trust:{"约书亚·布莱克":1},san:-1,add_run_memory:{text:"约书亚告诉你玛莎是他的妹妹。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_death_006",name:"伊莎贝拉的祈祷",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","isabella","prayer"],trigger:{areas:["town_center"],npc_dead:["希尔达·莫里斯"],npc_alive:["伊莎贝拉·韦伯"],npc_trust_gte:{"伊莎贝拉·韦伯":2},probability:0.15,once_per_run:true},description:"你走进教堂。伊莎贝拉跪在祭坛前，低声祈祷。\n你走近时，她站了起来。\n「希尔达走了，」她说，声音很平静。\n她看着你。「她是莫里斯家族最后的血脉。现在——」\n她停住了。\n「现在封印的钥匙——」\n她没有说完。但你知道——封印的钥匙消失了。",effects:{npc_trust:{"伊莎贝拉·韦伯":1},san:-2,add_run_memory:{text:"伊莎贝拉告诉你希尔达的死意味着封印的钥匙消失了。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_death_007",name:"老费舍的遗言",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","fisher","legacy"],trigger:{areas:["harbor_district"],npc_dead:["约书亚·布莱克"],npc_alive:["老费舍"],npc_trust_gte:{"老费舍":3},probability:0.15,once_per_run:true},description:"你走到码头边。老费舍坐在那里，手里握着一个贝壳。\n「约书亚走了，」他说，声音很轻。\n他把贝壳递给你。「这是他留给你的。」\n你接过贝壳。贝壳的背面刻着一个符号——和封印上的符号一样。\n「他说——如果你找到了灯塔下面的东西，用这个。」\n老费舍看着海面。\n「他一直在保护我们。但他没能保护自己。」",effects:{add_item:{item_id:"joshua_shell",name:"约书亚的贝壳",uses:1},add_clue:"clue_npc_cross_joshua_shell",add_run_memory:{text:"收到了约书亚留下的贝壳。"}},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_death_008",name:"埃德加的遗稿",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","edgar","manuscript"],trigger:{areas:["town_center"],npc_dead:["伊莱亚斯·沃德"],npc_alive:["埃德加·洛夫克拉夫特"],npc_trust_gte:{"埃德加·洛夫克拉夫特":2},probability:0.15,once_per_run:true},description:"你走进埃德加的房间。他坐在桌前，手里握着一叠手稿。\n「伊莱亚斯走了，」他说，声音很平静。\n他把手稿递给你。「这是他留给你的。」\n你翻看手稿。里面记载了伊莱亚斯关于封印的研究。\n「他研究了二十年。现在——」\n埃德加看着你。\n「现在这些知识需要有人继承。你愿意吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"愿意",text:"「我愿意。」埃德加点了点头。",effects:{npc_trust:{"埃德加·洛夫克拉夫特":1},add_clue:"clue_npc_cross_elias_legacy",add_run_memory:{text:"继承了伊莱亚斯的研究。"}}},{label:"不能",text:"「我不能。」埃德加叹了口气。",effects:{add_run_memory:{text:"拒绝了继承伊莱亚斯的研究。"}}}]},{id:"npc_cross_death_009",name:"希尔达的遗产",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","hilda","legacy"],trigger:{areas:["voxchester_manor"],npc_dead:["希尔达·莫里斯"],npc_alive:["伊莱亚斯·沃德"],npc_trust_gte:{"伊莱亚斯·沃德":3},probability:0.1,once_per_run:true},description:"你走进伊莱亚斯的书房。他坐在椅子上，手里握着一把钥匙。\n「希尔达走了，」他说，声音很平静。\n他把钥匙递给你。「这是她留给你的。庄园地下室的钥匙。」\n你接过钥匙。钥匙很旧，但保养得很好。\n「她在地下室藏了东西。关于封印的东西。」\n伊莱亚斯看着你。\n「你想去看看吗？」",effects:{add_item:{item_id:"hilda_basement_key",name:"希尔达的地下室钥匙",uses:1},add_clue:"clue_npc_cross_hilda_basement"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_death_010",name:"玛莎的酒吧",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","martha","bar"],trigger:{areas:["harbor_district"],npc_dead:["玛莎·格雷"],npc_alive:["老费舍"],npc_trust_gte:{"老费舍":2},probability:0.15,once_per_run:true},description:"你走进酒吧。老费舍坐在吧台后面，手里握着一瓶酒。\n「玛莎走了，」他说，声音很轻。\n他给你倒了一杯酒。「她一直在这里。一直在等我。」\n他看着酒吧的四周。\n「现在——酒吧是你的了。」\n你摇了摇头。\n「不。酒吧是大家的。」\n老费舍点了点头。\n「你说得对。酒吧是大家的。」",effects:{npc_trust:{"老费舍":1},san:1,add_run_memory:{text:"老费舍说酒吧是大家的。"}},event_classification:"NPC互动",normalcy_anchor:true,choices:[]},{id:"npc_cross_death_011",name:"汤米的告别",type:"npc_cross",subtype:"death_chain",weight:1,tier:"normal",tags:["npc","cross","death","tommy","farewell"],trigger:{areas:["town_center"],npc_dead:["汤米·陈"],npc_alive:["伊莱亚斯·沃德"],npc_trust_gte:{"伊莱亚斯·沃德":2},probability:0.15,once_per_run:true},description:"你走进伊莱亚斯的书房。他坐在椅子上，手里握着一张照片。\n「汤米走了，」他说，声音很平静。\n他把照片递给你。照片上是沃切斯特的全景。\n「他一直在记录这个城市。现在——」\n伊莱亚斯看着照片。\n「现在他的照片需要有人来保管。你愿意吗？」",effects:{},event_classification:"NPC互动",normalcy_anchor:false,choices:[{label:"愿意",text:"「我愿意。」伊莱亚斯点了点头。",effects:{npc_trust:{"伊莱亚斯·沃德":1},add_clue:"clue_npc_cross_tommy_photos_legacy",add_run_memory:{text:"保管了汤米的照片。"}}},{label:"不能",text:"「我不能。」伊莱亚斯叹了口气。",effects:{add_run_memory:{text:"拒绝了保管汤米的照片。"}}}]},{id:"npc_cross_death_012",name:"最后的联盟",type:"npc_cross",subtype:"death_chain",weight:1,tier:"rare",tags:["npc","cross","death","final"],trigger:{areas:["town_center"],npc_dead:["伊莎贝拉·韦伯","希尔达·莫里斯"],npc_alive:["伊莱亚斯·沃德","老费舍"],npc_trust_gte:{"伊莱亚斯·沃德":3,"老费舍":3},probability:0.05,once_per_run:true},description:"你走进伊莱亚斯的书房。老费舍也在。\n「伊莎贝拉和希尔达都走了，」伊莱亚斯说，声音很沉重。\n老费舍补充道：「封印的钥匙——只剩下我们了。」\n他们看着你。\n「我们三个——必须一起面对。」\n你知道——这将是最后的联盟。",effects:{npc_trust:{"伊莱亚斯·沃德":1,"老费舍":1},add_clue:"clue_npc_cross_final_alliance",unlock_ending_condition:"ending_seal_final_alliance_available"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},

」伊莱亚斯说，「森林深处的东西——我们一起面对。」\n埃德加点了点头。「我来记录。」\n你们三个人走进了森林。空气变得潮湿。\n你们开始往前走。路很长，很暗。\n你知道——森林深处有什么东西在等着你们。",effects:{add_clue:"clue_npc_cross_forest_team",san:-2},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_team_005",name:"码头的巡逻",type:"npc_cross",subtype:"team_action",weight:1,tier:"rare",tags:["npc","cross","team","harbor"],trigger:{areas:["harbor_district"],min_loop:3,npc_trust_gte:{"玛莎·格雷":4,"约书亚·布莱克":4,"老费舍":4},probability:0.06,once_per_run:true,npc_alive:["玛莎·格雷","约书亚·布莱克","老费舍"]},description:"你站在码头边。玛莎、约书亚和老费舍站在你身边。\n「我们一起巡逻，」玛莎说，「码头最近不太平。」\n约书亚点了点头。「我知道那些东西从哪里来。」\n老费舍补充道：「我知道怎么对付它们。」\n你们四个人开始沿着码头巡逻。海面很平静。但你知道——水下面不是。",effects:{add_clue:"clue_npc_cross_harbor_patrol",san:-1},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_team_006",name:"遗迹探索",type:"npc_cross",subtype:"team_action",weight:1,tier:"rare",tags:["npc","cross","team","ruins"],trigger:{areas:["ruins_of_yith"],min_loop:5,npc_trust_gte:{"伊莱亚斯·沃德":4,"希尔达·莫里斯":4,"埃德加·洛夫克拉夫特":4},probability:0.05,once_per_run:true,npc_alive:["伊莱亚斯·沃德","希尔达·莫里斯","埃德加·洛夫克拉夫特"]},description:"你站在伊斯遗迹前面。伊莱亚斯、希尔达和埃德加站在你身边。\n「我们一起去，」伊莱亚斯说，「遗迹里面的东西——我们一起面对。」\n希尔达点了点头。「我知道怎么启动机器。」\n埃德加补充道：「我来记录一切。」\n你们四个人走进了遗迹。空气变得异常寒冷。\n你们开始往前走。路很长，很暗。\n你知道——遗迹里面有什么东西在等着你们。",effects:{add_clue:"clue_npc_cross_ruins_team",san:-3,mythos:2},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_team_007",name:"深渊的远征",type:"npc_cross",subtype:"team_action",weight:1,tier:"signature",tags:["npc","cross","team","deep"],trigger:{areas:["deep_catacombs"],min_loop:5,npc_trust_gte:{"伊莱亚斯·沃德":4,"希尔达·莫里斯":4,"伊莎贝拉·韦伯":4,"老费舍":4},probability:0.03,once_per_run:true,npc_alive:["伊莱亚斯·沃德","希尔达·莫里斯","伊莎贝拉·韦伯","老费舍"]},description:"你站在深渊墓穴的入口。伊莱亚斯、希尔达、伊莎贝拉和老费舍站在你身边。\n「这是最后一次，」伊莱亚斯说，「深渊下面的东西——我们一起面对。」\n希尔达点了点头。「我的血脉可以打开门。」\n伊莎贝拉补充道：「我的祈祷可以保护我们。」\n老费舍补充道：「我知道水下的路。」\n你们五个人走进了深渊。空气变得稠密。\n你们开始往下走。路很长，很暗。\n你知道——深渊下面有什么东西在等着你们。",effects:{add_clue:"clue_npc_cross_deep_team",san:-3,mythos:3,unlock_ending_condition:"ending_seal_team_available"},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"npc_cross_team_008",name:"最后的防线",type:"npc_cross",subtype:"team_action",weight:1,tier:"signature",tags:["npc","cross","team","final"],trigger:{areas:["deep_catacombs"],min_loop:7,npc_trust_gte:{"伊莱亚斯·沃德":4,"希尔达·莫里斯":4,"伊莎贝拉·韦伯":4,"约书亚·布莱克":4,"老费舍":4,"玛莎·格雷":4,"汤米·陈":4,"埃德加·洛夫克拉夫特":4},probability:0.01,once_per_run:true},description:"你站在深渊墓穴的最深处。所有的NPC都站在你身边。\n「这是最后的防线，」伊莱亚斯说，「如果封印破碎——」\n「我们一起面对，」希尔达补充道。\n伊莎贝拉开始祈祷。约书亚握紧了拳头。老费舍看着海面。玛莎擦了擦眼睛。汤米举起了相机。埃德加拿出了笔记本。\n你们八个人站在封印前面。\n你知道——这是最后的防线。",effects:{add_clue:"clue_npc_cross_final_defense",unlock_ending_condition:"ending_seal_all_available",san:-5,mythos:5},event_classification:"NPC互动",normalcy_anchor:false,choices:[]}];var npcCrossEvents=_events_npcCrossEvents;

{id:"area_town_center_001",name:"市政厅地下室",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center"],trigger:{areas:["town_center"],min_loop:2,probability:0.15,once_per_run:true},description:"你找到了市政厅的地下室入口。门是锁着的，但锁已经生锈了。\n你用力推了一下。门开了。\n地下室里堆满了旧文件。你翻了几页——是沃切斯特的市政记录。日期从1890年开始。\n你注意到——1895年的记录突然中断了。整整一年的记录消失了。",effects:{add_clue:"clue_area_town_hall_basement",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_002",name:"失踪档案",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","missing"],trigger:{areas:["town_center"],min_loop:2,probability:0.15,once_per_run:true},description:"你在市政厅的档案室找到了一份失踪人口名单。名单很长。\n你数了一下——过去五年，沃切斯特有四十七人失踪。\n你注意到一个规律——失踪的人都在每月的十五号失踪。\n你看了看日历。今天是十四号。",effects:{add_clue:"clue_area_missing_list",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_003",name:"晨星会名单",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","cult"],trigger:{areas:["town_center"],min_loop:3,probability:0.12,once_per_run:true},description:"你在教堂的密室里找到了一份名单。名单上写着「晨星会」。\n名单上有十几个名字。你认出了几个——是镇上的居民。\n名单的最后一页写着：「新成员招募中。条件：自愿献出部分意识。」\n你把名单翻过来。背面画着一个符号——和封印上的符号一样。",effects:{add_clue:"clue_area_morning_star",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_004",name:"玩家姓氏",type:"area_deep",subtype:"town_center",weight:1,tier:"rare",tags:["area","deep","town_center","personal"],trigger:{areas:["town_center"],min_loop:3,probability:0.1,once_per_run:true},description:"你在市政厅的旧档案里找到了一个熟悉的名字——你的姓氏。\n你仔细看。是一个和你同姓的人，在1893年来过沃切斯特。\n档案上写着：「调查员。来自波士顿。调查失踪案。」\n你翻到最后一页。记录写着：「调查员于1893年10月15日失踪。」\n你知道——你不是第一个来沃切斯特的调查员。",effects:{add_clue:"clue_area_family_name",san:-3,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_005",name:"公告栏变体",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","notice"],trigger:{areas:["town_center"],min_loop:2,probability:0.15,once_per_run:true},description:"你走到公告栏前。今天的公告和昨天不一样。\n你仔细看——不是内容变了，是顺序变了。像是有人重新排列过。\n你把公告一张张取下来。最底下有一张被其他公告盖住的纸。\n纸上写着一行字：「不要相信公告栏。它在说谎。」\n你把纸翻过来。背面是空白的。",effects:{add_clue:"clue_area_notice_board_lie",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_006",name:"图书馆的密室",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","library"],trigger:{areas:["town_center"],min_loop:3,probability:0.1,once_per_run:true},description:"你在图书馆的角落里发现了一扇隐藏的门。门后面是一间密室。\n密室里堆满了书。你翻开一本——是关于沃切斯特的历史。\n但这个版本和公开的版本不一样。这个版本提到了封印。\n书的最后一页写着：「这本书是给后来者的。如果你读到了这里——说明你已经走得很远了。",effects:{add_clue:"clue_area_library_secret",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_007",name:"教堂的钟楼",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","church"],trigger:{areas:["town_center"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你爬上了教堂的钟楼。钟楼很高，可以看到整个沃切斯特。\n你看着下面的城市。一切都是灰色的——屋顶、街道、海面。\n但你注意到了——灯塔的灯光是绿色的。不是正常的白光。\n你数了一下灯塔闪烁的节奏。三短。三长。三短。\nSOS。灯塔在发求救信号。",effects:{add_clue:"clue_area_church_tower_view",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_008",name:"酒馆的地下室",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","bar"],trigger:{areas:["town_center"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了酒馆的地下室入口。门是锁着的，但你有钥匙。\n地下室里很暗。你划亮了火柴。\n"+DESC.SYMBOLS_RING_DOOR_HERE+"",effects:{add_clue:"clue_area_bar_basement",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_009",name:"老照片",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","photo"],trigger:{areas:["town_center"],min_loop:2,probability:0.12,once_per_run:true},description:"你在汤米的店铺里找到了一张老照片。照片上是沃切斯特的广场。\n照片的日期是1890年。广场上站着一群人。\n你仔细看——人群中有一个人的影子不对。影子太长了。太瘦了。\n你把照片翻过来。背面写着一行字：「它一直在这里。」",effects:{add_clue:"clue_area_old_photo",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_010",name:"广场的裂缝",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","crack"],trigger:{areas:["town_center"],min_loop:3,probability:0.1,once_per_run:true},description:"你注意到广场的地面上有一道裂缝。裂缝很窄，但很深。\n你蹲下来，把耳朵贴在裂缝上。你听到了声音——从下面传来的。\n是敲击声。有节奏的。三短。三长。三短。\n你知道——裂缝下面有什么东西。但你看不到。\n你站起来。裂缝比刚才宽了一点。",effects:{add_clue:"clue_area_square_crack",san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_town_center_011",name:"杂货店的秘密",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","shop"],trigger:{areas:["town_center"],min_loop:2,probability:0.12,once_per_run:true},description:"你走进杂货店。店主不在。你环顾四周。\n货架的后面有一扇门。门是虚掩着的。\n你推开门。里面是一间小房间。房间里放着一些奇怪的东西——蜡烛、草药、还有一些你认不出的粉末。\n你知道——店主不只是一个普通的商人。",effects:{add_clue:"clue_area_shop_secret",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_town_center_012",name:"街灯的异常",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","light"],trigger:{areas:["town_center"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你走在街上。街灯的光在闪烁。\n你停下来。街灯的光不是正常的黄色——是绿色的。\n你环顾四周。所有的街灯都是绿色的。\n你知道——在沃切斯特，绿色的灯光不是好事。\n你加快了脚步。街灯的光跟着你。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_town_center_013",name:"墓地的墓碑",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","graveyard"],trigger:{areas:["town_center"],min_loop:2,probability:0.12,once_per_run:true},description:"你走进镇上的小墓地。墓碑很旧，字迹已经模糊了。\n你找到了一块墓碑。碑文写着一个名字——你认出了这个名字。\n是你的名字。\n你蹲下来仔细看。日期是1893年。\n你知道——你不是第一个来沃切斯特的调查员。但你可能是最后一个。",effects:{add_clue:"clue_area_graveyard_name",san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_town_center_014",name:"镇民的仪式",type:"area_deep",subtype:"town_center",weight:1,tier:"normal",tags:["area","deep","town_center","ritual"],trigger:{areas:["town_center"],min_loop:3,probability:0.08,time_phase:["midnight"],once_per_run:true},description:"你半夜醒来。窗外有光。\n你走到窗边。镇民们聚集在广场上。他们围成一个圆圈，手里拿着蜡烛。\n圆圈的中心站着一个人。你认出了他——是镇上的一个居民。\n他开始念诵。你听不清他在说什么。但你能感觉到——空气变得沉重了。\n你知道——镇民在进行某种仪式。",effects:{add_clue:"clue_area_town_ritual",san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_town_center_015",name:"市政厅的真相",type:"area_deep",subtype:"town_center",weight:1,tier:"rare",tags:["area","deep","town_center","truth"],trigger:{areas:["town_center"],min_loop:4,probability:0.08,once_per_run:true},description:"你在市政厅的最深处找到了一间密室。密室里有一张桌子。\n桌子上放着一本厚厚的书。你翻开书——是沃切斯特的建城史。\n但这个版本和公开的版本完全不同。\n真正的建造者不是清教徒。是某种从海里来的东西。它们建造了这座城市，作为某种……门。\n你合上书。手在发抖。",effects:{add_clue:"clue_area_town_truth",san:-4,mythos:2},event_classification:"调查",normalcy_anchor:false,choices:[]},
{id:"area_harbor_001",name:"退潮的秘密",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.15,time_phase:["midnight"],once_per_run:true},description:"退潮了。你走到码头边缘。\n海床露了出来。你看到了一些东西——在泥沙里。\n是一些石板。石板上有字。你认出了其中一些——和封印上的符号一样。\n你知道——这些石板不是自然形成的。是某种建筑的一部分。\n在沃切斯特的海床下面，有一座建筑。",effects:{add_clue:"clue_area_harbor_low_tide",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_harbor_002",name:"沉船",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","shipwreck"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,once_per_run:true},description:"你看到远处的海面上有一个黑点。你用望远镜看——是一艘沉船。\n船身已经腐烂了，但你还能看出船的名字——「晨星号」。\n你知道——晨星号是五年前失踪的。船上有一百多人。\n你把望远镜转向码头。有人在看着你。他看到你在看他，立刻转身走了。",effects:{add_clue:"clue_area_harbor_shipwreck",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_harbor_003",name:"航海日志",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","log"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,once_per_run:true},description:"你在仓库里找到了一本航海日志。日志是用英文写的。\n你翻开了第一页。日期是1890年。\n日志的主人写道：「今天我们到达了沃切斯特。海面很平静。但——」\n后面的字迹变得模糊了。你只能看清几个词：「海里有东西。」\n你翻到最后一页。日志的主人写道：「它醒了。」",effects:{add_clue:"clue_area_harbor_log",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_harbor_004",name:"渔民的秘密",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","fisherman"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了一个老渔民。他坐在码头边补网。\n你问他关于海里的事。他沉默了很久。\n「海里有东西，」他终于说，「不是鱼。是别的什么。」\n他看着海面。\n「每天半夜，海面会变黑。不是天黑——是海水本身变黑了。」\n他看着你。\n「你见过吗？」",effects:{add_clue:"clue_area_harbor_fisherman_secret",san:-1},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"area_harbor_005",name:"码头午夜禁令",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","midnight"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你半夜走到码头。一个守卫拦住了你。\n「午夜后码头禁止进入，」他说。\n你问他为什么。\n「因为——」他停住了。看着海面。\n「因为海里的东西。」\n你顺着他目光看去。海面很平静。但你注意到——海面的颜色不对。是黑色的。",effects:{add_clue:"clue_area_harbor_midnight_ban",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_harbor_006",name:"仓库的暗门",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","warehouse"],trigger:{areas:["harbor_district"],min_loop:3,probability:0.1,once_per_run:true},description:"你找到了仓库的暗门。门后面是一条通道。\n通道很长，很暗。你走了很久。\n通道的尽头是一间房间。房间里放着一些箱子。\n你打开了一个箱子。里面是一些瓶子。瓶子里装着一种黑色的液体。\n你闻了闻——是铁锈和海水的味道。\n你知道——这些瓶子不是普通的货物。",effects:{add_clue:"clue_area_harbor_warehouse_secret",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_harbor_007",name:"灯塔的信号",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","lighthouse"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你站在码头边，看着灯塔。灯塔的灯光在闪烁。\n你认出了闪烁的节奏——三短。三长。三短。SOS。\n你知道——灯塔里有人在发信号。但灯塔应该是空的。\n你把目光转向灯塔的底部。你看到了一些东西——在灯塔的底部，有一个人影。\n人影在看着你。然后人影消失了。",effects:{add_clue:"clue_area_harbor_lighthouse_signal",san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_harbor_008",name:"海水的颜色",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","sea"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,once_per_run:true},description:"你走到码头边缘，低头看水。海水的颜色不对。\n不是正常的蓝色——是深绿色。像是有什么东西在水里发光。\n你用手舀了一些水。水是温热的。\n你闻了闻——是铁锈和海水的味道。\n你知道——海水的颜色不是自然的。是某种东西在影响它。",effects:{add_clue:"clue_area_harbor_sea_color",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_harbor_009",name:"渔网里的东西",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","net"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,once_per_run:true},description:"你看到一个渔民在拉渔网。渔网很重。\n渔民用力拉。渔网里有东西——不是鱼。\n是一块石板。石板上有字。你认出了其中一些——和封印上的符号一样。\n渔民看到石板，脸色变了。他把石板扔回了海里。\n「不要看，」他说，「不要问。」",effects:{add_clue:"clue_area_harbor_net_stone",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_harbor_010",name:"码头的脚印",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","footprint"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你半夜走到码头。地面上有脚印。\n你蹲下来仔细看。脚印很大，比正常人的脚大两倍。\n脚印从海里延伸出来，走到了码头上，然后又回到了海里。\n你知道——这些脚印不是人类的。",effects:{add_clue:"clue_area_harbor_footprints",san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_harbor_011",name:"旧灯塔的残骸",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","ruins"],trigger:{areas:["harbor_district"],min_loop:3,probability:0.1,once_per_run:true},description:"你在码头的角落里找到了一些旧灯塔的残骸。残骸很旧，已经腐烂了。\n你翻了翻残骸。找到了一块金属板。金属板上有字。\n字是用英文写的：「灯塔建于1850年。毁于1895年。」\n你知道——现在的灯塔是重建的。但旧灯塔为什么被毁了？\n你把金属板翻过来。背面画着一个符号——和封印上的符号一样。",effects:{add_clue:"clue_area_harbor_old_lighthouse",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_harbor_012",name:"海面的漩涡",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","vortex"],trigger:{areas:["harbor_district"],min_loop:3,probability:0.08,time_phase:["midnight"],once_per_run:true},description:"你半夜走到码头。海面上出现了一个漩涡。\n漩涡很大，直径大概有十米。海水在漩涡里旋转，发出低沉的声音。\n你看着漩涡。漩涡的中心是黑色的——不是海水的颜色，是纯粹的黑色。\n你知道——漩涡下面有什么东西。但你看不到。\n漩涡持续了几分钟，然后消失了。海面恢复了平静。",effects:{add_clue:"clue_area_harbor_vortex",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_harbor_013",name:"渔民的传说",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","legend"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了一个老渔民。他给你讲了一个传说。\n「很久以前，海里有东西。不是鱼——是别的什么。」\n「它们建造了沃切斯特。然后它们沉入了海底。」\n「但它们没有消失。它们一直在海里。等着。」\n老渔民看着你。\n「你知道它们在等什么吗？」\n你摇了摇头。\n「它们在等封印破碎。」",effects:{add_clue:"clue_area_harbor_legend",san:-2,mythos:1},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"area_harbor_014",name:"码头的守卫",type:"area_deep",subtype:"harbor_district",weight:1,tier:"normal",tags:["area","deep","harbor","guard"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你半夜走到码头。一个守卫拦住了你。\n「你不能过去，」他说。\n你问他为什么。\n「因为——」他停住了。看着海面。\n「因为今晚是月圆之夜。海里的东西会出来。」\n你顺着他目光看去。海面很平静。但你注意到——海面的颜色不对。是黑色的。",effects:{add_clue:"clue_area_harbor_guard",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_harbor_015",name:"海底的建筑",type:"area_deep",subtype:"harbor_district",weight:1,tier:"rare",tags:["area","deep","harbor","underwater"],trigger:{areas:["harbor_district"],min_loop:4,probability:0.06,time_phase:["midnight"],once_per_run:true},description:"你半夜走到码头。海面很平静。\n你低头看水。水很清——比平时清得多。\n你看到了——在水下。是某种结构。线条很整齐，不像是自然形成的。\n你凑近看。结构变得更清晰了。像是一个建筑的轮廓。\n在沃切斯特的水面下，有一座建筑。\n你知道——这就是渔民们一直在回避的东西。",effects:{add_clue:"clue_area_harbor_underwater_building",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"area_forest_001",name:"树刻字",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest"],trigger:{areas:["whispering_forest"],min_loop:2,probability:0.15,once_per_run:true},description:"你走过一棵老橡树。树干上有刻字。\n你仔细看——是一句话，反复刻了很多遍：「不要去灯塔。」\n字迹很旧，已经和树皮融为一体了。但你注意到——最新的刻痕旁边有你的指纹。\n你没有刻过这些字。但你的指纹确实在那里。",effects:{add_clue:"clue_area_forest_tree_carving",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_forest_002",name:"伊莱亚斯崩溃地点",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","elias"],trigger:{areas:["whispering_forest"],min_loop:2,probability:0.12,once_per_run:true,npc_alive:["伊莱亚斯·沃德"]},description:"你找到了一个地方。地面上有一片烧焦的痕迹。\n你认出了这个地方——伊莱亚斯曾经在这里崩溃过。他告诉过你。\n你蹲下来。烧焦的痕迹里有字。你用手指描摹——是封印的符号。\n你知道——伊莱亚斯在这里看到了什么。但他说他记不清了。",effects:{add_clue:"clue_area_forest_elias_breakdown",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_forest_003",name:"林中祭坛",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","altar"],trigger:{areas:["whispering_forest"],min_loop:3,probability:0.1,once_per_run:true},description:"你在森林深处找到了一个祭坛。祭坛是用石头砌成的。\n祭坛上放着一些东西——蜡烛、草药、还有一些你认不出的粉末。\n你知道——有人在这里进行过某种仪式。\n你把耳朵贴在祭坛上。你听到了声音——从下面传来的。是低语声。很多人的低语声。",effects:{add_clue:"clue_area_forest_altar",san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_forest_004",name:"迷路回环",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","loop"],trigger:{areas:["whispering_forest"],min_loop:3,probability:0.1,once_per_run:true},description:"你在森林里走了很久。你确信这条路通往禁忌之林。\n但走了二十分钟后，你回到了起点。\n树上有一道你刚才刻下的标记——用来确认方向的那道。\n你没有转弯。你一直走的是直线。\n你又走了一次。这次用了三十分钟回到了起点。距离变长了。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_forest_005",name:"树洞里的信",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","letter"],trigger:{areas:["whispering_forest"],min_loop:3,probability:0.1,once_per_run:true},description:"你在一个树洞里找到了一封信。信封上写着你的名字。\n你打开信。信是用你的笔迹写的。\n「如果你读到这封信，说明你已经走了足够远。」\n「封印下面的东西不是邪恶的。它只是不同。」\n「做出你的选择。但要知道——每个选择都有代价。」\n信的末尾没有签名。但你知道——这是你写的。另一个你。",effects:{add_clue:"clue_area_forest_letter",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_forest_006",name:"低语的内容",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","whisper"],trigger:{areas:["whispering_forest"],min_loop:2,probability:0.12,once_per_run:true},description:"你听到了森林的低语声。但这次——你听清了内容。\n「门。开启。代价。血。」\n你摇了摇头。低语声变得模糊了。\n你知道——你刚才确实听懂了。森林在和你说话。",effects:{san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_forest_007",name:"林中的空地",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","clearing"],trigger:{areas:["whispering_forest"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了一片空地。空地中央有一块石头。\n石头上刻着封印的符号。符号在发光——微弱的，蓝绿色的光。\n你把手放在石头上。石头是温热的。\n你知道——这块石头不是自然形成的。是某种建筑的一部分。",effects:{add_clue:"clue_area_forest_clearing",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_forest_008",name:"血色种子",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","seed"],trigger:{areas:["whispering_forest"],min_loop:3,probability:0.1,once_per_run:true},description:"你在森林深处找到了一棵树。树上结着果实——深红色的，像是凝固的血液。\n你摘下一颗。果实是温热的。\n你切开果实。里面不是果肉——是一颗种子。种子的形状像一个蜷缩的人。\n你把种子放在耳边。种子在呼吸。\n你知道这不是普通的种子。这是某种……生命的容器。",effects:{add_clue:"clue_area_forest_curse_blood_seed",san:-3,mythos:1,add_item:{item_id:"curse_blood_seed_forest",name:"森林血种",uses:1}},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_forest_009",name:"回不来的路径",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","path"],trigger:{areas:["whispering_forest"],min_loop:3,probability:0.08,once_per_run:true},description:"你找到了一条小路。小路通往森林的更深处。\n你沿着小路走了很久。小路越来越窄，越来越暗。\n你停下来。回头看来时的路——路不见了。\n你转身继续走。前面的路也消失了。\n你站在森林的中间，四面八方都是树木。没有路。\n你知道——你走进了某种陷阱。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_forest_010",name:"古树的年轮",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","tree"],trigger:{areas:["whispering_forest"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了一棵古树。树干很粗，需要三个人才能合抱。\n你数了一下年轮——超过了五百年。\n你用匕首切开了一小块树皮。年轮里有字。\n你仔细看——是封印的符号。符号排列成一个圆环，和封印上的图案一样。\n你知道——这棵树不是普通的树。是封印的一部分。",effects:{add_clue:"clue_area_forest_ancient_tree",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_forest_011",name:"林中的祭品",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","offering"],trigger:{areas:["whispering_forest"],min_loop:2,probability:0.12,once_per_run:true},description:"你在森林里找到了一个祭坛。祭坛上放着一些东西——食物、蜡烛、还有一些你认不出的东西。\n你知道——有人在这里进行过某种仪式。\n你把耳朵贴在祭坛上。你听到了声音——从下面传来的。是低语声。很多人的低语声。\n你知道——祭坛下面有什么东西。但你看不到。",effects:{add_clue:"clue_area_forest_offering",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_forest_012",name:"树根的形状",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","roots"],trigger:{areas:["whispering_forest"],min_loop:2,probability:0.12,once_per_run:true},description:"你蹲下来看一棵树的树根。树根的形状不对。\n树根排列成一个图案——不是自然的生长方式，是某种有规律的排列。\n你认出了图案——是封印的一部分。\n你知道——这些树根不是自然生长的。是某种力量塑造了它们。",effects:{add_clue:"clue_area_forest_roots",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_forest_013",name:"林中的眼睛",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","eyes"],trigger:{areas:["whispering_forest"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你半夜走进森林。你看到了眼睛。很多双眼睛。\n眼睛在树丛中，在草丛里，在树干上。绿色的，闪烁的。\n你知道——这些眼睛不是动物的眼睛。动物的眼睛不会那么多。\n你停下了脚步。眼睛在看着你。没有敌意。只是看着。\n然后眼睛消失了。一只一只地，像是灯泡熄灭了。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_forest_014",name:"写给玩家的信",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"rare",tags:["area","deep","forest","letter","personal"],trigger:{areas:["whispering_forest"],min_loop:4,probability:0.06,once_per_run:true},description:"你在一棵古树的树洞里找到了一封信。信封上写着你的名字。\n你打开信。信是用一种你不认识的文字写的。但你读得懂。\n「亲爱的调查员：」\n「如果你读到这封信，说明你已经走了足够远。」\n「封印下面的东西不是邪恶的。它只是不同。」\n「钥匙不是用来打开封印的——是用来和它沟通的。」\n「做出你的选择。但要知道——每个选择都有代价。」\n信的末尾写着一个名字。你的名字。",effects:{add_clue:"clue_area_forest_personal_letter",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_forest_015",name:"森林的边界",type:"area_deep",subtype:"whispering_forest",weight:1,tier:"normal",tags:["area","deep","forest","border"],trigger:{areas:["whispering_forest"],min_loop:3,probability:0.08,once_per_run:true},description:"你走到了森林的边界。树木突然变少了。\n你站在边界上，回头看森林。森林很密，很暗。\n你转过身，看森林的另一边。是一片空地。\n空地的中央有一块石头。石头上刻着封印的符号。\n你知道——这块石头是森林的边界标记。也是封印的一部分。",effects:{add_clue:"clue_area_forest_border",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},
{id:"area_manor_001",name:"希尔达童年日记",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","hilda"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,once_per_run:true,npc_alive:["希尔达·莫里斯"]},description:"你在庄园的书房里找到了一本旧日记。是希尔达的童年日记。\n你翻开了第一页。日期是1910年。希尔达八岁。\n日记里写道：「今天我在地下室发现了密室。密室里有一扇门。门后面有声音。」\n你翻到最后一页。日记里写道：「门后面的声音越来越大了。我害怕。」\n你知道——希尔达从小就和封印有联系。",effects:{add_clue:"clue_area_manor_hilda_diary",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_manor_002",name:"莫里斯家族血脉",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","blood"],trigger:{areas:["voxchester_manor"],min_loop:3,probability:0.1,once_per_run:true},description:"你在庄园的地下室里找到了一幅家族谱系图。谱系图很长。\n你仔细看——莫里斯家族的血脉可以追溯到1690年代。沃切斯特建城之前。\n你注意到——有些名字的旁边画着一个符号。和封印上的符号一样。\n你知道——莫里斯家族和封印有某种深层的联系。",effects:{add_clue:"clue_area_manor_bloodline",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_manor_003",name:"锁住房间",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","locked"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,once_per_run:true},description:"你走到了庄园二楼尽头的房间。门是锁着的。\n你试着推了一下。推不开。\n你把耳朵贴在门上。你听到了声音——从里面传来的。是敲击声。有节奏的。\n你认出了节奏——三短。三长。三短。SOS。\n你知道——房间里有人在发信号。但房间里不应该有人。",effects:{add_clue:"clue_area_manor_locked_room",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_manor_004",name:"画像变化",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","portrait"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,once_per_run:true},description:"你走过走廊。墙上挂着一幅画像。画像是一个男人。\n你仔细看——男人的脸在变化。缓慢地，细微地。\n眼睛变大了一点。下巴变尖了一点。皮肤的颜色变深了一点。\n你揉了揉眼睛。画像恢复了正常。\n你知道——你刚才看到的不是幻觉。画像确实在变化。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_manor_005",name:"地下室的秘密",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","basement"],trigger:{areas:["voxchester_manor"],min_loop:3,probability:0.1,once_per_run:true},description:"你找到了庄园地下室的入口。门是锁着的，但你有钥匙。\n地下室里很暗。你划亮了火柴。\n"+DESC.SYMBOLS_RING_DOOR_HERE+"",effects:{add_clue:"clue_area_manor_basement",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_manor_006",name:"莫里斯家族的秘密",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","secret"],trigger:{areas:["voxchester_manor"],min_loop:3,probability:0.08,once_per_run:true},description:"你在庄园的书房里找到了一本旧书。书是用英文写的。\n你翻开了第一页。标题是《莫里斯家族史》。\n书里记载了莫里斯家族的历史。你注意到——家族的创始人不是人类。\n书的最后一页写道：「莫里斯家族的血脉来自海里。我们的使命是守护封印。」\n你知道——莫里斯家族和封印有深层的联系。",effects:{add_clue:"clue_area_manor_family_secret",san:-3,mythos:2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_manor_007",name:"庄园的守卫",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","guard"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你半夜走进庄园。你听到了脚步声。\n你躲到了一根柱子后面。一个人影从你面前走过。\n人影很高，四肢的比例不对。它在巡逻。\n你知道——庄园里有守卫。但守卫不是人类。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_manor_008",name:"庄园的日记",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","diary"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,once_per_run:true},description:"你在庄园的书房里找到了一本旧日记。日记的主人是莫里斯家族的祖先。\n你翻开了第一页。日期是1847年。\n日记的主人写道：「今天，我见到了祂们。不是在梦里——是真实的。」\n「祂们从海里来。祂们建造了封印。祂们把钥匙留在了莫里斯家族的血脉里。」\n你翻到最后一页。日记的主人写道：「我不能再写了。祂们知道我在记录。」",effects:{add_clue:"clue_area_manor_diary",san:-3,mythos:2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_manor_009",name:"庄园的花园",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","garden"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,once_per_run:true},description:"你走进庄园的花园。花园已经荒废了。\n你注意到——花园的植物全部枯死了。但枯死的方式不对——不是缺水，像是被什么东西吸干了水分。\n你蹲下来检查土壤。土壤是黑色的，带着铁锈和海水的味道。\n你知道——花园的土壤被污染了。被什么污染的？",effects:{add_clue:"clue_area_manor_garden",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_manor_010",name:"庄园的镜子",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","mirror"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,once_per_run:true},description:"你走过一面镜子。镜面上有字。\n你凑近看。字是反过来的，但你认出了内容：\n「地下室。第三根柱子。」\n你伸手去摸字迹。指尖碰到镜面时，字迹消失了。\n镜面上只留下了一滴水珠。你没有看到水珠是从哪里来的。",effects:{add_clue:"clue_area_manor_mirror",san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_manor_011",name:"庄园的声音",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","sound"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你半夜醒来。庄园里有声音。\n你走出房间。声音从走廊的尽头传来。\n是敲击声。有节奏的。三短。三长。三短。\n你沿着走廊走到尽头。声音从墙壁里传来。\n你把耳朵贴在墙上。声音更清晰了。是SOS。\n你知道——墙壁里有人在发信号。但墙壁里不应该有人。",effects:{add_clue:"clue_area_manor_wall_sound",san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_manor_012",name:"庄园的地下室入口",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","basement"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了庄园地下室的入口。入口在书房的书架后面。\n你推开了书架。书架后面是一扇门。门是锁着的。\n你试着推了一下。推不开。\n你把耳朵贴在门上。你听到了声音——从里面传来的。是低语声。很多人的低语声。\n你知道——地下室里有什么东西。但你看不到。",effects:{add_clue:"clue_area_manor_basement_entrance",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_manor_013",name:"庄园的画像",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","portrait"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,once_per_run:true},description:"你走过走廊。墙上挂着一幅画像。画像是一个女人。\n你仔细看——女人的脸很熟悉。你认出了她——是希尔达。但不是现在的希尔达。是年轻时候的希尔达。\n画像的旁边写着一行字：「莫里斯家族的守护者。」\n你知道——希尔达不是第一个守护者。",effects:{add_clue:"clue_area_manor_portrait",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_manor_014",name:"庄园的钟声",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"normal",tags:["area","deep","manor","bell"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你半夜醒来。庄园的钟声响了。\n你数了一下。十三下。\n然后又响了十三下。\n你等了一会儿。没有第三次。\n你知道——庄园的钟声和教堂的钟声一样。十三下。\n在沃切斯特，十三是一个特殊的数字。",effects:{san:-2,add_clue:"clue_area_manor_bell"},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_manor_015",name:"莫里斯家族的血脉真相",type:"area_deep",subtype:"voxchester_manor",weight:1,tier:"rare",tags:["area","deep","manor","truth"],trigger:{areas:["voxchester_manor"],min_loop:4,probability:0.06,once_per_run:true},description:"你在庄园的最深处找到了一间密室。密室里有一张桌子。\n桌子上放着一本厚厚的书。你翻开书——是莫里斯家族的血脉记录。\n你仔细看——血脉的源头不是人类。是某种从海里来的东西。\n书的最后一页写道：「莫里斯家族的使命是守护封印。当封印破碎时——」\n后面的字迹被划掉了。你无法辨认。",effects:{add_clue:"clue_area_manor_blood_truth",san:-4,mythos:3},event_classification:"调查",normalcy_anchor:false,choices:[]},
{id:"area_catacombs_001",name:"空石棺",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.15,once_per_run:true},description:"你找到了一个石棺。石棺是空的。\n你仔细看——石棺的内壁上有字。你认出了其中一些——和封印上的符号一样。\n字排列成一个圆环。圆环的中心写着一行字：「这里曾经有人。现在没有了。」\n你知道——石棺里的人去了哪里？",effects:{add_clue:"clue_area_catacombs_empty_coffin",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_catacombs_002",name:"铜镜",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","mirror"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了一面铜镜。铜镜很旧，已经失去了光泽。\n你用布擦了擦。铜镜的表面变得清晰了。\n你看着铜镜。镜子里映出了你的脸。但你的脸在变化——缓慢地，细微地。\n你眨了眨眼。铜镜恢复了正常。\n你知道——铜镜不是普通的镜子。它能映出某种……真相。",effects:{add_clue:"clue_area_catacombs_mirror",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_catacombs_003",name:"半截脚印",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","footprint"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你在墓穴的地板上看到了脚印。脚印只有半截——从墙壁里延伸出来，走了几步，然后消失了。\n你蹲下来仔细看。脚印很大，比正常人的脚大两倍。\n你知道——这些脚印不是人类的。是什么东西从墙壁里走出来，然后又回到了墙壁里。",effects:{add_clue:"clue_area_catacombs_footprints",san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_catacombs_004",name:"墓穴铭文",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","inscription"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了一块墓碑。碑文是用一种你不认识的文字写的。\n但你读得懂。\n碑文记载了封印的建造过程。建造者不是人类——是某种更古老的存在。\n封印不是为了保护人类。是为了把什么东西关在里面。\n你读到最后一行时，字迹开始模糊。你的鼻子流血了。",effects:{add_clue:"clue_area_catacombs_inscription",san:-3,mythos:2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_catacombs_005",name:"地下风声",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","wind"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你听到了风声。从墓穴的深处传来的。\n你沿着风声的方向走。风声越来越大。\n你走到了一个竖井的边缘。风从竖井里吹上来。\n你往下看。竖井很深，你看不到底。\n你知道——竖井下面有什么东西。但你看不到。",effects:{add_clue:"clue_area_catacombs_wind",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_catacombs_006",name:"石壁上的符号",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","symbol"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你看到了石壁上的符号。符号排列成一个圆环。\n"+DESC.SYMBOLS_NOT_CARVED+"",effects:{add_clue:"clue_area_catacombs_symbols",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_catacombs_007",name:"墓穴的回声",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","echo"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你在墓穴里喊了一声。回声传来——但回声说的是不同的话。\n你喊的是「有人吗？」\n回声说的是「又来了。」\n你又喊了一次。这次没有回声。沉默持续了太久，久到你开始怀疑自己刚才是不是真的喊过。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_catacombs_008",name:"墓穴的温度",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","temperature"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你走进墓穴。空气变冷了。\n你继续走。空气越来越冷。\n你走到了一个地方。空气突然变热了。\n你蹲下来。地面是温热的。\n你知道——地面下面有什么东西在产生热量。但你看不到。",effects:{add_clue:"clue_area_catacombs_temperature",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_catacombs_009",name:"墓穴的水滴",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","water"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你听到了水滴声。从墓穴的深处传来的。\n你沿着水滴声的方向走。水滴声越来越大。\n你走到了一个水池的边缘。水池很小，但很深。\n你低头看水。水是黑色的。\n你知道——水池下面有什么东西。但你看不到。",effects:{add_clue:"clue_area_catacombs_water",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_catacombs_010",name:"墓穴的壁画",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","mural"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你看到了一幅壁画。壁画上画着一群人。\n你仔细看——人群的中心站着一个不属于人类的轮廓。模糊的，但你能看出——它的四肢比例不对。\n壁画的旁边写着一行字：「祂们从海里来。」\n你知道——壁画记录了沃切斯特建城的真相。",effects:{add_clue:"clue_area_catacombs_mural",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_catacombs_011",name:"墓穴的陷阱",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"normal",tags:["area","deep","catacombs","trap"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.12,once_per_run:true},description:"你走到了一个地方。地板突然塌陷了。\n你掉了下去。不深——大概两米。但你的脚踝扭了。\n你抬头看。洞口的边缘有字。你认出了其中一些——和封印上的符号一样。\n你知道——这是一个陷阱。但陷阱不是为了杀死你——是为了把你带到下面。",effects:{add_clue:"clue_area_catacombs_trap",hp:-2,san:-1,mythos:1},event_classification:"陷阱",normalcy_anchor:false,choices:[]},{id:"area_catacombs_012",name:"墓穴的深处",type:"area_deep",subtype:"catacombs_entrance",weight:1,tier:"rare",tags:["area","deep","catacombs","deep"],trigger:{areas:["catacombs_entrance"],min_loop:3,probability:0.06,once_per_run:true},description:"你走到了墓穴的最深处。空气变得稠密。\n"+DESC.DEEP_EXPLORE_WALL_SKIN+"你知道——墙壁后面有什么东西。但你看不到。\n"+DESC.WALL_HAND_REMOVE+"",effects:{add_clue:"clue_area_catacombs_deep",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"area_lighthouse_001",name:"灯室暗格",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,once_per_run:true},description:"你在灯室里找到了一个暗格。暗格在灯的底座下面。\n你打开了暗格。里面是一本旧日记。日记的主人是上一任守灯人。\n日记的内容越来越混乱。最后几页几乎无法辨认。\n你能看清的只有：\n「它在灯下面。不是灯——是门。灯是钥匙。」\n「我看到了它。不是怪物——是真相。真相比怪物更可怕。」",effects:{add_clue:"clue_area_lighthouse_hidden_compartment",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_002",name:"约书亚旧照片",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","joshua"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,once_per_run:true,npc_alive:["约书亚·布莱克"]},description:"你在灯塔的地下室找到了一张旧照片。照片上是一个年轻的男人。\n你认出了他——是约书亚。年轻时候的约书亚。\n照片的背面写着一行字：「灯塔下面的秘密。」\n你知道——约书亚曾经来过灯塔。但他从来没有告诉你。",effects:{add_clue:"clue_area_lighthouse_joshua_photo",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_003",name:"绿光源头",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","green_light"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,once_per_run:true},description:"你爬到了灯塔的灯室。灯光是绿色的。\n你仔细看——灯光不是从灯泡里发出来的。是从灯泡下面的一个小孔里发出来的。\n你蹲下来。小孔里有光——绿色的，微弱的。\n你知道——绿光的源头不在灯泡里。在灯塔的下面。",effects:{add_clue:"clue_area_lighthouse_green_source",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_004",name:"守灯人制服",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","uniform"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,once_per_run:true},description:"你在灯塔的储藏室里找到了一套守灯人制服。制服很旧，但保养得很好。\n你试了试——制服很合身。像是为你量身定做的。\n你把手伸进口袋。口袋里有一张纸条。纸条上写着一行字：\n「穿上制服。你就是守灯人了。」\n你知道——这不是巧合。",effects:{add_clue:"clue_area_lighthouse_uniform",san:-2},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_005",name:"地下井",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","well"],trigger:{areas:["lighthouse"],min_loop:3,probability:0.1,once_per_run:true},description:"你在灯塔的地下室找到了一口井。井很深。\n你往下看。井水是黑色的。\n你把耳朵贴在井口。你听到了声音——从下面传来的。是低语声。很多人的低语声。\n你知道——井下面有什么东西。但你看不到。",effects:{add_clue:"clue_area_lighthouse_well",san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_006",name:"灯塔的地下室",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","basement"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,once_per_run:true},description:"你走进灯塔的地下室。地下室很大。\n"+DESC.SYMBOLS_RING_DOOR_HERE+"\n你知道——灯塔下面有一扇门。但门通向哪里？",effects:{add_clue:"clue_area_lighthouse_basement",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_007",name:"灯塔的蓝图",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","blueprint"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,once_per_run:true},description:"你在灯塔的地下室找到了一张蓝图。是灯塔的建造图纸。\n但图纸上有一些不属于灯塔的结构——一个巨大的圆形房间，在灯塔正下方。\n圆形房间的中心画着一个符号。你认出了它。是封印的核心。\n图纸的角落里写着一行字：「灯塔不是灯塔。灯塔是钥匙。」",effects:{add_clue:"clue_area_lighthouse_blueprint",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_008",name:"灯塔的守灯人",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","keeper"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,time_phase:["midnight"],once_per_run:true},description:"你半夜走进灯塔。灯室里有人。\n你认出了他——是上一任守灯人。但他应该已经失踪了。\n他看到你，没有说话。只是看着你。\n然后他转身，走进了灯室的暗门。暗门关上了。\n你知道——守灯人还在灯塔里。但他不是人类了。",effects:{add_clue:"clue_area_lighthouse_keeper",san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_009",name:"灯塔的光",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","light"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,once_per_run:true},description:"你爬到了灯塔的灯室。灯光是绿色的。\n你仔细看——灯光的节奏不对。不是正常的旋转。\n灯光在闪烁。三短。三长。三短。\n你知道——灯塔在发信号。但信号是发给谁的？",effects:{add_clue:"clue_area_lighthouse_signal",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_010",name:"灯塔的螺旋楼梯",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","stairs"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,once_per_run:true},description:"你爬上了灯塔的螺旋楼梯。楼梯很长。\n你数了一下——一百三十七级。比正常灯塔的楼梯多得多。\n你走到了楼梯的尽头。尽头是一扇门。门是锁着的。\n你试着推了一下。推不开。\n你知道——门后面有什么东西。但你看不到。",effects:{add_clue:"clue_area_lighthouse_stairs",san:-1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_011",name:"灯塔的守灯人日记",type:"area_deep",subtype:"lighthouse",weight:1,tier:"normal",tags:["area","deep","lighthouse","diary"],trigger:{areas:["lighthouse"],min_loop:2,probability:0.12,once_per_run:true},description:"你在灯塔的灯室里找到了一本日记。是上一任守灯人写的。\n日记的内容越来越混乱。最后几页几乎无法辨认。\n你能看清的只有：\n「它在灯下面。不是灯——是门。灯是钥匙。」\n「我看到了它。不是怪物——是真相。真相比怪物更可怕。」\n「我不能再守灯了。我看到了太多。」\n最后一页只有一句话：「它醒了。」",effects:{add_clue:"clue_area_lighthouse_keeper_diary",san:-3,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_lighthouse_012",name:"灯塔的真相",type:"area_deep",subtype:"lighthouse",weight:1,tier:"rare",tags:["area","deep","lighthouse","truth"],trigger:{areas:["lighthouse"],min_loop:4,probability:0.06,once_per_run:true},description:"你走到了灯塔的最深处。空气变得稠密。\n"+DESC.DEEP_EXPLORE_WALL_SKIN+"你知道——灯塔下面有什么东西。但你看不到。\n"+DESC.WALL_HAND_REMOVE+"\n你知道——灯塔的真相比你想象的更复杂。",effects:{add_clue:"clue_area_lighthouse_truth",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"area_ruins_001",name:"伊斯机器",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","machine"],trigger:{areas:["ruins_of_yith"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了伊斯机器。机器很大，表面覆盖着一层金属。\n你把手放在机器上。机器是温热的。\n你知道——机器还在运作。但机器是做什么用的？",effects:{add_clue:"clue_area_ruins_machine",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_ruins_002",name:"意识投射",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","projection"],trigger:{areas:["ruins_of_yith"],min_loop:3,probability:0.1,once_per_run:true},description:"伊斯机器完全亮了起来。你看到了一段影像——\n是你自己。但不是现在的你。\n影像里的你穿着一种你不认识的衣服，站在一个你不认识的地方。周围是巨大的建筑，天空是紫色的。\n你知道——影像里的是伊斯文明的城市。",effects:{add_clue:"clue_area_ruins_projection",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_ruins_003",name:"非人档案",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","archive"],trigger:{areas:["ruins_of_yith"],min_loop:3,probability:0.08,once_per_run:true},description:"你在伊斯遗迹的深处找到了一个档案室。档案室里有很多记录。\n你翻开一本记录。记录是用一种你不认识的文字写的。但你读得懂。\n记录记载了伊斯文明的历史。它们曾经统治过地球。然后它们离开了。\n它们留下了封印——不是为了保护人类，而是为了保护它们的遗产。",effects:{add_clue:"clue_area_ruins_archive",san:-3,mythos:3},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_ruins_004",name:"时间切片",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","time"],trigger:{areas:["ruins_of_yith"],min_loop:3,probability:0.08,once_per_run:true},description:"伊斯机器完全亮了起来。你看到了一段影像——\n是地球。几百万年前的地球。\n海里有什么东西在移动。巨大的，缓慢的，像是大陆本身在呼吸。\n然后它们来了——从星空中。它们落在地球上，建造了城市，建造了封印。\n影像的最后，它们离开了。但封印留下了。",effects:{add_clue:"clue_area_ruins_time_slice",san:-3,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_ruins_005",name:"遗迹的墙壁",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","wall"],trigger:{areas:["ruins_of_yith"],min_loop:2,probability:0.12,once_per_run:true},description:"你触摸伊斯遗迹的墙壁。石头里有脉络。\n不是自然的纹理——是某种管道系统。很细，肉眼几乎看不到。\n但你的指尖能感觉到它们。脉络里有什么东西在流动。\n你把手贴在墙上。流动的速度加快了。\n像是遗迹感应到了你的存在。",effects:{add_clue:"clue_area_ruins_wall",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_ruins_006",name:"遗迹的声音",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","sound"],trigger:{areas:["ruins_of_yith"],min_loop:2,probability:0.12,once_per_run:true},description:"你听到了声音。从遗迹的深处传来的。\n你沿着声音的方向走。声音越来越大。\n你走到了一个房间的门口。声音从房间里传来。\n你推开门。房间里有一台机器。机器在运作。\n你知道——声音是从机器里发出来的。但机器是做什么用的？",effects:{add_clue:"clue_area_ruins_sound",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_ruins_007",name:"遗迹的符号",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","symbol"],trigger:{areas:["ruins_of_yith"],min_loop:2,probability:0.12,once_per_run:true},description:"你看到了遗迹的墙壁上有符号。符号排列成一个圆环。\n"+DESC.SYMBOLS_NOT_CARVED+"",effects:{add_clue:"clue_area_ruins_symbol",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_ruins_008",name:"遗迹的光",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","light"],trigger:{areas:["ruins_of_yith"],min_loop:2,probability:0.12,once_per_run:true},description:"你走进遗迹。遗迹里有光。\n你仔细看——光是从墙壁的脉络里发出来的。脉络里的东西在发光。\n你知道——遗迹的光不是普通的光。是某种能量。",effects:{add_clue:"clue_area_ruins_light",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_ruins_009",name:"遗迹的真相",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"rare",tags:["area","deep","ruins","truth"],trigger:{areas:["ruins_of_yith"],min_loop:4,probability:0.06,once_per_run:true},description:"伊斯机器完全亮了起来。你看到了一段影像——\n是地球的未来。或者过去。你无法分辨。\n影像里，沃切斯特已经不存在了。海平面升高了，城市被淹没了。\n但在水下，封印还在运作。灯塔的废墟在水面上露出一个尖端。\n影像里有一个人——站在灯塔的废墟上。你认出了那个人。\n是你。",effects:{add_clue:"clue_area_ruins_truth",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_ruins_010",name:"遗迹的守护者",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","guardian"],trigger:{areas:["ruins_of_yith"],min_loop:3,probability:0.08,time_phase:["midnight"],once_per_run:true},description:"你半夜走进遗迹。遗迹里有人。\n你认出了他——是一个伊斯人。但他应该已经离开了。\n他看到你，没有说话。只是看着你。\n然后他转身，走进了遗迹的深处。他消失了。\n你知道——遗迹里还有守护者。但守护者不是人类。",effects:{add_clue:"clue_area_ruins_guardian",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_ruins_011",name:"遗迹的入口",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"normal",tags:["area","deep","ruins","entrance"],trigger:{areas:["ruins_of_yith"],min_loop:2,probability:0.12,once_per_run:true},description:"你走到了遗迹的入口。入口是一扇巨大的门。\n门是用一种你不认识的金属制成的。金属表面覆盖着符号。\n你试着推了一下门。门没有动。\n你知道——门需要钥匙。但钥匙是什么？",effects:{add_clue:"clue_area_ruins_entrance",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_ruins_012",name:"遗迹的秘密",type:"area_deep",subtype:"ruins_of_yith",weight:1,tier:"rare",tags:["area","deep","ruins","secret"],trigger:{areas:["ruins_of_yith"],min_loop:4,probability:0.06,once_per_run:true},description:"你走到了遗迹的最深处。空气变得稠密。\n"+DESC.DEEP_EXPLORE_WALL_SKIN+"你知道——遗迹下面有什么东西。但你看不到。\n"+DESC.WALL_HAND_REMOVE+"",effects:{add_clue:"clue_area_ruins_secret",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"area_grove_001",name:"古树根系",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove"],trigger:{areas:["forbidden_grove"],min_loop:2,probability:0.12,once_per_run:true},description:"你蹲下来看一棵古树的根系。根系很长，延伸到了很远的地方。\n你沿着根系走。根系在地下形成了一个图案。\n你认出了图案——是封印的一部分。\n你知道——这些古树的根系和封印有某种联系。",effects:{add_clue:"clue_area_grove_roots",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_grove_002",name:"写给玩家的信",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","letter"],trigger:{areas:["forbidden_grove"],min_loop:3,probability:0.1,once_per_run:true},description:"你在一棵古树的树洞里找到了一封信。信封上写着你的名字。\n你打开信。信是用一种你不认识的文字写的。但你读得懂。\n「亲爱的调查员：」\n「如果你读到这封信，说明你已经走了足够远。」\n「封印下面的东西不是邪恶的。它只是不同。」\n「钥匙不是用来打开封印的——是用来和它沟通的。」\n信的末尾写着一个名字。你的名字。",effects:{add_clue:"clue_area_grove_letter",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_grove_003",name:"血色种子",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","seed"],trigger:{areas:["forbidden_grove"],min_loop:2,probability:0.12,once_per_run:true},description:"你在禁忌之林的深处找到了一棵树。树上结着果实——深红色的，像是凝固的血液。\n你摘下一颗。果实是温热的。\n你切开果实。里面不是果肉——是一颗种子。种子的形状像一个蜷缩的人。\n你把种子放在耳边。种子在呼吸。\n你知道这不是普通的种子。这是某种……生命的容器。",effects:{add_clue:"clue_area_grove_curse_blood_seed",san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_grove_004",name:"回不来的路径",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","path"],trigger:{areas:["forbidden_grove"],min_loop:3,probability:0.08,once_per_run:true},description:"你找到了一条小路。小路通往禁忌之林的更深处。\n你沿着小路走了很久。小路越来越窄，越来越暗。\n你停下来。回头看来时的路——路不见了。\n你转身继续走。前面的路也消失了。\n你站在禁忌之林的中间，四面八方都是树木。没有路。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_grove_005",name:"古树的年轮",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","tree"],trigger:{areas:["forbidden_grove"],min_loop:2,probability:0.12,once_per_run:true},description:"你找到了一棵古树。树干很粗，需要三个人才能合抱。\n你数了一下年轮——超过了五百年。\n你用匕首切开了一小块树皮。年轮里有字。\n你仔细看——是封印的符号。符号排列成一个圆环，和封印上的图案一样。\n你知道——这棵树不是普通的树。是封印的一部分。",effects:{add_clue:"clue_area_grove_ancient_tree",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_grove_006",name:"禁忌之林的低语",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","whisper"],trigger:{areas:["forbidden_grove"],min_loop:2,probability:0.12,once_per_run:true},description:"你听到了禁忌之林的低语声。但这次——你听清了内容。\n「门。开启。代价。血。」\n你摇了摇头。低语声变得模糊了。\n你知道——你刚才确实听懂了。禁忌之林在和你说话。",effects:{san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_grove_007",name:"禁忌之林的祭坛",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","altar"],trigger:{areas:["forbidden_grove"],min_loop:3,probability:0.08,once_per_run:true},description:"你在禁忌之林的深处找到了一个祭坛。祭坛是用石头砌成的。\n祭坛上放着一些东西——蜡烛、草药、还有一些你认不出的粉末。\n你知道——有人在这里进行过某种仪式。\n你把耳朵贴在祭坛上。你听到了声音——从下面传来的。是低语声。很多人的低语声。",effects:{add_clue:"clue_area_grove_altar",san:-3,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_grove_008",name:"禁忌之林的符号",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","symbol"],trigger:{areas:["forbidden_grove"],min_loop:2,probability:0.12,once_per_run:true},description:"你看到了禁忌之林的树干上有符号。符号排列成一个圆环。\n"+DESC.SYMBOLS_NOT_CARVED+"",effects:{add_clue:"clue_area_grove_symbol",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_grove_009",name:"禁忌之林的光",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","light"],trigger:{areas:["forbidden_grove"],min_loop:2,probability:0.12,once_per_run:true},description:"你走进禁忌之林。禁忌之林里有光。\n你仔细看——光是从树干的脉络里发出来的。脉络里的东西在发光。\n你知道——禁忌之林的光不是普通的光。是某种能量。",effects:{add_clue:"clue_area_grove_light",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_grove_010",name:"禁忌之林的守护者",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","guardian"],trigger:{areas:["forbidden_grove"],min_loop:3,probability:0.08,time_phase:["midnight"],once_per_run:true},description:"你半夜走进禁忌之林。禁忌之林里有人。\n你认出了他——是一个古老的生物。但他不是人类。\n他看到你，没有说话。只是看着你。\n然后他转身，走进了禁忌之林的深处。他消失了。\n你知道——禁忌之林里还有守护者。但守护者不是人类。",effects:{add_clue:"clue_area_grove_guardian",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_grove_011",name:"禁忌之林的入口",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"normal",tags:["area","deep","grove","entrance"],trigger:{areas:["forbidden_grove"],min_loop:2,probability:0.12,once_per_run:true},description:"你走到了禁忌之林的入口。入口是一扇巨大的门。\n门是用一种你不认识的木材制成的。木材表面覆盖着符号。\n你试着推了一下门。门没有动。\n你知道——门需要钥匙。但钥匙是什么？",effects:{add_clue:"clue_area_grove_entrance",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_grove_012",name:"禁忌之林的秘密",type:"area_deep",subtype:"forbidden_grove",weight:1,tier:"rare",tags:["area","deep","grove","secret"],trigger:{areas:["forbidden_grove"],min_loop:4,probability:0.06,once_per_run:true},description:"你走到了禁忌之林的最深处。空气变得稠密。\n你感到了什么——在树木后面。是某种存在。微弱的，但确实存在。\n你把手贴在树干上。树干是软的。像皮肤。\n你知道——禁忌之林下面有什么东西。但你看不到。\n你把手移开。树干恢复了硬度。但你能感觉到——树干下面有东西在动。",effects:{add_clue:"clue_area_grove_secret",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"area_deep_001",name:"竖井",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs"],trigger:{areas:["deep_catacombs"],min_loop:2,probability:0.12,once_per_run:true},description:"你走到了一个竖井的边缘。竖井很深。\n你往下看。竖井里有光——绿色的，微弱的。\n你知道——竖井下面有什么东西。但你看不到。",effects:{add_clue:"clue_area_deep_shaft",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_deep_002",name:"温血脚印",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs","footprint"],trigger:{areas:["deep_catacombs"],min_loop:2,probability:0.12,once_per_run:true},description:"你在深渊墓穴的地板上看到了脚印。脚印是温热的。\n你蹲下来仔细看。脚印很大，比正常人的脚大两倍。\n你知道——这些脚印不是人类的。是什么东西从墙壁里走出来，然后又回到了墙壁里。",effects:{add_clue:"clue_area_deep_warm_footprints",san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_deep_003",name:"封印核心",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs","seal"],trigger:{areas:["deep_catacombs"],min_loop:3,probability:0.08,once_per_run:true},description:"你走到了深渊墓穴的最深处。空气变得稠密。\n你看到了封印的核心。核心是一个巨大的圆环，上面刻满了符号。\n符号在发光——绿色的，微弱的。\n你知道——封印的核心还在运作。但核心正在衰弱。",effects:{add_clue:"clue_area_deep_seal_core",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_deep_004",name:"墓穴深处的回声",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs","echo"],trigger:{areas:["deep_catacombs"],min_loop:2,probability:0.12,once_per_run:true},description:"你在深渊墓穴里喊了一声。回声传来——但回声说的是不同的话。\n你喊的是「有人吗？」\n回声说的是「又来了。」\n你又喊了一次。这次没有回声。沉默持续了太久，久到你开始怀疑自己刚才是不是真的喊过。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_deep_005",name:"终局线索",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"rare",tags:["area","deep","deep_catacombs","ending"],trigger:{areas:["deep_catacombs"],min_loop:4,probability:0.06,once_per_run:true},description:"你走到了深渊墓穴的最深处。你看到了一面墙。墙上写满了名字——你认出了几个。\n是其他调查员的名字。有些你见过，在失踪告示上。有些你没见过。\n每个名字旁边都有一个结局：疯狂、死亡、逃离、献祭……\n最后一个名字是你的。旁边的结局栏是空的。\n墙的底部刻着一行字：「选择你的结局。」",effects:{add_clue:"clue_area_deep_ending_wall",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_deep_006",name:"深渊的空气",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs","air"],trigger:{areas:["deep_catacombs"],min_loop:2,probability:0.12,once_per_run:true},description:"你走进深渊墓穴的深处。空气变了。\n不是变冷了——是变稠了。你感到呼吸变得困难。\n你伸出手。空气像是有了实体。你的手指在空气中划过，能感到轻微的阻力。\n你知道——在深渊墓穴的深处，空气本身就是某种存在的体液。",effects:{add_clue:"clue_area_deep_air",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_deep_007",name:"深渊的墙壁",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs","wall"],trigger:{areas:["deep_catacombs"],min_loop:2,probability:0.12,once_per_run:true},description:"你触摸深渊墓穴的墙壁。墙壁是软的。像皮肤。\n你把手贴在墙上。墙壁在呼吸。\n你知道——墙壁后面有什么东西。但你看不到。\n"+DESC.WALL_HAND_REMOVE+"",effects:{add_clue:"clue_area_deep_wall",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_deep_008",name:"深渊的声音",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs","sound"],trigger:{areas:["deep_catacombs"],min_loop:2,probability:0.12,once_per_run:true},description:"你听到了声音。从深渊墓穴的深处传来的。\n你沿着声音的方向走。声音越来越大。\n你走到了一个房间的门口。声音从房间里传来。\n你推开门。房间里有一台机器。机器在运作。\n你知道——声音是从机器里发出来的。但机器是做什么用的？",effects:{add_clue:"clue_area_deep_sound",san:-2,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_deep_009",name:"深渊的符号",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs","symbol"],trigger:{areas:["deep_catacombs"],min_loop:2,probability:0.12,once_per_run:true},description:"你看到了深渊墓穴的墙壁上有符号。符号排列成一个圆环。\n"+DESC.SYMBOLS_NOT_CARVED+"",effects:{add_clue:"clue_area_deep_symbol",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_deep_010",name:"深渊的光",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs","light"],trigger:{areas:["deep_catacombs"],min_loop:2,probability:0.12,once_per_run:true},description:"你走进深渊墓穴。深渊墓穴里有光。\n你仔细看——光是从墙壁的脉络里发出来的。脉络里的东西在发光。\n你知道——深渊墓穴的光不是普通的光。是某种能量。",effects:{add_clue:"clue_area_deep_light",san:-1,mythos:1},event_classification:"调查",normalcy_anchor:false,choices:[]},{id:"area_deep_011",name:"深渊的守护者",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"normal",tags:["area","deep","deep_catacombs","guardian"],trigger:{areas:["deep_catacombs"],min_loop:3,probability:0.08,time_phase:["midnight"],once_per_run:true},description:"你半夜走进深渊墓穴。深渊墓穴里有人。\n你认出了他——是一个古老的生物。但他不是人类。\n他看到你，没有说话。只是看着你。\n然后他转身，走进了深渊墓穴的深处。他消失了。\n你知道——深渊墓穴里还有守护者。但守护者不是人类。",effects:{add_clue:"clue_area_deep_guardian",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"area_deep_012",name:"深渊的秘密",type:"area_deep",subtype:"deep_catacombs",weight:1,tier:"rare",tags:["area","deep","deep_catacombs","secret"],trigger:{areas:["deep_catacombs"],min_loop:4,probability:0.06,once_per_run:true},description:"你走到了深渊墓穴的最深处。空气变得稠密。\n"+DESC.DEEP_EXPLORE_WALL_SKIN+"你知道——深渊墓穴下面有什么东西。但你看不到。\n"+DESC.WALL_HAND_REMOVE+"\n你知道——深渊的秘密比你想象的更复杂。",effects:{add_clue:"clue_area_deep_secret",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]}];var areaDeepEvents=_events_areaDeepEvents;
