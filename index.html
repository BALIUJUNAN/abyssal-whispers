function getDeathText(mode,type,state,sourceEvent){const area=state.currentArea||'某处';const day=state.day||1;const loop=state.loopCount||0;
const hpTexts={drowning:{title:'你死于溺水。',lastMoment:'你最后记得的是水。\n\n'+'不是冰冷，而是重量。\n\n'+'它从你的袖口、领口、口鼻灌进去。你想抓住码头边缘，但木板离你越来越远。\n\n'+'有人在岸上喊你的名字。\n\n'+'声音很熟悉。\n\n'+'像你自己。',worldHandles:'第二天，渔民在潮沟里找到一只怀表。表壳里全是盐。他们把它放在失物招领的箱子里。没有人来认领。',residue:'下一周目，码头会记得这件事。\n水面上会漂着一件外套。颜色、尺寸、袖口磨损的位置都和你身上的一样。\n你不会把它捞起来。\n你知道口袋里有什么。'},bleeding:{title:'你死于失血。',lastMoment:'伤口不疼了。\n\n'+'这是最糟的部分——当疼痛停止的时候，你知道已经太晚了。\n\n'+'你低头看着自己的手。手指在发白。\n\n'+'你试图站起来。膝盖没有响应。\n\n'+'你最后看到的是天花板上的裂缝。裂缝的形状像一条河。',worldHandles:'第二天，有人在你倒下的地方放了一束花。花是白色的。到了晚上就枯了。',residue:'下一周目，你的衣袖上会有一块洗不掉的深色印记。\n不是血。但你知道它是什么。'},infection:{title:'你死于感染。',lastMoment:'伤口已经不疼了。变成了一种持续的、低沉的热度。\n\n'+'你的视线开始模糊。你知道这是发烧。\n\n'+'你试图叫人。声音从喉咙里出来的时候，已经不像你的了。\n\n'+'你最后想到的是——你本可以用那瓶药的。',worldHandles:'安全屋的床单上留下了一片汗渍。形状像一只手。没有人去洗它。',residue:'下一周目，安全屋的床单上会有旧汗渍。\n你不会在意。\n但你的身体会记得那种热度。'},starvation:{title:'你死于饥饿。',lastMoment:'你已经不觉得饿了。\n\n'+'这才是最危险的信号。\n\n'+'你的身体在消耗自己。你能感觉到——不是疼痛，而是一种空洞。从胃开始，向四肢蔓延。\n\n'+'你最后看到的是一张空桌子。桌上有划痕。像是有人用指甲在上面写字。',worldHandles:'安全屋的餐桌上永远少了一副餐具。没有人记得原来有几副。',residue:'下一周目，你的餐桌上会多出一副没有人用的餐具。\n你会觉得这很正常。\n直到你数了数椅子。'},falling:{title:'你死于坠落。',lastMoment:'你听到风声。\n\n'+'不是外面的风——是你自己下坠时切割空气的声音。\n\n'+'你试图抓住什么。手指划过石壁，指甲断了两根。\n\n'+'你最后想到的是——坠落比你想象的要安静。',worldHandles:'竖井底部的石头上多了一道裂痕。形状像一个人。',residue:'下一周目，你会在某个高处听到骨头落地的声音。\n不是真的。\n但你的膝盖会发软。'},darkness_taken:{title:'你被黑暗吞噬。',lastMoment:'灯灭了。\n\n'+'你摸了摸口袋。火柴没了。\n\n'+'黑暗不是安静的。它有声音——低沉的、持续的、像是呼吸。\n\n'+'你感到有什么东西在你身边。不是敌人。更像是——等待。\n\n'+'你最后看到的是——\n\n'+'不。你什么都没看到。',worldHandles:'你的安全屋多了一盏没有人点燃的灯。灯油是满的。但火柴盒是空的。',residue:'下一周目，你醒来时嘴里会有石灰粉的味道。\n你会以为是做梦。\n但你的指甲缝里确实有白色的粉末。'},physical:{title:'你死了。',lastMoment:'你的身体停止了运作。\n\n'+'不是某个特定的原因。只是——磨损。累积的伤害、疲惫、和沃切斯特的重量。\n\n'+'你最后想到的是一个你本可以做但没有做的选择。',worldHandles:'有人在你倒下的地方做了一个标记。标记后来被雾冲掉了。',residue:'下一周目，你会在某个地方看到一个模糊的标记。\n你不会认出它。\n但你的身体会停下来。'}};
const sanTexts={madness:{title:'你疯了。',lastMoment:'你没有倒下。\n\n'+'这才是最糟的部分。\n\n'+'你继续站着，继续呼吸，继续看着沃切斯特的街道。街灯亮着。海风吹过来。有人从你身边经过，礼貌地点头。\n\n'+'你想回应。\n\n'+'但你想不起自己的名字。',worldHandles:'笔记本从你手里滑落。最后一页自己翻开。\n上面写着："该角色已失去观察资格。"',residue:'下一周目，笔记本上会出现不属于你的涂鸦。\n你不会记得写过它们。\n但笔迹确实是你的。'},possession:{title:'你被替换了。',lastMoment:'你没有失去意识。\n\n'+'你只是——退后了一步。\n\n'+'你的身体还在动。你的手还在翻书页。你的嘴还在说话。\n\n'+'但操作的人不是你。\n\n'+'你站在自己身体的后面，看着它继续生活。\n\n'+'它回头看了你一眼。\n\n'+'表情很平静。\n\n'+'像是在说——终于轮到我了。',worldHandles:'第二天，玛莎说你来过酒吧。你坐在角落里，一直写字。\n她问你写了什么。\n你写的是事件编号。',residue:'下一周目，NPC会说你昨晚来过。\n但你没有那段记忆。\n你的手会记得某些你没做过的动作。'},identity_erasure:{title:'你没有死。',lastMoment:'你的身体还在街上站着。\n你的手还握着笔记本。\n你的眼睛还看着这个世界。\n\n'+'只是从这一刻开始，看的人不再是你。\n\n'+'你想尖叫。但你的声音也被写进了 description 里。',worldHandles:'存档名短暂变成了空白。\n然后恢复了。\n但文件大小少了一个字节。',residue:'下一周目，你的名字会在某些地方消失。\nNPC会叫你"调查员"而不是你的名字。\n你不会注意到。\n直到你翻到笔记本的扉页。'},mythos_absorption:{title:'你知道得太多了。',lastMoment:'文字开始从书页上浮起来。\n\n'+'不是幻觉——是真的浮起来。字母、笔画、标点，像是被什么东西从纸面上拉了出来。\n\n'+'它们围着你旋转。你试图读它们。你确实读了。\n\n'+'你读懂了。\n\n'+'这才是最可怕的部分。',worldHandles:'你翻开的那本书自动合上了。书页的边缘烧焦了一小块。\n没有人再去碰它。',residue:'下一周目，你能读懂不该读懂的文字。\n但这不是礼物。\n文字也会读懂你。'},loop_collapse:{title:'循环崩塌了。',lastMoment:'世界少了一段你记得存在的路。\n\n'+'你站在路口。左边通向码头。右边通向森林。\n\n'+'但中间——\n\n'+'中间应该还有一条路。你走过很多次。你记得路边的那棵树。\n\n'+'路不见了。树也不见了。\n\n'+'你试图回忆那条路通向哪里。你的大脑拒绝了。\n\n'+'不是想不起来。是不允许想。',worldHandles:'沃切斯特的面积比昨天小了一点。\n没有人注意到。\n因为记忆也被一起删除了。',residue:'下一周目，地图上会少一条你记得存在的路。\n你不会质疑它。\n循环会帮你处理好一切。'},becomes_event:{title:'你成为了第600个事件。',lastMoment:'你写下了自己的名字。\n\n'+'名字从纸面上消失了。\n\n'+'你看了看自己的手。手也在消失。\n\n'+'你变成了文字。你变成了代码。你变成了一个 id 字段和一段 description 字符串。',worldHandles:'笔记本自动翻到了最后一页。上面只有一行字：\n"第六百个事件。状态：已触发。备注：玩家已不存在。"',residue:'下一周目，事件池里会多出一个不属于任何文件的事件。\n触发条件是：当玩家走到足够远的时候。\n事件的内容是——你的名字。'},mental:{title:'你的理智崩塌了。',lastMoment:'你试图抓住一个念头。任何念头。\n\n'+'但你的思绪像是握在手里的沙子。越用力，流失得越快。\n\n'+'你最后想到的是——\n\n'+'你忘了你要想什么。',worldHandles:'你的笔记本掉在了地上。没有人捡起它。\n风翻了几页。然后停了。',residue:'下一周目，你会在某个时刻突然忘记自己在做什么。\n只有几秒钟。\n但那几秒钟里，你不是你。'}};
const hybridTexts={body_and_self_lost:{title:'你死于身心俱灭。',lastMoment:'你的身体先倒下。\n\n'+'你的意识晚了一步。\n\n'+'它站在原地，看着你的尸体，像看着一件脱下来的外套。\n\n'+'然后它也开始下沉。\n\n'+'不是坠落——是溶解。像墨水滴进水里。\n\n'+'你最后看到的是自己的脸。表情很平静。\n\n'+'像是终于可以休息了。',worldHandles:'第二天，有人在你倒下的地方发现了两样东西：一只怀表和一本笔记本。\n怀表停了。笔记本的最后一页是空白的。\n没有人把它们放在一起。',residue:'下一周目，你会同时感到饥渴和空虚。\n身体想要食物。意识想要意义。\n两者都不会得到满足。'}};const textMap=mode==='hp'?hpTexts:mode==='san'?sanTexts:hybridTexts;const text=textMap[type]||textMap.physical||textMap.mental||textMap.body_and_self_lost||{title:'你死了。',lastMoment:'你的故事在这里中断了。',worldHandles:'世界继续运转。',residue:'下一周目，你会感到一阵莫名的熟悉。'};return[text.title,'',text.lastMoment,'','——','',text.worldHandles,'','——','',text.residue].join('\n');}
function getDeathTypeLabel(type){return ALL_DEATH_TYPES[type]?.label||type||'未知';}
const PROLOGUE_EVENTS=[
{id:'prologue_station',name:'灰雨车站',type:'prologue',subtype:'tutorial_choice',description:'长途汽车在一个没有名字的车站停了下来。\n\n雨不大，但每一滴都是灰色的。站台上没有人，售票窗口关着，玻璃上贴着一张手写的告示：\n\n"末班车已过。"\n\n你回头看了一眼来时的路。路已经看不见了。\n\n前方有一条铁轨，消失在浓雾里。铁轨下面传来水流的声音。',tutorial_hint:'【提示】选择一个行动。你的选择会被记录。',effects:{},choices:[{id:'approach_rail',label:'靠近铁轨，听那阵水声',text:'你蹲在铁轨边缘。水声比你想的要近——不是从铁轨下面，而是从铁轨本身。铁轨在滴水。每一节枕木都在缓慢地渗出某种液体，灰色的，比雨水更稠。\n\n你伸手碰了一下。冰冷。但那温度在你收回手之后还在往上走，一直走到手肘才停下来。',effects:{add_clue:{id:'clue_prologue_rail_water',name:'铁轨渗水'}},fear:{ocean:1,investigative:1}},{id:'check_schedule',label:'检查时刻表',text:'时刻表贴在售票窗口旁边的木板上。纸张已经泛黄，但字迹很清楚。\n\n你注意到一件事：这张时刻表上没有沃切斯特。所有的线路都经过这个车站，但没有任何一条线路在这里停靠。\n\n你又看了一遍。\n\n没错。这个车站不在任何一条线路上。但它存在。',effects:{add_clue:{id:'clue_prologue_station_missing',name:'不存在的车站'}},fear:{control:1,investigative:1}},{id:'leave_station',label:'离开站台，往雾里走',text:'你没有回头看。你听到身后的水声变大了一点，像是什么东西在你离开的时候站了起来。\n\n但你没有回头。\n\n雾很浓。你走了大约十分钟，鞋底的声音从水泥变成了碎石，又从碎石变成了泥土。你不知道自己在往哪里走。但至少你在走。',effects:{},fear:{avoidant:1}}]},
{id:'prologue_inn',name:'旅馆登记',type:'prologue',subtype:'tutorial_npc',description:'你在雾里走了很久，终于看到一栋亮着灯的建筑。门口的招牌写着"海螺旅馆"。\n\n前台后面坐着一个老人，正在用钢笔填写什么东西。他的旁边站着一个年轻女人，手里端着一杯茶。角落里还有一个侍者，一言不发地擦拭酒杯。\n\n老人抬起头看了你一眼。他的眼睛在灯光下显得很小。',tutorial_hint:'【提示】与NPC对话。不同的回应方式会影响对方的态度。',effects:{},choices:[{id:'ask_help',label:'"我需要一个房间。外面的路不太对。"',text:'老人放下笔。他没有问你从哪里来，也没有问你为什么在深夜到达。他只是从抽屉里拿出一把钥匙，放在柜台上。\n\n"二楼尽头。"他说。"不要开窗。"\n\n年轻女人把茶推向你。"喝点热的。你的手在抖。"\n\n你低头看了一眼自己的手。确实在抖。但你不记得是从什么时候开始的。',effects:{add_clue:{id:'clue_prologue_inn_key',name:'旅馆钥匙'}},fear:{social:1,isolation:1}},{id:'probe_anomaly',label:'"这个地方……有什么不对吗？"',text:'老人的笔停了一下。他没有抬头。\n\n"不对？"他重复了一遍这个词，像是在品尝它。"你具体指什么？"\n\n年轻女人轻轻咳了一声。角落里的侍者停下了擦杯子的动作。\n\n空气变得很安静。你听到楼上有什么东西在地板上拖动的声音。很轻，但很清楚。\n\n老人继续写字。"二楼尽头。钥匙在柜台上。"',effects:{add_clue:{id:'clue_prologue_inn_silence',name:'旅馆的沉默'}},fear:{knowledge:1,investigative:1}},{id:'lie_identity',label:'"我是来出差的。政府的人。"',text:'老人看了你一眼。这次他看得很仔细——你的衣服、你的鞋、你手里的公文包。\n\n"政府的人。"他说。他的语气很平。"上一个政府的人，在三个月前来过。他的房间还在。他没有退房。"\n\n他把钥匙放在柜台上。\n\n"二楼尽头。不要翻他的东西。"',effects:{add_clue:{id:'clue_prologue_inn_stayer',name:'未退房的旅客'}},fear:{control:1}},{id:'cold_ignore',label:'不说话，拿走钥匙就上楼',text:'你拿起钥匙。老人没有阻止你。年轻女人也没有。\n\n你走到楼梯口的时候，听到身后传来一句很低的话。你不确定是老人说的还是侍者说的：\n\n"又一个。"\n\n楼梯的木板在你脚下发出声音。每一步都像是在说一个音节。你不想听懂它在说什么。',effects:{},fear:{predatory:1}}]},
{id:'prologue_corridor',name:'二楼走廊的水声',type:'prologue',subtype:'tutorial_move',description:'二楼的走廊比你想的要长。\n\n你数了一下门。七扇。但走廊尽头还有第八扇——不对，那是浴室的门。浴室的门开着一条缝。\n\n水声从那条缝里流出来。不是滴水声。是某种更均匀的、有节奏的声音。像是有人在浴缸里缓慢地翻动身体。\n\n你的房间在走廊的另一头。你需要经过浴室门口才能到达。',tutorial_hint:'【提示】行动需要消耗行动点（AP）。选择要谨慎。',ap_cost:true,effects:{},choices:[{id:'open_bathroom',label:'打开浴室门',cost:2,text:'门没有锁。推开的时候，铰链发出一声很低的呻吟。\n\n浴缸是空的。但浴缸底部有一层水——很浅，大概只有一厘米。水面是完全平静的。没有涟漪，没有波纹。\n\n你注意到一件事：水面在发光。不是反射灯光。是水面本身在发一种很淡的、蓝灰色的光。\n\n你蹲下来，靠近那层水。你的倒影在水面上，但倒影的动作和你不一样。你蹲下的时候，倒影在站起来。',effects:{san:-1,add_clue:{id:'clue_prologue_corridor_reflection',name:'浴缸中的倒影'}},fear:{ocean:2,investigative:1}},{id:'check_lock_thrice',label:'检查门锁三次',cost:1,text:'你回到自己的房间，把门锁上。然后检查了一遍。\n\n锁是好的。你又检查了一遍。\n\n还是好的。你第三次检查的时候，发现锁舌上有一道很细的划痕。那道划痕不是从外面造成的——是从里面。像是有人在房间里，用指甲慢慢地、耐心地刮锁的内侧。\n\n你把门锁上了第四遍。',effects:{add_clue:{id:'clue_prologue_corridor_lock',name:'锁舌上的划痕'}},fear:{control:2}},{id:'go_back_room',label:'快步走回房间，关门',cost:1,text:'你没有跑。你只是走得很快。经过浴室门口的时候，你没有看那条缝。你听到水声变大了一点，但你没有看。\n\n你关上门。锁上。然后坐在床上。\n\n你的心跳很快。你等了很久，它才慢下来。\n\n你没有脱衣服。你没有关灯。你躺在床上，听着走廊里的声音。\n\n水声停了。',effects:{},fear:{avoidant:1}},{id:'towel_door',label:'用毛巾堵住浴室门缝',cost:1,text:'你从自己房间里拿了一条毛巾，折好，塞进浴室门的底部缝隙。\n\n毛巾很快就湿了。你没有碰浴室里的水。你只是堵住了门缝。但毛巾变湿的速度比你想的要快得多。\n\n你退后一步。湿毛巾在走廊的灯光下，颜色变了——从白色变成了一种很淡的灰色。和外面的雨一样。',effects:{add_clue:{id:'clue_prologue_corridor_towel',name:'湿毛巾'}},fear:{controlling:1}}]},
{id:'prologue_mirror',name:'镜中伤口',type:'prologue',subtype:'tutorial_san',description:'你终于在房间里安顿下来。\n\n房间里有一面镜子。不大，挂在墙上，位置刚好在你坐下的时候能看到自己的脸。\n\n你注意到一件事：你的脖子上有一道伤口。你不知道它是什么时候出现的。伤口不深，但很长，从左耳下方一直延伸到锁骨。\n\n不疼。完全不疼。\n\n你伸手碰了一下自己的脖子。手指是干的。没有血。\n\n但镜子里的伤口在流血。',tutorial_hint:'【提示】某些选择会影响你的理智值（SAN）。SAN过低会有危险。',effects:{},choices:[{id:'touch_mirror',label:'触碰镜中的伤口',text:'你把手伸向镜子。你的指尖碰到了镜面。镜面是温的——不是玻璃的温度，是皮肤的温度。\n\n镜子里的你张开了嘴。没有声音。但你看到它的嘴里有一颗牙齿是你没有的。那颗牙齿是黑色的，很小，长在上颚的正中间。\n\n你收回手。你的指尖上有一点血。不是你的血。你不知道是谁的。\n\n你的脖子上那道伤口消失了。但你的嘴里多了一种味道——很咸。像是海水。',effects:{san:-2,add_clue:{id:'clue_prologue_mirror_tooth',name:'镜中的牙齿'}},fear:{body:2,knowledge:1}},{id:'break_mirror',label:'砸碎镜子',text:'你拿起桌上的台灯，朝镜子砸了过去。\n\n镜子碎了。碎片落了一地。\n\n但碎片里的你没有碎。每一块碎片里都有一个完整的你。它们都在看着你。伤口还在流血。\n\n你蹲下来捡起一块碎片。碎片里的你伸出手，像是要和你握手。你把碎片扔到了窗外。\n\n外面传来的不是玻璃落地的声音。是水花的声音。',effects:{san:-1,add_clue:{id:'clue_prologue_mirror_shard',name:'碎镜中的倒影'}},fear:{control:1,body:1}},{id:'record_mirror',label:'把这一切记在笔记本上',text:'你翻开笔记本。你尽量客观地记录：\n\n"颈部伤口——来源不明。无痛感。镜中可见出血，实际无出血。镜面温度异常。"\n\n你写完之后，读了一遍。字迹是你的。但有三个字不是你写的："不要查"。\n\n这三个字出现在你记录的最后一行。墨水的颜色和其他字一样。但你没有写过它们。\n\n你把这一页折了起来。',effects:{add_clue:{id:'clue_prologue_mirror_dont_look',name:'不要查'}},fear:{investigative:1,knowledge:1}},{id:'cover_mirror',label:'用床单盖住镜子',text:'你把床单从床上扯下来，盖在镜子上。\n\n你看不到镜子了。但你还是能感觉到它。镜子在床单后面，温热的，像是一块活的皮肤。\n\n你转过身，面对墙壁。\n\n你听到床单后面传来一声很轻的叹息。你没有回头。',effects:{},fear:{avoidant:1}}]},
{id:'prologue_cry',name:'隔壁房间的求救',type:'prologue',subtype:'tutorial_humanity',description:'你没有睡着。大概凌晨三点的时候，你听到隔壁传来声音。\n\n是一个女人的声音。她在说："让我出去。"\n\n一遍又一遍。声音很平，没有哭腔，没有喊叫。只是重复同一句话。\n\n"让我出去。"\n\n你走到走廊里。隔壁的门关着。门缝下面透出一点光。门口的地上放着一个药箱——很旧，皮革的，上面有一个铜扣。\n\n你不知道是谁把药箱放在那里的。',tutorial_hint:'【提示】你的选择会影响你与他人的关系，以及你对自己的看法。',effects:{},choices:[{id:'rescue',label:'打开门',text:'你转动门把手。门没有锁。\n\n房间里很暗。唯一的光源是窗户——窗外什么都没有，但窗户在发光。和浴缸里的光一样。蓝灰色的，冷的。\n\n一个女人坐在房间的角落里。她没有看你。她还在说："让我出去。"\n\n你走过去。她抬起头。她的眼睛是正常的，她的表情是正常的。但她的嘴在重复那句话的时候，嘴角的弧度没有变化。像是一个机械的动作。\n\n"我已经开了门。"你说。\n\n她停下来。她看着你。然后她说了一句不一样的话：\n\n"不是这扇门。"',effects:{add_clue:{id:'clue_prologue_cry_not_this_door',name:'不是这扇门'}},fear:{morality:2,sacrificial:1}},{id:'assess_first',label:'先敲门，确认情况',text:'你敲了敲门。\n\n声音停了。\n\n安静了大概十秒钟。然后门从里面打开了。\n\n没有人站在门口。房间里没有人。窗户关着，灯关着。床上的被子叠得很整齐。\n\n你回头看了一眼走廊。药箱还在地上。\n\n你弯腰捡起药箱。药箱是空的，但里面有一股很淡的碘酒味。你把药箱打开又合上。\n\n里面有一张纸条："如果你听到了，说明你已经进来了。"',effects:{add_clue:{id:'clue_prologue_cry_note',name:'空药箱纸条'}},fear:{control:1,social:1}},{id:'ignore_cry',label:'假装没听见，回房间',text:'你转身回了房间。你把门关上。你把枕头压在耳朵上。\n\n声音还在。不是从隔壁传来的——是直接在你耳朵里。像是你的耳膜在震动同一个频率。\n\n"让我出去。"\n\n你把枕头压得更紧。声音变小了。但它没有消失。\n\n你不知道过了多久。当你把枕头拿开的时候，走廊已经安静了。你的枕头是湿的。',effects:{},fear:{isolation:1,avoidant:1}},{id:'take_medicine',label:'拿走门口的药箱',text:'你弯腰捡起药箱。铜扣很凉。\n\n你打开药箱。里面有三样东西：一小瓶碘酒，一卷绷带，还有一把很小的手术刀。手术刀是新的，刀刃上还有出厂时的保护油。\n\n你把药箱合上，带回了房间。\n\n走廊里的声音停了。不是渐渐停下的。是在你拿起药箱的那一刻，同时停下的。像是开关。\n\n你把手术刀放在枕头下面。你不知道为什么。但它让你觉得安全了一点。',effects:{add_clue:{id:'clue_prologue_cry_scalpel',name:'药箱中的手术刀'}},fear:{predatory:2,morality:1}}]},
{id:'prologue_notebook',name:'笔记本最后一页',type:'prologue',subtype:'tutorial_clue',description:'天快亮了。你坐在旅馆的前台大厅里。老人不知道去了哪里。侍者还在擦杯子。\n\n你在翻看你自己的笔记本。前面的记录都是你的字迹——出差笔记、行程安排、一些无聊的数字。\n\n但最后一页不是你写的。\n\n那一页上写着：\n\n"你到达的时候，请翻到这一页。如果你正在读这段话，说明前五页的内容你已经不记得了。不要回去翻。继续往下读。"\n\n下面是空白。\n\n但空白在变化。字迹在从纸张深处慢慢浮现，像是墨水从纸的另一面渗透过来。',tutorial_hint:'【提示】线索可以被收集和记录。有些线索会影响后续事件。',effects:{},choices:[{id:'read_more',label:'继续等待文字浮现',text:'你盯着那片空白。\n\n字迹越来越清楚。你读到了：\n\n"沃切斯特不是一个地方。沃切斯特是一个正在发生的事情。你不是来调查的。你是来被调查的。"\n\n然后字迹停了。不是写完了——是墨水停了。像是写字的人被什么东西打断了。\n\n最后一行字出现得很慢：\n\n"他们在你的笔记本里放了一面镜子。"\n\n你合上笔记本。你的心跳很快。你刚才读到的东西，你知道是真的。但你不知道为什么你知道。',effects:{san:-1,add_clue:{id:'clue_prologue_notebook_mirror',name:'笔记本中的镜子'}},fear:{knowledge:2,investigative:1}},{id:'tear_page',label:'撕掉这一页',text:'你抓住那一页的边角，用力撕了下来。\n\n纸张比你想的要结实。你撕了两次才撕断。撕断的那一刻，你听到一声很小的声音——像是有人在很远的地方说了一个字。你没有听清是什么字。\n\n你把碎片揉成一团，扔进了壁炉。\n\n碎片没有燃烧。火焰绕过了它们。碎片在火焰中间，完好无损。\n\n你把碎片捡了出来。纸张是冷的。但你的手被烫伤了。',effects:{san:-1,add_clue:{id:'clue_prologue_notebook_burn',name:'烧不掉的纸'}},fear:{control:1,avoidant:1}},{id:'copy_text',label:'逐字抄写到新的一页',text:'你翻开新的一页，开始抄写。\n\n你写得很慢，很仔细。每一个字都和原文一样。你甚至模仿了笔迹的压力和角度。\n\n抄完之后，你把原文和抄本放在一起比较。一模一样。\n\n但抄本的最后一个字不是你写的。你抄到倒数第二个字的时候，笔自己动了。最后一个字出现在你的笔下，但那不是你的笔迹。那是另一种字迹——更老的，更有控制力的。\n\n你读了那个字。是一个名字。你的名字。',effects:{san:-1,add_clue:{id:'clue_prologue_notebook_name',name:'你的名字'}},fear:{control:2,knowledge:1}},{id:'close_notebook',label:'合上笔记本',text:'你合上笔记本。你没有撕掉那一页，也没有继续读。\n\n你把笔记本放在桌上。然后你看着它。\n\n笔记本在桌上。它比你记得的要厚一些。你刚才打开的时候，它大概有一百页。现在它看起来有一百二十页。\n\n你没有再打开它。\n\n你站起身，走到窗边。天亮了。但阳光是灰色的。',effects:{},fear:{avoidant:1}}]},
{id:'prologue_dawn',name:'清晨入城',type:'prologue',subtype:'transition',description:'清晨六点。你站在旅馆门口。\n\n雾还没有散。但你能看到远处的路牌了：\n\n沃切斯特 —— 1英里。\n\n你背起包。你的笔记本比昨天重了一些。你的脖子上没有伤口。你的嘴里没有咸味。但你记得那些事情发生过。\n\n你开始走。\n\n路上没有车。没有行人。只有你和你的影子。影子比你长。它在你前面，像是在替你探路。\n\n你走了大概二十分钟。然后你看到了沃切斯特的边界——一块石头，上面刻着建城年份。数字已经被雨水侵蚀得看不清了。\n\n你跨过那块石头的那一刻，你的影子消失了。你回头看。影子在石头的另一边。它没有跟过来。\n\n你继续走。\n\n你没有回头。',tutorial_hint:'【提示】前传结束。你的调查记录已被保存。',effects:{},choices:[{id:'enter_city',label:'进入沃切斯特',text:'档案已建立。\n\n你害怕的东西，比你先一步抵达。',effects:{},fear:{},isFinal:true}]}];PROLOGUE_EVENTS;
const FEAR_KEYS=['ocean','body','control','isolation','knowledge','morality'];const COPING_KEYS=['avoidant','investigative','social','controlling','sacrificial','predatory'];function applyPrologueChoice(prologue,fear,choiceId){if(!prologue)return prologue;if(!fear||typeof fear!=='object')return prologue;
const oldFp=prologue.fearProfile||{};const newFp={...oldFp};for(const key of FEAR_KEYS){if(fear[key])newFp[key]=(oldFp[key]||0)+fear[key];}
const oldCp=prologue.copingProfile||{};const newCp={...oldCp};for(const key of COPING_KEYS){if(fear[key])newCp[key]=(oldCp[key]||0)+fear[key];}
return{...prologue,fearProfile:newFp,copingProfile:newCp,choicesMade:[...prologue.choicesMade,choiceId]};}function calculateFearTuning(prologue){if(!prologue)return{primary:null,secondary:null,coping:null};const fp=prologue.fearProfile||{};const cp=prologue.copingProfile||{};
const fearEntries=Object.entries(fp).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);const primary=fearEntries.length>0?fearEntries[0][0]:null;const secondary=fearEntries.length>1?fearEntries[1][0]:null;
const copingEntries=Object.entries(cp).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);const coping=copingEntries.length>0?copingEntries[0][0]:null;return{primary,secondary,coping};}function generateFearFlags(tuning){const flags=[];if(tuning.primary)flags.push('fear_'+tuning.primary+'_primary');if(tuning.secondary)flags.push('fear_'+tuning.secondary+'_secondary');if(tuning.coping)flags.push('coping_'+tuning.coping);return flags;}function getNeutralTuning(){return{primary:null,secondary:null,coping:null};}const FEAR_LABELS={ocean:'深海',body:'肉体',control:'控制',isolation:'孤立',knowledge:'知识',morality:'道德'};const COPING_LABELS={avoidant:'回避',investigative:'调查',social:'社交',controlling:'支配',sacrificial:'牺牲',predatory:'掠夺'};

const NPC_MEMORY_LINES={'玛莎·格雷':{t1:['又来了……我是说，欢迎光临。','你上次来过。对吧？','你看起来很面熟。'],t2:['你这次又住几天？','别点啤酒了。你上次没喝完。','你是不是……每个月都来一次？'],t3:['这是第四次了。我不再问你了。','你要的房间一直空着。我没有给别人。','有些客人会回来。你是最执着的一个。'],t4:['（她没有说话，只是把一杯没动过的酒推到你面前。）','（她看了你一眼，然后把你上次坐的椅子拉了出来。）']},'老费舍':{t1:['你……又来了？','我好像在哪见过你。不是在岸上。','海会记住所有回来的人。'],t2:['你身上的盐味更重了。','你比上次看起来更像一个水手了。','又是你。鱼都不惊讶了。'],t3:['我不数了。反正你还会回来。','你是不是已经知道海底有什么了？','每次你来，潮汐都退得更早一些。'],t4:['（他把你带到了码头尽头，指着水面。水面上映着你很多个倒影。）','（他把一个贝壳递给你。贝壳里传来你的声音——上一次的你。）']},'希尔达·莫里斯':{t1:['你看起来……像是来过这个庄园。','走廊里的画像今天换了表情。你注意到了吗？','我们以前见过？你的步伐很熟悉。'],t2:['你认识去书房的路。不用我带了。','你上次走的时候，有一扇窗户自己关上了。','你是不是知道地下室的秘密？你的眼神说你知道。'],t3:['你是我见过的最执着的访客。或者说，最执着的回来者。','我把族谱放在了你知道的地方。不用谢。','你是唯一一个看过诅咒之后还回来的人。'],t4:['（她站在门口等你。好像她一直知道你会在这个时间出现。）','（桌上已经放好了茶。两杯。你还没有敲门。）']},'伊莎贝拉·韦伯':{t1:['你的眼神让我想起了一个梦。','教堂的蜡烛今天自己亮了。有人要来。','你……你不是第一次来这里。'],t2:['你已经听过十三声钟响了。你还在。','你比大多数人都更接近真相。也更接近危险。','你上次问我的问题，我在你走之后想了很久。'],t3:['我不再劝你离开了。因为我知道你不会听。','你每次来，圣坛上的十字架都会转一个角度。','你是被选中的。不是被神选中的——是被这个地方。'],t4:['（她跪在圣坛前。你进来的时候，她没有抬头。她说："我知道你来了。坐下吧。"）','（她翻开了一本你从未见过的书。书的第一页写着你的名字。）']},'约书亚·布莱克':{t1:['你……你看起来像是见过战场。或者见过比战场更糟的东西。','我在你身上闻到了重复的味道。','你又来了。我认得你的伤疤。'],t2:['你走路的姿势变了。比上次更谨慎。','你上次差点死在那条巷子里。你以为我不知道？','你是不是在循环什么东西？你的眼神像困兽。'],t3:['你是唯一一个让我觉得"回来"是一件可怕的事情的人。','我不问了。你告诉我该怎么做。','你这次要杀谁？或者，你要救谁？'],t4:['（他坐在角落里擦枪。你进来的时候，他把枪放在了桌上——不是对着你，是给你。）','（他什么都没说。但他的眼神里有一种东西——不是恐惧，是认命。）']},'伊莱亚斯·沃德':{t1:['你的存在本身就是一个悖论。你知道吗？','我在研究轮回理论。你的案例……很有趣。','你让我想起了一篇论文。关于时间的回文结构。'],t2:['你的记忆保留率高于理论值。我们需要谈谈。','你已经读过了那些书。我能从你的沉默中听出来。','你来了。很好。我有一些新的发现需要验证。'],t3:['你不再是一个调查者了。你是一个现象。','我把你的名字写进了研究笔记。不是作为案例——是作为合作者。','你是唯一一个能告诉我"上一次"发生了什么的人。'],t4:['（他桌上放着一份手稿。标题是《论沃切斯特的第十三次钟声》。作者栏是空白的——但笔迹是你的。）','（他把你带到了一面镜子前。镜子里的你穿着不同年代的衣服。他问："你看到了几个自己？"）']}};function handleNpcMemoryTier(s,npc,narr){const loop=s.loopCount;if(loop<3)return;const npcLines=NPC_MEMORY_LINES[npc.name];if(!npcLines)return;let tier,probability;if(loop>=10){tier='t4';probability=1.0;}else if(loop>=8){tier='t3';probability=0.6;}else if(loop>=5){tier='t2';probability=0.4;}else{tier=' function downloadSampleMod(){const sample={id:"sample_horror_1926",author:"调查员档案馆",name:"1926沃切斯特补充事件",version:"1.0",events:[{id:"ugc_sample_001",name:"码头的异常潮汐",type:"area_deep",subtype:"harbor",weight:0.8,tier:"rare",tags:["ugc","harbor","tide","anomaly"],trigger:{areas:["harbor_district"],time_phase:["midnight"],probability:0.12,min_loop:1,once_per_run:true},description:"你站在码头边。潮水正在退去——但退潮的方向不对。\n\n水不是向海里退去，而是向码头的木桩下方收缩。木桩在水中露出了更多的部分。你看到了木桩上刻着的数字。\n\n每一个木桩上都有一个数字。你从最近的开始数：3, 7, 11, 13。\n\n第十三根木桩上没有数字。上面刻着一个符号——和你笔记本最后一页上的一样。",effects:{san:-2},choices:[{id:"read_symbols",label:"记录符号",text:"你蹲下来，用铅笔把符号描在笔记本上。铅笔在纸上的触感变了——不是摩擦力的变化，是温度。纸张在你描的时候变热了。\n\n描完之后，符号消失了。不是从木桩上消失——是从你的笔记本上。但那页纸的温度还在。",effects:{add_clue:{id:"clue_ugc_tide_symbol",name:"第十三根木桩的符号"}}},{id:"touch_pile",label:"触碰第十三根木桩",text:"你的手指碰到木桩的那一刻，潮水回来了。\n\n不是慢慢涨回来的——是一瞬间。水没过了你的脚踝。冰冷。但那温度在往上走，一直走到膝盖才停。\n\n水退去之后，你的鞋带系成了你没见过的结。",effects:{san:-3,hp:-1}}]},{id:"ugc_sample_002",name:"教堂侧室的烛光",type:"humanity",subtype:"trial",weight:1,tier:"common",tags:["ugc","church","humanity","light"],trigger:{areas:["town_center"],time_phase:["evening"],probability:0.15,once_per_run:true},description:"教堂的侧室亮着光。不是主灯——是蜡烛。很多蜡烛。\n\n你推开门。侧室很小，大概三步乘三步。墙上挂满了照片。照片里的人你都不认识，但他们的表情都一样——不是恐惧，是困惑。像是突然看到了什么不该看到的东西。\n\n蜡烛的数量不对。你数了一下：十三根。但只有十二根在燃烧。第十三根蜡烛的火焰是黑色的。",effects:{san:-1},choices:[{id:"examine_photos",label:"仔细看照片",text:"你凑近了看。每张照片下面都有一个日期。日期从1899年开始，每隔几年一张。最近的一张——\n\n是你。\n\n照片里的你穿着你没见过的衣服，站在一个你不认识的地方。但那张脸是你的。日期是——明天。",effects:{san:-3,add_clue:{id:"clue_ugc_photo_tomorrow",name:"明天的照片"}}},{id:"blow_candle",label:"吹灭黑色火焰的蜡烛",text:"你弯下腰，靠近第十三根蜡烛。黑色的火焰没有温度。你吹了一口气。\n\n火焰没有灭。它变大了。\n\n其他十二根蜡烛同时熄灭了。房间暗了。但黑色的火焰还在。它照亮了你脚下的一块地砖。地砖上刻着一个字：\n\n「走」。",effects:{san:-2,add_clue:{id:"clue_ugc_black_flame",name:"黑色的火焰"}}},{id:"take_photo",label:"拿走那张你的照片",text:"你伸手去拿照片。照片粘在墙上——不是用胶水，是用什么温热的、有弹性的东西。\n\n你用力一扯。照片下来了。但照片的背面有一行字，墨水还没干：\n\n「你拿走的不是照片。是时间。」\n\n你把照片翻过来。正面的你——不见了。只剩下一个空的背景。",effects:{san:-2,add_clue:{id:"clue_ugc_stolen_photo",name:"被拿走的时间"}}}]}
