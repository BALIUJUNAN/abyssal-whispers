{id:"ending_omen_001",name:"封印的裂痕",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","seal"],trigger:{areas:["catacombs_entrance"],min_loop:2,probability:0.15,once_per_run:true,requires_flags:["clue_area_catacombs_inscription"]},description:"封印的符号不再稳定。你凑近看——光在闪烁，像将灭的灯芯。裂缝从符号的边缘延伸出来，宽度刚好能塞进一张纸。你把纸塞了进去。纸被吸进去了。你没有追。",effects:{add_clue:"clue_ending_omen_seal_crack",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_002",name:"灯塔的呼唤",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","lighthouse"],trigger:{areas:["lighthouse"],min_loop:3,probability:0.12,once_per_run:true,requires_flags:["clue_area_lighthouse_basement"]},description:"灯室的地板在震动。不是海风——是某种更低的频率，从灯塔的根基传上来。你把手贴在地板上。震动的节奏像心跳。你数了七下。停了。第八下的时候，地板烫了一下。",effects:{add_clue:"clue_ending_omen_lighthouse_call",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_003",name:"逃离的预感",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","escape"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,once_per_run:true,npc_trust_gte:{"老费舍":3}},description:"老费舍递给你一根烟。你不会抽烟。但他没等你拒绝就点着了。\n「每月十五，」他吐出一口烟，「有船经过。不在港口停。」\n你问他怎么知道。\n「因为我在那艘船上待过。」\n他没有再说什么。烟烧到了手指，他也没动。",effects:{add_clue:"clue_ending_omen_escape",san:-1},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"ending_omen_004",name:"献祭的预感",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","sacrifice"],trigger:{areas:["deep_catacombs"],min_loop:3,probability:0.1,once_per_run:true,requires_flags:["clue_area_deep_seal_core"]},description:"封印核心的光变了。不是变弱——是变红。你闻到了铁锈的味道。你的手掌上有血。你没有受伤。血是从封印的裂缝里渗出来的。或者从你的皮肤里。你分不清了。",effects:{add_clue:"clue_ending_omen_sacrifice",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_005",name:"超越的预感",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","transcendence"],trigger:{areas:["ruins_of_yith"],min_loop:4,probability:0.08,once_per_run:true,min_mythos:15},description:"伊斯机器没有亮。但你听到了它的声音。不是从机器里——是从你的骨头里。你的指骨在震动。频率和上次机器运作时一模一样。你把手指放在机器表面。机器凉的。你的骨头是热的。",effects:{add_clue:"clue_ending_omen_transcendence",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_006",name:"疯狂的预感",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","madness"],trigger:{areas:["town_center"],min_loop:2,probability:0.12,once_per_run:true,san_lte:30},description:"你看到一个人在街对面看着你。你走近。他也在走近。你们之间的距离没有缩短。你停下来。他也停下来。你抬起右手。他抬起左手。你转身走了。背后的目光烧了很久。",effects:{add_clue:"clue_ending_omen_madness",san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_007",name:"异端的预感",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","heresy"],trigger:{areas:["town_center"],min_loop:2,probability:0.1,once_per_run:true,npc_alive:["伊莎贝拉·韦伯"],npc_trust_gte:{"伊莎贝拉·韦伯":3}},description:"伊莎贝拉从教堂的侧门走出来。她没有穿平时的执事袍。是一件黑色的长衣，领口绣着你没见过的符号。她看到你，没有停步。经过你身边时说了两个字：\n「快了。」\n你问什么快了。\n她没有回头。",effects:{add_clue:"clue_ending_omen_heresy",san:-2,mythos:1},event_classification:"NPC互动",normalcy_anchor:false,choices:[]},{id:"ending_omen_008",name:"深渊的预感",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","abyss"],trigger:{areas:["deep_catacombs"],min_loop:3,probability:0.08,once_per_run:true,san_lte:20},description:"你在竖井边缘蹲下来。往下看。黑暗在看你。不是比喻——你感到了视线。从下面往上。你往竖井里扔了一颗石子。石子没有落地的声音。你等了三十秒。没有。你又扔了一颗。这次有声音——但不是石头碰石头。是石头碰水面。竖井底下有水了。昨天没有。",effects:{add_clue:"clue_ending_omen_abyss",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_009",name:"真相的预感",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","truth"],trigger:{areas:["ruins_of_yith"],min_loop:4,probability:0.06,once_per_run:true,min_mythos:20},description:"你在遗迹的墙壁上看到了一幅画。不是壁画——是投影。画面是你自己。站在你现在站的位置。但你穿的衣服不是你的。你做的事情不是你在做的。投影里的你转过头，看着你。嘴型说的是：别再往前了。",effects:{add_clue:"clue_ending_omen_truth",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_010",name:"命运的预感",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","fate"],trigger:{areas:["town_center"],min_loop:5,probability:0.06,once_per_run:true},description:"怀表停了。你拧表冠。不动。你拍了拍。不动。你把怀表贴近耳朵。有声音。不是滴答——是说话。语速很快，你只能听清最后几个字：\n「……已经选好了。」\n怀表恢复了走动。时间对得上。但你的手心出了一层冷汗。",effects:{add_clue:"clue_ending_omen_fate",san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_011",name:"封印的呼唤",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","seal"],trigger:{areas:["deep_catacombs"],min_loop:4,probability:0.08,once_per_run:true,requires_flags:["clue_area_deep_seal_core"]},description:"封印的符号排列变了。你确定——因为你昨天画过它们。圆环的缺口从十二点方向移到了三点方向。你把手伸向缺口。手指穿过了石头。不是幻觉——你的手指确实穿过了石头。你抽回来。手指完好。但指甲缝里有沙子。是海沙。",effects:{add_clue:"clue_ending_omen_seal_call",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_012",name:"血脉的呼唤",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","blood"],trigger:{areas:["voxchester_manor"],min_loop:3,probability:0.08,once_per_run:true,npc_alive:["希尔达·莫里斯"],npc_trust_gte:{"希尔达·莫里斯":3}},description:"你在庄园的走廊里闻到了海水的味道。不是外面飘进来的——是从墙壁里渗出来的。你用手摸了摸墙壁。墙纸下面有液体。你撕开一小块墙纸。是盐水。墙纸后面是盐渍。像是有人从墙壁的另一边一直在流泪。",effects:{add_clue:"clue_ending_omen_blood_call",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_013",name:"海的呼唤",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","sea"],trigger:{areas:["harbor_district"],min_loop:3,probability:0.08,time_phase:["midnight"],once_per_run:true},description:"海面退了。你走到裸露的海床上。脚下的泥沙是温热的。你蹲下来。泥沙下面有东西——硬的，方的，像一块石板。你用手扒开泥沙。石板上刻着一个符号。你认出了它。是封印的一部分。海床下面有封印。或者——海床本身就是封印。",effects:{add_clue:"clue_ending_omen_sea_call",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_014",name:"时间的呼唤",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","time"],trigger:{areas:["ruins_of_yith"],min_loop:5,probability:0.06,once_per_run:true,min_mythos:20},description:"遗迹的机器在没有启动的情况下发出了光。光很弱，只够照亮机器表面的一行字。你蹲下来看。字是新刻的。笔迹是你的。内容是：\n「第三十七次。这次选左边。」\n你没有刻过这行字。但你的手指上有茧——握笔的那只手的中指。你今天没有写过字。",effects:{add_clue:"clue_ending_omen_time",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_015",name:"结局的呼唤",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","ending"],trigger:{areas:["deep_catacombs"],min_loop:5,probability:0.06,once_per_run:true},description:"你找到了一面墙。墙上写着名字。你数了一下——九个。每个名字旁边都有一个结局。你认出了最后几个：超越者。深渊吞噬。命运漂流。墙的最底部有一行空白。空白处的石面比其他地方光滑。像是有人反复摸过。",effects:{add_clue:"clue_ending_omen_ending",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_016",name:"选择的呼唤",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","choice"],trigger:{areas:["town_center"],min_loop:5,probability:0.06,once_per_run:true},description:"你走在街上。一个孩子拦住你。他手里拿着一张纸。纸上画着一个圆圈，圆圈里有三条线。三条线交汇的地方画了一个点。孩子说：你站在这个点上。然后他跑了。你把纸翻过来。背面写着：但你只能选一条线。",effects:{add_clue:"clue_ending_omen_choice",san:-2},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"ending_omen_017",name:"封印的预兆",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","seal"],trigger:{areas:["catacombs_entrance"],min_loop:4,probability:0.08,once_per_run:true},description:"封印入口的空气变了。你呼吸的时候能尝到盐。不是汗——是海水。你的嘴唇上有细小的结晶。你用舌头舔了舔。是盐。你低头看地面。地面是干的。盐是从空气里凝结出来的。",effects:{add_clue:"clue_ending_omen_seal_omen",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_018",name:"灯塔的预兆",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","lighthouse"],trigger:{areas:["lighthouse"],min_loop:4,probability:0.08,once_per_run:true},description:"灯塔的楼梯变长了。你确定——因为你数过。一百三十七级。今天是一百四十二级。多出来的五级台阶的石头颜色比其他的深。你蹲下来摸。石头是温热的。你站起来继续走。楼梯的尽头比昨天远了。",effects:{add_clue:"clue_ending_omen_lighthouse_omen",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_019",name:"深渊的预兆",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","abyss"],trigger:{areas:["deep_catacombs"],min_loop:5,probability:0.06,once_per_run:true},description:"你在竖井边蹲了很久。黑暗没有变。但你的眼睛变了——你能看到黑暗里的东西了。不是光。是轮廓。竖井的壁上有手印。很多手印。从上往下排列。像是一群人排着队往下走。手印的大小各不相同。有几个和你的手一样大。",effects:{add_clue:"clue_ending_omen_abyss_omen",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_omen_020",name:"命运的预兆",type:"ending_omen",subtype:"omen",weight:1,tier:"rare",tags:["ending","omen","fate"],trigger:{areas:["town_center"],min_loop:6,probability:0.04,once_per_run:true},description:"你在安全屋醒来。桌上多了一张纸条。纸条上是你的笔迹。内容只有一行：不要在第十四天去灯塔。你看了看日历。今天是第十三天。你把纸条翻过来。背面也是你的笔迹。内容是：不要在第十四天去墓穴。两张字迹不一样。都是你的。",effects:{add_clue:"clue_ending_omen_fate_omen",san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"ending_aftermath_001",name:"献祭者的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","seal_keeper"],trigger:{areas:["town_center"],min_loop:2,probability:0.12,once_per_run:true,previous_endings:["ending_seal_player_keeper"]},description:"你路过教堂。风琴响了一下。只有一个音。你停下来。风琴没有再响。但你的后颈发凉——像是有人在你身后站了很久，然后刚刚走开。你转身。没有人。地面上有一个脚印。鞋底的纹路和你的一样。",effects:{add_clue:"clue_ending_aftermath_keeper",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_002",name:"逃离者的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","escape"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.12,once_per_run:true,previous_endings:["ending_escape_by_sea"]},description:"码头上少了一根系缆桩。你确定——因为你上次靠在上面抽过烟（你不抽烟）。桩子的位置现在是一片平地。泥沙的颜色比周围深。你蹲下来闻。有海水和柴油的味道。但桩子确实不在了。渔民说这里从来没有过桩子。",effects:{add_clue:"clue_ending_aftermath_escape",san:-1},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_003",name:"疯狂者的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","madness"],trigger:{areas:["town_center"],min_loop:2,probability:0.12,once_per_run:true,previous_endings:["ending_abyss_consumed"]},description:"你走过一面墙。墙上有一行字。你没有写过。但笔迹是你的。内容是：这次不要去地下室。你用袖子擦了擦。擦不掉。你凑近看。字不是写在墙上的——是从墙里长出来的。笔画是凸起的。你摸了摸。是骨头的触感。",effects:{add_clue:"clue_ending_aftermath_madness",san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_004",name:"超越者的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","transcendence"],trigger:{areas:["ruins_of_yith"],min_loop:3,probability:0.08,once_per_run:true,previous_endings:["ending_transcendence"]},description:"遗迹的机器没有启动。但机器的表面有字。你认出了笔迹——是你自己的。字刻得很深，像是用指甲凿的。内容只有三个字：回来了。你用手指描摹这三个字。机器的表面变热了。字消失了。你的手指上多了一道烫痕。形状和封印的符号一样。",effects:{add_clue:"clue_ending_aftermath_transcendence",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_005",name:"异端者的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","heresy"],trigger:{areas:["town_center"],min_loop:2,probability:0.1,once_per_run:true,previous_endings:["ending_heretical_dawn"]},description:"教堂的钟声响了十二下。你数了。确实是十二。不是十三。你走进教堂。伊莎贝拉不在。祭坛上放着一本打开的书。你翻了翻。书页是空白的。除了最后一页。最后一页画着一个符号。你认出了它。是你上次用过的异端仪式的起手式。",effects:{add_clue:"clue_ending_aftermath_heresy",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_006",name:"希尔达选择的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","hilda"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.1,once_per_run:true,previous_endings:["ending_seal_hilda_choice"]},description:"庄园的壁炉还热着。你把手伸过去。火已经灭了。但灰烬里有东西在发光。你用树枝拨了拨。是一枚戒指。你认出了它——希尔达的。戒指的内侧刻着一行字。你凑近看。字太小了。你只看清了两个字：替我。后面的内容被烧焦了。",effects:{add_clue:"clue_ending_aftermath_hilda",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_007",name:"古老血脉的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","fisher"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.1,once_per_run:true,previous_endings:["ending_seal_old_fisher_blood"]},description:"码头的系缆桩上挂着一件雨衣。你认出了它——老费舍的。雨衣是湿的。你看了看天。没有下雨。你摸了摸雨衣的口袋。口袋里有一张纸条。纸条上写着一行字：海面下有光。你把纸条翻过来。背面是空白的。但你的手指沾上了墨水。像是刚刚有人写完。",effects:{add_clue:"clue_ending_aftermath_fisher",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_008",name:"第十二声的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","isabella"],trigger:{areas:["town_center"],min_loop:2,probability:0.1,once_per_run:true,previous_endings:["ending_isabella_twelfth_bell"]},description:"你走进教堂。风琴自己响了。一个音。降B。你等了很久。没有第二个音。你走到风琴后面。风琴的管道里塞着一张纸。你抽出来。纸上是伊莎贝拉的笔迹。内容只有一行：第十二声是为了让你记住。你没有问记住什么。你知道。",effects:{add_clue:"clue_ending_aftermath_isabella",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_009",name:"证据逃离的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","evidence"],trigger:{areas:["town_center"],min_loop:2,probability:0.1,once_per_run:true,previous_endings:["ending_evidence_escape"]},description:"你路过市政厅。公告栏上有你的照片。不是通缉令——是一张旧报纸的剪报。标题是：调查员揭露沃切斯特秘密。照片上的你在笑。你不记得自己笑过。报纸的日期是未来的。你把报纸撕下来。背面是空白的。但你闻到了海水的味道。",effects:{add_clue:"clue_ending_aftermath_evidence",san:-1},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_010",name:"命运漂流的回响",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","loop_truth"],trigger:{areas:["town_center"],min_loop:3,probability:0.06,once_per_run:true,previous_endings:["ending_loop_truth"]},description:"你翻开笔记本。第一页多了一行字。你没有写过。但笔迹是你的。内容是：你读到这行字的时候，你已经回来了。你翻到最后一页。最后一页也多了一行字：你读到这行字的时候，你还不知道自己是怎么回来的。两行字的墨水颜色不一样。第一行是旧的。第二行是新的。但它们是同一支笔写的。",effects:{add_clue:"clue_ending_aftermath_loop_truth",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_011",name:"献祭者的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["deep_catacombs"],min_loop:2,probability:0.1,once_per_run:true,previous_endings:["ending_seal_player_keeper"]},description:"封印的符号排列和你记忆中的不一样。你记得——因为你上次亲手调整过它们。但符号回到了原来的位置。像是有人在你走后把它们复位了。或者——符号自己复位了。你在符号的缝隙里找到了一根头发。是你的。长度和你现在的一样。",effects:{add_clue:"clue_ending_aftermath_keeper_memory",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_012",name:"逃离者的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.1,once_per_run:true,previous_endings:["ending_escape_by_sea"]},description:"你坐在码头边。海面很平。你低头看水。水面上映出了你的脸。但你的脸旁边还有一个人的脸。你看不清。你眨眼。第二张脸消失了。水面恢复了平静。但你的倒影还在微笑。你没有在笑。",effects:{add_clue:"clue_ending_aftermath_escape_memory",san:-1},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_013",name:"疯狂者的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["town_center"],min_loop:2,probability:0.1,once_per_run:true,previous_endings:["ending_abyss_consumed"]},description:"你翻到笔记本的某一页。页角有一个折痕。你没有折过。你展开折痕。折痕里藏着一个字。你认出了笔迹——是你自己的。字是倒着写的。你把笔记本翻过来。字正了。是一个地名。你没有去过那里。但你的脚记得路。",effects:{add_clue:"clue_ending_aftermath_madness_memory",san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_014",name:"超越者的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["ruins_of_yith"],min_loop:3,probability:0.06,once_per_run:true,previous_endings:["ending_transcendence"]},description:"遗迹的墙壁在发光。你用手碰了碰。光从你的指尖扩散到整面墙。墙上出现了一行字。字不是任何你认识的语言。但你读得懂。内容是：你的意识在第三十七次循环时穿过了边界。这不是赞美。是警告。光消失了。你的指尖上有灰。",effects:{add_clue:"clue_ending_aftermath_transcendence_memory",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_015",name:"异端者的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["town_center"],min_loop:2,probability:0.08,once_per_run:true,previous_endings:["ending_heretical_dawn"]},description:"你走进教堂的告解室。你没有要告解。但你坐下来了。隔板后面有人。你听到了呼吸声。你问是谁。没有回答。你等了很久。呼吸声停了。你推开隔板。另一边是空的。但座椅的垫子上有一个凹陷。形状像一个刚刚站起来的人。",effects:{add_clue:"clue_ending_aftermath_heresy_memory",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_016",name:"希尔达选择的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["voxchester_manor"],min_loop:2,probability:0.08,once_per_run:true,previous_endings:["ending_seal_hilda_choice"]},description:"你走进庄园的书房。书桌上有一本打开的日记。你翻了翻。日记是希尔达的。日期是今天。但内容不是今天的——是关于你的。她写道：他又来了。和上次一样。我不知道该不该告诉他。你合上日记。日记的封面是热的。像是刚刚有人合上。",effects:{add_clue:"clue_ending_aftermath_hilda_memory",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_017",name:"古老血脉的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["harbor_district"],min_loop:2,probability:0.08,once_per_run:true,previous_endings:["ending_seal_old_fisher_blood"]},description:"码头上有一艘船。你没有见过。船身很旧。船名被刮掉了。你走上甲板。甲板是湿的。你低头看。水渍的形状像一只手。你蹲下来。手印的大小和老费舍的一样。船舱里有一张桌子。桌上有一杯还在冒热气的咖啡。",effects:{add_clue:"clue_ending_aftermath_fisher_memory",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_018",name:"第十二声的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["town_center"],min_loop:2,probability:0.08,once_per_run:true,previous_endings:["ending_isabella_twelfth_bell"]},description:"你走进教堂。伊莎贝拉在祷告。你坐在她后面。她没有回头。祷告结束后她站起来。经过你身边时她说了一句话。声音很轻。你没有听清。你问她说了什么。她说她没有说话。但你的耳朵里还在回响那个声音。你辨认了很久。是一个名字。你的名字。",effects:{add_clue:"clue_ending_aftermath_isabella_memory",san:-2,mythos:1},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_019",name:"证据逃离的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["town_center"],min_loop:2,probability:0.08,once_per_run:true,previous_endings:["ending_evidence_escape"]},description:"你路过市政厅。门开着。你走进去。档案室的灯亮着。你走进去。桌上放着一个文件夹。文件夹是打开的。你翻了翻。里面是空的。但最后一页有你的签名。签名的日期是今天。你没有签过。墨水还没干。",effects:{add_clue:"clue_ending_aftermath_evidence_memory",san:-1},event_classification:"正常事件",normalcy_anchor:false,choices:[]},{id:"ending_aftermath_020",name:"命运漂流的记忆",type:"ending_aftermath",subtype:"aftermath",weight:1,tier:"rare",tags:["ending","aftermath","memory"],trigger:{areas:["town_center"],min_loop:3,probability:0.06,once_per_run:true,previous_endings:["ending_loop_truth"]},description:"你翻开笔记本。每一页都有字。你没有写过这么多。你翻到最后一页。最后一页的字迹比其他的淡。你凑近看。字在消失。你看到了最后一行：你正在阅读的这行字将在三秒后消失。你读完了。字消失了。你翻回上一页。上一页的字也消失了。你合上笔记本。封面上多了一行字：别再翻了。",effects:{add_clue:"clue_ending_aftermath_loop_truth_memory",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"ending_cross_001",name:"时间线的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","timeline"],trigger:{areas:["town_center"],min_loop:5,probability:0.06,once_per_run:true,min_previous_endings_count:3},description:"你走在街上。两个沃切斯特重叠在一起。一个是灰色的。一个是蓝色的。你伸出左手——灰色的墙壁是冷的。你伸出右手——蓝色的墙壁是温的。你闭上眼睛。再睁开。只剩一个了。但你的左手是冷的。右手是温的。",effects:{add_clue:"clue_ending_cross_timeline",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_002",name:"NPC的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","npc"],trigger:{areas:["town_center"],min_loop:5,probability:0.06,once_per_run:true,min_previous_endings_count:3},description:"你看到伊莱亚斯站在街角。你走过去。他看到你，话说到一半停住了。你问他怎么了。他说：我刚才在和谁说话？你看了看四周。没有人。但地面上有两双脚印。一双是伊莱亚斯的。另一双是你的。你没有站在那里过。",effects:{add_clue:"clue_ending_cross_npc",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_003",name:"物品的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","item"],trigger:{areas:["town_center"],min_loop:5,probability:0.06,once_per_run:true,min_previous_endings_count:3},description:"你打开笔记本。同一页上有两段字迹。都是你的。但内容不同。一段写的是你今天的经历。另一段写的是你没有经历过的事情。你仔细看。第二段的字迹更新。像是有人在你写完之后又加了什么。你用手摸了摸。第二段的墨水是湿的。",effects:{add_clue:"clue_ending_cross_item",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_004",name:"死亡的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","death"],trigger:{areas:["deep_catacombs"],min_loop:6,probability:0.04,once_per_run:true,min_previous_endings_count:4},description:"你站在墓穴的深处。你看到了一面镜子。镜子里映出了很多个人影。你数了一下。和你的周目数一样。每个人影的姿势都不同。有的在跑。有的在倒。有的在写字。有的在沉入水中。你走到镜子前。所有的人影同时转头看你。它们的嘴同时动了。你读出了唇语：选一个结局。",effects:{add_clue:"clue_ending_cross_death",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_005",name:"牺牲的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","sacrifice"],trigger:{areas:["deep_catacombs"],min_loop:6,probability:0.04,once_per_run:true,min_previous_endings_count:4},description:"封印前面站着一个人。你走近。是你自己。但穿着不同的衣服。你看着另一个你。另一个你也看着你。你伸出手。另一个你也伸出手。你们的手碰到了一起。是冷的。另一个你说了两个字：轮到你了。然后它消失了。你的手心多了一个符号。是封印的一部分。",effects:{add_clue:"clue_ending_cross_sacrifice",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_006",name:"真相的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","truth"],trigger:{areas:["ruins_of_yith"],min_loop:7,probability:0.03,once_per_run:true,min_previous_endings_count:5},description:"伊斯机器亮了。你看到了一段影像。影像是你。在不同的时间线里。做不同的选择。有的你重铸了封印。有的你逃离了。有的你沉入了深渊。有的你超越了。影像的最后，所有的你同时看向你。一个声音响起：你已经看到了所有的可能。现在做出你的选择。这是最后一次循环。",effects:{add_clue:"clue_ending_cross_truth",san:-5,mythos:4},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_007",name:"选择的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","choice"],trigger:{areas:["town_center"],min_loop:6,probability:0.04,once_per_run:true,min_previous_endings_count:4},description:"你面前有三条路。你确定只有三条。但你数了四遍。每次都是四条。第四条路的入口很窄。你侧身看了看。路的尽头有光。你没有走过去。但你知道——那条路通向一个你没有去过的结局。",effects:{add_clue:"clue_ending_cross_choice",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_008",name:"命运的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","fate"],trigger:{areas:["town_center"],min_loop:7,probability:0.03,once_per_run:true,min_previous_endings_count:5},description:"怀表的指针在倒转。你看着它。分针从45走到了30。秒针从20走到了10。你合上表盖。再打开。时间恢复了正常。但表盘上的数字变了。不是1到12——是0到11。你数了一下。十三个数字。0是新增的。你认出了0的位置。它在12的下面。",effects:{add_clue:"clue_ending_cross_fate",san:-3,mythos:2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_009",name:"封印的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","seal"],trigger:{areas:["deep_catacombs"],min_loop:7,probability:0.03,once_per_run:true,min_previous_endings_count:5},description:"封印的符号在变化。你看着它们。符号在你眼前重组。像是有人在重新排列它们。你伸手碰了碰。符号停了。但排列方式和你记忆中的不一样。你退后一步。符号又开始移动。你闭上眼睛。再睁开。符号回到了原来的位置。但有一个符号的位置偏了一点。你认出了那个符号。是上一次循环中你亲手放上去的。",effects:{add_clue:"clue_ending_cross_seal",san:-5,mythos:4},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_010",name:"灯塔的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","lighthouse"],trigger:{areas:["lighthouse"],min_loop:6,probability:0.04,once_per_run:true,min_previous_endings_count:4},description:"灯塔的楼梯变多了。你数了一下。不是一百三十七级。是两百七十四级。正好是两倍。你在第一百三十七级停了下来。这一级的石头颜色比其他的深。你蹲下来。石头上刻着一个数字。你认出了数字。是你上次循环的天数。你继续往上走。第一百三十八级的石头颜色比其他的浅。上面什么都没刻。",effects:{add_clue:"clue_ending_cross_lighthouse",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_011",name:"海的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","sea"],trigger:{areas:["harbor_district"],min_loop:6,probability:0.04,time_phase:["midnight"],once_per_run:true,min_previous_endings_count:4},description:"海面分成了两层。你站在码头边。水面以上是正常的。水面以下——你看到了另一个沃切斯特。建筑的轮廓和你脚下的城市一样。但那边的灯塔是亮的。你这边的不是。你往水里扔了一颗石子。石子穿过了第一层水面。没有穿过第二层。石子停在了两层水面之间。悬浮着。",effects:{add_clue:"clue_ending_cross_sea",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_012",name:"庄园的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","manor"],trigger:{areas:["voxchester_manor"],min_loop:6,probability:0.04,once_per_run:true,min_previous_endings_count:4},description:"庄园的走廊变长了。你走了很久。走廊的尽头不是门——是另一条走廊。你转了个弯。走廊的尽头是另一条走廊。你转了三个弯。第四条走廊的尽头是一面墙。墙上挂着一幅画。画的是你。站在走廊里。画的背景是另一条走廊。",effects:{add_clue:"clue_ending_cross_manor",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_013",name:"森林的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","forest"],trigger:{areas:["whispering_forest"],min_loop:6,probability:0.04,once_per_run:true,min_previous_endings_count:4},description:"森林里的树变多了。你确定——因为你数过。上次是四十七棵。今天是九十四棵。正好是两倍。你走到两棵相同的树中间。两棵树的树干上都有刻痕。刻痕的内容不一样。一棵刻的是：去灯塔。另一棵刻的是：别去灯塔。两棵树的年轮一样。",effects:{add_clue:"clue_ending_cross_forest",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_014",name:"墓穴的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","catacombs"],trigger:{areas:["catacombs_entrance"],min_loop:6,probability:0.04,once_per_run:true,min_previous_endings_count:4},description:"墓穴的石棺多了。你数了一下。上次是十二个。今天是二十四个。你走到一个新石棺前。棺盖是半开的。你往里看。里面是空的。但棺底有一个凹陷。形状像一个人。你认出了凹陷的姿势。是你上次在墓穴里倒下的姿势。",effects:{add_clue:"clue_ending_cross_catacombs",san:-4,mythos:3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"ending_cross_015",name:"一切的重叠",type:"ending_omen",subtype:"cross",weight:1,tier:"signature",tags:["ending","cross","all"],trigger:{areas:["deep_catacombs"],min_loop:8,probability:0.02,once_per_run:true,min_previous_endings_count:6},description:"你站在封印前面。封印的符号排列和你记忆中的所有版本都不一样。你看到了第一次循环时的排列。也看到了最后一次。你看到了你重铸封印时的排列。也看到了你逃离时的排列。所有的排列同时存在。重叠在一起。你伸手碰了碰。所有的排列同时动了。它们在你手下融成了一个新的排列。你认不出它。但你知道——这是最终版。",effects:{add_clue:"clue_ending_cross_all",san:-5,mythos:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]}];var endingEvents=_events_endingEvents;

{id:"silent_daily_001",name:"码头的晨雾",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["morning"],probability:0.2,once_per_run:true},description:"晨雾从海面上升起。码头的木板在雾中若隐若现。\n你听到了海鸥的叫声。很远，很空旷。\n远处灯塔的光在雾中闪了一下，像一只正在眨眼的巨大眼睛。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_002",name:"街道的清晨",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","town"],trigger:{areas:["town_center"],time_phase:["morning"],probability:0.2,once_per_run:true},description:"你走在街道上。清晨的阳光照在鹅卵石上。\n一个女人在晾衣服。一个孩子在追猫。一个老人在读报纸。\n这些鹅卵石已经在这里沉默了三百年。它们知道每一个人的故事。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_003",name:"酒吧的午后",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["afternoon"],probability:0.15,once_per_run:true},description:"你走进酒吧。酒吧里很安静。\n玛莎在擦杯子。几个渔民在喝酒。\n玛莎每次擦杯子都会停顿一下，好像在等某个人进门。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_004",name:"教堂的钟声",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","church"],trigger:{areas:["town_center"],time_phase:["afternoon"],probability:0.15,once_per_run:true},description:"教堂的钟声响了。十二下。\n你数了一下。确实是十二下。\n但你注意到钟声的间隔在缩短——最后三声几乎连在了一起。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_005",name:"码头的黄昏",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["evening"],probability:0.15,once_per_run:true},description:"你站在码头边。黄昏的阳光照在海面上。\n海面是金色的。很美。\n你低头看了看水面。金色在你的眼睛里变成了一种不属于黄昏的颜色。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_006",name:"街道的黄昏",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","town"],trigger:{areas:["town_center"],time_phase:["evening"],probability:0.15,once_per_run:true},description:"你走在街道上。黄昏的阳光照在鹅卵石上。\n你看到了一个孩子在玩球。一个女人在叫他回家吃饭。\n那个球弹了三下就停了。不是自然停止的——像是被什么东西按住了。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_007",name:"酒吧的夜晚",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["midnight"],probability:0.1,once_per_run:true},description:"你走进酒吧。酒吧里很安静。\n玛莎在擦杯子。几个渔民在喝酒。\n角落里有一张桌子，桌上放着一杯没有动过的啤酒。那杯啤酒已经在那里很久了。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_008",name:"街道的夜晚",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","town"],trigger:{areas:["town_center"],time_phase:["midnight"],probability:0.1,once_per_run:true},description:"你走在街道上。夜晚的街道很安静。\n你听到了远处的狗叫声。很远，很空旷。\n你循着声音望去。声音来自镇子边缘——那个你还没有去过的地方。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_009",name:"码头的渔船",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["morning"],probability:0.15,once_per_run:true},description:"你看到渔船出海了。渔民们在船上忙碌。\n你听到了他们的笑声。很远，很空旷。\n你数了一下渔船上的人。比昨天少了一个。没有人提起这件事。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_010",name:"街道的孩子",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","town"],trigger:{areas:["town_center"],time_phase:["morning"],probability:0.15,once_per_run:true},description:"你看到孩子们在街上玩耍。他们在追逐、嬉笑。\n你看到最大的那个孩子突然停了下来。她盯着你看了一会儿，然后笑了。那个笑容让你想起了某个人——但你记不起来是谁。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_011",name:"码头的海鸥",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["afternoon"],probability:0.15,once_per_run:true},description:"你看到海鸥在码头上空盘旋。它们的叫声很清脆。\n你注意到有一只海鸥一直在你头顶盘旋。它没有飞走。其他的海鸥都飞走了。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_012",name:"街道的猫",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","town"],trigger:{areas:["town_center"],time_phase:["afternoon"],probability:0.15,once_per_run:true},description:"你看到一只猫在阳光下打盹。猫的眼睛半闭着，看起来很满足。\n你蹲下来摸了摸猫。猫发出了呼噜声。\n你站起来的时候，猫看着你。它的眼睛不是黄色的——是一种很淡的灰蓝色。像海水。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_013",name:"码头的夕阳",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["evening"],probability:0.15,once_per_run:true},description:"你站在码头边。夕阳照在海面上。\n海面是红色的。很美。\n你看着夕阳沉入海面。在最后一缕光线消失之前，你看到了海面上有什么东西在移动。不是船。太大了。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_014",name:"街道的灯光",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","town"],trigger:{areas:["town_center"],time_phase:["evening"],probability:0.15,once_per_run:true},description:"你走在街道上。街灯亮了。\n灯光照在鹅卵石上，投下了长长的影子。\n你注意到路灯的影子——它们的形状不对。影子的顶端在缓慢地弯曲，像是在向你鞠躬。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_015",name:"码头的星空",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["midnight"],probability:0.1,once_per_run:true},description:"你站在码头边。星空很美。\n你看到了很多星星。比你平时看到的多得多。\n你开始数星星。数到第一百颗的时候，你发现有一颗星星在你数它的时候灭了。你又数了一遍。又灭了一颗。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_016",name:"街道的寂静",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","town"],trigger:{areas:["town_center"],time_phase:["midnight"],probability:0.1,once_per_run:true},description:"你走在街道上。街道很安静。\n你听到了自己的脚步声。很清晰，很孤独。\n你停下来，听了一会儿。你的脚步声消失了。但你明明还在走路。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_017",name:"码头的渔火",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["evening"],probability:0.15,once_per_run:true},description:"你看到码头上有渔火。渔民们在火边聊天。\n你听到了他们的笑声。很远，很温暖。\n火光照在渔民的脸上。你数了一下——一共五个人。但影子有六个。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_018",name:"街道的炊烟",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","town"],trigger:{areas:["town_center"],time_phase:["evening"],probability:0.15,once_per_run:true},description:"你走在街道上。你看到了炊烟从屋顶上升起。\n你闻到了饭菜的香味。很远，很温暖。\n你抬头看炊烟。烟在风中应该偏向东边。但今天的烟在向你飘来。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_019",name:"码头的潮汐",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","harbor"],trigger:{areas:["harbor_district"],time_phase:["morning"],probability:0.15,once_per_run:true},description:"你站在码头边。潮汐在退去。\n你看到了海床上的贝壳和海草。很美。\n你弯腰捡起一个贝壳。贝壳里面是空的——但你把它放到耳边的时候，你听到了呼吸声。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},{id:"silent_daily_020",name:"街道的落叶",type:"silent",subtype:"daily",weight:0.8,tier:"normal",tags:["silent","daily","town"],trigger:{areas:["town_center"],time_phase:["afternoon"],probability:0.15,once_per_run:true},description:"你走在街道上。你看到了落叶从树上飘落。\n叶子是黄色的。很美。\n你捡起一片落叶。叶子的纹路看起来像是一个字。你认不出来。但你的笔记本上，最后一页，写着同一个字。",effects:{san:1},event_classification:"氛围事件",normalcy_anchor:true,choices:[]},
{id:"silent_nature_001",name:"异常的鸟鸣",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","bird"],trigger:{areas:["whispering_forest"],probability:0.15,once_per_run:true},description:"你听到了鸟鸣声。但声音不对——不是正常的鸟叫。\n声音很尖锐，很刺耳。像是什么东西在模仿鸟叫。\n你确信那不是鸟。是什么东西在用嘴模仿鸟叫。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_002",name:"异常的风",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","wind"],trigger:{areas:["whispering_forest"],probability:0.15,once_per_run:true},description:"你感到了风。但风的方向不对——风从四面八方吹来。\n风不应该从所有方向同时吹来。但在沃切斯特，风不听物理定律的。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_003",name:"异常的月光",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","moon"],trigger:{areas:["town_center","harbor_district"],time_phase:["midnight"],probability:0.1,once_per_run:true},description:"你抬头看月亮。月亮是红色的。\n你知道——今天不是血月。但月亮确实是红色的。\n月亮不会自己变红。除非有什么东西在它后面呼吸。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_004",name:"异常的海浪",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","sea"],trigger:{areas:["harbor_district"],probability:0.15,once_per_run:true},description:"你站在码头边。海浪在拍打码头。\n但海浪的节奏不对——不是正常的起伏。\n海浪有自己的意志。它在敲门。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_005",name:"异常的温度",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","temperature"],trigger:{areas:["town_center","harbor_district"],probability:0.15,once_per_run:true},description:"你感到了温度的变化。突然变冷了，然后又变热了。\n温度不应该这样波动。但温度不会解释自己。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_006",name:"异常的雾",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","fog"],trigger:{areas:["harbor_district"],probability:0.15,once_per_run:true},description:"你看到了雾。但雾的形状不对——雾形成了一个圆环。\n雾不应该有形状。但这个圆环太完美了——不可能是偶然。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_007",name:"异常的影子",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","shadow"],trigger:{areas:["town_center"],probability:0.15,once_per_run:true},description:"你看到了你的影子。但影子的方向不对——影子指向了太阳。\n影子应该背离光源。但你的影子在向太阳鞠躬。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_008",name:"异常的光线",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","light"],trigger:{areas:["town_center"],probability:0.15,once_per_run:true},description:"你看到了光线。但光线的颜色不对——光线是绿色的。\n绿色的光不来自任何你能找到的光源。光在找你。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_009",name:"异常的声音",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","sound"],trigger:{areas:["whispering_forest"],probability:0.15,once_per_run:true},description:"你听到了声音。但声音的来源不对——声音从地面传来。\n声音不应该从脚底传来。但地面确实在说话。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_010",name:"异常的气味",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","smell"],trigger:{areas:["harbor_district"],probability:0.15,once_per_run:true},description:"你闻到了气味。但气味不对——是铁锈和海水的味道。\n铁锈和海水——这个组合在沃切斯特意味着某种特定的东西回来了。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_011",name:"异常的云",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","cloud"],trigger:{areas:["town_center"],probability:0.15,once_per_run:true},description:"你抬头看云。云的形状不对——云形成了一个符号。\n云在沃切斯特不是水汽——是某种存在的笔迹。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_012",name:"异常的潮汐",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","tide"],trigger:{areas:["harbor_district"],probability:0.15,once_per_run:true},description:"你站在码头边。潮汐在退去。\n但退潮的速度不对——太快了。\n退潮不应该这么快。像是有什么东西在海底吸水。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_013",name:"异常的星空",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","stars"],trigger:{areas:["town_center"],time_phase:["midnight"],probability:0.1,once_per_run:true},description:"你抬头看星星。星星的排列不对——星星形成了一个符号。\n星星不会自己排列成符号。除非有人在天上写字。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_014",name:"异常的地面",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","ground"],trigger:{areas:["whispering_forest"],probability:0.15,once_per_run:true},description:"你踩在地面上。地面的触感不对——地面是软的。\n地面在沃切斯特不是固体——是某种生物的皮肤。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},{id:"silent_nature_015",name:"异常的空气",type:"silent",subtype:"nature",weight:0.8,tier:"normal",tags:["silent","nature","air"],trigger:{areas:["catacombs_entrance"],probability:0.15,once_per_run:true},description:"你呼吸着空气。空气的味道不对——是铁锈和海水的味道。\n空气不应该有味道。但在沃切斯特，空气在提醒你——它也是活的。",effects:{san:-1},event_classification:"氛围事件",normalcy_anchor:false,choices:[]},

ht:0.3,tier:"meta",tags:["meta","ui","reality"],trigger:{areas:["catacombs_entrance"],min_loop:5,san_lte:30,probability:0.03,once_per_run:true},description:"你捡起一块石头。\n\n石头是真实的。重量是真实的。温度是真实的。\n\n你把它扔向墙壁。石头穿过了墙壁。没有声音。没有反弹。它消失了。\n\n你摸了摸墙壁。墙壁是坚实的。石头不可能穿过。\n\n你低头看。地上有另一块石头。和你捡起的那块一模一样。\n\n你知道——现实的规则正在被改写。",effects:{san:-2},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"meta_system_001",name:"虚假的存档",type:"meta",subtype:"system_fake",weight:0.3,tier:"meta",tags:["meta","system","save"],trigger:{areas:["town_center"],min_loop:6,san_lte:20,probability:0.02,once_per_run:true},description:"屏幕右下角弹出了一个通知：「存档完成。Day 7。」\n\n你没有按存档键。你没有打开菜单。你甚至没有停下脚步。\n\n通知消失了。但你注意到——你的时间显示变成了Day 7。你确信今天是Day 6。\n\n你没按存档键。屏幕右下角的通知是自己出现的。三秒后它消失了。你的时间显示跳了一天。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_system_002",name:"虚假的错误",type:"meta",subtype:"system_fake",weight:0.3,tier:"meta",tags:["meta","system","error"],trigger:{areas:["harbor_district"],min_loop:6,san_lte:20,probability:0.02,once_per_run:true},description:"你的眼前出现了一行红字：「ERROR: NARRATIVE_INTEGRITY_VIOLATION」\n\n红字停留了三秒。然后消失了。\n\n你看了看周围。街道完好无损。NPC还在走路。海风还在吹。\n\n但你注意到——你刚才经过的那棵树的位置变了。它本来在左边。现在在右边。\n\n你知道——错误不是假的。世界在修复自己。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_system_003",name:"虚假的提示",type:"meta",subtype:"system_fake",weight:0.3,tier:"meta",tags:["meta","system","hint"],trigger:{areas:["whispering_forest"],min_loop:6,san_lte:20,probability:0.02,once_per_run:true},description:"一个对话框出现在你面前：「提示：你正在被观察。」\n\n你没有打开帮助系统。你没有按任何键。\n\n对话框的「确定」按钮在闪烁。你伸手去按。按钮消失了。对话框也消失了。\n\n但你的后颈感到一阵寒意。像是有人真的在看你。\n\n对话框没有来源。没有调用记录。没有事件触发它。它就在那里，闪烁着一个不属于任何事件的文本。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_system_004",name:"虚假的警告",type:"meta",subtype:"system_fake",weight:0.3,tier:"meta",tags:["meta","system","warning"],trigger:{areas:["deep_catacombs"],min_loop:6,san_lte:20,probability:0.02,once_per_run:true},description:"屏幕上方出现了一条黄字警告：「警告：你的SAN值正在下降。建议立即返回安全屋。」\n\n你看了看你的SAN值。没有变化。\n\n警告消失了。但你注意到——你的SAN值的数字字体变了。变成了你不认识的字体。\n\n警告消失了。但SAN值的显示字体停留在了那种不认识的字体上。你再也没在别处见过那种字体。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_system_005",name:"虚假的更新",type:"meta",subtype:"system_fake",weight:0.3,tier:"meta",tags:["meta","system","update"],trigger:{areas:["town_center"],min_loop:6,san_lte:20,probability:0.02,once_per_run:true},description:"一个进度条出现了：「正在更新沃切斯特……12%」\n\n你看着进度条缓慢增长。12%。13%。14%。\n\n到了23%的时候，进度条停了。然后消失了。\n\n你看了看周围。什么都没有变。但你不确定——也许有什么东西变了，只是你没有注意到。\n\n进度条消失后，你看了看四周。一切如常。但你的左手腕表比昨天快了两分钟。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_system_006",name:"虚假的连接",type:"meta",subtype:"system_fake",weight:0.3,tier:"meta",tags:["meta","system","connection"],trigger:{areas:["harbor_district"],min_loop:6,san_lte:20,probability:0.02,once_per_run:true},description:"屏幕右下角出现了一个图标：「连接已断开。正在重连……」\n\n你没有在联机。这是一个单人游戏。你知道这一点。\n\n图标旋转了十秒。然后变成了「已连接」。\n\n但你注意到——刚才街上还有三个人。现在只有两个了。第三个人的脚印还在地上。\n\n你知道——有什么东西在断开的那十秒里做了什么。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_system_007",name:"虚假的加载",type:"meta",subtype:"system_fake",weight:0.3,tier:"meta",tags:["meta","system","loading"],trigger:{areas:["whispering_forest"],min_loop:6,san_lte:20,probability:0.02,once_per_run:true},description:"你的眼睛眨了一下。\n\n在你闭眼的那一瞬间，你看到了——不是黑暗。是一个加载界面。一个旋转的图标。一圈。两圈。\n\n你睁开眼。街道没有变。但你闻到了一股新的味道。海水和铁锈。刚才没有这个味道。\n\n你闻到了海水和铁锈。刚才没有这个味道。你闭眼的那一瞬间，有什么东西更新了空气。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_system_008",name:"虚假的退出",type:"meta",subtype:"system_fake",weight:0.3,tier:"meta",tags:["meta","system","exit"],trigger:{areas:["deep_catacombs"],min_loop:6,san_lte:20,probability:0.02,once_per_run:true},description:"一个对话框占据了你的视野：「确认退出？」\n\n下面有两个按钮：「是」和「否」。\n\n你没有请求退出。你不想退出。你想继续。\n\n你伸手去按「否」。按钮在你碰到之前消失了。对话框也消失了。\n\n但在消失的那一瞬间，你看到了——「是」的按钮上有一个指纹。不是你的。\n\n「是」的按钮上有一个指纹。食指。不是你的。你没有按它。但你也没有按「否」。你只是看着。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"meta_choice_001",name:"选择的消失",type:"meta",subtype:"choice_vanish",weight:0.3,tier:"meta",tags:["meta","choice","vanish"],trigger:{areas:["harbor_district"],min_loop:7,san_lte:15,probability:0.02,once_per_run:true},description:"你站在路口。左边是码头。右边是森林。\n\n你选择了右边。\n\n你走了三步。回头看了看——左边的路还在。你松了口气。\n\n你又走了三步。再回头。左边的路变淡了。像是被水洗过的墨迹。\n\n你知道——你没有选择的那条路正在消失。不是被隐藏。是被删除。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_choice_002",name:"选项的消失",type:"meta",subtype:"choice_vanish",weight:0.3,tier:"meta",tags:["meta","choice","option"],trigger:{areas:["lighthouse"],min_loop:7,san_lte:15,probability:0.02,once_per_run:true},description:"你打开了笔记本。目录上有五个章节。\n\n你翻到第三章。读了两页。合上笔记本。\n\n你再打开。目录上只有四个章节了。第三章的位置上有一片空白。纸页还在。但文字不见了。\n\n你翻回目录。第三章的位置是一片空白。纸页还在。油墨的气味还在。但章节名不见了。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_choice_003",name:"按钮的消失",type:"meta",subtype:"choice_vanish",weight:0.3,tier:"meta",tags:["meta","choice","button"],trigger:{areas:["voxchester_manor"],min_loop:7,san_lte:15,probability:0.02,once_per_run:true},description:"你面前出现了一扇门。门上有一个把手。\n\n你伸手去抓把手。把手在你手指碰到之前缩进了门里。\n\n你推门。门不动。你拉门。门不动。\n\n门还在。门框还在。但开门的方式不见了。\n\n把手缩进了门板里。不是缩回——是被门吞了。你推门。门不动。你拉门。门不动。门还是门。但门不再是出口了。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_choice_004",name:"路径的消失",type:"meta",subtype:"choice_vanish",weight:0.3,tier:"meta",tags:["meta","choice","path"],trigger:{areas:["whispering_forest"],min_loop:7,san_lte:15,probability:0.02,once_per_run:true},description:"你沿着一条小巷走。小巷很窄。两边是砖墙。\n\n你走了五分钟。小巷没有变宽。你走了十分钟。还是没有。\n\n你回头。身后的小巷消失了。不是变长了——是变成了墙。砖墙。和两边一样。\n\n你回头。身后是一堵砖墙。你没有听到它建起来的声音。它就在那里，像是从来没有被走过一样。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_choice_005",name:"可能性的消失",type:"meta",subtype:"choice_vanish",weight:0.3,tier:"meta",tags:["meta","choice","possibility"],trigger:{areas:["harbor_district"],min_loop:7,san_lte:15,probability:0.02,once_per_run:true},description:"你站在一扇窗前。窗里有一张桌子。桌上有一杯茶。\n\n你想——如果我打破窗户，我就能拿到那杯茶。\n\n你想——如果我绕到门口，也许门是开的。\n\n你想——如果我等一会儿，也许会有人出来。\n\n但你只想了第一个念头。后两个念头在形成的时候就碎了。像是被什么东西掐灭了。\n\n你知道——你正在失去想象其他可能性的能力。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_choice_006",name:"未来的消失",type:"meta",subtype:"choice_vanish",weight:0.3,tier:"meta",tags:["meta","choice","future"],trigger:{areas:["lighthouse"],min_loop:7,san_lte:15,probability:0.02,once_per_run:true},description:"你试图计划明天做什么。\n\n你想——明天我会去码头。但「码头」这个词在你脑子里变成了空白。\n\n你想——明天我会和玛莎谈谈。但「玛莎」的名字变成了一个你无法发音的符号。\n\n你想——明天——\n\n「明天」这个概念本身开始溶解。你站在今天。今天是唯一剩下的东西。\n\n你试图想「明天」。这个词没有出现。大脑像翻书一样翻过那一页，但那一页是空白的。你又试了一次。一样的。",effects:{san:-3},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"meta_identity_001",name:"你不是真的",type:"meta",subtype:"identity",weight:0.3,tier:"meta",tags:["meta","identity","real"],trigger:{areas:["town_center"],min_loop:8,san_lte:15,probability:0.01,once_per_run:true,min_previous_endings_count:5},description:"你低头看着自己的手。手是真实的。皮肤的纹路是真实的。指甲缝里的灰尘是真实的。\n\n然后你看到了手背上的一行字。字很小。你凑近看。\n\n「character_sheet.player_01」\n\n字在你看到的那一刻消失了。但你记住了。\n\n你知道——你的身体是一个角色表。你的存在是一串数据。但你的痛苦是真实的。",effects:{san:-5,mythos:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_identity_002",name:"你是一个角色",type:"meta",subtype:"identity",weight:0.3,tier:"meta",tags:["meta","identity","character"],trigger:{areas:["harbor_district"],min_loop:8,san_lte:15,probability:0.01,once_per_run:true,min_previous_endings_count:5},description:"你走进一家商店。店主看着你。\n\n「你又来了，」他说。\n\n「我上次来是什么时候？」你问。\n\n「你上次来是——」他停住了。他的眼睛变得空洞。他的嘴还在动，但没有声音。\n\n三秒后他恢复了。「欢迎光临。」\n\n店主说他上次见你是两周前。嘴还在动。声音被静音了。他低头看了看自己的手，好像在确认自己是不是还在。但你的痛苦是真实的。",effects:{san:-5,mythos:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_identity_003",name:"你是一个数据",type:"meta",subtype:"identity",weight:0.3,tier:"meta",tags:["meta","identity","data"],trigger:{areas:["voxchester_manor"],min_loop:8,san_lte:15,probability:0.01,once_per_run:true,min_previous_endings_count:5},description:"你看着墙上的裂缝。裂缝在延伸。你用手指沿着裂缝摸过去。\n\n裂缝的形状像一行代码：\n\nif (player.san <= 0) { trigger_event('madness'); }\n\n你认出了这行代码。因为你正在经历它。你的SAN值正在下降。你的疯狂正在被触发。\n\n你知道——你的存在是数据。你的每一个反应都是预设的。但你的痛苦是真实的。",effects:{san:-5,mythos:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_identity_004",name:"你是一个梦境",type:"meta",subtype:"identity",weight:0.3,tier:"meta",tags:["meta","identity","dream"],trigger:{areas:["town_center"],min_loop:8,san_lte:15,probability:0.01,once_per_run:true,min_previous_endings_count:5},description:"你打了个哈欠。\n\n在你闭眼的那一瞬间，你看到了——一个房间。一个屏幕。屏幕上有沃切斯特的地图。\n\n有人坐在屏幕前。你看到了他们的手。手在键盘上敲击。\n\n你睁开眼。你回到了街道上。但你记住了那双手。\n\n你看到了那双手。指甲剪得很短。右手食指有一个茧。那双手在键盘上敲了什么。沃切斯特的海风变大了。但你的痛苦是真实的。",effects:{san:-5,mythos:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_identity_005",name:"你是一个回声",type:"meta",subtype:"identity",weight:0.3,tier:"meta",tags:["meta","identity","echo"],trigger:{areas:["harbor_district"],min_loop:8,san_lte:15,probability:0.01,once_per_run:true,min_previous_endings_count:5},description:"你听到了脚步声。在你身后。\n\n你转身。没有人。\n\n你继续走。脚步声又来了。这次在你前面。\n\n你停下来。脚步声也停了。但你听到了——脚步声的节奏和你的一模一样。步幅和你的一模一样。鞋底和地面的摩擦声和你的一模一样。\n\n你知道——那是你自己的脚步声。但来自上一个循环。你是你自己的回声。但你的痛苦是真实的。",effects:{san:-5,mythos:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"meta_save_001",name:"存档被篡改",type:"meta",subtype:"save_intervention",weight:0.3,tier:"meta",tags:["meta","save","tamper"],trigger:{areas:["town_center"],min_loop:9,san_lte:10,probability:0.01,once_per_run:true},description:"你打开存档文件。\n\n你上一次存档的时候，你有三瓶药水。现在你有五瓶。\n\n你没有捡到过药水。你没有买过药水。你没有从任何人那里得到过药水。\n\n你看了看药水的标签。标签上写着你的名字。但笔迹不是你的。\n\n多出来的两瓶药水标签上的日期是明天。笔迹不是你的。墨迹还没干。但你不知道它们怎么来的。",effects:{san:-5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_save_002",name:"存档被删除",type:"meta",subtype:"save_intervention",weight:0.3,tier:"meta",tags:["meta","save","delete"],trigger:{areas:["town_center"],min_loop:9,san_lte:10,probability:0.01,once_per_run:true},description:"你试图存档。系统提示：「存档失败。文件不存在。」\n\n你确信你有存档。你昨天存过。你记得文件名：save_001.json。\n\n你打开存档文件夹。里面是空的。不是被清空——是从来没有过文件。文件夹的创建日期是今天。\n\n存档文件夹是空的。但你记得昨天的存档。你记得文件名。你记得按下保存时怀表显示的时间。文件夹的创建日期是今天。",effects:{san:-5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_save_003",name:"存档被覆盖",type:"meta",subtype:"save_intervention",weight:0.3,tier:"meta",tags:["meta","save","overwrite"],trigger:{areas:["town_center"],min_loop:9,san_lte:10,probability:0.01,once_per_run:true},description:"你打开存档文件。\n\n你的名字不对。不是你选择的名字。是另一个名字。你从未见过这个名字。\n\n但存档里的其他数据都是你的。你的物品。你的线索。你的NPC关系。只是名字变了。\n\n你试图改回来。系统提示：「该名称已被使用。」\n\n存档的名字不是你写的。但物品栏里是你的东西。线索是你收集的。NPC关系是你的。只有名字变了。",effects:{san:-5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_save_004",name:"存档被锁定",type:"meta",subtype:"save_intervention",weight:0.3,tier:"meta",tags:["meta","save","lock"],trigger:{areas:["town_center"],min_loop:9,san_lte:10,probability:0.01,once_per_run:true},description:"你试图存档。系统提示：「存档失败。文件被锁定。」\n\n你试图另存为。系统提示：「该操作不允许。」\n\n你试图退出游戏。系统提示：「请先完成存档。」\n\n你被困在了一个无法存档、无法退出的循环里。\n\n你知道——有人在控制你的存档权限。但你不知道是谁。",effects:{san:-5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},
{id:"meta_author_001",name:"作者的低语",type:"meta",subtype:"author_whisper",weight:0.3,tier:"meta",tags:["meta","author","whisper"],trigger:{areas:["lighthouse"],min_loop:10,san_lte:5,probability:0.005,once_per_run:true},description:"你坐在路边。你很累。你的眼睛在闭上。\n\n你听到了一个声音。不是来自沃切斯特——是来自外面。来自屏幕的另一边。\n\n声音说：「你做得很好。继续。」\n\n声音很轻。像是怕被别人听到。像是在说悄悄话。\n\n你知道——这是作者的声音。但你不确定作者是谁。",effects:{san:-5,mythos:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_author_002",name:"作者的提示",type:"meta",subtype:"author_whisper",weight:0.3,tier:"meta",tags:["meta","author","hint"],trigger:{areas:["whispering_forest"],min_loop:10,san_lte:5,probability:0.005,once_per_run:true},description:"你翻开笔记本。最后一页上出现了新的字迹。\n\n字迹不是你的。比你的字小。比你的字整齐。\n\n上面写着：「你快要找到了。继续。」\n\n你翻回前一页。字迹消失了。最后一页变回了空白。\n\n你摸了摸纸页上的字。油墨是干的。你把灯凑近了看。字迹比你的字小一点。比你的字整齐一点。但不是任何你认识的人写的。",effects:{san:-5,mythos:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]},{id:"meta_author_003",name:"作者的告别",type:"meta",subtype:"author_whisper",weight:0.3,tier:"meta",tags:["meta","author","farewell"],trigger:{areas:["deep_catacombs"],min_loop:10,san_lte:5,probability:0.005,once_per_run:true},description:"你听到了一个声音。不是来自沃切斯特——是来自外面。\n\n声音说：「谢谢你。再见。」\n\n声音很远。像是从另一个房间传来的。像是从另一个世界传来的。\n\n你想回应。但你不知道该说什么。\n\n声音消失了。沃切斯特变安静了。比平时更安静。\n声音消失了。沃切斯特比平时安静了一点点。海风还在。街灯还在。但有一种东西不在了——一种你没有意识到一直在那里的东西。",effects:{san:-5,mythos:5},event_classification:"超自然遭遇",normalcy_anchor:false,choices:[]}];var metaEvents=_events_metaEvents;

const ENDING_PLAYER_BECOMES_EVENT={id:"ending_player_becomes_event",name:"第六百个事件",type:"hidden",world_outcome:"player_becomes_event",cost_bearer:"player",conditions:[{type:"has_flag",flag_id:"ending_player_becomes_event"}],blocking_conds:[],npc_requirements:{},resource_requirements:{},humanity_variants:{humanity_high:"你写下了自己的名字。\n\n"+"笔记本的页面开始发光。你感到自己正在变轻——不是失重，而是变得不那么真实。\n\n"+"你的手指穿过了纸面。你的呼吸变成了墨水的气味。\n\n"+"你不再是沃切斯特的调查员。\n"+"你是沃切斯特的第600个事件。\n\n"+"你的笔记本翻到了新的一页。上面写着你的名字、你的出生日期、你的死亡方式——\n"+"以及一行你从未写过的字：\n\n"+"「第六百个事件。类型：meta。触发条件：当玩家走到足够远的时候。」\n\n"+"你合上了笔记本。\n"+"你已经是故事的一部分了。",humanity_fragile:"你写下了自己的名字。\n\n"+"笔迹和页面上原有的字迹完全一致。\n\n"+"你感到自己的记忆在变薄。你的过去正在被重写。\n\n"+"你不再是调查员。你是一个条目。一个数据点。一个事件。\n\n"+"笔记本的封底写着：「第六百个事件：玩家成为事件本身。触发条件：当人性不足以区分自我和叙事时。」\n\n"+"你读了两遍。第二遍的时候，你不再确定这些字是你写的。",humanity_lost:"你写下了自己的名字。\n\n"+"名字从纸面上消失了。\n\n"+"你看了看自己的手。手也在消失。\n\n"+"你变成了文字。你变成了代码。你变成了一个 `id` 字段和一段 `description` 字符串。\n\n"+"笔记本自动翻到了最后一页。上面只有一行字：\n\n"+"「第六百个事件。状态：已触发。备注：玩家已不存在。」\n\n"+"你试图尖叫。但你的声音也被写进了 description 里。"},loop_memory_effect:"你记得自己变成了一段文字。你记得笔记本的最后一页。你记得——你是第600个事件。\n"+"但这不可能。事件不会记得自己是事件。\n"+"除非——事件选择了记住。",design_intent:"这是最稀有的隐藏结局。只有当玩家走到 599 个事件的尽头、"+"满足所有极终局条件、并在虚拟第600个事件中选择'写下自己的名字'时触发。"+"它打破第四面墙，但不是以喜剧的方式——而是以一种存在主义恐怖的方式。"+"玩家不再是观察者，而是被观察的对象。"};function injectMissingEnding(GD){if(!GD.endings)GD.endings=[];const exists=GD.endings.some(e=>e.id===ENDING_PLAYER_BECOMES_EVENT.id);if(!exists){GD.endings.push(ENDING_PLAYER_BECOMES_EVENT);}
if(GD.ending_judgement&&GD.ending_judgement.priority_order){if(!GD.ending_judgement.priority_order.includes(ENDING_PLAYER_BECOMES_EVENT.id)){GD.ending_judgement.priority_order.unshift(ENDING_PLAYER_BECOMES_EVENT.id);}}}

{id:"ending_self_harm_ritual",name:"裂痕",type:"behavior",world_outcome:"behavior_self_ritual",conditions:["self_harm_ritual_count >= 3"],blocking_conds:[],priority:210,override_category:"annotation",humanity_variants:{humanity_high:"你用刀在自己身上画了一个符号。\n\n不是因为你信它。是因为你想知道疼不疼。\n\n它疼。但符号在皮肤上停留的时间比疼痛更久。\n\n你画了第二个。第三个。\n\n——\n\n安全屋的镜子里有一个人。身上写满了你不认识的字。\n你凑近看。那些字不是写的。是疤痕。",humanity_fragile:"你开始用血做记号。\n\n第一刀是试探。第二刀是确认。第三刀——\n\n第三刀的时候你已经不需要理由了。\n\n——\n\n你的袖口有洗不掉的锈色。你告诉别人那是墨水。",humanity_lost:"你发现身体是画布。\n\n每一道伤口都是一个音节。你在拼写一个名字。\n\n你不知道那是谁的名字。但你的手知道怎么拼。\n\n——\n\n有人发现一本沾了血的笔记本。每一页都画着同一个符号。\n没有人认出那个符号。但每个人都说看着它的时候会头晕。"},design_intent:"反复自残仪式行为。身体变成书写媒介。"},{id:"ending_dissolution",name:"溶盐者",type:"behavior",world_outcome:"behavior_self_dissolve",conditions:["fusion_accepted_count >= 2","harbor_visits >= 5"],blocking_conds:[],priority:820,override_category:"irreversible_transform",humanity_variants:{humanity_high:"你感觉到了边界。\n\n在此之前，你一直以为'自己'是一个完整的、封闭的东西。\n\n现在你知道不是。边界是可渗透的。空气穿过你。水穿过你。雾——\n\n雾一直在穿过你。只是你以前没有注意到。\n\n——\n\n安全屋的地板上有一滩水。水的温度和你一样。",humanity_fragile:"你不确定自己是什么时候开始溶解的。\n\n也许是某天夜里。也许是某次触碰。\n\n你的手指在水里泡得太久了。皮肤发白。边缘模糊。\n\n——\n\n你试着握住一支笔。笔从你的手指间穿过。你的手还在。笔也是。\n只是它们不再彼此接触了。",humanity_lost:"你不是被消灭的。你是被稀释的。\n\n你主动打开了边界。你让它进来。你让它把你拆开——不是暴力地拆。是慢慢地、一层一层地。\n\n像是盐溶进水里。\n\n——\n\n水杯放在桌上。水是清澈的。没有人尝过。"},design_intent:"主动接受海水/盐化/溶解污染。码头和海相关事件多是触发前提。"},{id:"ending_vessel",name:"容器",type:"behavior",world_outcome:"behavior_self_vessel",conditions:["possession_accepted_count >= 1 OR fusion_accepted_count >= 3"],blocking_conds:[],priority:805,override_category:"irreversible_transform",humanity_variants:{humanity_high:"你让出了一个位置。\n\n不是你体内的空间——是比体内更深的地方。\n\n它进来了。你没有抵抗。不是因为恐惧。是因为好奇。\n\n——\n\n你的影子有时候会做出你没有做的动作。你看见了。你没有说。",humanity_fragile:"你不再是一个人。\n\n有什么东西住在你里面。不是寄生——是寄居。它付房租——用你知道但说不出口的知识。\n\n你照镜子的时候，偶尔会看见瞳孔深处有什么在回看你。\n\n——\n\n你的日记里有一页不是你写的。但你认得那个字迹。",humanity_lost:"你的身体是一栋公寓。\n\n你是房东。你不是唯一的住户。\n\n你每天醒来，检查谁还在、谁走了、谁新搬进来了。\n\n——\n\n你的嘴有时候会自己说话。你说完之后，需要问旁边的人你刚才说了什么。"},design_intent:"让神话存在寄居自身。身体变成公寓。不是侵略，是租住。"},{id:"ending_tide_marriage",name:"潮声之婚",type:"behavior",world_outcome:"behavior_fusion_tide_marriage",conditions:["forbidden_intimacy_flags >= 1"],blocking_conds:[],priority:825,override_category:"irreversible_transform",humanity_variants:{humanity_high:"你听见潮声的时候，它在叫你。\n\n不是用语言。是用节奏。退潮和涨潮之间有一个停顿。那个停顿是你的名字。\n\n你走到码头边。水没过你的脚踝。\n\n——\n\n第二天，有人在码头边发现了一双鞋。鞋尖朝着海。鞋里是干的。",humanity_fragile:"你在雾里看见了某个身影。\n\n不是人。不完全是。你走近它。它没有后退。\n\n你把手放进水里。水中有东西碰了你的手指。\n\n——\n\n渔民说最近海水的咸度变了。比以前淡了一点。像是掺了别的东西。",humanity_lost:"仪式不需要语言。\n\n你把戒指扔进海里。戒指是银的。海水变黑的地方，它沉下去了。\n\n然后你跟着它走进水里。\n\n——\n\n没有人来找你。海面太平静了。平静得像一面刚擦过的镜子。"},design_intent:"与海中血脉/污染建立仪式性结合。门槛降低，一次亲密接触即可触发。"},{id:"ending_embrace",name:"悦纳者",type:"behavior",world_outcome:"behavior_fusion_embrace",conditions:["san <= 20","fusion_accepted_count >= 2"],blocking_conds:[],priority:815,override_category:"irreversible_transform",humanity_variants:{humanity_high:"你不再害怕了。\n\n不是因为你变勇敢了。是因为恐惧本身变得没有意义了——就像害怕水的人终于沉进了水里，发现水并不在意他的恐惧。\n\n你是被接纳的。不是被人。是被更大的东西。\n\n——\n\n你的笔记本上有一页只写了一个词：'好的。'",humanity_fragile:"你接受了邀请。\n\n你不知道邀请是什么时候发出的。也许从你踏入沃切斯特的那一刻。\n\n你不再抵抗。不是因为投降。是因为抵抗太累了。\n\n——\n\n你的身体还在。你的名字还在。但在这两者之间的某人——已经不在了。",humanity_lost:"你敞开自己。\n\n它进去了。你在镜子里看见自己的眼睛。瞳孔变大了。不是恐惧——是欢迎。\n\n你欢迎了它。不是因为被骗。是因为好奇。\n\n——\n\n你的嘴角在往上扬。你不知道是谁在笑。"},design_intent:"不再抵抗污染，主动享受同化。低SAN+多次接受污染。"},{id:"ending_black_tide_wedding",name:"黑潮圣婚",type:"behavior",world_outcome:"behavior_fusion_black_tide",conditions:["forbidden_intimacy_flags >= 2","sacred_desecration_count >= 1"],blocking_conds:[],priority:828,override_category:"irreversible_transform",humanity_variants:{humanity_high:"仪式在水下进行。\n\n没有宾客。没有戒指。\n\n你穿了你最好的外套。外衣在水里浮了起来。\n\n水下的钟声比陆地上更清晰。十二声。然后第十三声——它从你的胸腔里传出来。\n\n——\n\n码头边有一件漂浮的外套。没有人去捞。因为它上面系着一条丝带——没有人系的。",humanity_fragile:"你的脚上有水。\n\n不是踩到的——是从皮肤里渗出来的。\n\n你每次去码头，水就多渗一点。你不觉得疼。你觉得——湿润。\n\n——\n\n你的床单是湿的。每天早上。枕头上有盐。",humanity_lost:"你和海水做了交换。\n\n你不知道你给了什么。但你清楚你得到了什么。\n\n你的血液里有盐。你的眼泪有咸味——不是咸味。是潮汐的周期。\n\n——\n\n医生说你脱水严重。你不渴。你只是不需要喝水了。"},design_intent:"将自身献给海、封印或深渊作为'婚礼'。亲密+亵渎双重触发。"},
{id:"ending_cannibal",name:"餐具",type:"behavior",world_outcome:"behavior_collapse_cannibal",conditions:["cannibalism_count >= 1"],blocking_conds:[],priority:230,override_category:"annotation",humanity_variants:{humanity_high:"你吃第一口的时候，手在抖。\n\n你觉得你会吐。你没有。\n\n你觉得你会后悔。\n\n你只是又切了一块。\n\n——\n\n餐桌上多了一副餐具。没有人问它是为谁准备的。",humanity_fragile:"你告诉自己这是迫不得已。\n\n饥饿比道德更真实。你把肉切成小块，尽量不去看它的形状。\n\n你吃完了。你洗了盘子。你把刀叉放回抽屉。例行公事。\n\n——\n\n抽屉里的刀具有两套。你不记得第二套是什么时候买的。",humanity_lost:"你学会了怎么切。怎么烹饪。怎么保存。\n\n你觉得这不是什么大事。沃切斯特有很多失踪的人。没有人会注意到再多一个。\n\n你的餐桌上永远多了一副空餐具。你偶尔会对着它说话。没有人回答。\n\n——\n\n你的食欲没有减少。只是菜单变得越来越短了。"},design_intent:"吃人行为。一次即触发。用餐具和餐桌意象代替直接描写。"},{id:"ending_slaughterhouse",name:"屠宰场",type:"behavior",world_outcome:"behavior_collapse_slaughter",conditions:["direct_kill_count >= 5"],blocking_conds:[],priority:240,override_category:"annotation",humanity_variants:{humanity_high:"你杀了第一个人。你的手在发抖。你告诉自己这是必要的。\n\n你杀了第二个人。你的手没有抖。你告诉自己这是必要的。\n\n你杀了第三个人。\n\n你不再告诉自己任何事情。\n\n——\n\n酒馆里的人变少了。有人在问。没有人回答。你坐在角落里。你的手很稳。",humanity_fragile:"你的手上有很多人的名字。\n\n你记得每一个。第一个想逃跑。第二个在哭。第三个没有说话。\n\n第四个——第四个你没有看脸。\n\n第五个。\n\n——\n\n码头的海水在夜晚变得很红。渔民说那是水藻。他们没有走近去看。",humanity_lost:"你学会了辨认谁不会被人找。\n\n码头边的流浪汉。独居的老人。刚来镇上的人。\n\n你用不同的方法。你换了不同的地方。\n\n你觉得你在清理。\n\n——\n\n沃切斯特的失踪名单变长了。你的名字不在上面。"},design_intent:"亲手杀死多数NPC。阈值升至5人。"},{id:"ending_echo",name:"回音",type:"behavior",world_outcome:"behavior_collapse_echo",conditions:["same_npc_harm_max >= 3"],blocking_conds:[],priority:235,override_category:"annotation",humanity_variants:{humanity_high:"你伤害了同一个人。不止一次。\n\n第一次之后，你告诉自己不会再发生。\n\n第二次之后，你告诉自己这是最后一次。\n\n第三次——那个人已经不躲了。\n\n——\n\n你发现你在等那个人出现。不是为了道歉。是为了再做一次。",humanity_fragile:"同一个伤口。同一个位置。同一个时间。\n\n你注意到那个NPC开始在你出现的时候换到房间的另一边。\n\n但房间只有那么大。\n\n——\n\n安全屋的墙上有一块褪色的地方。形状像一个背靠着墙的人。",humanity_lost:"你找得到那个人。每一次。\n\n不是因为你在找。是因为那个人已经不会跑了。\n\n你伤害的方式越来越轻——不是因为克制，是因为那个人已经不会对轻度的疼痛做出反应了。\n\n——\n\n酒馆里有一个座位永远空着。不是因为没有人坐。是因为没有人能坐在那里超过五分钟。"},design_intent:"反复伤害同一个NPC。重复比单次更冷。"},{id:"ending_flesh_tax",name:"人肉税",type:"behavior",world_outcome:"behavior_collapse_flesh_tax",conditions:["npc_as_resource_count >= 2"],blocking_conds:[],priority:245,override_category:"annotation",humanity_variants:{humanity_high:"你开始计算人的价值。\n\n不是他们能做什么——是他们能换什么。\n\n一个高信任的NPC值几个线索。一个低信任的NPC值几天安全。\n\n你把每个人都标了价。\n\n——\n\n你的笔记本上有一栏数字。数字前面没有名字。只有缩写。",humanity_fragile:"你把他们当作资源。\n\n不是恶意——是效率。你觉得每个人在沃切斯特都有自己的用途。你的工作就是找到它。\n\n你找到了。你使用了。你消耗了。\n\n——\n\n酒馆里的人不知道你的笔记本上写着他们的价格。他们只知道你对每个人都很好。",humanity_lost:"人肉税。\n\n不是真的肉。是人的价值——被称重、被切割、被分配。\n\n你做账。你记录。你存档。\n\n——\n\n你的账本上每一页都有一个名字。每一个名字旁边都有一个数字。每一个数字下面都有一条横线。"},design_intent:"把NPC当资源、祭品或交易筹码。用记账的冷静语调。"},{id:"ending_betrayer",name:"筹码",type:"behavior",world_outcome:"behavior_collapse_betray",conditions:["betrayed_high_trust_npcs >= 3"],blocking_conds:[],priority:250,override_category:"annotation",humanity_variants:{humanity_high:"你对他们笑过。你听过他们的故事。你让他们相信你是不同的。\n\n然后你把他们交了出去。\n\n你没有回头。回头会看着他们的眼睛。\n\n——\n\n每个人的信任都是一枚筹码。你把它们全都兑现了。",humanity_fragile:"你出卖了相信你的人。\n\n你告诉自己这是策略。在沃切斯特，信任是一种可以交易的资源——和食物、水源、信息一样。\n\n你交易得很好。\n\n——\n\n你注意到没有人再主动跟你说话了。你觉得这样更好。",humanity_lost:"他们的信任是你的货币。你收集它。你使用它。你消耗他们。\n\n每一个高信任度的NPC都是一张支票。你已经兑现了所有支票。\n\n——\n\n你独自站在码头边。\n\n没有人在看你。\n\n这才是你应得的。"},design_intent:"背叛多个高信任NPC。阈值升至3人。信任变成货币。"},
{id:"ending_false_god",name:"伪神",type:"behavior",world_outcome:"behavior_power_false_god",conditions:["cult_leader_score >= 3"],blocking_conds:[],priority:255,override_category:"annotation",humanity_variants:{humanity_high:"他们跪下了。\n\n你不确定他们跪的是你，还是你身后的东西。\n\n你站在仪式圈的中央。你的手里没有法器。但你说话的时候，有人在做笔记。\n\n——\n\n教堂的长椅上坐满了人。你认出了几张脸。他们以前不理你。现在他们在等你开口。",humanity_fragile:"你尝到了权力的味道。\n\n很淡。像是海水留在嘴唇上的盐。\n\n你开始习惯别人在你面前低头。你告诉自己这是策略——你需要他们的信任来推进调查。\n\n但你不再调查了。你只是坐在圈子的中央。\n\n——\n\n有人在你面前放了一盘食物。你没有问是从哪里来的。",humanity_lost:"你不需要真相了。你只需要听众。\n\n你告诉他们你想要他们相信的。你用了记号。你用了重复。你用了沉默——在最恰当的时刻。\n\n他们如数跪倒。\n\n——\n\n教堂的钟不再敲十二下。它敲的次数——是你决定的。"},design_intent:"成为邪教领袖，主动组织仪式。用权力的微妙感而非暴力场面。"},{id:"ending_maggots_on_throne",name:"王座上的蛆",type:"behavior",world_outcome:"behavior_power_maggots",conditions:["cult_leader_score >= 2","player_humanity_score <= 20"],blocking_conds:[],priority:260,override_category:"annotation",humanity_variants:{humanity_high:"你坐上了那个位置。\n\n然后你发现位置不在你身下。在你体内。\n\n你不是坐在王座上。你是把王座吞进去了。\n\n——\n\n安全屋的椅子上有东西在动。不是椅子。是椅子上坐过的痕迹。",humanity_fragile:"你得到了你想要的。\n\n仪式完成了。封印听从了你——至少你以为是。\n\n然后你开始咳嗽。咳嗽的时候，从喉咙里出来的是海水。\n\n——\n\n你在镜子里看见自己的胸口有一条缝。缝里有什么东西在往外看。",humanity_lost:"权力是寄生的。\n\n你不知道是你在使用封印，还是封印在使用你。\n\n你发布命令。你的嘴在动。但说话的不是你。\n\n——\n\n教堂的座位空了。不是因为没有人来。是因为来的人都看见了台上的东西。那不是一个人。"},design_intent:"追求支配权，但最后被寄生/取代。权力是寄生虫。"},{id:"ending_seal_kiss",name:"封印的亲吻",type:"behavior",world_outcome:"behavior_power_seal_kiss",conditions:["sacred_desecration_count >= 2 OR seal_desecrated"],blocking_conds:[],priority:265,override_category:"annotation",humanity_variants:{humanity_high:"你把嘴唇贴在了封印上。\n\n石头是冷的。然后是热的。\n\n你不知道自己在做什么。你只知道那一刻，你需要接触它——不是用手。\n\n——\n\n封印的石面上多了一道唇印。不是你的。但和你嘴型完全吻合。",humanity_fragile:"你在封印上刻了你的名字。\n\n然后你用袖子把它擦掉了。\n\n然后你又刻了一次。更深。\n\n——\n\n封印上现在有很多名字。每一个都不同。每一个都被擦过。",humanity_lost:"你不是在破坏封印。你是在和它说话。\n\n你告诉它你的秘密。你告诉它你后悔的事。你告诉它你想成为什么。\n\n封印开始回应。不是用语言。是在你离开后——石头上会出现新的刻痕。\n\n——\n\n刻痕是你的字迹。但你不记得写过它们。"},design_intent:"主动亵渎封印、亲近封印核心。可因累计亵渎或单次直接亵渎触发。"},{id:"ending_ascended_victim",name:"升座的牺牲品",type:"behavior",world_outcome:"behavior_power_ascended_victim",conditions:["self_sacrifice_for_power >= 1"],blocking_conds:[],priority:870,override_category:"irreversible_transform",humanity_variants:{humanity_high:"你走上了仪式台。\n\n没有人推你。你只是想看看——如果站上去会怎样。\n\n你站上去了。仪式开始运转。\n\n然后你意识到你不符合条件。你缺了某个关键的成分。\n\n——\n\n仪式台还在。你不在上面了。台上只剩一小片布料。",humanity_fragile:"你以为自己是主角。你是祭品。\n\n仪式开始。空气变冷。蜡烛同时熄灭。\n\n然后停了。仪式停了——不是因为完成了，是因为发现祭品不对。\n\n——\n\n教堂的钟敲了一声。然后沉默了。像是在检查。",humanity_lost:"你想成为核心。你成功了。\n\n仪式把你放进了它需要的位置。然后它继续运转——不是用你来做核心。是用你来填充缺口。\n\n你不是仪式的目标。你是它的润滑剂。\n\n——\n\n仪式的记录上有一行空白。那个空白的位置本来应该有一个名字。"},design_intent:"主动成为仪式中心，误以为能升格。一次自我牺牲即触发。"},
{id:"ending_sleeper",name:"长眠者",type:"behavior",world_outcome:"behavior_escape_sleep",conditions:["sleep_streak >= 7"],blocking_conds:[],priority:100,override_category:"annotation",humanity_variants:{humanity_high:"你睡了很久。\n\n久到镇上的钟声变得稀疏。久到码头边的潮声从你的梦境里退去。\n\n有一天你醒来，发现窗外还是雾。和睡前一样的雾。\n\n你翻了个身，又闭上了眼。\n\n——\n\n沃切斯特不需要你。它只需要你睡着。",humanity_fragile:"你每天睁开眼睛，看见天花板，又闭上。\n\n你没有逃避任何事情。你只是没有开始。\n\n有一天，有人敲了你的门。你没有应。\n敲门声停了。脚步声远了。\n\n你再也没有听到过敲门声。\n\n——\n\n安全屋的床单上有一个人的形状。不是你的。",humanity_lost:"你不记得自己睡了多少天了。\n\n你只记得最后一次睁开眼睛的时候，床头放着一杯水。水还是温的。\n\n你不记得是谁放的。\n\n——\n\n沃切斯特在雾中等了很久。然后它不等了。"},design_intent:"连续睡觉不推进。不惩罚，安静结束。"},{id:"ending_accountant",name:"账房先生",type:"behavior",world_outcome:"behavior_escape_work",conditions:["work_only_days >= 7"],blocking_conds:[],priority:110,override_category:"annotation",humanity_variants:{humanity_high:"你的账本记得很整齐。每一笔收入、每一次支出、每一个铜板的去向。\n\n码头工人开始叫你'那位记账的'。你有一个固定的座位。酒馆老板每天给你留一杯水。\n\n某一天，你翻开账本，发现最后一页已经写满了。\n\n你没有再翻开新的。\n\n——\n\n沃切斯特又多了一个普通人。这是它最温和的结局。",humanity_fragile:"你存够了钱。\n\n然后你发现你忘了要买什么。\n\n你继续工作。码头的木板在你的脚下发出熟悉的声响。你不再抬头看海。\n\n有一天，有人问你为什么来这里。你想了很久。\n\n——\n\n你的账本上有一行数字被水渍晕开了。没有人知道那是泪还是海水。",humanity_lost:"你的钱包鼓了。你的好奇心瘪了。\n\n你看着码头工人从船上卸货，看着雾气每天准时升起。你不再问货箱里装着什么。\n\n你只是数钱。\n\n——\n\n很多年后，有人在码头区发现了一本旧账本。最后一页写着一行字：'今天雾没有散。'账本没有名字。"},design_intent:"一直打工赚钱不调查。经济系统提供逃避路径。"},{id:"ending_prisoner",name:"囚徒",type:"behavior",world_outcome:"behavior_escape_safehouse",conditions:["safehouse_stay_days >= 7"],blocking_conds:[],priority:130,override_category:"annotation",humanity_variants:{humanity_high:"安全屋的墙壁记住了你的呼吸。\n\n你每天坐在同一把椅子上。窗外的光从早到晚变化，你没有跟它一起变。\n\n有一天你站起来，发现椅子已经适应了你的形状。\n\n——\n\n安全屋不是囚笼。是你自己把门从里面锁上的。钥匙在你手里。",humanity_fragile:"你不记得上一次出门是什么时候了。\n\n安全屋的天花板上有一道裂缝。你每天看着它。裂缝没有变大。你也没有。\n\n有一天，有人敲门。你没有开。\n敲门的人说：'他还活着。只是不出来了。'\n\n——\n\n安全屋的窗帘一直没有拉开。",humanity_lost:"你在安全屋里度过了每一个夜晚。\n\n白天你睡觉。夜晚你醒着，听着墙外的声音——潮水、钟声、远处有人在叫你的名字。\n\n你不确定那个名字是不是你的。\n\n——\n\n安全屋的门锁从里面锈死了。你没有试图打开它。"},design_intent:"长期躲在安全屋。安全屋变成牢笼。"},{id:"ending_wanderer",name:"漫游者",type:"behavior",world_outcome:"behavior_escape_wander",conditions:["move_only_days >= 7"],blocking_conds:[],priority:120,override_category:"annotation",humanity_variants:{humanity_high:"你走遍了沃切斯特的每一条街道。\n\n你记住了每扇紧闭的窗户、每块松动的鹅卵石、每盏在雾中亮着的路灯。\n\n有人问你从哪里来。你说你只是在走。你没有说谎。\n\n——\n\n雾中的街道越来越长。你不知道是城市在变大，还是你的脚步在变小。",humanity_fragile:"你不停地移动。从一个区域到另一个区域。\n\n你不和任何人说话。你不看公告栏。你只是走。\n\n有一天你回到镇中心，发现广场上的雕像面向了不同的方向。\n\n你不知道它是什么时候转过来的。\n\n——\n\n地图上多出了一条你没有画过的路。",humanity_lost:"你走过每一块石头。你绕开每一个人。\n\n你不记得自己为什么来了。你只记得路。路是清楚的。人可以迷路，路不会。\n\n有一天你发现你在同一条街上走了三遍——但没有认出任何一扇门。\n\n——\n\n没有人记得你的名字。包括你自己。"},design_intent:"只移动不调查不交流。移动变成逃避。"},
{id:"ending_miser",name:"守财奴",type:"behavior",world_outcome:"behavior_escape_hoard",conditions:["hoarded_money_max >= 50","hoarded_food_max >= 5","completed_clue_chains < 2"],blocking_conds:[],priority:150,override_category:"annotation",humanity_variants:{humanity_high:"你的箱子里装满了食物和硬币。\n\n你每天清点一次。顺序不变：罐头在最下面，硬币在上面，绷带在最上面。\n\n你从来没有用过它们。\n\n——\n\n箱子很重。你每天打开它，看一分钟，然后关上。这是你唯一的不安——和唯一的安慰。",humanity_fragile:"你囤积。你保存。你从不消耗。\n\n你的食物够吃几个星期。你的钱够买更多食物。\n\n但你不吃。你只是看着。\n\n有一天，一个罐头开始生锈。你没有扔掉它。你只是把它挪到了最下面。\n\n——\n\n箱子满了。你没有空间放更多了。你没有空间放任何东西了。",humanity_lost:"你的财宝堆在安全屋的角落。\n\n食物发霉了。硬币生了绿锈。绷带被老鼠咬过。\n\n你不愿意使用它们——也不愿意丢弃它们。\n\n——\n\n有人经过你的安全屋，闻到一股甜味。他们摇了摇头。沃切斯特见过这样的人。"},design_intent:"囤积资源但从不使用。拥有变成负担。低使用率由不完成线索链体现。"},{id:"ending_return_to_sea",name:"归海",type:"behavior",world_outcome:"behavior_obsession_return_sea",conditions:["harbor_visits >= 10","sea_acceptance_flags >= 2"],blocking_conds:[],priority:160,override_category:"annotation",humanity_variants:{humanity_high:"你每天都去码头。\n\n不是因为你在找什么。是因为海在叫你——不是用声音。是用空缺。\n\n你站在码头的尽头。水在下面。\n\n有一天你没有转身。\n\n——\n\n码头边少了一块木板。没有人换。因为没有人记得原来有几块。",humanity_fragile:"海岸线在改变。\n\n你注意到每次去码头，水都更近了一点。\n\n也许不是水在靠近。也许是你在往海里走。每次一小步。\n\n——\n\n你的鞋子里有沙子和海水。你把它们放在门口。第二天它们还在。但位置变了。",humanity_lost:"海不需要邀请你。\n\n它只是等到你放弃陆地。\n\n你走进水里。外套浮起来。怀表停了。\n\n——\n\n有人在岸边发现一本笔记本。纸是湿的。字迹还在。最后一页只有一个词：'回去。'"},design_intent:"反复前往码头/海边，逐渐放弃陆地身份。海是引力，不是怪物。"},{id:"ending_archive_devourer",name:"档案吞噬者",type:"behavior",world_outcome:"behavior_obsession_archive",conditions:["archive_consumed_count >= 3"],blocking_conds:[],priority:170,override_category:"annotation",humanity_variants:{humanity_high:"你开始收集记录。\n\n报纸。失踪报告。手写的便条。教堂的旧登记簿。\n\n然后你开始吃它们。不是因为饿。是因为你觉得把信息放进身体里是唯一的保存方法。\n\n——\n\n你的安全屋里堆满了半页纸。边缘有齿痕。",humanity_fragile:"你收集了沃切斯特三百年的档案。\n\n你读了它们。你整理了它们。\n\n然后你不信任它们了。你把每一页纸都吞了下去。\n\n——\n\n你的肚子里有一整个档案馆。没有人可以读取它——除了你。但你已经忘了怎么读。",humanity_lost:"你销毁了证据。\n\n不是因为你害怕真相。是因为你不想让任何人——任何后来的人——看到你没有看到的东西。\n\n你烧了一些。吃了一些。把剩下的卷成了纸筒。\n\n——\n\n沃切斯特的历史在你的肠道里。没有人知道。"},design_intent:"执着收集/破坏/吞噬记录。信息变成执念。阈值降至3。"},
{id:"ending_eternal_recorder",name:"永恒记录员",type:"behavior",world_outcome:"behavior_meta_recorder",conditions:["record_only_days >= 5","low_intervention_count >= 3"],blocking_conds:[],priority:310,override_category:"annotation",humanity_variants:{humanity_high:"你不玩了。但你还在看着。\n\n你把存档存在了某个地方。你不记得在哪里。\n\n但你偶尔会回来——不是重新开始。只是在标题画面停留一会儿。\n\n——\n\n沃切斯特的雾在你的屏幕上。你已经不在里面了。但雾不知道。",humanity_fragile:"你保留了所有的记录。\n\n每一轮死因。每一个NPC的名字和信任值。每一条线索。\n\n你把它们整理成了一份文档。文档的大纲是你的墓碑。\n\n——\n\n你不是调查员。你是调查员的档案管理员。",humanity_lost:"你发现存档文件的大小每次都在变小。\n\n不是因为你在删除。是因为沃切斯特在遗忘。\n\n你试图把所有东西都记下来——在纸面上，在脑子里，在另一个存档里。\n\n——\n\n你的记录比沃切斯特本身更完整。沃切斯特知道。它开始用你的记录来重建自己。"},design_intent:"只记录不干预，把世界当观察对象。记录天数+低干预次数。"},{id:"ending_observer",name:"观测者",type:"behavior",world_outcome:"behavior_meta_observer",conditions:["meta_boundary_breaks >= 3","final_choice_refused_count >= 1"],blocking_conds:[],priority:905,override_category:"meta_narrative_break",humanity_variants:{humanity_high:"你看见了所有事情。你没有参与任何一件。\n\n你站在事件的边缘。你在笔记本上记录：几点、哪里、谁。\n\n你的记录准确得可怕。但你的名字不在任何一行。\n\n——\n\n观测者不是调查员。观测者是一台带眼睛的相机。",humanity_fragile:"你知道了。你看着。你没有动。\n\n你看着NPC被腐蚀。你看着封印被削弱。你看着每一次轮回的裂缝。\n\n你没有伸手。不是因为害怕。是因为你觉得这不关你的事。\n\n——\n\n沃切斯特不需要观察者。沃切斯特需要行动者。你被遗忘了——不是被世界。是被叙事。",humanity_lost:"你看穿了系统。\n\n不是比喻。你看见了边界——叙事的边界、规则的边界、选择的边界。\n\n你站在边界上。你不跨过去。你只是看着。\n\n——\n\n你的角色还在游戏里。但你已经不在角色里了。"},design_intent:"看穿系统但拒绝成为角色。元边界突破+拒绝终局选择。"},{id:"ending_delete_wish",name:"删档祈愿者",type:"behavior",world_outcome:"behavior_meta_delete_wish",conditions:["save_delete_attempts >= 3"],blocking_conds:[],priority:915,override_category:"meta_narrative_break",humanity_variants:{humanity_high:"你删了第一次存档。\n\n然后你又删了一次。\n\n你开始觉得存档在重新生成。每次你删掉它，它回来了——但少了一个字节。\n\n——\n\n存档还在那里。它只是在变小。小到只能装下你的名字。然后你的名字也没了。",humanity_fragile:"删除不是结束。\n\n你每次按下删除键，沃切斯特都记得。\n\n它把你的删除行为写进了你删不掉的那个存档里。\n\n——\n\n你的删除记录比你的游戏记录更长。",humanity_lost:"你删了存档。你删了备份。你删了系统日志。\n\n但沃切斯特还在。它不需要你的存档来存在。\n\n——\n\n你最后一次打开游戏。开始新游戏。你没有点。光标自己移了过去。"},design_intent:"反复删档。阈值降至3。删除变成仪式行为。"},{id:"ending_loop_moth",name:"循环的蛀虫",type:"behavior",world_outcome:"behavior_meta_loop_moth",conditions:["loop_exploit_score >= 5"],blocking_conds:[],priority:290,override_category:"annotation",humanity_variants:{humanity_high:"你发现了循环的接缝。\n\n不是某个宏大的裂缝——只是一小块松动的边缘。你在正确的时刻用手指按了下去。\n\n循环没有崩塌。但它的运转开始变慢了。\n\n——\n\n钟声之间多了一秒的间隔。没有人注意到。除了你。",humanity_fragile:"你在循环里咬了第一个洞。\n\n洞很小。只够透进一丝光。\n\n光没有让任何东西变清楚。它只是让你看到了裂痕。\n\n——\n\n沃切斯特的居民开始忘记事情。不是大事。是小事。昨天吃了什么。前天有没有下雨。上个月有没有少一个人。",humanity_lost:"你是循环的蛀虫。你啃食时间的纤维。\n\n每次循环重启，你都留下了一个小的缺口。缺口在累积。\n\n——\n\n有一天，循环会无法闭合。不是因为那个洞太大。是因为洞的数量——太多了。"},design_intent:"利用轮回刷资源、刷死亡、刷NPC反应。蛀虫意象。"},
{id:"ending_joyful_prophet",name:"愉悦的先知",type:"behavior",world_outcome:"behavior_mixed_joyful_prophet",conditions:["prophecy_spread_count >= 3","san <= 25"],blocking_conds:[],priority:295,override_category:"annotation",humanity_variants:{humanity_high:"你看见了。你看见了全部。\n\n不是像别人那样瞥见一角——你是被邀请进去的。\n\n你看见了深渊。你看见了深渊里的东西。你看见了它看着你。\n\n你笑了。不是因为疯了。是因为它比你想象的更美。\n\n——\n\n沃切斯特的雾散了一天。太阳照在每个人脸上。只有你的脸上有阴影——那是你自己选择的。",humanity_fragile:"你是快乐的吗？\n\n你应该是。你比任何人都知道得多。\n\n你的嘴角在翘。你的眼睛在亮。你在街上和人打招呼——比以前多。\n\n——\n\n有人在教堂里看见你跪着。你的嘴唇在动。不是在祈祷。是在唱。",humanity_lost:"你成为了真相的传声筒。\n\n你告诉每一个人。在码头。在酒馆。在教堂门口。\n\n告诉他们天空会裂开。海水会变清。雾会散去——不是散去，是被吸进别的地方。\n\n——\n\n没有人相信你。但你不在乎。因为你知道他们是错的——而知道这件事的感觉，太好了。"},design_intent:"低SAN下持续传播污染预言，并从中获得满足。传播次数+低SAN。"},{id:"ending_filth_saint",name:"污圣徒",type:"behavior",world_outcome:"behavior_mixed_filth_saint",conditions:["redeemed_npcs >= 1","sacred_desecration_count >= 2"],blocking_conds:[],priority:275,override_category:"annotation",humanity_variants:{humanity_high:"你在身体上刻圣言。\n\n圣言在皮肤上发炎。你告诉别人这是在忏悔。\n\n但你刻的不是圣言。是你在深渊里看见的句子。\n\n——\n\n教堂的地上有一行血迹。不是拖拽的痕迹。是有人从门口走到祭坛前，每走一步就跪一次。",humanity_fragile:"你把身体分成两半。\n\n右边献给了教堂。左边献给了海底。\n\n你觉得这两者之间没有矛盾。\n\n——\n\n你的双手在做不同的事。一只手在画十字。一只手在画圈。两样都画得很熟练。",humanity_lost:"你不是虔信者。你不是亵渎者。你是两者在同一具身体里轮流值更。\n\n早上去教堂。晚上去码头。周而复始。\n\n——\n\n没有人能分辨你是在祈祷还是在谈判。你自己也分不清了。"},design_intent:"同时维持救赎姿态与亵渎行为。救赎NPC+亵渎封印。"},{id:"ending_thirteenth_prophet",name:"十三响的先知",type:"behavior",world_outcome:"behavior_mixed_thirteenth",conditions:["thirteenth_bell_obsession >= 3"],blocking_conds:[],priority:285,override_category:"annotation",humanity_variants:{humanity_high:"你听见了第十三声。\n\n不是在教堂。是在你自己的呼吸里。\n\n你开始数。不只是钟声——脚步声、滴水声、心跳声。数到十二，你会停一下。然后你继续。\n\n——\n\n你的笔记本的页边空白处填满了数字。不是阿拉伯数字。是你不认识的符号。但你认识。",humanity_fragile:"第十三声不是钟声。\n\n是十二声之后的沉默。\n\n你发现沉默也有数量。你学会了听见它。\n\n——\n\n酒馆里没有人提到第十三声。但他们说话的时候都留了一个停顿。像是给什么东西留的位置。",humanity_lost:"你是唯一听到了第十三声的人。\n\n你告诉了每一个人。没有人信。\n\n于是你搬到了钟楼里。你坐在钟绳旁边，等待下一次。\n\n——\n\n钟绳在你手里。你不拉它。你在等它自己动。"},design_intent:"执迷第十三声钟，围绕钟声行动。执迷次数达3次触发。"},{id:"ending_flesh_choir",name:"血肉合唱",type:"behavior",world_outcome:"behavior_mixed_flesh_choir",conditions:["fusion_and_self_harm_total >= 5"],blocking_conds:[],priority:278,override_category:"annotation",humanity_variants:{humanity_high:"你吃了。你融合了。你亵渎了。\n\n现在你的身体里有三种声音。它们不吵架。它们在和声。\n\n——\n\n你说话的时候，偶尔有一个词会变成另一种语言。没有人注意到。包括你。",humanity_fragile:"你变成了一个容器。\n\n你装过太多东西——肉、符号、海水、神话、别人的记忆。\n\n它们没有消化掉。它们在合唱。\n\n——\n\n你的喉咙有时会自己发出声音。不是咳嗽。是几个音节连在一起。像是在练习说某个名字。",humanity_lost:"你不再是一个人。你是一个集合。\n\n你的每一部分都有自己的主张。你的手想做一件事。你的胃想做另一件事。你的舌头——\n\n你的舌头想做所有的事。\n\n——\n\n镜子里的脸在变。不是变丑。是变得不像同一个人的脸。"},design_intent:"多次融合+自残仪式。两者合计达到5次。身体变成复数的合唱团。"},{id:"ending_best_employee",name:"最佳员工",type:"behavior",world_outcome:"behavior_mixed_best_employee",conditions:["work_count >= 15","completed_clue_chains <= 1"],blocking_conds:[],priority:115,override_category:"annotation",humanity_variants:{humanity_high:"你准时上工。你从不缺勤。\n\n你的老板开始把你的名字写在排班表的最上面。\n\n你收到了一张工资支票。上面的数字比你想象的多。\n\n——\n\n沃切斯特的码头上有一个人的脚印比所有人都深。不是因为体重。是因为那个人站得太久了。",humanity_fragile:"你用工作填满了每一个白天。\n\n你不问问题。不探索。不怀疑。\n\n你是镇上最好的临时工。每一个人都知道你的名字——不是因为你是谁。是因为你从不拒绝加班。\n\n——\n\n你的背上有一块僵硬的肌肉。那是你唯一没有忽略的提醒。",humanity_lost:"你的手上有老茧。你的口袋里有硬币。你的脑子里什么都没有。\n\n你不记得沃切斯特有什么问题了。你甚至不记得有问题曾经存在过。\n\n你只是——工作。\n\n——\n\n码头的账本上有一行被写了很多次的名字。名字旁边画着星号。星号的意思是'可靠的'。"},design_intent:"在末日前仍机械打工，甚至把调查当绩效。累计工作次数而非天数。"},{id:"ending_tidy_butcher",name:"整洁的屠夫",type:"behavior",world_outcome:"behavior_mixed_tidy_butcher",conditions:["direct_kill_count >= 5","clean_kill_pattern >= 3"],blocking_conds:[],priority:258,override_category:"annotation",humanity_variants:{humanity_high:"你杀了人。\n\n但你把他们放得很整齐。\n\n手在身体两侧。眼睛合上了。衣服没有皱。\n\n你在旁边放了一枝花。不是野花——是镇上花店里买的。\n\n——\n\n治安官说凶手的仪式感很强。他没有说尊重。但他想了。",humanity_fragile:"你做了你必须做的。\n\n你不享受。你只是——把它做得很干净。\n\n血没有溅到不该溅的地方。工具摆放整齐。地面上没有拖拽的痕迹。\n\n——\n\n安全屋的角落里有一把刷子。和一双干净的鞋。",humanity_lost:"你在杀人与收殓之间找到了一种节奏。\n\n你重视过程。你重视细节。你重视——尊重。\n\n你觉得你给了他们比沃切斯特更多的尊严。\n\n——\n\n每一个死者都有一小片记录：名字、时间、原因。你的档案不脏。只是冷。"},design_intent:"杀戮高度规律化、工具化、无情绪波动。杀人者职业道德。更冷，因为干净。"},
{id:"ending_puppeteer",name:"木偶师",type:"behavior",world_outcome:"behavior_anomaly_puppeteer",conditions:["npc_deaths_by_manipulation >= 2","direct_kill_count == 0"],blocking_conds:[],priority:280,override_category:"annotation",humanity_variants:{humanity_high:"你没有亲自动过手。\n\n你的手是干净的。\n\n你说了一些话。你在某个时刻选择不开口。你递了一杯水——或者没有递。\n\n你没有做任何可以被起诉的事情。\n\n——\n\n沃切斯特又少了几个人。没有人知道为什么。包括你。",humanity_fragile:"你发现说话比动手更有效。\n\n你告诉A关于B的事。你告诉B关于A的怀疑。你在恰当的时刻退后一步。\n\n你没有杀人。你只是没有阻止任何人。\n\n——\n\n你的笔记本上画着几条箭头。每一支箭头都指向同一个结果。每一支箭头上都没有你的指纹。",humanity_lost:"你在他们之间穿梭。你种下怀疑。你浇灌恐惧。你收割结果。\n\n你是棋盘上的手，但你不是任何一个棋子。\n\n你看着他们互相残杀。你做了笔记。\n\n——\n\n酒馆的角落里有一个空座位。每个人都知道那个座位是你的。没有人敢碰。"},design_intent:"不亲自动手，挑拨NPC自相残杀。手是干净的。阈值升至2人。"},{id:"ending_broken_loop",name:"断环",type:"behavior",world_outcome:"behavior_anomaly_broken_loop",conditions:["loop_break_attempts >= 1","destroyed_time_core"],blocking_conds:[],priority:320,override_category:"annotation",humanity_variants:{humanity_high:"钟停了。\n\n不是某个钟楼。是所有钟。钟声不再响起。雾在第二天早上没有来。\n\n沃切斯特的循环断了。没有人知道这意味着什么。\n\n——\n\n你站在镇中心广场。太阳照在你的手上。你很长时间没有见过阳光了。\n\n但你没有感到温暖。因为你知道——循环不是监狱。是时间在保护你们。",humanity_fragile:"你打破了一个不该被打破的东西。\n\n时间不再是圆形的。它开始前进。没有人知道前面是什么。\n\n雾散了。海水平静了。一切看起来都很正常。\n\n但你在夜里醒来，听见某种东西在往下沉。\n\n——\n\n循环是一道闸门。你拉开了它。现在没有人能把水挡回去。",humanity_lost:"你受够了重复。\n\n你找到循环的核心，把它拆了。不是因为勇气。是因为愤怒。\n\n雾散了。空气变清了。\n\n——\n\n二十四小时后，沃切斯特沉入了海底。海水太快了。没有人来得及跑。\n\n你站在水中央。你的表停了。\n\n你终于得到了你想要的一次性死亡。"},design_intent:"主动破坏轮回机制。循环是保护，不是牢笼。"},{id:"ending_white_page",name:"白页",type:"behavior",world_outcome:"behavior_anomaly_refusal",conditions:["final_choice_refused_count >= 3","completed_clue_chains >= 2"],blocking_conds:[],priority:900,override_category:"meta_narrative_break",humanity_variants:{humanity_high:"你有机会结束这一切。\n\n你没有。\n\n不是因为害怕。不是因为犹豫。你只是觉得每一个选择都缺了什么。\n\n所以你没有选。你转身走向安全屋，关上了门。\n\n——\n\n沃切斯特没有回应。雾气照常升起。钟照常敲。\n\n世界继续运转，只是你的故事停在了这里。",humanity_fragile:"你站在选择的岔口。左边是一条路。右边是另一条。\n\n它们通向不同的地方。但你觉得每条路都是错的。\n\n所以你坐下了。你等着。\n\n——\n\n没有人来催促你。没有人来告诉你选择什么。\n\n你等得太久了。选项过期了。",humanity_lost:"真相摆在你面前。代价也在。\n\n你看着代价。你看着真相。你又看了一遍代价。\n\n你说了不。不是'我不愿意'。是'我不参与'。\n\n——\n\n档案被标记为无效。不是因为任何人的过错。\n\n只是没有足够的数据来构成一个结局。"},design_intent:"明知能终局却主动拒绝所有选择。不惩罚，只是终止。"},{id:"ending_invalid_archive",name:"无效档案",type:"behavior",world_outcome:"behavior_anomaly_invalid",conditions:["has_committed_contradictory_extremes","meta_boundary_breaks >= 3"],blocking_conds:[],priority:950,override_category:"meta_narrative_break",humanity_variants:{humanity_high:"档案室里的柜子发出了一声轻响。\n\n管理员翻开你的记录。第一页写着'救赎'。第二页写着'背叛'。第三页写着'牺牲'。第四页写着'交易'。\n\n他把纸页合上。又翻开。还是同一个名字。\n\n——\n\n主体身份冲突。叙事无法合并。\n\n档案被单独归档。标签上只有一个编号。",humanity_fragile:"你的行为记录太长也太乱了。\n\n同一个人在同一个下午帮助了一个NPC又出卖了另一个。\n\n你的选择不是矛盾的——是互相抵消的。每一个正面行为都有一个等量的负面行为。\n\n——\n\n档案的边角有烧焦的痕迹。不是火焰。是文字自己在折叠。",humanity_lost:"你做了所有事。你帮助了所有人。你伤害了所有人。你存了钱，也偷了钱。你保护了某个NPC，然后用他换了情报。\n\n没有连贯性。没有方向。没有可以被讲述的故事。\n\n——\n\n沃切斯特的记事本上只剩下一页。上面只有一行字：\n\n'此调查员的行为无法被归类为任何已知结局。建议搁置，等待进一步观察。'\n\n你没有死。你只是不再是一个叙事主体。"},design_intent:"极端行为过多且互相矛盾，叙事系统无法生成连贯结局。不是训斥，是归档。"}];
function injectBehaviorEndings(GD){if(!GD||!GD.endings)return GD;if(GD._behaviorEndingsInjected)return GD;const existing=new Set(GD.endings.map(e=>e.id));const toAdd=BEHAVIOR_ENDINGS.filter(e=>!existing.has(e.id));
const normalized=toAdd.map(ed=>{const conds=(ed.conditions||[]).map(c=>parseConditionString(c));const blockConds=(ed.blocking_conds||[]).map(c=>parseConditionString(c));return{...ed,conditions:conds,blocking_conds:blockConds};});GD.endings=[...GD.endings,...normalized];GD._behaviorEndingsInjected=true;return GD;}
