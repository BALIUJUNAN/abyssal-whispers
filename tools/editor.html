<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深渊低语 · 数据编辑器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans SC', system-ui, sans-serif; background: #1a1a2e; color: #e0d5c0; min-height: 100vh; }
  .header { background: #16213e; padding: 12px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .header h1 { font-size: 16px; font-weight: 600; color: #c8b89a; }
  .header .subtitle { font-size: 12px; opacity: 0.5; }
  .toolbar { display: flex; gap: 8px; margin-left: auto; }
  .btn { padding: 6px 14px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #e0d5c0; cursor: pointer; font-size: 12px; border-radius: 4px; transition: all 0.15s; }
  .btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }
  .btn.primary { background: rgba(100,140,200,0.2); border-color: rgba(100,140,200,0.4); }
  .btn.primary:hover { background: rgba(100,140,200,0.3); }
  .btn.danger { background: rgba(200,80,60,0.15); border-color: rgba(200,80,60,0.3); }
  .btn.success { background: rgba(60,180,80,0.15); border-color: rgba(60,180,80,0.3); }
  .layout { display: flex; height: calc(100vh - 49px); }
  .sidebar { width: 280px; background: #16213e; border-right: 1px solid rgba(255,255,255,0.06); overflow-y: auto; flex-shrink: 0; }
  .sidebar-section { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .sidebar-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.4; padding: 6px 16px; }
  .sidebar-item { padding: 8px 16px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; transition: background 0.1s; }
  .sidebar-item:hover { background: rgba(255,255,255,0.04); }
  .sidebar-item.active { background: rgba(100,140,200,0.15); color: #a8c8f0; }
  .sidebar-item .badge { font-size: 10px; opacity: 0.4; margin-left: auto; }
  .sidebar-item .type-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .main { flex: 1; overflow-y: auto; padding: 24px; }
  .editor-panel { max-width: 720px; }
  .editor-panel h2 { font-size: 18px; margin-bottom: 4px; color: #c8b89a; }
  .editor-panel .meta { font-size: 12px; opacity: 0.4; margin-bottom: 16px; }
  .field-group { margin-bottom: 14px; }
  .field-group label { display: block; font-size: 12px; opacity: 0.6; margin-bottom: 4px; }
  .field-group input, .field-group textarea, .field-group select {
    width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
    color: #e0d5c0; font-size: 13px; border-radius: 4px; font-family: inherit;
  }
  .field-group textarea { min-height: 80px; resize: vertical; line-height: 1.6; }
  .field-group input:focus, .field-group textarea:focus { outline: none; border-color: rgba(100,140,200,0.5); }
  .field-row { display: flex; gap: 12px; }
  .field-row .field-group { flex: 1; }
  .validation-bar { padding: 8px 16px; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.06); background: #16213e; }
  .validation-bar.pass { color: #6abf69; }
  .validation-bar.fail { color: #e67e22; }
  .validation-bar .issue { margin-top: 4px; opacity: 0.7; }
  .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; opacity: 0.3; font-size: 14px; }
  .choices-list { margin-top: 8px; }
  .choice-item { background: rgba(0,0,0,0.2); padding: 10px; margin-bottom: 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.06); }
  .choice-item .choice-label { font-size: 12px; opacity: 0.5; margin-bottom: 4px; }
  .file-input { display: none; }
  .status { font-size: 11px; opacity: 0.5; padding: 4px 0; }
  .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 12px; opacity: 0.5; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab:hover { opacity: 0.8; }
  .tab.active { opacity: 1; color: #a8c8f0; border-bottom-color: #a8c8f0; }
  .json-preview { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 4px; font-family: monospace; font-size: 11px; max-height: 400px; overflow: auto; white-space: pre-wrap; line-height: 1.5; }
</style>
</head>
<body>
<div class="header">
  <h1>深渊低语 · 数据编辑器</h1>
  <span class="subtitle">Content Editor v0.1</span>
  <div class="toolbar">
    <button class="btn" onclick="loadFile()">📂 加载 JSON</button>
    <button class="btn" onclick="loadFromUrl()">🌐 加载 URL</button>
    <button class="btn primary" onclick="exportJSON()">💾 导出 JSON</button>
    <button class="btn success" onclick="validateAll()">✓ 校验全部</button>
  </div>
  <input type="file" id="fileInput" class="file-input" accept=".json" onchange="handleFileLoad(event)">
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="empty-state" id="sidebarEmpty">加载 JSON 数据开始编辑</div>
  </div>
  <div class="main" id="main">
    <div class="empty-state">← 从左侧选择数据条目<br><br>或点击顶部 "加载 JSON" 导入 game_base.json</div>
  </div>
</div>

<div class="validation-bar" id="validationBar" style="display:none"></div>

<script>
// ── State ──
let gameData = null;
let currentType = 'events';
let currentIndex = 0;
let dirty = false;

// ── Data loading ──
function loadFile() { document.getElementById('fileInput').click(); }

function handleFileLoad(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      gameData = JSON.parse(ev.target.result);
      renderSidebar();
      selectItem('events', 0);
      setStatus('Loaded: ' + file.name);
    } catch (err) { setStatus('Parse error: ' + err.message); }
  };
  reader.readAsText(file);
}

function loadFromUrl() {
  const url = prompt('Enter URL (e.g. /src/data/game_base.json):');
  if (!url) return;
  fetch(url).then(r => r.json()).then(data => {
    gameData = data;
    renderSidebar();
    selectItem('events', 0);
    setStatus('Loaded from: ' + url);
  }).catch(err => setStatus('Fetch error: ' + err.message));
}

// ── Sidebar ──
const TYPES = [
  { key: 'events', label: '事件', color: '#e67e22' },
  { key: 'npcs', label: 'NPC', color: '#3498db' },
  { key: 'areas', label: '区域', color: '#27ae60' },
  { key: 'items', label: '物品', color: '#9b59b6' },
];

function renderSidebar() {
  if (!gameData) return;
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  document.getElementById('sidebarEmpty').style.display = 'none';

  TYPES.forEach(t => {
    const arr = gameData[t.key] || [];
    const section = document.createElement('div');
    section.className = 'sidebar-section';
    section.innerHTML = '<div class="sidebar-title">' + t.label + ' (' + arr.length + ')</div>';
    arr.forEach((item, idx) => {
      const el = document.createElement('div');
      el.className = 'sidebar-item';
      el.dataset.type = t.key;
      el.dataset.index = idx;
      el.innerHTML = '<span class="type-dot" style="background:' + t.color + '"></span>'
        + '<span>' + (item.name || item.id || '#' + idx) + '</span>'
        + '<span class="badge">' + (item.type || '') + '</span>';
      el.onclick = () => selectItem(t.key, idx);
      section.appendChild(el);
    });
    sb.appendChild(section);
  });
}

function selectItem(type, index) {
  currentType = type;
  currentIndex = index;
  // Update sidebar active state
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.type === type && parseInt(el.dataset.index) === index);
  });
  renderEditor();
}

// ── Editor ──
function renderEditor() {
  if (!gameData || !gameData[currentType]) return;
  const item = gameData[currentType][currentIndex];
  if (!item) return;
  const main = document.getElementById('main');
  const typeLabel = TYPES.find(t => t.key === currentType)?.label || currentType;

  let html = '<div class="editor-panel">';
  html += '<h2>' + esc(item.name || item.id || 'Untitled') + '</h2>';
  html += '<div class="meta">' + typeLabel + ' #' + currentIndex + ' · id: ' + esc(item.id || '—') + '</div>';

  // Tabs: Edit / JSON
  html += '<div class="tabs">';
  html += '<div class="tab active" onclick="switchTab(\'edit\',this)">表单编辑</div>';
  html += '<div class="tab" onclick="switchTab(\'json\',this)">JSON 预览</div>';
  html += '</div>';

  html += '<div id="tabContent">';
  html += renderEditForm(item);
  html += '</div>';
  html += '</div>';
  main.innerHTML = html;
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const item = gameData[currentType][currentIndex];
  const tc = document.getElementById('tabContent');
  if (tab === 'edit') {
    tc.innerHTML = renderEditForm(item);
  } else {
    tc.innerHTML = '<div class="json-preview">' + esc(JSON.stringify(item, null, 2)) + '</div>';
  }
}

function renderEditForm(item) {
  let html = '';
  const fields = getFieldsForType(currentType);
  fields.forEach(f => {
    const val = item[f.key];
    if (f.type === 'textarea') {
      html += '<div class="field-group"><label>' + f.label + '</label>';
      html += '<textarea data-key="' + f.key + '" onchange="updateField(this)">' + esc(String(val || '')) + '</textarea></div>';
    } else if (f.type === 'number') {
      html += '<div class="field-group"><label>' + f.label + '</label>';
      html += '<input type="number" data-key="' + f.key + '" value="' + (val ?? '') + '" onchange="updateField(this)"></div>';
    } else if (f.type === 'json') {
      html += '<div class="field-group"><label>' + f.label + ' (JSON)</label>';
      html += '<textarea data-key="' + f.key + '" style="font-family:monospace;font-size:11px;min-height:60px" onchange="updateFieldJSON(this)">' + esc(JSON.stringify(val || (f.isArray ? [] : {}), null, 1)) + '</textarea></div>';
    } else {
      html += '<div class="field-group"><label>' + f.label + '</label>';
      html += '<input type="text" data-key="' + f.key + '" value="' + esc(String(val || '')) + '" onchange="updateField(this)"></div>';
    }
  });

  // Choices editor (events only)
  if (currentType === 'events' && item.choices && item.choices.length > 0) {
    html += '<div class="field-group"><label>选项 (' + item.choices.length + ')</label><div class="choices-list">';
    item.choices.forEach((ch, i) => {
      html += '<div class="choice-item">';
      html += '<div class="choice-label">#' + i + (ch.id ? ' · ' + ch.id : '') + '</div>';
      html += '<div class="field-group"><label>标签</label><input value="' + esc(ch.label || '') + '" data-choice="' + i + '" data-ckey="label" onchange="updateChoice(this)"></div>';
      html += '<div class="field-group"><label>文本</label><textarea data-choice="' + i + '" data-ckey="text" onchange="updateChoice(this)">' + esc(ch.text || '') + '</textarea></div>';
      if (ch.effects) {
        html += '<div class="field-group"><label>效果 (JSON)</label><textarea style="font-family:monospace;font-size:11px;min-height:40px" data-choice="' + i + '" data-ckey="effects" onchange="updateChoiceJSON(this)">' + esc(JSON.stringify(ch.effects, null, 1)) + '</textarea></div>';
      }
      html += '</div>';
    });
    html += '</div></div>';
  }

  return html;
}

function getFieldsForType(type) {
  if (type === 'events') return [
    { key: 'id', label: 'ID' },
    { key: 'name', label: '名称' },
    { key: 'type', label: '类型' },
    { key: 'description', label: '描述', type: 'textarea' },
    { key: 'sanity_damage', label: 'SAN 损伤', type: 'number' },
    { key: 'unreliable_narration_level', label: '叙述可靠等级 (0-5)', type: 'number' },
    { key: 'trigger', label: '触发条件', type: 'json' },
    { key: 'effects', label: '效果', type: 'json' },
  ];
  if (type === 'npcs') return [
    { key: 'id', label: 'ID' },
    { key: 'name', label: '名称' },
    { key: 'role', label: '角色' },
    { key: 'location', label: '位置' },
    { key: 'personality', label: '性格', type: 'textarea' },
    { key: 'background', label: '背景', type: 'textarea' },
    { key: 'trust_layers', label: '信任层级', type: 'json' },
  ];
  if (type === 'areas') return [
    { key: 'id', label: 'ID' },
    { key: 'name', label: '名称' },
    { key: 'description', label: '描述', type: 'textarea' },
    { key: 'danger_level', label: '危险等级', type: 'number' },
    { key: 'chapter_unlock', label: '解锁章节' },
    { key: 'connected_areas', label: '连接区域', type: 'json' },
    { key: 'resource_pressure', label: '资源压力', type: 'json' },
  ];
  if (type === 'items') return [
    { key: 'id', label: 'ID' },
    { key: 'name', label: '名称' },
    { key: 'type', label: '类型' },
    { key: 'uses', label: '使用次数 (-1=无限)', type: 'number' },
    { key: 'use_hint', label: '使用提示', type: 'textarea' },
    { key: 'use_text', label: '使用文本', type: 'textarea' },
    { key: 'effects', label: '效果', type: 'json' },
  ];
  return [];
}

// ── Field updates ──
function updateField(el) {
  const key = el.dataset.key;
  const item = gameData[currentType][currentIndex];
  if (el.type === 'number') {
    item[key] = el.value === '' ? null : Number(el.value);
  } else {
    item[key] = el.value;
  }
  dirty = true;
  validateCurrent();
}

function updateFieldJSON(el) {
  const key = el.dataset.key;
  const item = gameData[currentType][currentIndex];
  try {
    item[key] = JSON.parse(el.value);
    el.style.borderColor = 'rgba(255,255,255,0.1)';
    dirty = true;
    validateCurrent();
  } catch (e) {
    el.style.borderColor = 'rgba(200,80,60,0.5)';
  }
}

function updateChoice(el) {
  const idx = parseInt(el.dataset.choice);
  const key = el.dataset.ckey;
  gameData[currentType][currentIndex].choices[idx][key] = el.value;
  dirty = true;
}

function updateChoiceJSON(el) {
  const idx = parseInt(el.dataset.choice);
  const key = el.dataset.ckey;
  try {
    gameData[currentType][currentIndex].choices[idx][key] = JSON.parse(el.value);
    el.style.borderColor = 'rgba(255,255,255,0.1)';
    dirty = true;
  } catch (e) { el.style.borderColor = 'rgba(200,80,60,0.5)'; }
}

// ── Validation ──
function validateCurrent() {
  if (!gameData) return;
  const item = gameData[currentType][currentIndex];
  const bar = document.getElementById('validationBar');
  bar.style.display = 'block';

  // Basic validation (no Zod in browser — structural checks)
  const issues = [];
  if (!item.id) issues.push('缺少 id 字段');
  if (currentType === 'events' && !item.description) events.push('缺少 description');
  if (currentType === 'npcs' && !item.name) issues.push('缺少 name');
  if (currentType === 'areas' && !item.name) issues.push('缺少 name');
  if (currentType === 'items' && !item.name) issues.push('缺少 name');

  if (issues.length === 0) {
    bar.className = 'validation-bar pass';
    bar.textContent = '✓ 校验通过';
  } else {
    bar.className = 'validation-bar fail';
    bar.innerHTML = '⚠ 校验问题<div class="issue">' + issues.join(' · ') + '</div>';
  }
}

function validateAll() {
  if (!gameData) { alert('请先加载数据'); return; }
  let total = 0, issues = 0;
  TYPES.forEach(t => {
    const arr = gameData[t.key] || [];
    arr.forEach(item => {
      total++;
      if (!item.id && !item.name) issues++;
    });
  });
  alert('校验完成\n总计: ' + total + ' 条\n问题: ' + issues + ' 条\n\n(完整 Schema 校验请运行: npm run lint:schema)');
}

// ── Export ──
function exportJSON() {
  if (!gameData) { alert('请先加载数据'); return; }
  const json = JSON.stringify(gameData, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'game_base_edited.json';
  a.click();
  URL.revokeObjectURL(url);
  dirty = false;
  setStatus('Exported game_base_edited.json');
}

// ── Helpers ──
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setStatus(msg) { console.log('[Editor]', msg); }
</script>
</body>
</html>
